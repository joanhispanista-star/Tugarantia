<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Borrar mi cuenta · Tu Garantía</title>
<meta name="theme-color" content="#0C0A0B">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- ============================================================================
     BORRAR LA CUENTA, DESDE FUERA DE LA APP

     Google Play lo exige desde 2023 y es de los requisitos que se revisan de
     verdad: tiene que poderse pedir desde la app Y desde una dirección web
     pública, sin instalar nada y sin tener que entrar. Esta es esa dirección;
     iría escrita en la ficha si la tienda se retoma (18-ago-2026: Play quedó
     descartado como canal — ver android/LEEME.md). La página sigue viva a
     propósito: poder pedir el borrado sin instalar nada es buena práctica, la
     exija Google o no.

     Y dice qué se borra Y QUÉ NO. Un crédito ya desembolsado es un soporte
     contable que la ley obliga a conservar; prometer que se borra todo y no
     hacerlo es peor que decirlo de frente. La lista sale de cumplimiento.js
     para que esta página y la app no puedan prometer cosas distintas.
     ========================================================================= -->

<div class="cab laca"><div class="wrap">
  <div class="marca"><span class="pin">G</span> Tu Garantía</div>
  <h1>Borrar mi cuenta</h1>
</div></div>

<div class="wrap"><div id="cuerpo"></div></div>

<script src="../app/creditos.js"></script>
<script src="../app/cuenta.js?v=139"></script>
<script src="../app/cumplimiento.js?v=139"></script>
<script>
'use strict';
/* 23-oct-2026 — ¿LLEGÓ LO QUE PEDÍ? Cada .js propio que cambió desde lo
   publicado se pide con la versión en la dirección (…?v=139): ni la caché
   HTTP de 10 min de GitHub Pages ni la del service worker anterior tienen
   nada guardado con ese nombre, así que una página nueva ya no puede correr
   con el .js de antes (pasó tres veces: «Ajustar el próximo pago» y el pie de
   Créditos en el CRM, y el choque del espejo que cobraba dos veces un pago
   acordado). Lo que queda es que NO llegue: el sw.js v138, sin señal,
   contesta index.html a lo que no guardó, y la página correría sin esa
   pieza. Cada uno de esos .js firma al empezar (TG_LLEGARON); si uno de los de
   arriba no firmó, esta pantalla no arranca: lo dice, ofrece recargar y corta
   aquí, antes de que nada de este bloque pueda escribir plata ni datos. Por
   eso va primero, y por eso frena los toques y las teclas fuera del aviso. Es
   la misma copia en todas las páginas: si cambias una, cámbialas todas
   (pruebas/la-pagina-nueva-no-corre-con-un-js-viejo.test.js). */
(function () {
  var d = typeof document !== 'undefined' ? document : null;
  if (!d || typeof d.getElementsByTagName !== 'function') return;
  var firmas = window.TG_LLEGARON || {}, faltan = [], ss = d.getElementsByTagName('script');
  for (var i = 0; i < ss.length; i++) {
    var pedido = ss[i].getAttribute('src') || '';
    if (!/[?&]v=\d/.test(pedido) || /^([a-z][\w+.-]*:|\/\/)/i.test(pedido)) continue;   // solo los del sitio
    if (!firmas[ss[i].src]) faltan.push(pedido.split('?')[0]);
  }
  if (!faltan.length) return;
  window.TG_A_MEDIAS = faltan;
  var caja = d.createElement('div');
  caja.setAttribute('role', 'alertdialog');
  caja.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:999999;display:flex;'
    + 'align-items:center;justify-content:center;padding:24px;background:#fff;color:#1b1b1b;'
    + 'font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center';
  caja.innerHTML = '<div style="max-width:420px">'
    + '<p style="margin:0 0 10px;font-size:19px;font-weight:700">Falta bajar parte de la versión nueva</p>'
    + '<p style="margin:0 0 18px">Para no guardar ni mandar nada a medias, esta pantalla no sigue. '
    + 'Con señal, toca Recargar: no se pierde nada de lo que ya estaba guardado.</p>'
    + '<button type="button" style="font:inherit;font-weight:700;padding:12px 24px;border:0;'
    + 'border-radius:10px;background:#1b1b1b;color:#fff">Recargar</button></div>';
  caja.querySelector('button').onclick = function () { location.reload(); };
  (d.body || d.documentElement).appendChild(caja);
  ['click', 'keydown', 'submit', 'input', 'change'].forEach(function (t) {
    window.addEventListener(t, function (e) {
      if (!caja.contains(e.target)) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, true);
  });
  throw new Error('Llegó a medias (' + faltan.join(', ') + '): esta pantalla no arranca.');
})();

var U = window.CuentaSocio, K = window.Cumplimiento;
var $ = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}

var B = K.BORRADO;

$('cuerpo').innerHTML =
  '<div class="card">' +
    '<p class="sub" style="margin-top:0">Puedes pedir que borremos tu cuenta cuando quieras, ' +
      'sin dar explicaciones. No hace falta tener la app instalada.</p>' +
  '</div>' +

  '<div class="card">' +
    '<h3 class="tit">Qué se borra</h3>' +
    '<ul style="margin:var(--e3) 0 0;padding-left:20px;line-height:1.7">' +
      B.se_borra.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
    '</ul>' +
  '</div>' +

  '<div class="card">' +
    '<h3 class="tit">Qué NO se puede borrar, y por qué</h3>' +
    '<p class="sub">Preferimos decírtelo antes que prometerte algo que no podemos cumplir.</p>' +
    B.se_conserva.map(function (x) {
      return '<div style="margin-top:var(--e4)"><b>' + esc(x.que) + '</b>' +
        '<div class="ayuda">Se conserva ' + esc(x.cuanto) + '. ' + esc(x.porque) + '</div></div>';
    }).join('') +
  '</div>' +

  '<div class="card">' +
    '<h3 class="tit">Pídelo aquí</h3>' +
    '<p class="sub">Con tu celular nos alcanza para encontrarte. Te confirmamos por WhatsApp ' +
      'y lo hacemos en máximo ' + B.plazo_dias + ' días.</p>' +
    '<label for="bTel">Tu celular</label>' +
    '<input id="bTel" type="tel" inputmode="numeric" placeholder="300 111 2233">' +
    '<label for="bMotivo">Si quieres, cuéntanos por qué <span class="opc">· opcional</span></label>' +
    '<input id="bMotivo" type="text" placeholder="No es obligatorio">' +
    '<button class="btn arriba" id="btnBorrar">Pedir que borren mi cuenta</button>' +
    '<div id="errB" class="aviso ambar oculto"></div>' +
    '<div class="ayuda" style="margin-top:var(--e3)">Esto abre WhatsApp con el mensaje ya escrito. ' +
      'Nada se borra en este momento: primero confirmamos que eres tú.</div>' +
  '</div>' +

  '<div class="card">' +
    '<h3 class="tit">Otras formas</h3>' +
    '<ul style="margin:var(--e3) 0 0;padding-left:20px;line-height:1.7">' +
      B.como.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') +
    '</ul>' +
  '</div>' +

  '<div class="pie">' +
    '<a href="index.html" style="color:inherit">Volver a la app</a> · ' +
    '<a href="../legal/privacidad.html" style="color:inherit">Tus datos</a></div>';

$('btnBorrar').addEventListener('click', function () {
  var err = $('errB');
  err.classList.add('oculto');
  var tel = U.normalizarTelefono($('bTel').value);
  if (!tel) {
    err.textContent = 'Escribe tu celular completo: son 10 números y empiezan por 3.';
    err.classList.remove('oculto');
    return;
  }
  var motivo = ($('bMotivo').value || '').trim();
  var texto = 'Hola, quiero que borren mi cuenta de Tu Garantía.\n' +
    'Mi celular es ' + U.telefonoBonito(tel) + '.' +
    (motivo ? '\nMotivo: ' + motivo : '');
  /* 27-ago-2026 — YA HAY NÚMERO OFICIAL, y aquí importaba más que en ningún
     otro botón. Sin destinatario, esta solicitud no le llegaba a nadie: el
     usuario tenía que buscar el chat a mano, y el borrado de cuenta es de lo
     poco que Google verifica de oficio antes de aprobar una app. La duda vieja
     («un número sin firmar lo puede suplantar alguien») se resuelve porque el
     número viaja EN la página, servida por HTTPS desde el dominio propio: quien
     pudiera cambiarlo ya tendría el sitio entero. */
  window.open('https://wa.me/573103606348?text=' + encodeURIComponent(texto), '_blank', 'noopener');
});
</script>
</body>
</html>
