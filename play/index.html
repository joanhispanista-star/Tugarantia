/* -------------------------------------------------------------------------
 * LA CALCULADORA
 *
 * Los números salen TODOS de C.simular(): ninguno se calcula acá. Es la regla
 * de la casa y en este archivo importa el doble, porque una cuenta escrita a
 * mano en la vitrina sería un precio distinto del que se cobra.
 *
 * Se usa el perfil preferente para cotizar y NO es una promesa de cupo: el
 * perfil decide cuánto y qué tan rápido, nunca el precio (app/creditos.js).
 * Con preferente el motor cotiza cualquier monto del rango sin devolver
 * 'sin_cupo', y el precio que sale es exactamente el mismo que pagaría
 * cualquiera. Lo que el visitante puede pedir se dice aparte, en el recorrido.
 * ----------------------------------------------------------------------- */
var CALC_MIN = 100000;      // el mínimo que acepta el servidor (play_solicitar)
var CALC_MAX = 2000000;     // el cupo del perfil más alto. No hay nada por encima.
var CALC_PASO = 50000;
var CALC_MESES_MIN = 3;     // 90 días. Por debajo, simular() lanza: la app dejaría de ser publicable.
var CALC_MESES_MAX = 6;
/* Arranca en 500.000 y a 6 meses a propósito: es el mismo ejemplo que trae la
   divulgación obligatoria, así que lo primero que ve el visitante son dos
   cifras que coinciden en vez de dos precios distintos del mismo producto. */
var CALC = { monto: 500000, meses: 6 };

function cotizacionDeCalc() {
  var r = C.simular({ perfil: 'preferente', capital: CALC.monto,
                      fecha_desembolso: hoyISO(), meses: CALC.meses });
  return r.puede ? r : r.cotizacion;
}

function tarjetaCalculadora() {
  /* Sin la letra obligatoria no se pinta ni una cifra. Es el artículo 305 por un
     lado y la ficha de Google por el otro, y esta app ya estuvo a punto de
     publicar «tasa máxima legal: 0,00%» una vez. */
  if (!hayQueCotizar()) {
    return '<div class="card"><h3 class="tit">No podemos cotizar hoy</h3>' +
      '<p class="sub">Nos falta la certificación de la tasa máxima legal de este mes, y sin ella ' +
      'no publicamos un precio. Escríbenos y lo resolvemos por WhatsApp.</p></div>';
  }
  return '<div class="card laca">' +
      '<div class="etq">' + esc(TEXTOS.gancho) + '</div>' +
      '<div id="calcCifras">' + cifrasDeCalc() + '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="calcMonto" style="margin:0">Cuánto necesitas</label>' +
          '<b id="calcMontoTxt">' + COP(CALC.monto) + '</b></div>' +
        '<input type="range" id="calcMonto" min="' + CALC_MIN + '" max="' + CALC_MAX + '" ' +
          'step="' + CALC_PASO + '" value="' + CALC.monto + '" ' +
          'aria-label="Cuánto necesitas" oninput="moverCalc()">' +
      '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="calcMeses" style="margin:0">En cuántas cuotas</label>' +
          '<b id="calcMesesTxt">' + CALC.meses + ' meses</b></div>' +
        '<input type="range" id="calcMeses" min="' + CALC_MESES_MIN + '" max="' + CALC_MESES_MAX + '" ' +
          'step="1" value="' + CALC.meses + '" aria-label="En cuántas cuotas" oninput="moverCalc()">' +
      '</div>' +
    '</div>' +
    '<div class="card"><div id="calcLetra">' + letraDeCalc() + '</div></div>';
}

/* Las cifras se repintan solas; los deslizadores NO están adentro de esto y es
   deliberado: en este proyecto ya se borró dos veces un campo a mitad de
   escribir por repintar el contenedor que lo contenía. */
function cifrasDeCalc() {
  var c = cotizacionDeCalc();
  if (!c) return '<div class="aviso ambar">No podemos cotizar hoy.</div>';
  return '<div class="calc-cifra">' + COP(c.cuota_tipica) + '</div>' +
    '<div class="muted calc-pie">al mes, ' + c.meses + ' cuotas. En total pagas <b>' +
      COP(c.total_a_pagar) + '</b>.</div>' +
    '<div class="sep"></div>' +
    fila('Lo que recibes', COP(c.capital)) +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Última cuota', fmtFecha(c.cuotas[c.cuotas.length - 1].fecha)) +
    /* La E.A. es la ÚNICA cifra en porcentaje que el cliente ve en todo el
       sistema, y va porque Google la exige junto a cualquier precio de crédito. */
    fila('Tasa efectiva anual', pct(c.efectivo_anual));
}

function letraDeCalc() {
  return '<div class="aviso ambar" style="margin-top:0"><b>Esto es un cálculo, no una aprobación.</b> ' +
      'El precio es real y es el que se cobra. Cuánto te podemos prestar a ti lo decidimos ' +
      'cuando abras tu cuenta y hablemos.</div>' +
    '<div class="muted" style="font-size:12.5px;margin-top:12px;line-height:1.55">' +
      esc(divulgacionHoy()) + '</div>' +
    '<div class="muted" style="font-size:12.5px;margin-top:10px">Sin cuotas de manejo, sin seguros ' +
      'y sin cargos aparte: lo que ves es todo lo que se cobra.</div>';
}

function moverCalc() {
  var m = $('calcMonto'), p = $('calcMeses');
  if (m) CALC.monto = Math.max(CALC_MIN, Math.min(CALC_MAX, Number(m.value) || CALC_MIN));
  if (p) CALC.meses = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, Number(p.value) || CALC_MESES_MAX));
  var t1 = $('calcMontoTxt'); if (t1) t1.textContent = COP(CALC.monto);
  var t2 = $('calcMesesTxt'); if (t2) t2.textContent = CALC.meses + (CALC.meses === 1 ? ' mes' : ' meses');
  var caja = $('calcCifras'); if (caja) caja.innerHTML = cifrasDeCalc();
}

/* -------------------------------------------------------------------------
 * EL RECORRIDO — a dónde se llega, y cómo
 *
 * Los tres escalones son los tres perfiles REALES de app/creditos.js, con su
 * cupo real. No hay ninguna cifra escrita a mano: si mañana Joan sube el cupo
 * del perfil preferente, esta pantalla lo dice sola.
 *
 * En tercera persona y en condicional, y cada tarjeta con su sello ANTES de la
 * primera cifra. El motivo del sello por tarjeta y no por pantalla: la forma en
 * que un ejemplo se escapa de su descargo es un recorte de WhatsApp.
 * ----------------------------------------------------------------------- */
function tarjetaRecorrido() {
  var P = C.PERFILES;
  var pasos = [
    { p: P.nuevo, hoy: true, titulo: 'Empiezas aquí',
      cifra: 'Lo revisamos contigo',
      como: 'Abres tu cuenta sin que nadie te presente. Nos cuentas de ti, pides lo que necesitas, y te respondemos.' },
    { p: P.recurrente, hoy: false, titulo: 'Segundo escalón',
      cifra: 'hasta ' + COP(P.recurrente.cupo_maximo),
      como: 'Se llega cuando ya nos pagaste en fecha y te invitamos. Desde aquí pides y se desembolsa sin revisión.' },
    { p: P.preferente, hoy: false, titulo: 'Tercer escalón',
      cifra: 'hasta ' + COP(P.preferente.cupo_maximo),
      como: 'Historial construido con nosotros. Es hasta donde llega este crédito hoy.' }
  ];
  return '<div class="card">' +
    '<h3 class="tit">Hasta dónde se puede llegar</h3>' +
    '<p class="sub">Nadie empieza arriba. Así se sube, y no hay otra forma.</p>' +
    pasos.map(function (e) {
      return '<div class="escalon' + (e.hoy ? ' hoy' : '') + '"><i class="n"></i>' +
        '<span class="ej-sello">' + (e.hoy ? 'Aquí empiezas' : 'A esto se llega') + '</span>' +
        '<div class="paso-tit">' + esc(e.titulo) + '</div>' +
        '<div class="paso-cifra">' + esc(e.cifra) + '</div>' +
        '<div class="paso-como">' + esc(e.como) + '</div>' +
      '</div>';
    }).join('') +
    '<div class="muted" style="font-size:12.5px;margin-top:var(--e3);line-height:1.5">' +
      'Los montos de arriba son el tope de cada escalón, no una oferta: lo tuyo se decide cuando ' +
      'hablemos. A los escalones dos y tres se entra por invitación nuestra, después de que nos ' +
      'pagues en fecha.</div>' +
  '</div>';
}

function plegable(id, titulo, parrafos) {
  return '<details class="plegable" id="' + id + '"><summary>' + esc(titulo) + '</summary>' +
    '<div class="adentro">' + parrafos.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('') +
    '</div></details>';
}

/* -------------------------------------------------------------------------
 * DEJARLA EN EL CELULAR
 *
 * Solo aparece cuando el navegador de verdad puede instalarla: Chrome avisa con
 * `beforeinstallprompt` y si no avisó, el botón mentiría. Es la misma regla que
 * ya sigue app/socio.html.
 *
 * LO QUE NO SE PIDE: el permiso de notificaciones. Joan lo pidió y no se hace
 * todavía, con motivo: hoy no hay quién mande una — el service worker no
 * escucha 'push' y no existe el emisor. Pedir un permiso que no se va a usar es
 * pedirle algo al cliente a cambio de nada, y lo QUEMA: Android no lo vuelve a
 * preguntar el día que sí haga falta. Es la misma decisión que ya está escrita
 * en android/twa-manifest.json y que vigila una prueba.
 * ----------------------------------------------------------------------- */
var INSTALADOR = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault(); INSTALADOR = e;
  var c = $('cajaInstalar'); if (c) c.innerHTML = tarjetaInstalarPlay();
});
function tarjetaInstalarPlay() {
  if (!INSTALADOR) return '';
  return '<div class="card"><h3 class="tit">Déjala en tu celular</h3>' +
    '<p class="sub">' + esc(TEXTOS.empujon_instalar) + ' Ocupa menos que una foto y abre sin señal.</p>' +
    '<button class="btn sec arriba" onclick="instalarPlay()">Agregar a mi pantalla de inicio</button></div>';
}
function instalarPlay() {
  if (!INSTALADOR) return;
  INSTALADOR.prompt();
  INSTALADOR.userChoice.then(function () {
    INSTALADOR = null;
    var c = $('cajaInstalar'); if (c) c.innerHTML = '';
  }).catch(function () {});
}

/* -------------------------------------------------------------------------
 * EL RAYO
 *
 * Joan: «que cada vez que se toque la pantalla se cree un rayo de energía que se
 * mueve aleatoriamente como un rayo real y continuo».
 *
 * Cómo está hecho: un rayo es una cabeza que CAMINA por la pantalla desde el
 * punto que se tocó, con una dirección que se desvía al azar en cada paso
 * (paseo aleatorio con inercia, que es lo que hace que se vea como un rayo y no
 * como una línea temblorosa). Va dejando un rastro que se apaga por detrás, y
 * de vez en cuando echa una rama. Vive poco más de un segundo.
 *
 * LO QUE LO HACE BARATO, que es la parte que importa en un celular de gama baja:
 *   · Un solo lienzo para todos los rayos, y el bucle se APAGA cuando no queda
 *     ninguno vivo: no gira en vacío gastando batería.
 *   · Máximo tres rayos a la vez. El cuarto toque no crea nada.
 *   · AUTODEGRADADO: se cronometran los primeros fotogramas y si este teléfono
 *     no da los 30 por segundo, el rayo baja a la mitad de puntos y se queda
 *     así el resto de la visita. Un adorno no puede volver lenta una app de
 *     plata.
 *   · Sordo al tacto (pointer-events:none) y sin capturar el toque: jamás se
 *     queda con un toque que era para un botón.
 * ----------------------------------------------------------------------- */
var RAYOS = { lienzo: null, ctx: null, vivos: [], corriendo: false, dpr: 1,
              puntos: 26, medidos: 0, suma: 0, degradado: false, ultimo: 0 };

function iniciarRayos() {
  if (RAYOS.lienzo) return;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) {}
  var c = document.createElement('canvas');
  c.id = 'rayos'; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  RAYOS.lienzo = c; RAYOS.ctx = c.getContext('2d');
  medirLienzo();
  window.addEventListener('resize', medirLienzo);
  /* pointerdown y no click: el rayo tiene que salir en el instante en que el
     dedo toca, no cuando se levanta. `passive` para no frenar el desplazamiento. */
  window.addEventListener('pointerdown', function (e) { nacerRayo(e.clientX, e.clientY); }, { passive: true });
}
/* Se vuelve a medir sola si hace falta, y no solo cuando el navegador avisa que
   cambió el tamaño. Motivo concreto: si `innerWidth` llega en CERO en el momento
   de cargar —pasa cuando la página arranca en una pestaña que todavía no se
   muestra, y se vio en el banco de pruebas—, el lienzo nace de 0×0 y el rayo no
   vuelve a dibujarse nunca, porque `resize` puede no dispararse jamás. Comparar
   dos números por fotograma no cuesta nada; quedarse con un adorno muerto y sin
   error en consola, sí. */
function medirLienzo() {
  var c = RAYOS.lienzo; if (!c) return false;
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if (!w || !h) return false;
  RAYOS.dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = Math.round(w * RAYOS.dpr), H = Math.round(h * RAYOS.dpr);
  if (c.width !== W || c.height !== H) {
    c.width = W; c.height = H;
    RAYOS.ctx.setTransform(RAYOS.dpr, 0, 0, RAYOS.dpr, 0, 0);
  }
  return true;
}
function nacerRayo(x, y) {
  if (!RAYOS.ctx || RAYOS.vivos.length >= 3) return;
  RAYOS.vivos.push({
    puntos: [{ x: x, y: y }],
    ang: Math.random() * Math.PI * 2,
    vida: 0,
    tope: RAYOS.degradado ? Math.round(RAYOS.puntos / 2) : RAYOS.puntos,
    ramas: []
  });
  if (!RAYOS.corriendo) { RAYOS.corriendo = true; RAYOS.ultimo = 0; requestAnimationFrame(pasoRayos); }
}
function pasoRayos(t) {
  var ctx = RAYOS.ctx; if (!ctx) { RAYOS.corriendo = false; return; }
  /* Si el lienzo todavía no tiene tamaño (ver medirLienzo), se espera al
     siguiente fotograma en vez de dibujar en la nada. */
  if (!medirLienzo()) { requestAnimationFrame(pasoRayos); return; }

  /* El autodegradado: diez fotogramas medidos y se decide de una vez. */
  if (RAYOS.ultimo && RAYOS.medidos < 10) {
    RAYOS.suma += (t - RAYOS.ultimo); RAYOS.medidos++;
    if (RAYOS.medidos === 10 && (RAYOS.suma / 10) > 33) RAYOS.degradado = true;
  }
  RAYOS.ultimo = t;

  var W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);

  RAYOS.vivos = RAYOS.vivos.filter(function (r) {
    r.vida++;
    if (r.puntos.length < r.tope) {
      var u = r.puntos[r.puntos.length - 1];
      /* La desviación es lo que le da el aire de rayo: mucha inercia y de vez en
         cuando un quiebre fuerte, como los de verdad. */
      r.ang += (Math.random() - 0.5) * 0.9;
      if (Math.random() < 0.12) r.ang += (Math.random() - 0.5) * 2.2;
      var paso = 16 + Math.random() * 22;
      var n = { x: u.x + Math.cos(r.ang) * paso, y: u.y + Math.sin(r.ang) * paso };
      /* Rebota en los bordes en vez de irse: si se va, el rayo se acaba antes de
         verse. */
      if (n.x < 4 || n.x > W - 4) { r.ang = Math.PI - r.ang; n.x = Math.max(4, Math.min(W - 4, n.x)); }
      if (n.y < 4 || n.y > H - 4) { r.ang = -r.ang; n.y = Math.max(4, Math.min(H - 4, n.y)); }
      r.puntos.push(n);
      if (!RAYOS.degradado && Math.random() < 0.16 && r.ramas.length < 3) {
        r.ramas.push({ desde: r.puntos.length - 1, ang: r.ang + (Math.random() - 0.5) * 2, largo: 3 + Math.random() * 4 });
      }
    }
    var edad = r.vida / (r.tope + 16);
    var alfa = Math.max(0, 1 - edad);
    if (alfa <= 0) return false;

    dibujarRayo(ctx, r, alfa);
    return true;
  });

  if (RAYOS.vivos.length) requestAnimationFrame(pasoRayos);
  else { RAYOS.corriendo = false; ctx.clearRect(0, 0, W, H); }
}
function dibujarRayo(ctx, r, alfa) {
  var pts = r.puntos;
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* Dos pasadas: una ancha y tenue que hace el halo, y una fina y clara que
     hace el filamento. Sale más barato que un shadowBlur, que en Android
     recalcula el desenfoque en cada fotograma. */
  ctx.strokeStyle = 'rgba(245,197,66,' + (alfa * 0.22).toFixed(3) + ')';
  ctx.lineWidth = 9; trazo(ctx, pts);
  ctx.strokeStyle = 'rgba(255,240,200,' + (alfa * 0.95).toFixed(3) + ')';
  ctx.lineWidth = 2; trazo(ctx, pts);
  ctx.strokeStyle = 'rgba(245,197,66,' + (alfa * 0.7).toFixed(3) + ')';
  ctx.lineWidth = 1;
  r.ramas.forEach(function (b) {
    var o = pts[b.desde]; if (!o) return;
    ctx.beginPath(); ctx.moveTo(o.x, o.y);
    var a = b.ang, x = o.x, y = o.y;
    for (var i = 0; i < b.largo; i++) {
      a += (Math.random() - 0.5) * 1.1;
      x += Math.cos(a) * 12; y += Math.sin(a) * 12;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  });
  ctx.restore();
}
function trazo(ctx, pts) {
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

/* ============================== LA CUENTA ==============================
   Etapa 6. Lo que el socio ve cuando entra: su perfil y su cupo, el simulador,
   el botón de pedir, y su historial.

   TODO SALE DE LA SESIÓN, Y LO QUE NO ESTÁ SE DICE. Un historial vacío dibujado
   como si fuera real es la clase de mentira que este proyecto lleva meses
   quitándose: si la nube todavía no responde, la pantalla lo dice. */
var SESION = null;
var MONTO = 500000;

function perfilDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  var p = m && m.perfil;
  return C.perfilValido(p) ? p : 'nuevo';
}
function historialDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  return (m && Array.isArray(m.creditos)) ? m.creditos : [];
}

function pintarCuenta(sesion) {
  if (sesion) SESION = sesion;
  VISTA = 'cuenta';
  $('titulo').textContent = 'Mi cuenta';
  var idPerfil = perfilDeSesion(SESION);
  var perfil = C.PERFILES[idPerfil];

  MONTO = Math.min(MONTO, perfil.cupo_maximo || 500000);
  MONTO = Math.max(MONTO, 100000);

  $('cuerpo').innerHTML =
    '<div id="solicitudBox"></div>' +
    tarjetaCupo(perfil) +
    tarjetaSimulador(idPerfil) +
    tarjetaHistorial() +
    '<div class="card">' +
      '<button class="btn sec" onclick="pintarEntrar()">Salir</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarBorrar()">' +
        'Borrar mi cuenta</button>' +
    '</div>' + pie();
  pintarSimulacion();
  cargarMiSolicitud();
  subirArchivosRegistro().catch(function () {});
  window.scrollTo(0, 0);
}

function tarjetaCupo(perfil) {
  if (perfil.cupo_maximo === 0) {
    return '<div class="card laca">' +
      '<div class="etq">Tu cupo</div>' +
      '<div class="cifra">En revisión</div>' +
      '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
        'Todavía estamos revisando tus datos. Te escribimos por WhatsApp en cuanto ' +
        'terminemos y ahí te decimos hasta cuánto puedes pedir. Mientras tanto puedes ' +
        'simular y dejar tu solicitud.</div></div>';
  }
  return '<div class="card laca">' +
    '<div class="etq">Puedes pedir hasta</div>' +
    '<div class="cifra oro">' + COP(perfil.cupo_maximo) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'Socio ' + esc(perfil.nombre.toLowerCase()) + '. ' + esc(perfil.texto) + '</div></div>';
}

/* EL SIMULADOR. Mueve el monto y las cifras cambian; no hay un botón "calcular"
   que devuelva un número que uno ya no sabe de dónde salió. Y las cuotas se ven
   CON FECHA antes de pedir, que es lo que el socio necesita para saber si le
   cuadra con el día que le pagan. */
function tarjetaSimulador(idPerfil) {
  var tope = Math.max(C.PERFILES[idPerfil].cupo_maximo || 0, 2000000);
  return '<div class="card">' +
    '<h3 class="tit">Simula tu crédito</h3>' +
    '<p class="sub">Mueve el monto y mira exactamente cuánto pagarías.</p>' +
    '<input type="range" id="rMonto" min="100000" max="' + tope + '" step="50000" value="' + MONTO + '" ' +
      'oninput="cambiaMonto(this.value)" style="width:100%;margin-top:var(--e4);accent-color:var(--rojo)">' +
    '<div id="simu"></div>' +
    '</div>';
}

function cambiaMonto(v) {
  MONTO = Number(v) || 100000;
  pintarSimulacion();
}

function pintarSimulacion() {
  var idPerfil = perfilDeSesion(SESION);
  var r = C.simular({ perfil: idPerfil, capital: MONTO, fecha_desembolso: hoyISO() });
  var c = r.puede ? r : r.cotizacion;
  var el = $('simu');
  if (!el) return;

  if (!c) {
    el.innerHTML = '<div class="aviso ambar">' + esc(r.mensaje) + '</div>';
    return;
  }

  var sobreCupo = !r.puede && r.motivo === 'sobre_cupo';
  var sinCupo = !r.puede && r.motivo === 'sin_cupo';

  el.innerHTML =
    '<div class="cifra sm" style="margin-top:var(--e3)">' + COP(c.capital) + '</div>' +
    '<div class="muted" style="font-size:13.5px">' + c.meses + ' cuotas de <b>' +
      COP(c.cuota_tipica) + '</b></div>' +
    '<div class="sep"></div>' +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Total a pagar', COP(c.total_a_pagar)) +
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +

    '<div class="grupo-tit">Cuándo pagarías</div>' +
    c.cuotas.map(function (q) {
      return fila('Cuota ' + q.n + ' · ' + fmtFecha(q.fecha), COP(q.total));
    }).join('') +

    /* LA DIVULGACIÓN, AQUÍ Y NO EN UN RINCÓN. Google la exige "en el mismo lugar
       donde el usuario solicita el crédito", y además es lo correcto: el precio
       completo justo antes del botón, no en una pantalla de términos que nadie
       abre. El texto sale de cumplimiento.js, el mismo que va en la ficha. */
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      esc(divulgacionHoy()) + '</div>' +

    (sobreCupo
      ? '<div class="aviso ambar">Estás pidiendo más que tu cupo (' + COP(r.cupo_maximo) + '). ' +
        'Puedes dejar la solicitud igual: la revisamos y te respondemos.</div>'
      : '') +
    (sinCupo
      ? '<div class="aviso ambar">Todavía no tienes cupo asignado. Puedes dejar tu ' +
        'solicitud y la revisamos.</div>'
      : '') +

    '<button class="btn arriba" onclick="pedir()">' +
      (r.puede ? 'Pedir ' + COP(c.capital) : 'Dejar mi solicitud') + '</button>' +
    '<div id="errPedir" class="aviso ambar oculto"></div>';
}

var DIVULGACION = null;
/* 9-sep-2026 — EL VACÍO NO SE CACHEA. Antes, si la primera llamada caía en un
   día sin certificación de usura vigente, esto guardaba '' y lo devolvía el
   resto de la sesión sin decir nada. La letra que Google exige al lado de todo
   precio desaparecía sola y en silencio — y con una calculadora que se repinta
   en cada movimiento del dedo, esa llamada ocurre cien veces por visita.
   Ahora el vacío se vuelve a preguntar, y quien pinta cifras tiene que
   comprobar que hay texto ANTES de pintar la primera (ver hayQueCotizar). */
function divulgacionHoy() {
  if (!DIVULGACION) {
    var K = window.Cumplimiento;
    var d = K ? K.divulgacion(hoyISO()) : null;
    DIVULGACION = (d && d.puede) ? d.texto : '';
  }
  return DIVULGACION;
}
/* La pregunta que toda pantalla con precios tiene que hacerse primero. Sin
   divulgación no se cotiza: es el artículo 305 del Código Penal por un lado y
   la ficha de Google por el otro, y la app ya estuvo a punto de publicar
   «tasa máxima legal: 0,00%» una vez (4-sep-2026). */
function hayQueCotizar() { return !!divulgacionHoy(); }

function fmtFecha(iso) {
  var p = String(iso).split('-');
  var mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}

function pedir() {
  var err = $('errPedir');
  err.classList.add('oculto');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la solicitud no ' +
      'se puede enviar. Esto es una versión en construcción.');
  }
  fallo(err, 'Enviando…');
  /* La solicitud NO es un crédito: entra a la bandeja de Joan y él responde. La
     pantalla lo dice con esas palabras para que nadie salga creyendo que ya le
     desembolsaron. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/play_solicitar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', apikey: CFG.anon,
      Authorization: 'Bearer ' + ((SESION && SESION.access_token) || CFG.anon)
    },
    body: JSON.stringify({ p_capital: MONTO, p_meses: C.PLAZO_MESES })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      /* La función contesta {ok:false} con HTTP 200 cuando algo no cuadra o el
         freno de solicitudes está lleno: decir «recibimos» ahí sería mentir. */
      if (!j || j.ok !== true) {
        return fallo(err, 'No pudimos recibir la solicitud ahora. Espera unos minutos y vuelve a intentar.');
      }
      pintarPedido();
    })
    .catch(function () {
      fallo(err, 'No pude enviar la solicitud. Revisa tu internet y vuelve a intentar.');
    });
}

function pintarPedido() {
  $('titulo').textContent = 'Solicitud enviada';
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Recibimos tu solicitud.</b></div>' +
      '<p class="sub" style="margin-top:var(--e4)">Pediste ' + COP(MONTO) + ' a ' +
      C.PLAZO_MESES + ' meses. <b>Todavía no es un crédito:</b> la revisamos y te ' +
      'respondemos por WhatsApp. Si la aprobamos, ahí te decimos cuándo recibes la plata.</p>' +
      '<button class="btn arriba" onclick="pintarCuenta()">Volver a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* EL HISTORIAL. Sale de la sesión. Si no hay nada, se distingue "no tienes
   créditos todavía" de "no pudimos cargarlos": son cosas distintas y confundirlas
   le haría creer al socio que perdió su historial. */
function tarjetaHistorial() {
  var creditos = historialDeSesion(SESION);
  if (!SESION) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">No pudimos cargar tu historial. Vuelve a entrar en un momento.</p></div>';
  }
  if (!creditos.length) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">Todavía no tienes créditos con nosotros. Cuando pidas el primero, ' +
      'aquí vas a ver cada cuota y cada pago.</p></div>';
  }
  return '<div class="card"><div class="etq">Tu historial</div>' +
    creditos.map(function (cr) {
      var pagadas = (cr.cuotas || []).filter(function (q) { return q.pagada; }).length;
      return '<div style="margin-top:var(--e4)">' +
        '<b>' + COP(cr.capital) + '</b> a ' + cr.meses + ' meses' +
        '<div class="ayuda">' + esc(fmtFecha(cr.fecha_desembolso)) + ' · ' +
          pagadas + ' de ' + (cr.cuotas || []).length + ' cuotas pagadas' +
          (cr.pagado ? ' · <b>terminado</b>' : '') + '</div>' +
        (cr.cuotas || []).map(function (q) {
          return fila('Cuota ' + q.n + ' · ' + fmtFecha(q.fecha),
                      COP(q.total) + (q.pagada ? ' ✓' : ''));
        }).join('') +
        '</div>';
    }).join('') +
    '<button class="btn sec sm arriba" onclick="imprimirCertificado()">' +
      'Descargar mi certificado de pagos</button>' +
    '</div>';
}

/* El certificado y el contrato: una ventana imprimible que el teléfono guarda
   como PDF con "Imprimir → Guardar como PDF". Sin librerías, sin subir nada a
   ningún servidor, y funciona igual en Android y en iPhone. */
function imprimirCertificado() {
  var creditos = historialDeSesion(SESION);
  var nombre = (SESION && SESION.user && SESION.user.user_metadata &&
                SESION.user.user_metadata.vinculacion &&
                (SESION.user.user_metadata.vinculacion.nombres + ' ' +
                 SESION.user.user_metadata.vinculacion.apellidos)) || 'Socio';
  var filas = creditos.map(function (cr) {
    return '<h3>' + COP(cr.capital) + ' a ' + cr.meses + ' meses · ' +
      esc(fmtFecha(cr.fecha_desembolso)) + '</h3><table>' +
      (cr.cuotas || []).map(function (q) {
        return '<tr><td>Cuota ' + q.n + '</td><td>' + esc(fmtFecha(q.fecha)) + '</td>' +
          '<td>' + COP(q.total) + '</td><td>' + (q.pagada ? 'Pagada' : 'Pendiente') + '</td></tr>';
      }).join('') + '</table>';
  }).join('');

  var w = window.open('', '_blank');
  if (!w) return;
  w.document.write(
    '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Certificado de pagos · Tu Garantía</title><style>' +
    'body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#111}' +
    'h1{font-size:20px} h3{font-size:15px;margin-top:24px}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}' +
    'td{padding:6px 4px;border-bottom:1px solid #ddd}' +
    '.pie{margin-top:34px;font-size:12px;color:#666;line-height:1.6}' +
    '</style></head><body>' +
    '<h1>Certificado de pagos</h1>' +
    '<p>' + esc(nombre) + '<br>Expedido el ' + esc(fmtFecha(hoyISO())) + '</p>' +
    (filas || '<p>Sin créditos registrados.</p>') +
    '<div class="pie">Tu Garantía · Este documento refleja lo registrado en la ' +
      'plataforma a la fecha de expedición.</div>' +
    '</body></html>');
  w.document.close();
  w.focus();
  w.print();
}
