/* ===================== LA CALCULADORA DE LA GARANTÍA =====================
   Joan, 14-sep-2026: «una calculadora abierta para que la gente pueda ver los
   créditos que se solicitan con garantía… y que está a 6 meses si el cliente
   quiere, pero ser claros explicando que para esta calculadora solo se puede
   acceder de acuerdo al acumulado de garantía».

   LAS DOS MITADES DE ESA FRASE VAN JUNTAS O NO VA NINGUNA. La calculadora se le
   muestra a todo el mundo —es lo que explica para qué sirve pagar en fecha—,
   pero encima de la primera cifra va siempre hasta dónde le alcanza HOY a quien
   está mirando. Una cuota de tres millones enseñada a quien tiene cero de
   garantía, sin esa línea, es una oferta que no existe.

   Las cifras salen de motor.js (simularPrestamoRespaldado), el mismo que cobra
   en el CRM: 2% mensual SOBRE EL SALDO —no sobre el original—, cuota fija, a 6
   meses como máximo y desde un millón. */
var GCALC = { monto: M.MONTO_MINIMO_RESPALDADO, meses: M.PLAZO_RESPALDADO_MAX, arranque: null };
var GCALC_MIN = M.MONTO_MINIMO_RESPALDADO;
/* EL PISO ES EL DE LA PÁGINA, no el del motor. El motor acepta el préstamo con
   garantía desde UN mes y así lo opera Joan en su CRM; esta pantalla lleva
   declarado el piso de 90 días desde agosto (ver CALC_MESES_MIN, unas líneas
   arriba, con su razón). Se deriva del mismo número para que no haya dos. */
var GCALC_MESES_MIN = Math.ceil(C.PLAZO_MINIMO_DIAS / 30);
var GCALC_MESES_MAX = M.PLAZO_RESPALDADO_MAX;
/* El tope del deslizador sale del mínimo, no de una cifra escrita acá: el techo
   de verdad es la garantía de cada uno, y esto es solo hasta dónde deja
   arrastrar el dedo. */
var GCALC_MAX = M.MONTO_MINIMO_RESPALDADO * 4;
var GCALC_PASO = 100000;

/* La entrada del motor. Con ficha, la de la ficha; sin ficha, una en cero — que
   es la verdad de quien todavía no ha pagado nada. */
function entradaGarantia() {
  return (FICHA && FICHA.entrada) ||
    { datos: {}, referidos: 0, acumulada: 0, ajuste: 0, comprometida: 0 };
}
function respaldoDisponible() { return (FICHA && FICHA.maxRespaldado) || 0; }

function cotizacionGarantia(saltar) {
  try {
    return M.simularPrestamoRespaldado(GCALC.monto, GCALC.meses, entradaGarantia(),
                                       { fechaDesembolso: hoyISO(),
                                         saltarCortes: saltar == null ? arranqueElegido() : saltar });
  } catch (e) { return null; }
}

/* ---------------------------------------------------------------------------
 * CUANDO QUIERE PAGAR — 15-sep-2026, pedido de Joan con estas palabras:
 * «quiero ver la opcion para yo escoger el numero de cuotas y las fechas de
 * pago». Las cuotas ya se elegian con el deslizador; las fechas, no.
 *
 * No es un calendario libre, y eso es a proposito: las cuotas de este producto
 * caen en los CORTES de la casa (el 15 y el fin de mes, corridos si hay domingo
 * o festivo), asi que dejar escribir una fecha cualquiera seria ofrecer un dia
 * en el que nadie recauda. Lo que se elige es CUAL corte, y la pantalla lo dice
 * con la fecha de verdad —«el 31 de octubre»—, no con una regla que habria que
 * explicar.
 *
 * Y hay una razon de plata, no de comodidad: correr la primera cuota un corte
 * BAJA la efectiva anual. Medido sobre septiembre, un millon, los treinta dias
 * de desembolso: a tres meses, doce de los treinta se pasaban del techo de
 * usura; corriendo el arranque, CERO, y el peor caso baja de 33,07% a 24,34%.
 * A seis meses, de seis de treinta a cero. O sea que esta pantalla no solo
 * ofrece elegir: ofrece la opcion que cabe debajo de la ley.
 *
 * Por eso cada opcion se cotiza POR SEPARADO y se le pregunta a
 * garantiaSePuedeCotizar. La que no pasa no se ofrece, y se dice por que en
 * palabras —no se esconde, porque una opcion que desaparece sin explicacion es
 * la pantalla mintiendo por omision.
 * ------------------------------------------------------------------------- */
function arranquesPosibles() {
  var salida = [];
  try {
    var ops = M.opcionesDeArranque(hoyISO(), GCALC.meses);
    for (var i = 0; i < ops.length; i++) {
      var c = cotizacionGarantia(ops[i].saltar);
      salida.push({
        saltar: ops[i].saltar,
        primera: ops[i].primera,
        dias: ops[i].dias_a_la_primera,
        cotizacion: c,
        sirve: !!(c && c.cumple_minimo && garantiaSePuedeCotizar(c))
      });
    }
  } catch (e) { return []; }
  return salida;
}

/* Cual arranque manda. Si el dedo ya eligio uno y ese sirve, ese; si no, el
   PRIMERO que sirva. Nunca se devuelve uno que no sirva: de este numero cuelga
   el precio que se publica, y publicar el precio de una opcion ilegal por no
   tener a mano una legal es justo lo que el articulo 305 castiga. */
function arranqueElegido() {
  var ops;
  try { ops = M.opcionesDeArranque(hoyISO(), GCALC.meses); } catch (e) { return 0; }
  var legales = [];
  for (var i = 0; i < ops.length; i++) {
    var c = null;
    try {
      c = M.simularPrestamoRespaldado(GCALC.monto, GCALC.meses, entradaGarantia(),
        { fechaDesembolso: hoyISO(), saltarCortes: ops[i].saltar });
    } catch (e) { c = null; }
    if (c && c.cumple_minimo && garantiaSePuedeCotizar(c)) legales.push(ops[i].saltar);
  }
  if (!legales.length) return 0;
  for (var k = 0; k < legales.length; k++) if (legales[k] === GCALC.arranque) return GCALC.arranque;
  return legales[0];
}

function eligeArranque(v) {
  GCALC.arranque = Number(v);
  var caja = $('gcalcCifras'); if (caja) caja.innerHTML = cifrasDeGarantia();
  var f = $('gcalcFechas'); if (f) f.innerHTML = mandoDeFechas();
}

/* El mando, con la fecha REAL de cada opcion. Si solo hay una que sirva, no se
   pinta una eleccion de una sola cosa: se dice cuando seria la primera cuota y
   ya. Un boton solo, marcado, que no se puede cambiar, es un boton que engana
   sobre lo que hay para elegir. */
function mandoDeFechas() {
  var ops = arranquesPosibles();
  var sirven = ops.filter(function (o) { return o.sirve; });
  if (!sirven.length) return '';
  if (sirven.length === 1) {
    return '<div class="mando"><div class="cab-mando">' +
      '<span>Tu primera cuota</span><b>' + fmtFecha(sirven[0].primera) + '</b></div>' +
      '<div class="muted" style="font-size:12.5px">Las siguientes, una cada mes. ' +
      'Siempre en dia habil: si la fecha cae domingo o festivo, se corre.</div></div>';
  }
  var elegido = arranqueElegido();
  var botones = sirven.map(function (o) {
    return '<button type="button" class="opFecha' + (o.saltar === elegido ? ' sel' : '') + '" ' +
      'aria-pressed="' + (o.saltar === elegido) + '" onclick="eligeArranque(' + o.saltar + ')">' +
      '<b>' + fmtFecha(o.primera) + '</b>' +
      '<span>en ' + o.dias + ' dias</span></button>';
  }).join('');
  return '<div class="mando"><div class="cab-mando">' +
    '<label style="margin:0">Cuando pagas la primera</label></div>' +
    '<div class="opFechas">' + botones + '</div>' +
    '<div class="muted" style="font-size:12.5px">Las siguientes, una cada mes. ' +
    'Siempre en dia habil: si la fecha cae domingo o festivo, se corre.</div></div>';
}

/* La efectiva anual del flujo REAL, no de una fórmula aparte: se le da al mismo
   cálculo que usa el producto a 6 meses, con las cuotas que se acaban de pintar.
   Es la única cifra en porcentaje que el cliente ve, y va porque es obligatoria. */
/* 16-sep-2026 — CON LAS FECHAS DE VERDAD, y la diferencia no es cosmética.
   Esto usaba C.efectivoAnual, que supone cuotas cada treinta días parejos. Las
   de este producto caen en los CORTES —el 15 y el fin de mes—, así que con
   desembolso el 10 la primera cae a VEINTE días y el crédito de «tres meses»
   dura 81. La plata vuelve antes: la tasa de verdad es más alta.
   Medido sobre septiembre, un millón, los treinta días de desembolso: a tres
   meses, DOCE de los treinta quedan por encima del techo de usura, y el peor da
   33,07% mientras esta línea publicaba 26,82%. La única cifra en porcentaje que
   el cliente ve estaba diciendo un número que no era el de su propio plan.
   Devuelve null si no se puede calcular, y quien la llame tiene que tratarlo:
   una tasa que no se puede calcular no se publica. */
function eaDeGarantia(c) {
  return C.efectivoAnualPorFechas(hoyISO(), c.capital,
    c.cuotas.map(function (q) { return { fecha: q.fecha_corte, total: q.total }; }));
}

/* EL TECHO DE USURA, COMPROBADO EN PANTALLA Y NO SOLO EN LAS PRUEBAS. Las
   pruebas comparan contra el tope más bajo de la tabla; esto compara contra el
   tope DE HOY, que es el que manda. Si un mes la Superfinanciera bajara el techo
   por debajo de este producto, la app deja de cotizarlo sola en vez de publicar
   un precio que el artículo 305 castiga con cárcel. */
/* 16-sep-2026 — SIN CERTIFICACIÓN NO SE PROHÍBE: SE CALLA LA FRASE, NO EL PRECIO.
   Es la decisión escrita del 4-sep, y esta función la estaba contradiciendo. La
   tabla de topes se vence el último día de cada mes por diseño —la
   Superfinanciera certifica mes a mes y nadie adivina el siguiente— y hasta hoy
   un `topeVigente` nulo devolvía false: el 1 de octubre, dentro de dos semanas,
   la tarjeta entera del crédito con garantía habría desaparecido de la puerta
   pública. La cuota, el total, las seis fechas, el cuadro de lo que gana
   pagando: todo, y hasta que alguien se acordara de agregarle una fila a la
   tabla.
   El precio de este producto NO sale del techo (es 2% mensual sobre el saldo),
   así que la cotización sobrevive igual que la del otro producto. Lo que se
   calla es la frase del techo, y de eso ya se encarga divulgacionRespaldado.
   El `return false` se queda para el caso que de verdad importa: hay techo
   certificado y el precio se le pasa por encima. */
function garantiaSePuedeCotizar(c) {
  if (!hayQueCotizarGarantia()) return false;
  /* Una tasa que no se pudo calcular no se publica, y tampoco se deja pasar:
     sin ella no hay con qué comparar contra el techo. */
  var ea = eaDeGarantia(c);
  if (ea == null) return false;
  /* 15-sep-2026 — AQUI DECIA `if (!t) return true`, Y ESO ERA UNA REJA CON
     FECHA DE APERTURA. `topeVigente` devuelve null desde el dia en que la tabla
     se vence —el 30 de septiembre— y a partir de ahi esta linea daba por bueno
     CUALQUIER precio.

     Medido sobre octubre, un millon: el credito con garantia a tres meses se
     pasa del ultimo techo conocido en DOCE de los treinta y un dias, y el peor
     da 32,81%. O sea que el 1 de octubre esta pagina habria empezado a publicar
     precios de usura sola, sin que nadie tocara nada.

     El techo del mes que viene no se puede saber. Pero NO se mueve de golpe: en
     toda la tabla va de 28,79% a 29,24%. Mientras llega el nuevo se compara
     contra el ultimo conocido, que es conservador y es lo unico honesto que se
     puede hacer con lo que hay. Si no hay tabla NINGUNA, no se publica. */
  var t = C.topeDeReferencia ? C.topeDeReferencia(hoyISO()) : null;
  if (!t) return false;
  return ea <= t.tope;
}

function tarjetaCalcGarantia() {
  var c = cotizacionGarantia();
  if (!c || !garantiaSePuedeCotizar(c)) {
    return '<div class="card"><h3 class="tit">El crédito con garantía</h3>' +
      '<p class="sub">Hoy no podemos publicar su precio. Escríbenos y lo resolvemos por WhatsApp.</p></div>';
  }
  /* 16-sep-2026 — AQUÍ DECÍA «MÁS BARATO», Y EN ESTA MISMA PANTALLA ES MENTIRA.
     Se midieron los dos motores en las dieciséis combinaciones donde los dos
     rangos se pisan (de un millón a cuatro, de 3 a 6 meses): el de garantía sale
     más caro SIEMPRE. Con un millón a seis meses, arriba son $64.200 de costo y
     23,98% efectivo anual; acá abajo son $71.154 y 26,82%. Las dos cifras las
     imprime la propia página a tres centímetros de distancia, y la única cifra
     en porcentaje que la casa permite mostrar lo confirma.

     «Más barato» era cierto contra el crédito quincenal —20% a quince días—,
     que es lo que Joan opera; pero el quincenal no se cotiza en esta página, y
     lo que está justo encima es el producto a 6 meses, que sale más barato que
     el «barato». Una comparación es contra lo que se ve, no contra lo que uno
     tiene en la cabeza.

     «Más grande» también era falso acá: el deslizador de arriba llega al cupo
     preferente y el de esta tarjeta a cuatro millones. Y «hasta 6 meses» no
     distingue nada: arriba también son 6.

     Lo que queda es lo único que es verdad Y se puede comprobar en la misma
     pantalla: el costo se cobra sobre el saldo que va bajando. */
  return '<div class="card">' +
      '<h3 class="tit">Y cuando tengas garantía, otro crédito</h3>' +
      /* Ni una palabra más de las que se pueden comprobar acá mismo. Se pensó en
         agregar «y se desembolsa sin volver a estudiarte»: eso está escrito para
         el segundo escalón del OTRO producto, no para éste, y afirmarlo sería
         exactamente lo que este comentario vino a impedir. */
      '<p class="sub">Cada vez que pagas en fecha, guardas garantía. La garantía es la que te abre este otro crédito: <b>el costo se cobra sobre lo que te va quedando, no sobre lo que pediste</b>. Compara las dos cuotas de esta pantalla y pide el que te sirva.</p>' +
      '<div id="gcalcTecho">' + techoDeGarantia() + '</div>' +
      '<div id="gcalcCifras">' + cifrasDeGarantia() + '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="gcalcMonto" style="margin:0">Cuánto pedirías</label>' +
          '<b id="gcalcMontoTxt">' + COP(GCALC.monto) + '</b></div>' +
        '<input type="range" id="gcalcMonto" min="' + GCALC_MIN + '" max="' + GCALC_MAX + '" ' +
          'step="' + GCALC_PASO + '" value="' + GCALC.monto + '" ' +
          'aria-label="Cuánto pedirías" oninput="moverGCalc()">' +
      '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="gcalcMeses" style="margin:0">En cuántos meses</label>' +
          '<b id="gcalcMesesTxt">' + GCALC.meses + ' meses</b></div>' +
        '<input type="range" id="gcalcMeses" min="' + GCALC_MESES_MIN + '" max="' + GCALC_MESES_MAX + '" ' +
          'step="1" value="' + GCALC.meses + '" aria-label="En cuántos meses" oninput="moverGCalc()">' +
      '</div>' +
      '<div id="gcalcFechas">' + mandoDeFechas() + '</div>' +
    '</div>';
}

/* LA LÍNEA DEL ACCESO. Es la que Joan pidió que fuera clara, y cambia según
   quién mira: el visitante sin cuenta, el registrado que todavía no ha pagado
   nada, y el que ya tiene garantía ganada. Ninguno de los tres ve una promesa
   que no le corresponde. */
function techoDeGarantia() {
  /* 16-sep-2026 — «HOY TIENES $0» SOLO SI DE VERDAD SE SABE QUE TIENE CERO.
     Esta línea decía eso siempre que no hubiera ficha, y no tener ficha son
     cuatro cosas distintas: el visitante que no tiene cuenta, el socio cuyo
     historial se está cargando, el que no se pudo traer, y el que de verdad
     todavía no ha ganado nada. Decirle «hoy tienes $0» a alguien que lleva
     medio año pagando, porque la nube no contestó, es la casa mintiendo sobre
     la causa de un fallo. */
  if (FICHA_ESTADO === 'cargando') {
    return '<div class="aviso" style="margin-top:0">Estamos buscando tu garantía…</div>';
  }
  if (FICHA_ESTADO === 'falla' || FICHA_ESTADO === 'apagada' || FICHA_ESTADO === 'sesion') {
    return '<div class="aviso ambar" style="margin-top:0">No pude traer tu garantía ahora. ' +
      'Eso <b>no</b> quiere decir que no tengas: quiere decir que no pude preguntar. ' +
      'Mira las cifras de abajo como un cálculo, no como tu cupo.</div>';
  }
  var d = respaldoDisponible();
  if (d <= 0) {
    /* Al visitante sin cuenta no se le afirma un saldo que nadie ha mirado: se
       le explica de dónde sale. Al registrado que sí sabemos que está en cero,
       se le dice el cero. */
    var suyo = (FICHA_ESTADO === 'vinculada' || FICHA_ESTADO === 'nueva');
    return '<div class="aviso ambar" style="margin-top:0"><b>Esto todavía no lo puedes pedir.</b> ' +
      'El crédito con garantía se abre con la garantía que se gana pagando, peso a peso. ' +
      (suyo ? 'Hoy tienes <b>$0</b>: empieza' : 'Empieza') +
      ' por un crédito normal y cada cuota que pagues en fecha te va abriendo este.</div>';
  }
  /* NI SE PROMETE UN MONTO QUE EL PRODUCTO NO PRESTA. La garantía puede alcanzar
     para trescientos mil y este crédito empieza en un millón: decirle «puedes
     pedir hasta $300.000» es ofrecerle algo que la misma tarjeta rechaza dos
     renglones más abajo. */
  if (d < GCALC_MIN) {
    return '<div class="aviso ambar" style="margin-top:0">Llevas <b>' + COP(d) + '</b> de ' +
      'garantía ganada. Este crédito empieza en <b>' + COP(GCALC_MIN) + '</b>, así que ' +
      'todavía no te alcanza: te faltan <b>' + COP(GCALC_MIN - d) + '</b>, y cada cuota que ' +
      'pagues en fecha te acerca.</div>';
  }
  if (GCALC.monto > d) {
    return '<div class="aviso ambar" style="margin-top:0">Con tu garantía de hoy puedes pedir hasta <b>' + COP(d) + '</b>. Puedes pedir más y lo miramos, pero te vamos a contestar con una propuesta por lo que alcanza.</div>';
  }
  return '<div class="aviso verde" style="margin-top:0">Con tu garantía de hoy puedes pedir hasta <b>' + COP(d) + '</b>. Lo que estás moviendo te alcanza.</div>';
}

function cifrasDeGarantia() {
  var c = cotizacionGarantia();
  if (!c) return '<div class="aviso ambar">No podemos cotizar ese monto.</div>';
  if (!c.cumple_minimo) {
    return '<div class="aviso ambar">El crédito con garantía va desde <b>' +
      COP(c.monto_minimo) + '</b>. Por debajo de eso se pide el crédito normal.</div>';
  }
  /* 16-sep-2026 — EL GUARDIÁN DEL TECHO, TAMBIÉN ACÁ. tarjetaCalcGarantia lo
     comprobaba UNA vez, con el monto y el plazo de arranque, y a partir de ahí
     moverGCalc repintaba estas cifras en cada movimiento del dedo sin volver a
     preguntar. La efectiva anual no es constante en todo el rango —el redondeo
     de la cuota la mueve— así que el día que la Superfinanciera certifique un
     techo que caiga dentro de esa ventana, la tarjeta se pintaría porque el
     combo inicial pasa, y el visitante publicaría un precio ilegal con solo
     arrastrar. Es el artículo 305, y el único aviso sería que nadie lo mirara.
     Ahora el guardián está en los DOS caminos: el primer pintado y cada arrastre. */
  if (!garantiaSePuedeCotizar(c)) {
    return '<div class="aviso ambar">Con ese monto y ese plazo no podemos publicar un ' +
      'precio hoy. Prueba con otro, o escríbenos y lo resolvemos por WhatsApp.</div>';
  }
  /* Las dos calculadoras de esta página dicen sus cifras de la MISMA forma: la
     cuota manda y el total va en su propia caja. Dos formas de decir lo mismo,
     una debajo de la otra, obligan a leer dos veces para comparar — que es justo
     lo que alguien hace acá. */
  return '<div class="etq-cifra">Pagarías cada mes</div>' +
    '<div class="cifra sm">' + COP(c.cuota_fija) + '</div>' +
    '<div class="muted" style="font-size:13.5px">durante ' + c.plazo_meses +
      (c.plazo_meses === 1 ? ' mes' : ' meses') + avisoUltimaCuota(c) + '</div>' +
    '<div class="granTotal"><span>En total vas a pagar</span><b>' +
      COP(c.total_a_pagar) + '</b></div>' +
    fila('Lo que recibes', COP(c.capital)) +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Tasa efectiva anual', pct(eaDeGarantia(c))) +
    '<div class="grupo-tit">Cuándo pagarías cada cuota</div>' +
    cuadroCuotas(c.cuotas) +
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      esc(divulgacionGarantiaHoy()) + '</div>' +
    tarjetaGanancia(c);
}

/* EL CUADRO DE LO QUE GANA AL PAGAR — Joan lo pidió con esas palabras: «que
   muestre un cuadro o una imagen de cuánto gana en garantía cuando pague».
   No es una imagen: son las mismas cifras del motor, con una barra que crece.
   Una imagen se queda vieja; esto no puede. */
function tarjetaGanancia(c) {
  var deja = c.garantia_que_deja || 0;
  if (deja <= 0) return '';
  var acum = 0, total = deja || 1;
  var barras = c.cuotas.map(function (q) {
    acum += q.garantia_generada || 0;
    var alto = Math.max(6, Math.round(acum / total * 100));
    return '<div class="tramo"><i style="height:' + alto + '%"></i>' +
      '<span>' + q.numero + '</span></div>';
  }).join('');
  return '<div class="gana">' +
    '<div class="etq">Lo que ganas pagando</div>' +
    '<div class="barras">' + barras + '</div>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e2)">Si pagas las ' +
      c.plazo_meses + ' cuotas en fecha, terminas con <b>' + COP(deja) +
      '</b> más de garantía. Esa garantía es la que te abre el siguiente crédito, más grande.</div></div>';
}

/* LA ÚLTIMA CUOTA NO SIEMPRE ES IGUAL A LAS DEMÁS, y desde que el plan está en
   pantalla eso se ve. Los dos motores cuadran el sobrante en la última —uno
   porque reparte el total entre los meses y le carga el resto, el otro porque
   liquida el saldo— así que la cifra grande multiplicada por el plazo puede no
   dar el total por dos o tres pesos. Antes no importaba: nadie veía la última.
   Ahora está tres renglones más abajo, y una cifra grande que dice «cada mes» al
   lado de una lista donde la última es distinta es la pantalla contradiciéndose.
   Se dice, y solo cuando de verdad difiere. Sale del motor, no de una resta. */
function avisoUltimaCuota(c) {
  var cs = c.cuotas || [];
  if (!cs.length) return '';
  var grande = c.cuota_fija != null ? c.cuota_fija : c.cuota_tipica;
  var ultima = cs[cs.length - 1].total;
  if (ultima === grande) return '';
  return ' · la última, ' + COP(ultima);
}

/* Las cuotas, SEGMENTADAS: una línea por cuota, con su fecha y su monto. Es lo
   que Joan pidió «para mejorar la cobranza y dar claridad», y sirve igual en la
   calculadora, en la propuesta y en el crédito activo — por eso está una vez. */
function cuadroCuotas(cuotas) {
  return (cuotas || []).map(function (q) {
    var f = q.fecha_corte || q.fecha;
    return fila('Cuota ' + (q.numero || q.n) + (f ? ' · ' + fmtFecha(f) : ''),
                COP(q.total) + (q.pagada || q.pagado ? ' ✓' : ''));
  }).join('');
}

function moverGCalc() {
  var m = $('gcalcMonto'), p = $('gcalcMeses');
  if (m) GCALC.monto = Math.max(GCALC_MIN, Math.min(GCALC_MAX, Number(m.value) || GCALC_MIN));
  if (p) GCALC.meses = Math.max(GCALC_MESES_MIN,
    Math.min(GCALC_MESES_MAX, Number(p.value) || GCALC_MESES_MAX));
  var t1 = $('gcalcMontoTxt'); if (t1) t1.textContent = COP(GCALC.monto);
  var t2 = $('gcalcMesesTxt'); if (t2) t2.textContent = GCALC.meses + (GCALC.meses === 1 ? ' mes' : ' meses');
  var caja = $('gcalcCifras'); if (caja) caja.innerHTML = cifrasDeGarantia();
  var techo = $('gcalcTecho'); if (techo) techo.innerHTML = techoDeGarantia();
  /* LAS FECHAS TAMBIEN, y no es adorno: mover el plazo cambia el calendario
     entero, y con el la efectiva anual de cada opcion. Si esto no se repinta,
     los botones siguen mostrando las fechas del plazo ANTERIOR mientras las
     cifras de al lado ya son del nuevo — dos planes distintos en una pantalla. */
  var f = $('gcalcFechas'); if (f) f.innerHTML = mandoDeFechas();
}

/* ===========================================================================
 * LA RULETA DEL CUPO — la pantalla
 * Pedida por Joan el 15-sep-2026.
 *
 * Las reglas están en app/ruleta.js y la única vez la impone la base
 * (base/20260917_ruleta.sql): acá solo se pinta, se anima y se pregunta.
 *
 * SI ruleta.js NO LLEGA, ESTA TARJETA NO SE PINTA Y YA. No entra al guardián de
 * arriba a propósito: el guardián es para las reglas del CRÉDITO, sin las
 * cuales la página no puede decir un precio. Una rueda de premios que no cargó
 * no es motivo para dejar a alguien sin poder pedir plata. Se calla y el resto
 * de la página sigue igual — que es exactamente lo contrario de lo que pasaba
 * el 16-sep, cuando una constante de adorno dejaba la puerta en cero letras.
 * ========================================================================= */
var RU = window.RuletaCupo || null;
var RULETA = { girando: false, estado: null, angulo: 0, anim: null, premio: null };

function tarjetaRuleta() {
  if (!RU) return '';
  var esc2 = RU.ESCALONES;
  return '<div class="card ruleta-card">' +
    '<h3 class="tit">Tu cupo de bienvenida</h3>' +
    '<p class="sub">Gira y destápalo. <b>Todos los que abren su cuenta empiezan en ' +
      COP(RU.CUPO_BIENVENIDA) + ' de cupo</b> — la rueda te lo muestra, y de paso te ' +
      'muestra hasta dónde puedes subir.</p>' +
    '<div class="ruleta-caja">' +
      '<canvas id="ruletaLienzo" width="320" height="320" aria-label="Rueda del cupo"></canvas>' +
      '<div class="ruleta-aguja" aria-hidden="true"></div>' +
    '</div>' +
    '<div id="ruletaMsg" class="ruleta-msg"></div>' +
    '<button class="btn arriba" id="ruletaBtn" onclick="tocarRuleta()">Girar</button>' +
    '<div class="grupo-tit">La escalera</div>' +
    esc2.map(function (e) {
      return '<div class="escalon' + (e.entrega ? ' hoy' : '') + '">' +
        '<b>' + COP(e.cupo) + '</b>' +
        '<span><i>' + esc(e.titulo) + '</i>' + esc(e.como) + '</span></div>';
    }).join('') +
    /* LA FRASE QUE EVITA LA QUEJA. Los escalones de arriba se llegan pagando y
       eso queda dicho en letras, no insinuado por un candado. */
    '<div class="aviso" style="margin-top:var(--e3);font-size:12.5px;line-height:1.55">' +
      'La rueda entrega el cupo de bienvenida de ' + COP(RU.CUPO_BIENVENIDA) + ', uno por ' +
      'persona. Los escalones de arriba <b>no se sortean</b>: se llega a ellos pagando en ' +
      'fecha, como dice cada uno. Tener cupo no es tener el crédito aprobado — la ' +
      'solicitud se estudia igual.</div>' +
    '</div>';
}

/* Dibujar la rueda. Canvas y no SVG porque gira miles de fotogramas y acá hay
   teléfonos de gama baja: rotar un lienzo es una transformación, rotar un SVG
   es recalcular el árbol. */
function pintarRuleta() {
  var lz = $('ruletaLienzo');
  if (!lz || !RU || typeof lz.getContext !== 'function') return;
  var ctx = lz.getContext('2d');
  /* El lienzo puede no dar contexto —pestaña en segundo plano, memoria— y
     entonces ctx es null. Tocar ctx.save() ahí tira la página entera. Ya pasó
     con el rayo el 16-sep: cero letras en pantalla. */
  if (!ctx) return;

  var t = RU.tajadas(), n = t.length;
  var cx = lz.width / 2, cy = lz.height / 2, r = Math.min(cx, cy) - 6;
  ctx.clearRect(0, 0, lz.width, lz.height);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(RULETA.angulo);

  for (var i = 0; i < n; i++) {
    var a0 = i * 2 * Math.PI / n - Math.PI / 2;
    var a1 = (i + 1) * 2 * Math.PI / n - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.closePath();
    /* El escalón que se entrega va en amarillo de la casa; los demás, apagados.
       Se ve desde el primer vistazo cuál es el que está en juego hoy. */
    ctx.fillStyle = t[i].entrega
      ? (i % 2 ? '#F2C230' : '#FFD84D')
      : (i % 2 ? '#2A2E36' : '#333842');
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    /* La cifra, acostada sobre el radio de su tajada. */
    ctx.save();
    ctx.rotate((a0 + a1) / 2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = t[i].entrega ? '#1A1D23' : '#C9CEDA';
    ctx.font = (t[i].entrega ? '700 ' : '500 ') + '15px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText(milesCortos(t[i].cupo), r - 14, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, 2 * Math.PI);
  ctx.fillStyle = '#12151A';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

/* «100.000» en la tajada no cabe en un teléfono. «100k» sí, y se entiende. La
   cifra completa está escrita tres renglones más abajo, en la escalera. */
function milesCortos(v) {
  var n = Number(v) || 0;
  return n >= 1000 ? Math.round(n / 1000) + 'k' : String(n);
}

/* ---------------------------------------------------------------- el estado */
function cargarEstadoRuleta() {
  if (!RU) return Promise.resolve(null);
  return rpcSesion('ruleta_mi_estado').then(function (j) {
    RULETA.estado = j || null;
    pintarMensajeRuleta();
    return j;
  }).catch(function () {
    /* Sin sesión o sin migración: se trata como visitante. La rueda se pinta
       igual y el botón manda a registrarse, que es lo que Joan pidió. */
    RULETA.estado = null;
    pintarMensajeRuleta();
    return null;
  });
}

function pintarMensajeRuleta() {
  var m = $('ruletaMsg'), b = $('ruletaBtn');
  if (!m || !RU) return;
  var e = RULETA.estado;
  var p = RU.puedeGirar(e || { registrado: false });

  if (RULETA.premio) {
    m.innerHTML = '<div class="aviso verde"><b>Tu cupo de bienvenida: ' +
      COP(RULETA.premio.cupo) + '.</b> Queda anotado a tu nombre. Se lo aplicamos a tu ' +
      'cuenta cuando pidas tu crédito.</div>';
    if (b) { b.textContent = 'Ya giraste'; b.disabled = true; }
    return;
  }
  if (p.motivo === 'sin_cuenta') {
    m.innerHTML = '<div class="aviso info">Para girar, primero abre tu cuenta. ' +
      'Son unos minutos y con eso queda tu cupo.</div>';
    if (b) { b.textContent = 'Abrir mi cuenta y girar'; b.disabled = false; }
    return;
  }
  if (p.motivo === 'ya_giro') {
    m.innerHTML = '<div class="aviso verde"><b>Ya giraste.</b> Tu cupo de bienvenida de ' +
      COP((e && e.premio && e.premio.cupo) || RU.CUPO_BIENVENIDA) + ' está anotado.</div>';
    if (b) { b.textContent = 'Ya giraste'; b.disabled = true; }
    return;
  }
  m.innerHTML = '';
  if (b) { b.textContent = 'Girar'; b.disabled = false; }
}

/* ------------------------------------------------------------------ el giro */
function tocarRuleta() {
  if (!RU || RULETA.girando) return;
  var p = RU.puedeGirar(RULETA.estado || { registrado: false });
  if (p.motivo === 'sin_cuenta') {
    /* Lo que pidió Joan, literal: «al momento que el cliente quiera jugar
       primero le indique que se registre». Se le lleva al registro y se deja
       anotado que venía a girar, para traerlo de vuelta acá al terminar. */
    try { sessionStorage.setItem('tg_venia_a_girar', '1'); } catch (e) {}
    pintarRegistro(0);
    return;
  }
  if (p.motivo === 'ya_giro') return;
  girarRuleta();
}

function girarRuleta() {
  if (!RU || RULETA.girando) return;
  RULETA.girando = true;
  var b = $('ruletaBtn'); if (b) { b.disabled = true; b.textContent = 'Girando…'; }

  /* SE LE PREGUNTA AL SERVIDOR ANTES DE ANIMAR, no después. Si la rueda parara
     sola y el servidor dijera que no, habría que borrarle un premio de la cara
     a alguien que ya lo vio. El orden es: la base decide, la pantalla celebra. */
  rpcSesion('ruleta_girar').then(function (j) {
    if (!j || j.ok !== true) {
      RULETA.girando = false;
      if (b) { b.disabled = false; b.textContent = 'Girar'; }
      var m = $('ruletaMsg');
      if (m) m.innerHTML = '<div class="aviso ambar">No pude girar ahora. ' +
        'Revisa tu internet y vuelve a intentar.</div>';
      return;
    }
    animarGiro(function () {
      RULETA.premio = j.premio;
      RULETA.estado = { registrado: true, ya_giro: true, premio: j.premio };
      RULETA.girando = false;
      pintarMensajeRuleta();
    });
  }).catch(function () {
    RULETA.girando = false;
    if (b) { b.disabled = false; b.textContent = 'Girar'; }
    var m = $('ruletaMsg');
    if (m) m.innerHTML = '<div class="aviso ambar">No pude conectarme. ' +
      'Revisa tu internet y vuelve a intentar.</div>';
  });
}

/* La animación. Frena con una curva que se va apagando (easeOut cúbico) para
   que se sienta rueda y no cronómetro. El destino NO es al azar: es la tajada
   que manda app/ruleta.js. */
function animarGiro(alTerminar) {
  var lz = $('ruletaLienzo');
  if (!lz || typeof lz.getContext !== 'function' || !lz.getContext('2d')) {
    /* Sin lienzo no hay animación, pero el premio sí: se entrega igual. Un
       adorno que no se puede dibujar no puede quedarse con la plata de nadie. */
    if (alTerminar) alTerminar();
    return;
  }
  /* Respeta a quien pidió menos movimiento en su teléfono. */
  var quieto = false;
  try { quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

  var n = RU.TAJADAS, gana = RU.tajadaGanadora();
  /* Dónde tiene que quedar el ángulo para que la aguja (arriba) apunte al
     centro de la tajada ganadora. */
  var destino = -(gana + 0.5) * 2 * Math.PI / n;
  var vueltas = quieto ? 0 : 5;
  var fin = destino - vueltas * 2 * Math.PI;
  var ini = RULETA.angulo;
  var dur = quieto ? 260 : 3400;
  var t0 = null;

  if (RULETA.anim) { try { cancelAnimationFrame(RULETA.anim); } catch (e) {} }

  function paso(t) {
    if (t0 === null) t0 = t;
    var k = Math.min(1, (t - t0) / dur);
    var suave = 1 - Math.pow(1 - k, 3);
    RULETA.angulo = ini + (fin - ini) * suave;
    pintarRuleta();
    if (k < 1) RULETA.anim = requestAnimationFrame(paso);
    else { RULETA.anim = null; if (alTerminar) alTerminar(); }
  }
  RULETA.anim = requestAnimationFrame(paso);
}

/* Se llama después de pintar la portada: el lienzo ya existe en el documento. */
function arrancarRuleta() {
  if (!RU) return;
  if (!$('ruletaLienzo')) return;
  pintarRuleta();
  cargarEstadoRuleta();
  /* Si venía del registro por haber tocado «Girar», se le devuelve el hilo. */
  var venia = null;
  try { venia = sessionStorage.getItem('tg_venia_a_girar'); } catch (e) {}
  if (venia) {
    try { sessionStorage.removeItem('tg_venia_a_girar'); } catch (e) {}
    var m = $('ruletaMsg');
    if (m) m.innerHTML = '<div class="aviso info">Tu cuenta quedó abierta. ' +
      '<b>Ahora sí: gira.</b></div>';
  }
}


function moverCalc() {
  var m = $('calcMonto'), p = $('calcMeses');
  if (m) CALC.monto = Math.max(CALC_MIN, Math.min(CALC_MAX, Number(m.value) || CALC_MIN));
  if (p) CALC.meses = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, Number(p.value) || CALC_MESES_MAX));
