<!-- ============================================================================
     LA APP PUBLICABLE — Etapa 2 (entrar y registrarse) + parte de la 4 (catálogo)

     QUÉ ES ESTO Y QUÉ NO ES. Esta es la PUERTA PÚBLICA del negocio (decisión
     del 24-ago-2026): el desconocido se registra solo, ve la calculadora del
     producto a 6 meses, y su registro cae al apartado «Registrados» del CRM.
     Cuando Joan lo aprueba y le manda su código de membresía, entra a la app
     REAL (app/socio.html) — que es OTRA dirección, a propósito: la política
     de Play prohíbe desbloquear el quincenal dentro de esta app, así que la
     frontera es estructural, no una promesa. También es la candidata a Play
     cuando la tienda se retome. Tiene UN solo producto: 6 meses en cuotas,
     por debajo del techo de usura del mes.

     18-ago-2026 — PLAY QUEDÓ DESCARTADO COMO CANAL (ver android/LEEME.md). El
     APK se reparte directo por enlace y envuelve app/socio.html con alcance en
     todo /Tugarantia/: hoy esta página abriría DENTRO de la app instalada, no
     fuera. La carpeta queda lista por si la tienda se retoma; en ese caso el
     alcance vuelve a /Tugarantia/play/ y lo de abajo vuelve a estar en presente.

     Lo que sigue siendo cierto de un TWA: no tiene versiones que colar — el
     .aab es una cáscara que abre este sitio, y el contenido cambia en el
     instante en que se hace push. La app aprobada SERÍA este archivo, siempre.
     Por eso la frontera tiene que ser estructural —una carpeta y un alcance—
     y no una promesa.
     ========================================================================= -->

<div class="cab laca"><div class="wrap">
  <div class="marca"><span class="pin">G</span> Tu Garantía</div>
  <h1 id="titulo">Tu crédito a 6 meses</h1>
</div></div>

<div class="wrap"><div id="cuerpo"></div></div>

<script src="../app/creditos.js"></script>
<script src="../app/cuenta.js"></script>
<script src="../app/cumplimiento.js"></script>
<script>
'use strict';

var VERSION_PLAY = '2026-08-24';

/* La conexión con la nube VIENE PUESTA DE FÁBRICA — 24-ago-2026, la misma
   decisión que salvó a socio.html el 20-ago: con el cajón vacío, cada aparato
   nuevo mostraba «versión en construcción» y nadie podía registrarse. La llave
   publishable es PÚBLICA POR DISEÑO (lo que protege los datos es el RLS de la
   base, no esconder esta cadena); una guardada a mano en play_cfg no se pisa. */
var CFG = {
  url: 'https://wnsioekvjspwtghbodbg.supabase.co',
  anon: 'sb_publishable_uWFyReBljFSh7l0KYkWmmg_Swo4SOxj'
};
try {
  var g = JSON.parse(localStorage.getItem('play_cfg') || 'null');
  if (g && g.url && g.anon) CFG = g;
} catch (e) {}

var C = window.CreditosPublicables;
var U = window.CuentaSocio;
var $ = function (id) { return document.getElementById(id); };
var COP = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CO'); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function pct(x) { return (x * 100).toFixed(2).replace('.', ',') + '%'; }

/* El borrador del registro vive en el teléfono mientras se llena: son 26 campos
   y nadie los completa de una sentada sin que le entre una llamada. Se borra al
   enviarlo. NUNCA guarda la contraseña — esa no toca localStorage ni un
   milisegundo. */
var LLAVE_BORRADOR = 'play_registro_borrador';
function leerBorrador() {
  try { return JSON.parse(localStorage.getItem(LLAVE_BORRADOR) || '{}') || {}; }
  catch (e) { return {}; }
}
function guardarBorrador(d) {
  var limpio = {};
  Object.keys(d).forEach(function (k) { if (k !== 'clave' && k !== 'clave2') limpio[k] = d[k]; });
  try { localStorage.setItem(LLAVE_BORRADOR, JSON.stringify(limpio)); } catch (e) {}
}

var VISTA = 'entrar';
var REGISTRO = leerBorrador();
var PASO = 0;

/* ====================== EL CATÁLOGO, QUE SE VE SIN CUENTA ======================
   A propósito: Joan pidió que el costo real se vea desde el primer momento, y
   una app de crédito que esconde el precio hasta que te registras es justo lo
   que la política de Play mira con lupa. Acá el número está antes de pedir nada.
   Se muestra el perfil `nuevo`, que es el que le toca a quien todavía no entra. */
function tarjetaCatalogo(perfil) {
  var r = C.simular({ perfil: perfil || 'nuevo', capital: 500000, fecha_desembolso: hoyISO() });
  var c = r.puede ? r : r.cotizacion;

  if (!c) {
    /* Sin techo certificado no se cotiza, y se dice. Ver el comentario de TOPES
       en creditos.js: preferible una app que avisa a una que cotiza mal callada. */
    return '<div class="card"><div class="aviso ambar"><b>No podemos cotizar hoy.</b> ' +
      esc(r.mensaje) + ' Escríbenos y lo resolvemos.</div></div>';
  }

  return '<div class="card laca">' +
    '<div class="etq">Ejemplo: ' + COP(c.capital) + ' a ' + c.meses + ' meses</div>' +
    '<div class="cifra oro">' + COP(c.cuota_tipica) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      c.meses + ' cuotas mensuales. En total pagas <b>' + COP(c.total_a_pagar) + '</b>.</div>' +
    '<div class="sep"></div>' +
    fila('Lo que pides', COP(c.capital)) +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Total a pagar', COP(c.total_a_pagar)) +
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +
    fila('Plazo', c.meses + ' meses') +
    '<div class="muted" style="font-size:12.5px;margin-top:var(--e3)">' +
      'Sin cuotas de manejo, sin seguros y sin cargos aparte: lo que ves es todo lo que ' +
      'se cobra.' +
      /* 4-sep-2026 — con la tabla de usura vencida esto imprimía «El techo legal
         de este mes es 0,00% ().» en la cara del cliente. El precio sigue
         saliendo; lo que desaparece es la frase que no se puede sostener. */
      (c.techo_del_mes
        ? ' El techo legal de este mes es ' + pct(c.techo_del_mes) +
          ' (' + esc(c.certificacion) + ').'
        : '') +
      '</div>' +
    '</div>';
}
function fila(k, v) {
  return '<div class="fila"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
}

/* ============================== ENTRAR ============================== */
function pintarEntrar() {
  VISTA = 'entrar';
  $('titulo').textContent = 'Tu crédito a 6 meses';
  /* 25-ago-2026 — EL REGISTRO VA PRIMERO Y EL LOGIN DESPUÉS. Esta es la puerta
     del DESCONOCIDO: casi todo el que llega aquí no tiene cuenta todavía, y
     tener de primero un formulario de contraseña le dice, sin decirlo, que
     esto no es para él. El orden es el mensaje. */
  $('cuerpo').innerHTML =
    tarjetaCatalogo('nuevo') +
    '<div class="card">' +
      '<h3 class="tit">¿Eres nuevo? Abre tu cuenta</h3>' +
      '<p class="sub"><b>No necesitas que nadie te presente.</b> Te tomará unos minutos: ' +
        'te pedimos los datos con los que evaluamos el crédito, y cada uno te decimos ' +
        'para qué es. Después revisamos tu solicitud y te escribimos por WhatsApp.</p>' +
      '<button class="btn arriba" onclick="pintarRegistro(0)">Abrir mi cuenta</button>' +
    '</div>' +
    '<div class="card">' +
      '<h3 class="tit">¿Ya abriste tu cuenta aquí?</h3>' +
      '<p class="sub">Entra con tu celular y tu contraseña.</p>' +
      '<label for="inTel">Tu celular</label>' +
      '<input id="inTel" type="tel" inputmode="numeric" autocomplete="username" ' +
        'placeholder="300 111 2233" oninput="tecleaTel(this)">' +
      '<label for="inClave">Tu contraseña</label>' +
      '<input id="inClave" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="btn sec arriba" id="btnEntrar">Entrar</button>' +
      '<div id="errEntrar" class="aviso ambar oculto"></div>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="olvide()">Olvidé mi contraseña</button>' +
    '</div>' +
    pie();
  $('btnEntrar').addEventListener('click', entrar);
  $('inClave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
}

function tecleaTel(el) {
  var t = U.normalizarTelefono(el.value);
  if (t) el.value = U.telefonoBonito(t);
}

function entrar() {
  var tel = U.normalizarTelefono($('inTel').value);
  var clave = $('inClave').value || '';
  var err = $('errEntrar');
  err.classList.add('oculto');
  if (!tel) return fallo(err, 'Escribe tu celular completo: son 10 números y empiezan por 3.');
  if (!clave) return fallo(err, 'Escribe tu contraseña.');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que aún no se puede entrar. ' +
      'Esto es una versión en construcción.');
  }
  fallo(err, 'Conectando…');
  /* Supabase Auth. El correo lo arma cuenta.js desde el teléfono; el socio nunca
     lo ve. La contraseña se manda una sola vez y no se guarda en ninguna parte
     de este archivo. */
  fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
    body: JSON.stringify({ email: U.correoDeTelefono(tel), password: clave })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) {
      if (!r.ok) {
        /* Nunca se dice "ese celular existe pero la contraseña no": eso
           convertiría la app en un oráculo de quién es cliente. */
        return fallo(err, 'No pudimos entrar con esos datos. Revísalos, y si siguen sin ' +
          'funcionar toca «Olvidé mi contraseña».');
      }
      err.classList.add('oculto');
      pintarCuenta(r.j);
    })
    .catch(function () { fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.'); });
}

function fallo(el, msg) { el.textContent = msg; el.classList.remove('oculto'); }

/* El WhatsApp del negocio, escrito ENTERO (57 + los 10 dígitos). Es la única
   línea que se edita para cambiarlo. VACÍO, WhatsApp abre con el mensaje listo
   y deja elegir el chat — le sirve al que ya conoce a Joan, pero el registrado
   NUEVO no tiene su chat: llenar esto es lo que vuelve la verificación de un
   solo toque. (Va horneado y no en un paquete editable por la misma razón que
   NEGOCIO_OFICIAL en socio.html: un número que viajara en datos falsificables
   mandaría a los clientes al WhatsApp de un estafador.) */
var WA_NEGOCIO = '573103606348';
function abrirWhatsApp(texto) {
  var n = String(WA_NEGOCIO || '').replace(/\D/g, '');
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
}

function olvide() {
  var tel = U.normalizarTelefono(($('inTel') || {}).value || '');
  /* La recuperación es por WhatsApp y con Joan en el medio, decisión del
     11-ago: no hay SMS que pagar, y el número ya está en su Panel. */
  var texto = 'Hola, olvidé mi contraseña de la app de Tu Garantía.' +
    (tel ? ' Mi celular es ' + U.telefonoBonito(tel) + '.' : '') +
    ' ¿Me ayudas a recuperarla?';
  abrirWhatsApp(texto);
}

/* ================= LA VERIFICACIÓN POR WHATSAPP =================
   24-ago-2026, decisión de Joan: nada de SMS pagos. El registrado manda su
   código de verificación por WhatsApp DESDE su propio número; como el mensaje
   llega con el remitente puesto por WhatsApp —no por él—, si el número y el
   código cuadran con la bandeja del CRM, el celular queda verificado gratis.
   El verificador es Joan, que de todas formas iba a escribirle antes de
   aprobar: esto solo le ahorra la duda de si el número es de verdad.

   La forma V-##### es A PROPÓSITO distinta de los otros tres códigos de la
   casa (TG-XXXX-XXXX invita, 5 letras abre la app, CL-0001 solo numera): ya
   son tres y confundirlos es el error natural. Puros dígitos, además, se
   dictan fácil por teléfono. */
var VERIF_ULTIMA = '';
function codigoVerificacion() {
  var a = new Uint32Array(1);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else a[0] = Math.floor(Math.random() * 1e9);
  return 'V-' + String(10000 + (a[0] % 90000));
}
function verificarPorWhatsApp() {
  abrirWhatsApp('Hola, me acabo de registrar en la app de Tu Garantía. Soy ' +
    ((REGISTRO && REGISTRO.nombres) || 'socio nuevo') +
    ' y mi código de verificación es ' + VERIF_ULTIMA + '.');
}

/* ============================== REGISTRO ==============================
   En pasos y no en una sola página de 26 campos: nadie llena eso de una
   sentada, y una pantalla de scroll infinito es donde la gente abandona. El
   borrador se guarda solo, menos la contraseña. */
var PASOS = [
  { id: 'entrada',  titulo: 'Tu celular y tu contraseña' },
  { id: 'identidad', titulo: 'Quién eres' },
  { id: 'contacto',  titulo: 'Cómo te contactamos' },
  { id: 'domicilio', titulo: 'Dónde vives' },
  { id: 'ingresos',  titulo: 'De qué vives' },
  { id: 'referencias', titulo: 'Quién puede responder por ti' },
  { id: 'permiso',  titulo: 'Tu autorización' }
];

function pintarRegistro(paso) {
  VISTA = 'registro';
  PASO = Math.max(0, Math.min(paso, PASOS.length - 1));
  var p = PASOS[PASO];
  $('titulo').textContent = 'Abrir mi cuenta';

  var barra = '<div class="pasos">' + PASOS.map(function (_, i) {
    return '<i class="' + (i < PASO ? 'hecho' : (i === PASO ? 'aqui' : '')) + '"></i>';
  }).join('') + '</div>';

  var cuerpo;
  if (p.id === 'entrada')      cuerpo = pasoEntrada();
  else if (p.id === 'permiso') cuerpo = pasoPermiso();
  else                         cuerpo = pasoCampos(p.id);

  $('cuerpo').innerHTML =
    '<div class="card">' +
      '<div class="etq">Paso ' + (PASO + 1) + ' de ' + PASOS.length + '</div>' +
      barra +
      '<h3 class="tit" style="margin-top:var(--e3)">' + esc(p.titulo) + '</h3>' +
      cuerpo +
      '<div id="errReg" class="aviso ambar oculto"></div>' +
      '<button class="btn arriba" onclick="siguientePaso()">' +
        (PASO === PASOS.length - 1 ? 'Abrir mi cuenta' : 'Continuar') + '</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="' +
        (PASO === 0 ? 'pintarEntrar()' : 'pintarRegistro(' + (PASO - 1) + ')') + '">Volver</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

function pasoEntrada() {
  return '<p class="sub">Tu celular es tu usuario. Con él entras y por ahí te escribimos.</p>' +
    '<label for="rTel">Tu celular</label>' +
    '<input id="rTel" type="tel" inputmode="numeric" autocomplete="username" placeholder="300 111 2233" value="' +
      esc(REGISTRO.celular ? U.telefonoBonito(REGISTRO.celular) : '') + '">' +
    '<div class="ayuda">Son 10 números y empiezan por 3. Tiene que tener WhatsApp: ' +
      'por ahí te mandamos tu código si olvidas la contraseña.</div>' +
    '<label for="rClave">Crea tu contraseña</label>' +
    '<input id="rClave" type="password" autocomplete="new-password" placeholder="••••••••">' +
    '<div class="ayuda">Mínimo ' + U.LARGO_MINIMO_CLAVE + ' caracteres. No uses tu celular ' +
      'ni tu cédula: son lo primero que alguien probaría.</div>' +
    '<label for="rClave2">Escríbela otra vez</label>' +
    '<input id="rClave2" type="password" autocomplete="new-password" placeholder="••••••••">';
}

function pasoCampos(grupo) {
  return U.camposDelGrupo(grupo).map(function (c) {
    var v = REGISTRO[c.id] === undefined ? '' : REGISTRO[c.id];
    var etiqueta = '<label for="f_' + c.id + '">' + esc(c.etiqueta) +
      (c.obligatorio ? '' : ' <span class="opc">· opcional</span>') + '</label>';
    var campo;
    if (c.tipo === 'opcion') {
      campo = '<select id="f_' + c.id + '"><option value="">Escoge…</option>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      var tipo = c.tipo === 'celular' ? 'tel'
               : c.tipo === 'correo'  ? 'email'
               : c.tipo === 'fecha'   ? 'date'
               : c.tipo === 'numero' || c.tipo === 'pesos' ? 'text' : 'text';
      var modo = (c.tipo === 'celular' || c.tipo === 'numero' || c.tipo === 'pesos')
        ? ' inputmode="numeric"' : '';
      campo = '<input id="f_' + c.id + '" type="' + tipo + '"' + modo + ' value="' + esc(v) + '">';
    }
    /* El porqué se le MUESTRA al socio, no se queda en el código. Si un dato
       vale la pena pedirlo, vale la pena decir para qué; y si da vergüenza
       escribirlo, ese es el aviso de que no había que pedirlo. */
    return etiqueta + campo + '<div class="ayuda">' + esc(c.porque) + '</div>';
  }).join('');
}

function pasoPermiso() {
  return '<p class="sub">Para abrir tu cuenta necesitamos tu permiso para tratar tus datos, ' +
      'como manda la Ley 1581 de 2012.</p>' +
    '<label class="permiso"><input type="checkbox" id="autGeneral"><span>' +
      '<b>Autorizo el tratamiento de mis datos personales.</b>' +
      '<span class="muted">Los usamos para evaluar y llevar tu crédito, y para escribirte ' +
      'sobre tus pagos. No los vendemos. Puedes pedirnos que te digamos qué tenemos tuyo, ' +
      'que lo corrijamos o que lo borremos, cuando quieras.</span></span></label>' +
    '<label class="permiso"><input type="checkbox" id="autSensible"><span>' +
      'Autorizo también la foto de mi cédula y la selfie.' +
      '<span class="muted">Esto es aparte y es opcional: tu cuenta se abre igual sin ' +
      'marcarlo. La ley no permite condicionarte el servicio a que lo des.</span></span></label>' +
    '<div class="aviso" style="margin-top:var(--e4)"><b>Lo que esta app NO te pide:</b> ' +
      'no accede a tus mensajes, ni a tus llamadas, ni a tus contactos, ni a tu ubicación, ' +
      'ni a tus fotos. Solo la cámara, y solo en el momento de tomar una foto.</div>' +
    '<div class="ayuda" style="margin-top:var(--e3)">' +
      '<a href="../legal/privacidad.html" target="_blank" rel="noopener">Leer la política completa</a> · ' +
      '<a href="../legal/terminos.html" target="_blank" rel="noopener">Términos</a></div>';
}

function recogerPaso() {
  var p = PASOS[PASO];
  if (p.id === 'entrada') {
    var tel = U.normalizarTelefono($('rTel').value);
    if (tel) REGISTRO.celular = tel;
    return { clave: $('rClave').value, clave2: $('rClave2').value };
  }
  if (p.id === 'permiso') {
    return { general: $('autGeneral').checked, sensibles: $('autSensible').checked };
  }
  U.camposDelGrupo(p.id).forEach(function (c) {
    var el = $('f_' + c.id);
    if (el) REGISTRO[c.id] = el.value;
  });
  guardarBorrador(REGISTRO);
  return {};
}

var CLAVE_EN_MEMORIA = '';   // vive solo mientras la pestaña está abierta

function siguientePaso() {
  var err = $('errReg');
  err.classList.add('oculto');
  var extra = recogerPaso();
  var p = PASOS[PASO];

  if (p.id === 'entrada') {
    if (!REGISTRO.celular) return fallo(err, 'Escribe tu celular: son 10 números y empiezan por 3.');
    var rc = U.revisarContrasena(extra.clave, { telefono: REGISTRO.celular, cedula: REGISTRO.documento });
    if (!rc.ok) return fallo(err, rc.motivo);
    if (extra.clave !== extra.clave2) return fallo(err, 'Las dos contraseñas no son iguales.');
    CLAVE_EN_MEMORIA = extra.clave;
    guardarBorrador(REGISTRO);
    return pintarRegistro(PASO + 1);
  }

  if (p.id === 'permiso') {
    if (!extra.general) {
      return fallo(err, 'Sin tu autorización no podemos abrir la cuenta. Es un requisito de la ley.');
    }
    return enviarRegistro(extra.sensibles);
  }

  /* Falta algo obligatorio de ESTE paso. No se revisa el formulario entero:
     mandar al socio a un paso anterior por algo que aún no ha llenado es la
     forma más rápida de que cierre la app. */
  var r = U.revisarVinculacion(REGISTRO);
  var idsDelPaso = U.camposDelGrupo(p.id).map(function (c) { return c.id; });
  var faltanAqui = r.faltan.filter(function (f) { return idsDelPaso.indexOf(f.id) !== -1; });
  var errosAqui = r.errores.filter(function (e) { return idsDelPaso.indexOf(e.id) !== -1; });
  if (errosAqui.length) return fallo(err, errosAqui[0].motivo);
  if (faltanAqui.length) {
    return fallo(err, 'Falta ' + faltanAqui.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') + '.');
  }
  pintarRegistro(PASO + 1);
}

function enviarRegistro(sensibles) {
  var err = $('errReg');
  var r = U.revisarVinculacion(REGISTRO);
  if (!r.ok) {
    return fallo(err, 'Falta completar: ' +
      r.faltan.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') + '.');
  }
  var autorizacion = U.armarAutorizacion(new Date().toISOString(), sensibles);

  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la cuenta no se ' +
      'puede crear todavía. Tus datos quedaron guardados en este teléfono y no se ' +
      'perdieron. Esto es una versión en construcción.');
  }

  /* El código de verificación nace aquí y viaja DENTRO de la vinculación: así
     llega a la bandeja del CRM sin una sola pieza nueva de plomería, y Joan lo
     compara con el que le llegue por WhatsApp. */
  VERIF_ULTIMA = codigoVerificacion();
  REGISTRO.verificacion = VERIF_ULTIMA;

  fallo(err, 'Creando tu cuenta…');
  /* PRIMERO la bandeja de Joan, DESPUÉS la cuenta — y el orden es la garantía.
     Si fuera al revés y la bandeja fallara, la cuenta quedaría creada pero
     invisible para Joan (el defecto que este flujo tuvo hasta el 24-ago: el
     registro se iba solo a Supabase Auth y nadie lo leía). Así, si la bandeja
     falla no se crea nada y el cliente reintenta; y si la cuenta falla después,
     el registro YA está en la bandeja — reintentar no lo duplica, porque
     registrar_abierto es idempotente por celular. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registrar_abierto', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: REGISTRO.celular,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).replace(/\s+/g, ' ').trim(),
      p_cedula: REGISTRO.documento || '',
      p_datos: REGISTRO
    })
  }).then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status)); })
    .then(function (r) {
      if (!r || r.ok !== true) {
        throw { humano: 'No pudimos recibir tu registro. Revisa tu celular y tu nombre, y vuelve a intentar en unos minutos.' };
      }
      return fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
        body: JSON.stringify({
          email: U.correoDeTelefono(REGISTRO.celular),
          password: CLAVE_EN_MEMORIA,
          data: { telefono: REGISTRO.celular, vinculacion: REGISTRO, autorizacion: autorizacion }
        })
      });
    })
    .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        var yaExiste = /registered|already/i.test(JSON.stringify(res.j || {}));
        return fallo(err, yaExiste
          ? 'Ya hay una cuenta con ese celular. Entra con tu contraseña, o toca «Olvidé mi contraseña».'
          : 'No pudimos crear la cuenta. Vuelve a intentar en un momento.');
      }
      try { localStorage.removeItem(LLAVE_BORRADOR); } catch (e) {}
      CLAVE_EN_MEMORIA = '';
      pintarRegistrado();
    })
    .catch(function (e) {
      fallo(err, (e && e.humano) ? e.humano
        : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
    });
}

function pintarRegistrado() {
  VISTA = 'listo';
  $('titulo').textContent = 'Tu cuenta quedó abierta';
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Listo.</b> Tu cuenta quedó creada.</div>' +
      /* La verificación va PRIMERO y con el código a la vista: es el único
         paso que acelera la revisión, y mandarlo desde su propio WhatsApp es
         lo que prueba que el número es suyo. Sin este paso igual se revisa —
         se dice tal cual, sin amenaza. */
      (VERIF_ULTIMA
        ? '<div style="margin-top:var(--e4)"><b>Confirma tu número por WhatsApp.</b>' +
          '<p class="sub">Escríbenos desde este mismo celular con tu código de verificación: ' +
          '<b style="letter-spacing:.08em">' + esc(VERIF_ULTIMA) + '</b>. ' +
          'Así confirmamos que el número es tuyo y tu revisión sale más rápida.</p>' +
          '<button class="btn arriba" onclick="verificarPorWhatsApp()">Enviar mi código por WhatsApp</button></div>'
        : '') +
      '<p class="sub" style="margin-top:var(--e4)">Ahora revisamos tus datos. ' +
      '<b>Todavía no tienes cupo asignado</b>: te escribimos por WhatsApp en cuanto ' +
      'terminemos de revisar, y ahí te decimos hasta cuánto puedes pedir.</p>' +
      '<p class="sub">Mientras tanto puedes entrar y ver el catálogo con los costos reales.</p>' +
      '<button class="btn sec" onclick="pintarEntrar()">Entrar a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* ============================== LA CUENTA ==============================
   Etapa 6. Lo que el socio ve cuando entra: su perfil y su cupo, el simulador,
   el botón de pedir, y su historial.

   TODO SALE DE LA SESIÓN, Y LO QUE NO ESTÁ SE DICE. Un historial vacío dibujado
   como si fuera real es la clase de mentira que este proyecto lleva meses
   quitándose: si la nube todavía no responde, la pantalla lo dice. */
var SESION = null;
var MONTO = 500000;

function perfilDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  var p = m && m.perfil;
  return C.perfilValido(p) ? p : 'nuevo';
}
function historialDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  return (m && Array.isArray(m.creditos)) ? m.creditos : [];
}

function pintarCuenta(sesion) {
  if (sesion) SESION = sesion;
  VISTA = 'cuenta';
  $('titulo').textContent = 'Mi cuenta';
  var idPerfil = perfilDeSesion(SESION);
  var perfil = C.PERFILES[idPerfil];

  MONTO = Math.min(MONTO, perfil.cupo_maximo || 500000);
  MONTO = Math.max(MONTO, 100000);

  $('cuerpo').innerHTML =
    tarjetaCupo(perfil) +
    tarjetaSimulador(idPerfil) +
    tarjetaHistorial() +
    '<div class="card">' +
      '<button class="btn sec" onclick="pintarEntrar()">Salir</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarBorrar()">' +
        'Borrar mi cuenta</button>' +
    '</div>' + pie();
  pintarSimulacion();
  window.scrollTo(0, 0);
}

function tarjetaCupo(perfil) {
  if (perfil.cupo_maximo === 0) {
    return '<div class="card laca">' +
      '<div class="etq">Tu cupo</div>' +
      '<div class="cifra">En revisión</div>' +
      '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
        'Todavía estamos revisando tus datos. Te escribimos por WhatsApp en cuanto ' +
        'terminemos y ahí te decimos hasta cuánto puedes pedir. Mientras tanto puedes ' +
        'simular y dejar tu solicitud.</div></div>';
  }
  return '<div class="card laca">' +
    '<div class="etq">Puedes pedir hasta</div>' +
    '<div class="cifra oro">' + COP(perfil.cupo_maximo) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'Socio ' + esc(perfil.nombre.toLowerCase()) + '. ' + esc(perfil.texto) + '</div></div>';
}

/* EL SIMULADOR. Mueve el monto y las cifras cambian; no hay un botón "calcular"
   que devuelva un número que uno ya no sabe de dónde salió. Y las cuotas se ven
   CON FECHA antes de pedir, que es lo que el socio necesita para saber si le
   cuadra con el día que le pagan. */
function tarjetaSimulador(idPerfil) {
  var tope = Math.max(C.PERFILES[idPerfil].cupo_maximo || 0, 2000000);
  return '<div class="card">' +
    '<h3 class="tit">Simula tu crédito</h3>' +
    '<p class="sub">Mueve el monto y mira exactamente cuánto pagarías.</p>' +
    '<input type="range" id="rMonto" min="100000" max="' + tope + '" step="50000" value="' + MONTO + '" ' +
      'oninput="cambiaMonto(this.value)" style="width:100%;margin-top:var(--e4);accent-color:var(--rojo)">' +
    '<div id="simu"></div>' +
    '</div>';
}

function cambiaMonto(v) {
  MONTO = Number(v) || 100000;
  pintarSimulacion();
}

function pintarSimulacion() {
  var idPerfil = perfilDeSesion(SESION);
  var r = C.simular({ perfil: idPerfil, capital: MONTO, fecha_desembolso: hoyISO() });
  var c = r.puede ? r : r.cotizacion;
  var el = $('simu');
  if (!el) return;

  if (!c) {
    el.innerHTML = '<div class="aviso ambar">' + esc(r.mensaje) + '</div>';
    return;
  }

  var sobreCupo = !r.puede && r.motivo === 'sobre_cupo';
  var sinCupo = !r.puede && r.motivo === 'sin_cupo';

  el.innerHTML =
    '<div class="cifra sm" style="margin-top:var(--e3)">' + COP(c.capital) + '</div>' +
    '<div class="muted" style="font-size:13.5px">' + c.meses + ' cuotas de <b>' +
      COP(c.cuota_tipica) + '</b></div>' +
    '<div class="sep"></div>' +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Total a pagar', COP(c.total_a_pagar)) +
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +

    '<div class="grupo-tit">Cuándo pagarías</div>' +
    c.cuotas.map(function (q) {
      return fila('Cuota ' + q.n + ' · ' + fmtFecha(q.fecha), COP(q.total));
    }).join('') +

    /* LA DIVULGACIÓN, AQUÍ Y NO EN UN RINCÓN. Google la exige "en el mismo lugar
       donde el usuario solicita el crédito", y además es lo correcto: el precio
       completo justo antes del botón, no en una pantalla de términos que nadie
       abre. El texto sale de cumplimiento.js, el mismo que va en la ficha. */
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      esc(divulgacionHoy()) + '</div>' +

    (sobreCupo
      ? '<div class="aviso ambar">Estás pidiendo más que tu cupo (' + COP(r.cupo_maximo) + '). ' +
        'Puedes dejar la solicitud igual: la revisamos y te respondemos.</div>'
      : '') +
    (sinCupo
      ? '<div class="aviso ambar">Todavía no tienes cupo asignado. Puedes dejar tu ' +
        'solicitud y la revisamos.</div>'
      : '') +

    '<button class="btn arriba" onclick="pedir()">' +
      (r.puede ? 'Pedir ' + COP(c.capital) : 'Dejar mi solicitud') + '</button>' +
    '<div id="errPedir" class="aviso ambar oculto"></div>';
}

var DIVULGACION = null;
function divulgacionHoy() {
  if (!DIVULGACION) {
    var K = window.Cumplimiento;
    var d = K ? K.divulgacion(hoyISO()) : null;
    DIVULGACION = (d && d.puede) ? d.texto : '';
  }
  return DIVULGACION;
}

function fmtFecha(iso) {
  var p = String(iso).split('-');
  var mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}

function pedir() {
  var err = $('errPedir');
  err.classList.add('oculto');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la solicitud no ' +
      'se puede enviar. Esto es una versión en construcción.');
  }
  fallo(err, 'Enviando…');
  /* La solicitud NO es un crédito: entra a la bandeja de Joan y él responde. La
     pantalla lo dice con esas palabras para que nadie salga creyendo que ya le
     desembolsaron. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/play_solicitar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', apikey: CFG.anon,
      Authorization: 'Bearer ' + ((SESION && SESION.access_token) || CFG.anon)
    },
    body: JSON.stringify({ p_capital: MONTO, p_meses: C.PLAZO_MESES })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      /* La función contesta {ok:false} con HTTP 200 cuando algo no cuadra o el
         freno de solicitudes está lleno: decir «recibimos» ahí sería mentir. */
      if (!j || j.ok !== true) {
        return fallo(err, 'No pudimos recibir la solicitud ahora. Espera unos minutos y vuelve a intentar.');
      }
      pintarPedido();
    })
    .catch(function () {
      fallo(err, 'No pude enviar la solicitud. Revisa tu internet y vuelve a intentar.');
    });
}

function pintarPedido() {
  $('titulo').textContent = 'Solicitud enviada';
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Recibimos tu solicitud.</b></div>' +
      '<p class="sub" style="margin-top:var(--e4)">Pediste ' + COP(MONTO) + ' a ' +
      C.PLAZO_MESES + ' meses. <b>Todavía no es un crédito:</b> la revisamos y te ' +
      'respondemos por WhatsApp. Si la aprobamos, ahí te decimos cuándo recibes la plata.</p>' +
      '<button class="btn arriba" onclick="pintarCuenta()">Volver a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* EL HISTORIAL. Sale de la sesión. Si no hay nada, se distingue "no tienes
   créditos todavía" de "no pudimos cargarlos": son cosas distintas y confundirlas
   le haría creer al socio que perdió su historial. */
function tarjetaHistorial() {
  var creditos = historialDeSesion(SESION);
  if (!SESION) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">No pudimos cargar tu historial. Vuelve a entrar en un momento.</p></div>';
  }
  if (!creditos.length) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">Todavía no tienes créditos con nosotros. Cuando pidas el primero, ' +
      'aquí vas a ver cada cuota y cada pago.</p></div>';
  }
  return '<div class="card"><div class="etq">Tu historial</div>' +
    creditos.map(function (cr) {
      var pagadas = (cr.cuotas || []).filter(function (q) { return q.pagada; }).length;
      return '<div style="margin-top:var(--e4)">' +
        '<b>' + COP(cr.capital) + '</b> a ' + cr.meses + ' meses' +
        '<div class="ayuda">' + esc(fmtFecha(cr.fecha_desembolso)) + ' · ' +
          pagadas + ' de ' + (cr.cuotas || []).length + ' cuotas pagadas' +
          (cr.pagado ? ' · <b>terminado</b>' : '') + '</div>' +
        (cr.cuotas || []).map(function (q) {
          return fila('Cuota ' + q.n + ' · ' + fmtFecha(q.fecha),
                      COP(q.total) + (q.pagada ? ' ✓' : ''));
        }).join('') +
        '</div>';
    }).join('') +
    '<button class="btn sec sm arriba" onclick="imprimirCertificado()">' +
      'Descargar mi certificado de pagos</button>' +
    '</div>';
}

/* El certificado y el contrato: una ventana imprimible que el teléfono guarda
   como PDF con "Imprimir → Guardar como PDF". Sin librerías, sin subir nada a
   ningún servidor, y funciona igual en Android y en iPhone. */
function imprimirCertificado() {
  var creditos = historialDeSesion(SESION);
  var nombre = (SESION && SESION.user && SESION.user.user_metadata &&
                SESION.user.user_metadata.vinculacion &&
                (SESION.user.user_metadata.vinculacion.nombres + ' ' +
                 SESION.user.user_metadata.vinculacion.apellidos)) || 'Socio';
  var filas = creditos.map(function (cr) {
    return '<h3>' + COP(cr.capital) + ' a ' + cr.meses + ' meses · ' +
      esc(fmtFecha(cr.fecha_desembolso)) + '</h3><table>' +
      (cr.cuotas || []).map(function (q) {
        return '<tr><td>Cuota ' + q.n + '</td><td>' + esc(fmtFecha(q.fecha)) + '</td>' +
          '<td>' + COP(q.total) + '</td><td>' + (q.pagada ? 'Pagada' : 'Pendiente') + '</td></tr>';
      }).join('') + '</table>';
  }).join('');

  var w = window.open('', '_blank');
  if (!w) return;
  w.document.write(
    '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Certificado de pagos · Tu Garantía</title><style>' +
    'body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#111}' +
    'h1{font-size:20px} h3{font-size:15px;margin-top:24px}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}' +
    'td{padding:6px 4px;border-bottom:1px solid #ddd}' +
    '.pie{margin-top:34px;font-size:12px;color:#666;line-height:1.6}' +
    '</style></head><body>' +
    '<h1>Certificado de pagos</h1>' +
    '<p>' + esc(nombre) + '<br>Expedido el ' + esc(fmtFecha(hoyISO())) + '</p>' +
    (filas || '<p>Sin créditos registrados.</p>') +
    '<div class="pie">Tu Garantía · Este documento refleja lo registrado en la ' +
      'plataforma a la fecha de expedición.</div>' +
    '</body></html>');
  w.document.close();
  w.focus();
  w.print();
}

function pintarBorrar() {
  $('titulo').textContent = 'Borrar mi cuenta';
  var K = window.Cumplimiento;
  var B = K.BORRADO;
  $('cuerpo').innerHTML =
    '<div class="card">' +
      '<h3 class="tit">Qué se borra</h3>' +
      '<ul style="margin:var(--e3) 0 0;padding-left:20px;line-height:1.7">' +
        B.se_borra.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
    '</div>' +
    '<div class="card">' +
      '<h3 class="tit">Qué NO se puede borrar</h3>' +
      B.se_conserva.map(function (x) {
        return '<div style="margin-top:var(--e3)"><b>' + esc(x.que) + '</b>' +
          '<div class="ayuda">' + esc(x.porque) + '</div></div>';
      }).join('') +
    '</div>' +
    '<div class="card">' +
      '<a class="btn" href="borrar-cuenta.html">Continuar</a>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarCuenta()">Volver</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

function pie() {
  return '<div class="pie">' +
    '<a href="../legal/terminos.html" style="color:inherit">Términos</a> · ' +
    '<a href="../legal/privacidad.html" style="color:inherit">Tus datos</a><br>' +
    '<span class="muted" style="font-size:11px">Versión ' + esc(VERSION_PLAY) +
    ' · reglas del ' + esc(C.TOPES[C.TOPES.length - 1].desde) + '</span></div>';
}

/* ============================== ARRANQUE ============================== */
(function () {
  if (!C || !U) {
    document.body.innerHTML = '<div class="wrap"><div class="aviso ambar" style="margin-top:40px">' +
      'No pude cargar las reglas del crédito. Vuelve a abrir la página.</div></div>';
    return;
  }
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js').catch(function () {});
    });
  }
  pintarEntrar();
})();
</script>
