         teléfono ni su internet, y se dice; y su pedido no se pierde: se le
         ofrece mandarlo por el chat de Créditos nuevos, ya escrito. */
      CS.error('Pedir desde aquí todavía no está encendido de nuestro lado (no es tu teléfono ni tu internet).');
      if (salida) salida.innerHTML = '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pedirPorElChat()">' +
        'Mandarlo por el chat de Créditos nuevos</button>';
      return;
    }
    CS.error(c === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y tu solicitud sale al instante.'
      : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  });
}

/* 19-oct-2026 — EL ESTIMADO VIAJA CON LO QUE PIDIÓ, para que Joan lo vea en
   el CRM («El cliente vio un estimado de $6.000») y sepa si su propuesta se
   aleja. Va DESPUÉS de pedir y aparte (anotar_estimado, base/20261019_el_
   estimado_viaja.sql), no dentro de solicitar_a_la_medida: esa función ya
   está viva y no se reescribe, y así pedir no depende de que la migración
   nueva esté corrida. Si no lo está (404) o falla, no se le dice nada al
   cliente —su solicitud ya llegó— y el CRM simplemente no dice que vio un
   estimado, que es la verdad que puede probar. */
/* 21-oct-2026 — H2: con `ses`, la sesión que pidió (no la que esté en vivo). */
function anotarEstimado(sol, estimado, ses) {
  if (!estimado || !sol || sol.id == null) return Promise.resolve(null);
  return rpcSesion('anotar_estimado', { p_id: Number(sol.id), p_estimado: estimado }, ses)
    .catch(function () { return null; });
}

/* Cada motivo de la base, su frase. Las cifras del piso y del techo las dice
   el SERVIDOR en la misma respuesta; si no vinieran, las del módulo, que son
   las mismas (una prueba las compara con la migración). */
function motivoDelPedido(j) {
  var m = j && j.motivo;
  return m === 'minimo' ? 'Lo mínimo que estudiamos es ' + CS.pesos(j.minimo || CS.MONTO_MIN) + '. Sube la cifra y lo vemos.'
    : m === 'maximo' ? 'Por aquí llegamos hasta ' + CS.pesos(j.maximo || CS.MONTO_MAX) + '. Si necesitas más, escríbenos por el chat y lo hablamos.'
    : m === 'fecha' ? 'Escoge un día entre mañana y dentro de seis meses.'
    : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y tu solicitud sale al instante.'
    : m === 'muchas' ? 'Ya nos dejaste varias solicitudes hace poco. Las tenemos: dale un rato y te respondemos.'
    : m === 'ocupado' ? 'Estamos recibiendo muchas solicitudes en este momento. Vuelve a intentar en unos minutos.'
    : 'No pudimos recibir tu solicitud ahora. Espera unos minutos y vuelve a intentar.';
}

/* El pedido, escrito, en el chat de Créditos nuevos: la salida mientras la
   base no tenga solicitar_a_la_medida. No se manda solo: queda en la casilla
   para que la persona lo lea y toque «Enviar». */
function pedirPorElChat() {
  var t = CS ? CS.resumen(CS.estado(), hoyISO()).replace(/^Pides /, 'Quiero pedir ') : '';
  CANAL = 'creditos'; TAB = 'chat';
  pintarCuenta();
  var x = $('chTexto'); if (x && t) x.value = t;
}

/* LA SOLICITUD QUE ESPERA PROPUESTA. Se dice lo pedido con sus palabras y en
   qué va, sin promesas: ni una hora (la contesta una persona), ni un aviso que
   no existe (la propuesta se ve aquí, al abrir la app, y no llega sola). */
function tarjetaSolicitudEnEspera(sol) {
  var p = (sol && sol.pedido) || {};
  var monto = Number(p.capital != null ? p.capital : (sol.pedido_monto || sol.capital)) || 0;
  var fecha = String(p.fecha_pago || sol.fecha_corte || '').slice(0, 10);
  var P = CS ? CS.pesos : COP, F = CS ? CS.fechaLarga : fmtFecha;
  return '<div class="card"><div class="aviso verde"><b>Recibimos tu solicitud.</b></div>' +
    '<p class="sub" style="margin-top:var(--e4)">Pediste <b>' + esc(P(monto)) + '</b>' +
      (fecha ? ' para pagar el <b>' + esc(F(fecha)) + '</b>' : '') + '. ' +
      '<b>Todavía no es un crédito:</b> la revisamos y te mandamos una propuesta con el costo exacto en pesos. ' +
      'Cuando la tengamos la ves aquí, en la pestaña Crédito, y la aceptas solo si te sirve.</p>' +
    (sol.pedido_nota ? '<p class="sub">Nos dijiste: «' + esc(sol.pedido_nota) + '»</p>' : '') +
    '<p class="sub">¿Quieres cambiar lo que pediste? Mueve la calculadora de la pestaña Crédito y vuelve a ' +
      'tocar «Pedir»: cambiamos esta misma solicitud.</p>' +
  '</div>';
}
function esperaPropuesta(sol) {
  return !!sol && sol.estado === 'nueva' && !sol.contrapropuesta;
}
/* 8-oct-2026 (segunda vuelta) — MIENTRAS ESPERA, LA CALCULADORA DICE LO QUE
   PIDIÓ. La tarjeta de espera le dice «mueve la calculadora y vuelve a tocar
   Pedir»: si la calculadora arrancara en otra cifra (otro teléfono, o lo
   guardado ya venció), «Pedir» sin mover nada cambiaría la solicitud por esa
   otra. La solicitud de la base manda; lo que se esté escribiendo no se toca
   (si la persona ya movió algo desde que abrió, se respeta). */
var PEDIDO_PUESTO = '';
function ponerCalculadoraEnLoPedido(sol) {
  if (!CS || !sol) return;
  var p = sol.pedido || {};
  var monto = Number(p.capital != null ? p.capital : sol.pedido_monto) || 0;
  var dias = CS.diasHasta(String(p.fecha_pago || sol.fecha_corte || '').slice(0, 10), hoyISO());
  if (!(monto > 0) || dias === null) return;
  var llave = String(sol.id) + '|' + monto + '|' + p.fecha_pago;
  if (PEDIDO_PUESTO === llave) return;   // ya se puso: lo que movió después es suyo
  PEDIDO_PUESTO = llave;
  CS.poner({ monto: monto, dias: dias });
  CS.guardar(CS.estado(), null, hoyISO());
}

/* LA PROPUESTA, CON LAS CONDICIONES DE ESE CRÉDITO — 8-oct-2026.
   Joan: «al momento de la contrapropuesta que se le muestren los términos y
   condiciones de ese crédito en específico». Debajo del texto de Joan va el
   bloque «Las condiciones de este crédito» (qué recibe, cuándo paga, el
   total, lo que cuesta, la garantía que le deja, qué pasa si se atrasa y que
   eso se negocia, cómo se paga) y la casilla «Leí y acepto las condiciones de
   este crédito». Sin la casilla el botón no se puede tocar, y lo que se
   aceptó viaja con la aceptación (aceptar_condiciones).

   La casilla se acuerda por solicitud Y por propuesta (CS.llaveDeCasilla): si
   Joan cambia la propuesta, la marca de la vieja no vale para la nueva. */
var CONDICIONES_LEIDAS = {};
var SOL_EN_PANTALLA = null;
function tarjetaContrapropuesta(sol) {
  var cp = sol.contrapropuesta || {};
  var aceptada = sol.estado === 'aceptada';
  var P = CS ? CS.pesos : COP;
  var cond = CS ? CS.condiciones(sol, { hoy: hoyISO() }) : null;
  /* 21-oct-2026 — con una propuesta ya aceptada se SUELTA: no tiene casilla ni
     botón de aceptar, y SE ACTUALIZA SOLA (casillaDeLaPropuestaMarcada) seguía
     viendo la de antes, con su marca, y no recargaba nunca más en Crédito. */
  SOL_EN_PANTALLA = aceptada ? null : sol;
  var h = '<div class="card">' +
    (aceptada ? '' : '<div class="aviso ambar"><b>Te hicimos una propuesta.</b> Léela con calma y decide.</div>') +
    '<div class="etq">' + (aceptada ? 'Tu crédito, aceptado' : 'Tu propuesta') + '</div>' +
    (cp.texto ? '<p class="sub">' + esc(cp.texto) + '</p>' : '') +
    /* Sin el módulo, lo de siempre: lo que recibe, lo que cuesta, lo que
       devuelve y cuándo. Una propuesta nunca se queda sin cifras. */
    (cond ? CS.condicionesHTML(cond)
          : fila('Te prestamos', COP(cp.capital)) +
            fila('Lo que cuesta', COP(cp.costo)) +
            fila('Devuelves', COP(cp.total)) +
            '<div class="grupo-tit">Cuándo pagas</div>' +
            cuotasDePropuesta(cp));
  if (aceptada) {
    /* 7-oct-2026 — sin «tu código de acceso»: Joan apagó los códigos.
       22-oct-2026 — con la cuenta que eligió, si la base la guardó para ESTA
       propuesta (CP.destinoVigente); solo el final del número. Si no la hay
       (aceptó por la puerta vieja), lo de siempre: se lo decimos por el chat. */
    var dst = CP ? CP.destinoVigente(sol) : null;
    h += '<div class="aviso verde" style="margin-top:var(--e3)"><b>Listo: aceptaste ' + P(cp.capital) + '.</b> ' +
      (dst
        ? 'Te la consignamos a <b>' + esc(CP.describirDestino(dst)) + '</b>, a tu nombre. Te avisamos <b>en el chat de la app</b> cuando la enviemos. '
        : 'Te avisamos <b>en el chat de la app</b> cuándo y por dónde recibes la plata. ') +
      'No tienes que hacer nada más por ahora.</div>';
  } else {
    var marcada = !!(CS && CONDICIONES_LEIDAS[CS.llaveDeCasilla(sol)]);
    /* 22-oct-2026 — «¿A DÓNDE TE CONSIGNAMOS?», ANTES DEL «ACEPTO». Joan: «al
       momento de que el cliente acepte la contrapropuesta, que se le pregunte
       nuevamente a qué cuenta desea que le consignen; recomendemos que sea por
       billeteras digitales ya que es más rápido». Las que dio al registrarse
       (mis_cuentas_de_pago: ver cuentasDelRegistro), billeteras y llave
       primero, y «Otra cuenta a tu nombre».
       Solo si están las condiciones (CS): sin ellas la aceptación no puede
       llevar la cuenta (aceptar_con_destino pide lo que vio), y una pregunta
       cuya respuesta no viaja sería mentirle. */
    h += (preguntaDestino(sol) ? '<div id="cajaDestino">' + eleccionDestinoHTML(sol) + '</div>' : '') +
      (CS ? CS.casillaHTML('condLeidas', 'marcarCondiciones(this.checked)', marcada) : '') +
      /* Con las condiciones a la vista, «aceptar no te entrega la plata» ya lo
         dice su último renglón: aquí solo lo que falta, que no aceptar es gratis. */
      (cond
        ? '<p class="sub" style="margin-top:var(--e3)">Si no te cuadra, no aceptes: no pasa nada y no pierdes nada.</p>'
        : '<p class="sub" style="margin-top:var(--e3)">Aceptar todavía no te entrega la plata: ' +
          'es tu visto bueno a estas cifras. Después te avisamos cuándo y por dónde la recibes. ' +
          'Y si no te cuadra, no aceptes: no pasa nada y no pierdes nada.</p>') +
      /* 8-oct-2026 (segunda vuelta) — APAGADO PERO NO MUDO. Con `disabled` el
         toque no hacía nada y no decía por qué: el aviso «Marca la casilla…»
         de aceptarContrapropuesta nunca se alcanzaba (lo probó la revisión del
         teléfono). Ahora se ve apagado (aria-disabled), se puede tocar, y al
         tocarlo dice qué falta; y debajo, mientras falte, una línea lo dice. */
      '<button class="btn arriba" id="btnAceptar" onclick="aceptarContrapropuesta(' + Number(sol.id) + ')"' +
        (CS && !marcada ? ' aria-disabled="true" style="opacity:.55"' : '') + '>' +
        'Acepto: recibo ' + P(cp.capital) + ' y devuelvo ' + P(cp.total) + '</button>' +
      (CS ? '<div class="ayuda" id="faltaCasilla"' + (marcada ? ' style="display:none"' : '') + '>' +
        'Para aceptar, marca primero la casilla de arriba.</div>' : '') +
      '<div id="errAceptar" class="aviso ambar oculto"></div>';
  }
  return h + '</div>';
}

function marcarCondiciones(si) {
  if (!CS || !SOL_EN_PANTALLA) return;
  CONDICIONES_LEIDAS[CS.llaveDeCasilla(SOL_EN_PANTALLA)] = !!si;
  var b = $('btnAceptar');
  if (b && b.setAttribute) {
    if (si) { b.removeAttribute && b.removeAttribute('aria-disabled'); if (b.style) b.style.opacity = ''; }
    else { b.setAttribute('aria-disabled', 'true'); if (b.style) b.style.opacity = '.55'; }
  }
  var f = $('faltaCasilla'); if (f && f.style) f.style.display = si ? 'none' : '';
  var err = $('errAceptar'); if (err && si) err.classList.add('oculto');
}

/* ===========================================================================
 * ¿A DÓNDE TE CONSIGNAMOS? — 22 de octubre de 2026
 *
 * Lo que eligió vive aquí, por solicitud Y por propuesta (como la casilla de
 * las condiciones): si Joan cambia la propuesta, se le vuelve a preguntar. Y
 * en memoria, no en el teléfono: es un dato de pago, y la pestaña se lo lleva
 * al cerrarse. Se manda JUNTO con la aceptación (aceptar_con_destino): no
 * hay un paso aparte que se pueda caer a la mitad y dejar una aceptación sin
 * cuenta. Las reglas y el marcado, de app/cuentas-pago.js.
 * ======================================================================== */
var DESTINOS = {};
function preguntaDestino(sol) { return !!(CP && CS && sol); }
function llaveDeDestino(sol) {
  var cp = (sol && sol.contrapropuesta) || {};
  return String(sol && sol.id) + '|' + String(cp.creada_en || '');
}
function destinoDe(sol) {
  var k = llaveDeDestino(sol);
  if (!DESTINOS[k]) DESTINOS[k] = { eleccion: null, otra: {}, error: '' };
  return DESTINOS[k];
}
/* 22-oct-2026 — LAS CUENTAS DEL REGISTRO, DE DONDE SÍ LLEGAN. Se leían de
   sol.datos, y ese campo la base no se lo manda al teléfono desde el 7-oct
   (mi_solicitud le quita `datos`, a propósito: puede ser el registro de otra
   persona). La lista salía siempre vacía y el registro prometía lo contrario.
   Ahora las pide mis_cuentas_de_pago (base/20261022b_las_cuentas_del_registro.sql),
   que solo las da si el sello del registro casa con esta cuenta (ver
   LLAVE_SELLO en app/cuentas-pago.js). Una vez por solicitud y por sesión: si
   falla (404 sin el archivo, la red, la sesión vencida) queda «Escribe tu
   cuenta», que es lo honesto, y no se reintenta en cada repintada. En memoria
   y nunca en el teléfono, como lo elegido (DESTINOS); «Salir» las suelta. */
var CUENTAS_DEL_REGISTRO = {};
function llaveDeCuentas(sol) {
  return String((SESION && SESION.access_token) || '') + '|' + String(sol && sol.id);
}
function cuentasDelRegistro(sol) {
  var k = llaveDeCuentas(sol);
  if (CUENTAS_DEL_REGISTRO[k]) return CUENTAS_DEL_REGISTRO[k];
  var c = CUENTAS_DEL_REGISTRO[k] = { estado: 'cargando', opciones: [] };
  var listo = function (cuentas) {
    c.estado = 'ok';
    c.opciones = CP ? CP.opcionesDeDestino(cuentas || {}) : [];
    if (SOL_EN_PANTALLA && Number(SOL_EN_PANTALLA.id) === Number(sol.id)) repintarDestino();
  };
  var p;
  /* Se llama mientras se arma la tarjeta: un error aquí no la puede tumbar. */
  try { p = rpcSesion('mis_cuentas_de_pago', { p_id: Number(sol.id) }); }
  catch (e) { c.estado = 'ok'; return c; }
  p.then(function (j) {
    listo(j && j.ok === true && j.cuentas && typeof j.cuentas === 'object' ? j.cuentas : {});
  }, function () { listo({}); });
  return c;
}
function opcionesDeDestinoDe(sol) {
  var c = (CP && sol) ? CUENTAS_DEL_REGISTRO[llaveDeCuentas(sol)] : null;
  return (c && c.estado === 'ok') ? c.opciones : [];
}
function eleccionDestinoHTML(sol) {
  var d = destinoDe(sol);
  var c = cuentasDelRegistro(sol);
  return CP.eleccionHTML({ opciones: opcionesDeDestinoDe(sol), cargando: c.estado === 'cargando', estado: d, prefijo: 'dst',
    alElegir: 'elegirDestino', alMedio: 'medioDestino', alEscribir: 'escribirDestino', error: d.error });
}
function repintarDestino() {
  var c = $('cajaDestino');
  if (c && SOL_EN_PANTALLA && preguntaDestino(SOL_EN_PANTALLA)) c.innerHTML = eleccionDestinoHTML(SOL_EN_PANTALLA);
}
function elegirDestino(v) {
  if (!SOL_EN_PANTALLA) return;
  var d = destinoDe(SOL_EN_PANTALLA);
  d.eleccion = String(v); d.error = '';
  repintarDestino();
}
function medioDestino(m) {
  if (!SOL_EN_PANTALLA) return;
  var d = destinoDe(SOL_EN_PANTALLA);
  d.otra = { medio: String(m || ''), es_mia: !!(d.otra && d.otra.es_mia === true) };
  d.error = '';
  repintarDestino();
}
/* Mientras escribe NO se repinta (perdería el foco y el teclado); solo al
   cambiar de banco, porque «Otro» abre la casilla del nombre. */
function escribirDestino(campo, valor) {
  if (!SOL_EN_PANTALLA) return;
  var d = destinoDe(SOL_EN_PANTALLA);
  d.otra = d.otra || {};
  if (campo === 'es_mia') { d.otra.es_mia = valor === true; return; }
  d.otra[campo] = String(valor == null ? '' : valor);
  if (campo === 'banco_codigo') {
    var b = CP && CP.bancoPorCodigo(valor);
    d.otra.banco = (b && b.codigo !== 'otro') ? b.nombre : '';
    repintarDestino();
  }
}

/* Las cuotas de una propuesta, segmentadas. Si la propuesta trae cuotas se
   pintan una por una; si trae un solo pago se pinta ESE, con su fecha y su
   monto. Partir un pago único en tres renglones inventados sería la pantalla
   fabricando un acuerdo que nadie hizo. (8-oct-2026: es el respaldo de la
   tarjeta cuando app/calculadora-solicitud.js no llegó.) */
function cuotasDePropuesta(cp) {
  if (cp.cuotas && cp.cuotas.length) return cuadroCuotas(cp.cuotas);
  if (!cp.fecha_pago) return '';
  return fila('Pago único · ' + fmtFecha(cp.fecha_pago), COP(cp.total)) +
    '<div class="ayuda">Es un solo pago, ' + Number(cp.dias) + ' días después de ' +
      'que recibas la plata. No hay cuotas intermedias ni nada que pagar antes.</div>';
}

/* Lo que dice arriba de la tarjeta según cómo se llegó a ella. */
function avisoDeSolicitud(nota) {
  if (nota === 'ya_habia') return '<div class="card"><div class="aviso">Ya tenías una solicitud abierta: es esta.</div></div>';
  if (nota === 'cambiada') return '<div class="card"><div class="aviso">Cambiamos tu solicitud con lo que acabas de pedir.</div></div>';
  if (nota === 'cambio') {
    return '<div class="card"><div class="aviso ambar"><b>La propuesta cambió mientras la leías.</b> ' +
      'Esta es la nueva: léela antes de aceptar.</div></div>';
  }
  /* 22-oct-2026 — aceptó, pero la base todavía no sabe guardar la cuenta
     (aceptar_con_destino sin publicar: 404). La aceptación quedó; la cuenta
     no, y se dice. */
  if (nota === 'sin_destino') {
    return '<div class="card"><div class="aviso ambar"><b>Tu aceptación quedó, pero no alcanzamos a guardar a qué cuenta te consignamos.</b> ' +
      'Te lo preguntamos por el chat de la app antes de enviarte la plata.</div></div>';
  }
  return '';
}

function pintarSolicitud(sol, nota) {
  VISTA = 'solicitud';
  marcarVista('');
  $('titulo').textContent = sol.estado === 'aceptada' ? 'Tu crédito'
    : esperaPropuesta(sol) ? 'Solicitud enviada' : 'Tu propuesta';
  $('cuerpo').innerHTML = avisoDeSolicitud(nota) +
    (esperaPropuesta(sol) ? tarjetaSolicitudEnEspera(sol) : tarjetaContrapropuesta(sol)) +
    '<div class="card"><button class="btn sec" onclick="pintarCuenta()">Ir a mi cuenta</button></div>' + pie();
  window.scrollTo(0, 0);
}

/* ACEPTAR, con las condiciones que vio. La base compara el monto, el total, la
   fecha de pago y el sello de la propuesta que la persona tenía delante con la
   vigente: si Joan la cambió mientras leía, contesta 'cambio' y se le muestra
   la nueva, con la casilla sin marcar.
   8-oct-2026 (segunda vuelta) — CON 404 YA NO SE ACEPTA «CON LA DE SIEMPRE».
   La migración del 8-oct sin correr hacía caer en aceptar_contrapropuesta, que
   no guarda nada de lo leído, mientras los términos prometen «guardamos una
   copia tal como las viste». Ahora se dice que no se pudo y que nos escriba
   por el chat si le urge: mejor una aceptación que espera que una sin constancia. */
function aceptarContrapropuesta(id) {
  var err = $('errAceptar');
  var sol = (SOL_EN_PANTALLA && Number(SOL_EN_PANTALLA.id) === Number(id)) ? SOL_EN_PANTALLA : null;
  if (CS && !(sol && CONDICIONES_LEIDAS[CS.llaveDeCasilla(sol)])) {
    if (err) fallo(err, 'Marca la casilla «' + CS.TEXTO_CASILLA + '» para seguir.');
    return;
  }
  var cond = (CS && sol) ? CS.condiciones(sol, { hoy: hoyISO() }) : null;
  /* 22-oct-2026 — y a dónde se consigna: sin elegir (o con una cuenta mal
     escrita, o sin «Es mía») no se acepta, y se dice ahí mismo. */
  var destino = null;
  if (cond && preguntaDestino(sol)) {
    var de = CP.destinoElegido(opcionesDeDestinoDe(sol), destinoDe(sol));
    if (!de.ok) {
      destinoDe(sol).error = de.motivo;
      repintarDestino();
      if (err) fallo(err, de.motivo);
      return;
    }
    destinoDe(sol).error = '';
    destino = de.destino;
  }
  if (err) progreso(err, 'Registrando…');
  var conCondiciones = !!cond;
  /* 21-oct-2026 — H2: la sesión que acepta. Si sale antes de la respuesta, la
     propuesta aceptada no se pinta en la cuenta del siguiente, ni se anota
     el aparato en ella, ni se recarga nada con su token. */
  var ses = SESION;
  /* 22-oct-2026 — CON LA CUENTA, por aceptar_con_destino: la aceptación y la
     cuenta en una sola transacción. Si la base todavía no la tiene (404: el
     archivo base/20261022_destino_del_desembolso.sql sin correr), se acepta
     como siempre y se dice que la cuenta se pregunta por el chat: mejor eso
     que trabar una aceptación que la base sí sabe guardar. */
  var sinDestinoGuardado = false;
  var p_vio = conCondiciones ? CS.paraAceptar(cond) : null;
  (conCondiciones
    ? (destino
        ? rpcSesion('aceptar_con_destino', { p_id: Number(id), p_vio: p_vio, p_destino: destino }, ses)
            .catch(function (e) {
              if (causaDe(e) !== 'apagado') throw e;
              sinDestinoGuardado = true;
              return rpcSesion('aceptar_condiciones', { p_id: Number(id), p_vio: p_vio }, ses);
            })
        : rpcSesion('aceptar_condiciones', { p_id: Number(id), p_vio: p_vio }, ses))

/* UNA SOLA DECODIFICACIÓN, VARIOS TAMAÑOS — 16-sep-2026.
   Decodificar la foto de un celular cuesta memoria de verdad: doce millones de
   píxeles son unos cuarenta megas de mapa de bits, y eso pasa justo cuando el
   navegador acaba de volver de la cámara y está en su peor momento. Antes se
   decodificaba TRES veces la misma foto (1600 para el código de barras, otra vez
   adentro del lector, y 900 para guardar). Ahora se decodifica una y de ahí
   salen los dos tamaños. */
function comprimirVarias(file, tamanos) {
  return new Promise(function (res, rej) {
    var url;
    try { url = URL.createObjectURL(file); } catch (e) { return rej(e); }
    var img = new Image();
    img.onload = function () {
      try {
        if (!img.width || !img.height) throw new Error('imagen vacia');

          var max = t[0], q = t[1];
          try {
          var w = img.width, h = img.height;
          if (w > h && w > max) { h = h * max / w; w = max; }
          else if (h >= w && h > max) { w = w * max / h; h = max; }
          var c = document.createElement('canvas');
          c.width = Math.round(w); c.height = Math.round(h);
          /* willReadFrequently desde el principio: a este lienzo se le pide
             getImageData para leer el código, y los atributos del contexto se
             fijan en la PRIMERA llamada — pedirlo después no sirve de nada y
             deja la lectura bajando de la GPU. */
          c.getContext('2d', q == null ? { willReadFrequently: true } : undefined).drawImage(img, 0, 0, c.width, c.height);
          /* 21-sep-2026 — con q en null se devuelve el LIENZO, no una cadena:
             es la versión que va al lector del código de barras, y el lector
             ya no quiere un data URL (tenía que volver a decodificar el JPEG y
             pasarlo por un <img> y un segundo lienzo: 15 MB de más). Quien lo
             recibe lo suelta al terminar (soltarLienzo). */
          if (q == null) return c;

             memoria del bitmap hasta la siguiente recolección. */
          c.width = c.height = 1;

          } catch (e) {

               que hacer; los demás son comodidades (el grande para leer el
               código de barras) y su fallo no puede costarle la foto a nadie. */
            if (indice === 0) throw e;
            return null;
          }
        });
        res(salidas);
      } catch (e) { rej(e); }
      finally {
        try { URL.revokeObjectURL(url); } catch (e) {}
        img.src = ''; img.onload = img.onerror = null;
      }

         mismo mejor es el primero que se lee (si no, una ventana ya cerrada
         con un mejor muy nítido no volvería a intentarlo nunca). */
      ESCDOC.tPatron = ahora;

}

  var t0 = Date.now();   // 22-oct-2026: lo que tarda cada detección, para ?medir=1
  d.detectar(c).then(function (caras) {
    if (ESCANER.detector !== d) return;   // se soltó mientras miraba (ver el vigilante del bucle)
    ESCANER.detectando = false;
    if (!ESCANER.activo || turno !== ESCANER.turno || gen !== GENERACION_DEL_REGISTRO) return;
    ESCANER.fallos = 0;
    /* 23-oct-2026 — una mirada de verdad a la cámara: desde la primera se
       cuenta el rato sin cara de T3 (en bucleEscaner), y no desde que cargó el
       detector, que pudo ser con el diálogo del permiso todavía en pantalla. */
    ESCANER.miradas++;
    if (!ESCANER.desdeRostro) ESCANER.desdeRostro = t0;
    var cara = RV.caraPrincipal(caras);
    if (cara) ESCANER.vioCara = true;   // 22-oct-2026: ver el detector que nunca ve una cara, en bucleEscaner
    var nit = cara ? nitidezDeCara(v, cara) : 0;
    if (nit) ESCANER.mejorNitidez = RV.mejorNitidez(ESCANER.mejorNitidez, nit);
    var m = RV.medirRostro(caras, { luz: luz, nitidez: nit, mejorNitidez: ESCANER.mejorNitidez, previa: ESCANER.previaCara });
    if (MEDIDAS) anotarDeteccion(Date.now() - t0, m, nit, ESCANER.previaCara);   // 22-oct-2026: ?medir=1
    ESCANER.medida = m; ESCANER.previaCara = m.cara;
    /* 22-oct-2026 — los ojos de esta detección, si vinieron, con su hora: el
       dibujo los muestra solo un rato (MS_OJOS_VIVOS). Se pasan a la pantalla
       un poco suavizados, para que no tiemblen más que la cara; el
       suavizado es del dibujo, no de nada que se decida. */
    if (m.ojos) { ESCANER.ojos = suavizarOjos(ESCANER.ojos, m.ojos, Date.now() - ESCANER.ojosT < MS_OJOS_VIVOS); ESCANER.ojosT = Date.now(); }
    /* 22-oct-2026 — la racha cuenta detecciones Y el tiempo con la cara a la
       vista (RostroEnVivo.ROSTRO.MS_ESCANEO_MIN): que se VEA que escanea. */
    var r = RV.contarRacha(ESCANER.estables, m, { ahora: Date.now(), desde: ESCANER.desdeCara });
    ESCANER.estables = r.estables; ESCANER.desdeCara = r.desde || 0;

    if (turno !== ESCANER.turno) return;

       ejemplo): se suelta el detector y se sigue con el encuadre. */
    if (++ESCANER.fallos >= 3) { liberarDetectorRostro(); ESCANER.modo = 'encuadre'; ESCANER.estables = 0; }
  });

/* EL BUCLE MIRA EL FOTOGRAMA, NO EL RELOJ (9-sep-2026).
   Hasta ayer disparaba a los 3,2 segundos pasara lo que pasara —la pantalla
   prometía «cuando tu rostro esté quieto y centrado» y era mentira: apuntando
   al techo salía igual—. Ahora se piden CUADROS seguidos en verde, y la racha
   se cae en cuanto la persona se mueve o se sale del óvalo.
   Lo que decide está en app/cuenta.js, fuera de esta pantalla, para poder
   probarlo con fotogramas de mentira. Y lo que decide es un ENCUADRE: acá no se
   reconoce a nadie (eso sería biometría en el teléfono, y cambiaría la ficha de
   Data Safety). El parecido con la cédula lo saca el CRM de Joan.
   8-oct-2026 — con el detector (modo 'rostro') la racha la cuentan las
   DETECCIONES (RostroEnVivo.contarRacha: una cara, centrada, cerca, nítida y
   quieta), y el disparo sale de detectarCara. Sin él, el encuadre de siempre.
   Tampoco aquí se reconoce a nadie: se sabe DÓNDE hay una cara, no DE QUIÉN. */
function bucleEscaner() {
  if (!ESCANER.activo) return;
  var v = $('camVideo'), c = $('camLienzo'), estado = $('camEstado');
  if (!v || !c || !v.videoWidth) { ESCANER.temporizador = setTimeout(bucleEscaner, 120); return; }
  if (!ESCANER.desde) ESCANER.desde = Date.now();

  if (ESCANER.modo === 'cargando' && !RV && (Date.now() - ESCANER.desdeCarga) > 8000) ESCANER.modo = 'encuadre';

  var g = fotogramaGris(v);
  var m = g ? U.medirEncuadre(g, ESCANER.previa, LADO_MEDIR) : null;
  ESCANER.previa = g;
  ESCANER.ultima = m;
  /* EL VIGILANTE: una detección que no contesta en 6 s (el primer cuadro
     compila los programas de la tarjeta gráfica y puede tardar 2 o 3; más que
     eso es un teléfono que no puede) no deja el escáner mudo: se suelta el
     detector y se sigue con el encuadre. */
  if (ESCANER.modo === 'rostro' && ESCANER.detectando && (Date.now() - (ESCANER.detectandoDesde || 0)) > 6000) {
    liberarDetectorRostro(); ESCANER.modo = 'encuadre'; ESCANER.estables = 0;
  }
  /* 22-oct-2026 — EL DETECTOR QUE NUNCA VE UNA CARA (T3). Si contesta, pero
     «no hay cara» una y otra vez durante RostroEnVivo.ROSTRO.MS_SIN_CARA, el
     vigilante de arriba no lo ve (contesta a tiempo) y la persona se quedaba
     en «Pon tu cara dentro del óvalo» hasta rendirse y tocar «Continuar» sin
     foto. Se suelta y se pone a la vista la cámara del celular.
     22-oct-2026 (segunda vuelta) — Y EL ENCUADRE QUE QUEDA YA NO DISPARA
     SOLO (soloAMano). Disparaba, y el encuadre no necesita ver una cara: con
     el celular apoyado mirando una repisa, una camisa a rayas o un techo con
     detalle, a los 12 s la foto «se tomaba sola», salía «¡Listo!» y llegaba
     al CRM como «Su cara» —el síntoma de William al revés—, justo cuando el
     detector acababa de concluir que ahí no había ninguna cara. La política
     dice que dispara con una cara: aquí la persona la toma con el botón o con
     la cámara del celular. Se suelta igual (memoria y batería: lo que viene
     es la subida) y el óvalo se queda como guía.
     23-oct-2026 — EL RATO SIN CARA EMPIEZA CUANDO EL DETECTOR MIRA. Se contaba
     desde que el detector quedó listo, y baja mientras el teléfono pregunta
     por la cámara: quien tardaba 14 s en tocar «Permitir» (a los 9 s esta
     misma página le dice «Esperando el permiso de la cámara…») llegaba con
     el plazo vencido, y en el primer fotograma —sin una sola detección— la
     nota decía «El escáner no logra ver tu cara» y la foto ya no se tomaba
     sola. Ahora desdeRostro es la primera mirada (detectarCara) y además
     tiene que haber mirado RostroEnVivo.ROSTRO.MIRADAS_SIN_CARA veces. */
  if (ESCANER.modo === 'rostro' && ESCANER.detector && RV && RV.ROSTRO && !ESCANER.vioCara &&
      ESCANER.desdeRostro && (Date.now() - ESCANER.desdeRostro) > RV.ROSTRO.MS_SIN_CARA &&
      ESCANER.miradas >= (RV.ROSTRO.MIRADAS_SIN_CARA || 0)) {
    liberarDetectorRostro(); ESCANER.modo = 'encuadre'; ESCANER.estables = 0; ESCANER.soloAMano = true;
    var fs0 = $('fot_selfie'); if (fs0) fs0.style.display = '';
    var ns0 = $('selfieNota');
    if (ns0) ns0.textContent = 'El escáner no logra ver tu cara, así que no la va a tomar solo: pon tu cara en el óvalo ' +
      'y toca «Tomar la foto ahora», o toma la selfie con la cámara del celular, aquí abajo.';
  }
  var conCara = ESCANER.modo === 'rostro' && !!ESCANER.detector && !!RV;
  var enganchado, avance, mr = null, ojos = null;
  if (conCara) {
    if (!ESCANER.detectando) detectarCara(v, m ? m.luz : 128);
    mr = ESCANER.medida;
    enganchado = !!(mr && mr.ok);
    /* 22-oct-2026 — el avance es el de la racha Y el del tiempo con la cara
       a la vista (contarRacha): el óvalo se llena mientras de verdad escanea. */
    var msMin = RV.ROSTRO.MS_ESCANEO_MIN || 0;
    avance = !enganchado ? 0 : Math.min(1, ESCANER.estables / RV.ROSTRO.CUADROS,
      msMin > 0 ? (ESCANER.desdeCara ? (Date.now() - ESCANER.desdeCara) / msMin : 0) : 1);
    if (ESCANER.ojos && (Date.now() - ESCANER.ojosT) < MS_OJOS_VIVOS && mr && mr.ojos) ojos = ESCANER.ojos;
  } else if (ESCANER.modo === 'encuadre' && ESCANER.soloAMano) {
    /* 22-oct-2026 — sin racha, sin verde y sin «3·2·1»: los tres prometen un
       disparo que aquí no va a llegar (ver T3 arriba). */
    ESCANER.estables = 0; enganchado = false; avance = 0;
  } else if (ESCANER.modo === 'encuadre') {
    if (m && m.ok) ESCANER.estables++; else ESCANER.estables = 0;
    enganchado = !!(m && m.ok);
    avance = Math.min(1, ESCANER.estables / U.ENCUADRE.CUADROS);
  } else {
    /* Bajando el detector: no se dispara por encuadre, ver prepararDetectorRostro. */
    ESCANER.estables = 0; enganchado = false; avance = 0;
  }
  /* El mismo interruptor que la cédula: verde solo cuando de verdad hay una
     cara centrada y quieta, nunca por reloj. */
  var caja = $('escaner');
  if (caja && caja.classList) caja.classList.toggle('enganchado', enganchado);
  /* La altura real de la caja, para que el barrido la recorra entera: cambia
     con el ancho del teléfono, así que no se puede escribir en la hoja. */
  if (caja && caja.style && caja.style.setProperty && caja.clientHeight) {
    caja.style.setProperty('--alto', (caja.clientHeight + 70) + 'px');
  }

  /* 17-sep-2026 — EL LIENZO SOLO SE REDIMENSIONA CUANDO CAMBIA DE VERDAD.
     Escribir `c.width` vuelve a reservar el mapa de bits ENTERO aunque el
     número sea el mismo: a 720x960 son 2,76 MB por cuadro, y esto corría doce
     veces por segundo durante todo el escaneo del rostro, que puede pasar de
     los dieciocho segundos. Unos 33 MB por segundo de basura para el
     recolector, en el peor momento de memoria del teléfono y mientras la
     cámara ya tiene sus propios búferes.
     No es el pico de la foto: es la presión de fondo que hace que el pico
     siguiente sea el que mata.
     Ojo: redimensionar también BORRA el lienzo, así que el clearRect de abajo
     dejó de ser redundante y pasó a ser obligatorio. */
  if (c.width !== v.videoWidth || c.height !== v.videoHeight) {
    c.width = v.videoWidth; c.height = v.videoHeight;
  }

     los que el detector acaba de ver, o nada. */
  dibujarMarco(ctx, c.width, c.height, t, enganchado, avance,
    { cara: conCara && mr ? mr.cara : null, ojos: ojos, cargando: ESCANER.modo === 'cargando', conCara: conCara,
      zona: zonaVisible(c.width, c.height) });

  /* 22-oct-2026 — LA CUENTA «3·2·1» ES LA RACHA, no un reloj: con el detector,
     una detección buena por número (y el último espera el tiempo mínimo en
     verde); con el encuadre, la racha de fotogramas en tercios. Si la persona
     se mueve, desaparece y vuelve a empezar. */
  var cuenta = 0;
  if (enganchado) {
    cuenta = conCara
      ? Math.max(1, RV.ROSTRO.CUADROS + 1 - ESCANER.estables)
      : Math.max(1, Math.ceil(3 * (U.ENCUADRE.CUADROS - ESCANER.estables) / U.ENCUADRE.CUADROS));
  }
  var cc = $('camCuenta');
  if (cc) cc.textContent = cuenta ? String(cuenta) : '';

  if (estado) {
    /* Ni un fotograma mudo: si algo falta, se dice QUÉ hacer. Y si lleva mucho
       rato peleando, se le recuerda que puede disparar a mano — quedarse
       atascado en el paso 3 de 9 con el teléfono en la cara es peor que una
       foto mal encuadrada. */
    var txt;
    if (conCara) {
      txt = enganchado
        ? 'Quieto… ' + cuenta
        : (mr ? RV.textoDeRostro(mr) : 'Buscando tu cara…');
    } else if (ESCANER.modo === 'cargando') {
      txt = 'Preparando el escáner…';
    } else if (ESCANER.soloAMano) {
      txt = 'Pon tu cara en el óvalo y toca «Tomar la foto ahora»';   // 22-oct-2026: ver T3
    } else {
      txt = m && m.ok
        ? 'Quieto… ' + cuenta
        : U.textoDeEncuadre(m);
    }
    if (!g) txt = 'Encendiendo la cámara…';
    else if (t > 18 && !enganchado && !ESCANER.soloAMano) txt = 'Si no lo logras, toca «Tomar la foto ahora»';
    estado.textContent = txt;
  }
  if (MEDIDAS) pintarMedidas(false);   // 22-oct-2026: ?medir=1

  if (ESCANER.modo === 'encuadre' && !ESCANER.soloAMano && ESCANER.estables >= U.ENCUADRE.CUADROS) {
    anotarDisparo('sola, con el encuadre');
    if (capturarRostro()) avisarFotoDelEncuadre();
    return;
  }
  ESCANER.temporizador = setTimeout(bucleEscaner, 80);
}
/* 22-oct-2026 — LA FOTO QUE SE TOMÓ SIN BUSCAR UNA CARA SE DICE. El encuadre
   (sin detector: poca señal, un celular sin aceleración gráfica o un detector
   que se trabó) mide luz, detalle y quietud en el óvalo; no sabe si lo que
   hay es una cara, y con un cuarto o una lámpara quietos también dispara. Ya
   no dispara con una textura pareja (U.medirEncuadre, 'parejo'), pero lo que
   queda no se puede descartar sin ver la cara. Así que la persona lo lee junto
   a su foto, con el botón «Repetir la foto» al lado, y la política lo cuenta. */
function avisarFotoDelEncuadre() {
  var nota = $('selfieNota'); if (!nota) return;
  var antes = String(nota.textContent || '');
  nota.textContent = (antes ? antes + ' ' : '') +
    'Se tomó sola sin poder buscar tu cara: mírala y, si no se ve bien tu cara, toca «Repetir la foto».';
}
/* 9-sep-2026 — el dibujo dice la verdad: ámbar y punteado mientras busca,
   verde y entero cuando de verdad hay una cara centrada y quieta. Un escáner
   que se ve igual en los dos casos es decoración; este es una señal.
   8-oct-2026 — con el detector, además, unas esquinas SIGUEN la cara que se
   detectó (es la caja de verdad, no un adorno), con una retícula y una línea
   que la recorre: eso es lo que hace que se sienta como un escaneo de cara.
   22-oct-2026 — y los OJOS que el detector vio (su contorno y una mira en el
   medio), y el óvalo que se LLENA con la racha. `extra`: {cara y ojos (en
   fracciones de la zona que se ve), zona (en píxeles del lienzo: zonaVisible;
   sin ella, el lienzo entero), cargando, conCara}. */
function dibujarMarco(ctx, w, h, t, enganchado, avance, extra) {

  var z = x2.zona || { x: 0, y: 0, w: w, h: h };

  var cx = z.x + z.w / 2, cy = z.y + z.h / 2, rx = z.w * 0.32, ry = z.h * 0.36;
  var col = enganchado ? '124,255,196' : (x2.cargando ? '255,255,255' : '245,197,66');
  /* 22-oct-2026 — EL ÓVALO SE LLENA desde abajo con el avance de la racha (la
     de detecciones Y el tiempo en verde): si la persona se mueve, se vacía. */
  if (enganchado && avance > 0) {
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = 'rgba(124,255,196,.16)';
    var lleno = 2 * ry * Math.min(1, avance);
    ctx.fillRect(cx - rx, cy + ry - lleno, 2 * rx, lleno);
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(' + col + ',.95)'; ctx.lineWidth = 3;
  if (!enganchado) ctx.setLineDash([9, 9]);
  if (!enganchado && !MOVIMIENTO_REDUCIDO) ctx.lineDashOffset = -t * 18;   // el punteado gira: está buscando
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]); ctx.lineDashOffset = 0;
  var L = Math.min(z.w, z.h) * 0.08, m = Math.min(z.w, z.h) * 0.06;
  [[z.x + m, z.y + m, 1, 1], [z.x + z.w - m, z.y + m, -1, 1], [z.x + m, z.y + z.h - m, 1, -1], [z.x + z.w - m, z.y + z.h - m, -1, -1]].forEach(function (k) {
    ctx.beginPath(); ctx.moveTo(k[0], k[1] + L * k[3]); ctx.lineTo(k[0], k[1]); ctx.lineTo(k[0] + L * k[2], k[1]); ctx.stroke();
  });

  /* La cara que se detectó: esquinas que la siguen, retícula y la línea que
     la recorre. Solo con una detección de verdad: sobre una pared vacía no se
     pinta ninguna cara. */
  if (x2.cara) {
    var fx = z.x + x2.cara.x * z.w, fy = z.y + x2.cara.y * z.h, fw = x2.cara.w * z.w, fh = x2.cara.h * z.h;
    var colCara = enganchado ? '124,255,196' : '245,197,66';
    ctx.save();
    ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
    ctx.strokeStyle = 'rgba(' + colCara + ',' + (MOVIMIENTO_REDUCIDO ? 0.22 : (0.16 + 0.1 * Math.sin(t * 3))) + ')';
    ctx.lineWidth = 1;
    var paso = Math.max(10, fw / 8);
    for (var gx = fx + paso; gx < fx + fw; gx += paso) { ctx.beginPath(); ctx.moveTo(gx, fy); ctx.lineTo(gx, fy + fh); ctx.stroke(); }
    for (var gy = fy + paso; gy < fy + fh; gy += paso) { ctx.beginPath(); ctx.moveTo(fx, gy); ctx.lineTo(fx + fw, gy); ctx.stroke(); }
    if (!MOVIMIENTO_REDUCIDO) {
      var ly = fy + fh * (0.5 + 0.5 * Math.sin(t * 2.6));
      var grad = ctx.createLinearGradient(0, ly - 18, 0, ly);
      grad.addColorStop(0, 'rgba(' + colCara + ',0)'); grad.addColorStop(1, 'rgba(' + colCara + ',.35)');
      ctx.fillStyle = grad; ctx.fillRect(fx, ly - 18, fw, 18);
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(fx, ly); ctx.lineTo(fx + fw, ly); ctx.stroke();
    }
    ctx.restore();
    var e = Math.min(fw, fh) * 0.22;
    ctx.strokeStyle = 'rgba(' + colCara + ',.95)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]].forEach(function (k) {
      ctx.beginPath(); ctx.moveTo(k[0], k[1] + e * k[3]); ctx.lineTo(k[0], k[1]); ctx.lineTo(k[0] + e * k[2], k[1]); ctx.stroke();
    });
    ctx.lineCap = 'butt';
    /* 22-oct-2026 — LOS OJOS, donde el detector los vio: el contorno de cada
       uno (sus seis puntos) y una mira en su centro. Solo con cara y con
       ojos de esta detección; nunca «donde suelen estar». */
    if (x2.ojos && x2.ojos.length === 2) {
      ctx.strokeStyle = 'rgba(' + colCara + ',.95)'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
      x2.ojos.forEach(function (ojo) {
        if (!ojo || ojo.length !== 6) return;
        var pts = ojo.map(function (p) { return [z.x + p[0] * z.w, z.y + p[1] * z.h]; });
        ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.closePath(); ctx.stroke();
        var mx = 0, my = 0, minx = Infinity, maxx = -Infinity;
        pts.forEach(function (p) { mx += p[0] / pts.length; my += p[1] / pts.length; minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); });
        var rr = Math.max(4, (maxx - minx) * 0.32);
        ctx.beginPath(); ctx.arc(mx, my, rr, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mx - rr * 1.8, my); ctx.lineTo(mx - rr * 0.6, my);
        ctx.moveTo(mx + rr * 0.6, my); ctx.lineTo(mx + rr * 1.8, my);
        ctx.moveTo(mx, my - rr * 1.8); ctx.lineTo(mx, my - rr * 0.6);
        ctx.moveTo(mx, my + rr * 0.6); ctx.lineTo(mx, my + rr * 1.8);
        ctx.stroke();
      });
      ctx.lineJoin = 'miter';
    }
  } else if (enganchado && !x2.conCara) {
    /* Sin detector (el encuadre de siempre): la malla en el óvalo, como antes,
       solo cuando hay algo enganchado. */
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = 'rgba(120,255,190,' + (MOVIMIENTO_REDUCIDO ? 0.24 : (0.18 + 0.12 * Math.sin(t * 3))) + ')'; ctx.lineWidth = 1;
    var paso2 = Math.max(18, w / 14), dd = MOVIMIENTO_REDUCIDO ? 0 : (t * 12) % paso2;
    for (var x = -paso2 + dd; x < w; x += paso2) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (var y = -paso2 + dd; y < h; y += paso2) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
    ctx.restore();
  }

     · «CUANDO QUIERAS» prometía crédito a demanda, y esta misma pantalla lo

/* -------------------------------------------------------------------------
 * LA CALCULADORA DEL PEDIDO, EN LA PORTADA — 8-oct-2026
 *
 * La misma de app/calculadora-solicitud.js que sale al terminar el registro y
 * en la pestaña Crédito: cuánto y para cuándo, sin precio. El botón NO pide
 * nada todavía (sin cuenta no hay a nombre de quién): guarda lo movido en
 * este teléfono y abre el registro; al terminar, el paso de pedir lo trae
 * puesto (estadoInicialDelPedido). Lo que se guarda es monto y días, nunca
 * nada de la persona.
 * ----------------------------------------------------------------------- */
function tarjetaPedirPortada() {
  if (!CS) {
    return '<div class="card"><h3 class="tit">Pide lo que necesitas</h3>' +
