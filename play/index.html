<script>
/* 21-oct-2026 — LA «s» DE HTTPS, TAMBIÉN AQUÍ. Es el mismo cinturón que tienen
   app/socio.html y platachat/index.html desde agosto (ver su comentario largo),
   y esta era la única puerta sin él: «Enforce HTTPS» sigue apagado en GitHub
   Pages y http://tugarantia.net/play/ contesta 200 sin redirigir (curl, 21-oct).
   En http no hay service worker, ni cámara en vivo, ni GPS, y el registro
   empieza por la cámara. Y http y https son dos cajones de almacenamiento
   distintos: el paso guardado a medias quedaría en el que no se vuelve a abrir.

   Va ARRIBA DEL TODO, antes que cualquier otro script, para que el salto
   ocurra antes de leer nada del cajón equivocado. localhost, 127.0.0.1 y la
   red de la casa quedan fuera: ahí no hay https. Con try: un banco de pruebas
   sin `location` no puede caerse por esto. El arreglo de fondo sigue siendo
   el clic de Joan en Settings → Pages. */
(function () {
  try {
    var h = location.hostname;
    if (location.protocol === 'http:' && h !== 'localhost' && h !== '127.0.0.1'
        && String(h).indexOf('192.168.') !== 0 && h !== '[::1]') {
      location.replace('https:' + location.href.substring(location.protocol.length));
    }
  } catch (e) {}
})();
</script>

/* 1-oct-2026 — EL MODO PLATACHAT se decide AQUÍ, antes de pintar nada: la piel
   tiene que estar puesta cuando aparece la cabecera, o el cliente de PlataChat
   ve un instante la de Tu Garantía. Ver MARCA en el script grande. */
(function () {
  if (!/(^|[?&])marca=platachat(&|$)/.test(String(location.search || '').slice(1))) return;
  window.MARCA_PLATACHAT = true;
  try {
    document.documentElement.classList.add('marca-platachat');
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = '../platachat/piel-registro.css';
    document.head.appendChild(l);
  } catch (e) {}
})();
</script>
<style>
/* 8-sep-2026 — la cédula y el rostro */
.foto-caja{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border:1.5px dashed rgba(255,255,255,.35);border-radius:14px;cursor:pointer;background:rgba(255,255,255,.04)}
.foto-caja.ok{border-style:solid;border-color:rgba(120,255,190,.7)}
.foto-caja .ic{font-size:26px}.foto-caja .lbl{font-size:14px;line-height:1.3}
.foto-caja img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.foto-caja input{display:none}
.escaner{position:relative;width:100%;max-width:360px;margin:12px auto 0;aspect-ratio:3/4;background:#000;border-radius:18px;overflow:hidden}
.escaner video,.escaner canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.escaner video{transform:scaleX(-1)}.escaner canvas{transform:scaleX(-1)}
.escaner-linea{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#F5C542,transparent);box-shadow:0 0 14px #F5C542;animation:escaneo 2.2s ease-in-out infinite}
@keyframes escaneo{0%{top:12%}50%{top:86%}100%{top:12%}}
.escaner-estado{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:14px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.selfie-prev{display:block;width:160px;height:200px;object-fit:cover;border-radius:14px;margin:12px auto;transform:scaleX(-1)}

/* 22-sep-2026 — AQUÍ FALTABA EL «/*» QUE ABRE ESTE COMENTARIO, y llevaba así
   desde el 21-sep, cuando esta hoja se movió aquí adentro. No es cosmético: sin
   la apertura, el navegador lee toda esta prosa como un SELECTOR y sigue
   leyendo hasta la primera llave que encuentra — o sea que se tragaba entera la
   PRIMERA REGLA de abajo, en silencio y sin un error en ninguna parte.

   La regla que se estaba comiendo era «.clave-caja{position:relative}», que es
   justo la que mete el ojo DENTRO de la barra de la contraseña. Por eso Joan
   dijo «se ve muy feo»: el ojo no estaba mal diseñado, estaba suelto.

   Hay una prueba que ahora cuenta las aperturas y los cierres de comentario en
   esta hoja, porque un defecto así no da ningún error: solo desaparece una
   regla y nadie sabe cuál.
   ---------------------------------------------------------------------------
   EL ESCÁNER DE LA CÉDULA Y EL OJO DE LA CONTRASEÑA — 21-sep-2026

   El ojo: un botón DENTRO del campo que alterna type password/text sobre el
   mismo <input>; el campo no cambia de sitio ni de id, solo se ve.

   El escáner: la caja era 9:16 (no 3:4 como la del rostro) porque en un
   teléfono vertical el video es 9:16 y así se veía ENTERO: la cédula iba de pie
   y ocupaba el 84 % del alto, que era lo que le daba al código de barras los
   3 px por módulo que el lector necesita.
   21-oct-2026 — LAS DOS CARAS VAN ACOSTADAS (pedido de Joan, y la causa de que
   su cédula amarilla no se leyera: de pie había que ponerla a ~7,8 cm y la
   cámara no enfocaba; ver app/escaner-captura.js). La caja pasa a 4:5 y más
   ancha (hasta 420 px): el video sigue viéndose a lo ANCHO entero, que es el
   lado donde ahora va la cédula, y lo que se recorta es arriba y abajo, donde
   no hay nada que leer. Los píxeles por módulo que se pierden los pone la
   resolución que se pide (4K ideal).
   El video de la cédula NO se espeja (el del rostro sí, para que se sienta un
   espejo): un código de barras espejado no se lee y una cédula espejada
   desconcierta. La regla lleva dos clases para ganarle a la del rostro, que
   vive en línea en play/index.html y se aplica después de esta hoja.
   La línea que barre anima transform (nada de top): en un teléfono barato
   mover geometría se siente, y pruebas/vitrina.test.js lo exige.
   ------------------------------------------------------------------------- */
/* 22-sep-2026 — DONDE SE ESCRIBE, BLANCO CON LETRA NEGRA, EN LOS DOS MODOS.
   Joan: «no quiero que sea oscuro donde uno escribe si no blanco con letras
   negras». No era un color mal elegido: los campos usan var(--papel) y
   var(--tinta), que en MODO OSCURO del telefono valen #151113 y #EDE7E4. El
   telefono de la clienta estaba en oscuro y por eso escribia en negro sobre
   negro.

   Se fija solo en las casillas donde se TECLEA. El resto de la pantalla
   sigue respetando el modo del telefono: lo que se pidio es poder leer lo
   que uno escribe, no apagar el tema oscuro. */
input[type=text],input[type=tel],input[type=password],input[type=number],
input[type=email],input[type=date],textarea{
  background:#FFFFFF;color:#0C0A0B;border-color:#D8D2CC}
input::placeholder,textarea::placeholder{color:#8A807B;opacity:1}

/* EL OJO, DISCRETO Y DENTRO DE LA BARRA. Joan: «se ve muy feo, quisa un poco
   mas discreto dentro de la barra donde uno escribe».
   Mas chico a la vista (20px de trazo) pero con 44px de zona tocable, que es
   el minimo para un dedo: achicar el icono no puede achicar el blanco al que
   se apunta. Gris claro en reposo, tinta cuando esta mostrando la clave, y
   sin fondo ni borde: lo que se ve es el trazo, no un boton encima. */
.clave-caja{position:relative}
.clave-caja input{padding-right:46px}
.clave-caja .ojo{position:absolute;right:2px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;
  color:#9C918B;display:flex;align-items:center;justify-content:center;
  transition:color .15s ease}
.clave-caja .ojo svg{width:20px;height:20px}
.clave-caja .ojo:hover{color:#6E6460}
.clave-caja .ojo .ojo-raya{opacity:0}
.clave-caja .ojo.viendo{color:#0C0A0B}
.clave-caja .ojo.viendo .ojo-raya{opacity:1}
/* El foco se ve en la casilla, no en el ojo: dos aros juntos se leen como un
   error de pintado. Pero el ojo sigue siendo alcanzable con el teclado. */
.clave-caja .ojo:focus-visible{outline:2px solid var(--rojo-texto);outline-offset:-4px;
  border-radius:10px}

.escaner.escaner-doc{aspect-ratio:4/5;max-width:420px;border-radius:20px;background:var(--laca);
  --tono:245,197,66;--mascara:12,10,11}
/* 21-oct-2026 — «QUE LA PANTALLA SE PONGA VERDE» (Joan). Antes el verde era el
   borde, las esquinas y la retícula: a un brazo de distancia no se notaba. Ahora
   con la tarjeta enganchada —que es cuando se está midiendo la nitidez para
   escoger la foto— vira a verde TODA la máscara de afuera del marco. */
.escaner.escaner-doc.enganchado{--tono:124,255,196;--mascara:6,86,56}
.escaner.escaner-doc video,.escaner.escaner-doc canvas{transform:none}
.escaner.escaner-doc canvas{pointer-events:none}

/* EL MARCO. La máscara de afuera es un box-shadow gigante: una sola capa que el
   compositor resuelve solo, en vez de repintar el lienzo entero doce veces por
   segundo. El borde cambia de punteado a entero y de ámbar a verde con una
   transición, así que el enganche se SIENTE en vez de parpadear. */
.doc-guia{position:absolute;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(var(--mascara),.52);
  outline:2px dashed rgba(var(--tono),.85);outline-offset:0;
  transition:outline-color .18s linear,box-shadow .25s linear}
.escaner-doc.enganchado .doc-guia{outline-style:solid;
  box-shadow:0 0 0 9999px rgba(var(--mascara),.72),0 0 22px 2px rgba(var(--tono),.45) inset}
/* 21-oct-2026 — EL DESTELLO al tomar la foto: un blanco que se apaga solo. Es
   la señal de «ya está» que da cualquier cámara, y junto con la vibración
   (navigator.vibrate, donde exista) dice que se tomó sin tener que mirar. Solo
   anima opacidad (pruebas/vitrina.test.js). */
.doc-destello{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.escaner-doc.destello .doc-destello{animation:doc-destello .45s ease-out}
@keyframes doc-destello{
  0%{opacity:.9}
  100%{opacity:0}
}

/* LAS CUATRO ESQUINAS, que se cierran al enganchar. Dos capas con el mismo
   gradiente cónico: la de arriba solo pinta las esquinas porque el resto del
   borde queda transparente. */
.doc-esq{position:absolute;inset:-3px;border-radius:17px;pointer-events:none;
  background:
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/22px 3px no-repeat;
  filter:drop-shadow(0 0 6px rgba(var(--tono),.7));
  transform:scale(1.04);opacity:.75;
  transition:transform .22s cubic-bezier(.2,1.3,.4,1),opacity .22s linear}
.escaner-doc.enganchado .doc-esq{transform:scale(1);opacity:1}

/* LA RETÍCULA. Solo aparece cuando de verdad hay una tarjeta enganchada: es la
   diferencia entre una señal y un adorno. */
.doc-red{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none;
  opacity:0;transition:opacity .3s linear;
  background-image:
    repeating-linear-gradient(90deg,rgba(var(--tono),.22) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(var(--tono),.22) 0 1px,transparent 1px 26px)}
.escaner-doc.enganchado .doc-red{opacity:1;animation:doc-respira 2.4s ease-in-out infinite}

/* EL BARRIDO, con estela. La línea es el filo; el halo de abajo es la estela
   que deja, y las dos se mueven juntas con el mismo keyframe. */
.doc-barrido{position:absolute;left:0;right:0;top:-64px;height:64px;pointer-events:none;
  animation:doc-barre 2.1s cubic-bezier(.45,0,.55,1) infinite alternate}
.doc-barrido::before{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;
  background:linear-gradient(to top,rgba(var(--tono),.28),transparent)}
.doc-linea{position:absolute;left:4%;right:4%;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgb(var(--tono)) 18%,#fff 50%,rgb(var(--tono)) 82%,transparent);
  box-shadow:0 0 18px 4px rgba(var(--tono),.6)}
/* El progreso del FRENTE, que es el único que tiene un progreso de verdad: la
   racha de cuadros quietos. El respaldo no lo lleva a propósito — ahí no hay
   nada que contar hasta que el código de barras se lee, y una barra que avanza
   sin saber hacia dónde es justamente la clase de mentira que este escáner no
   se permite.
   8-oct-2026 — AHORA EL RESPALDO SÍ TIENE HACIA DÓNDE: dispara solo cuando
   pasa su rato bien puesto (EC.decidirRespaldo), así que la barra cuenta ese
   rato —tiempo en verde, no reloj— y llega al final justo cuando se toma la
   foto. Si el código se lee antes, se dispara antes. */
.doc-progreso{position:absolute;left:0;right:0;bottom:-10px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.18);overflow:hidden;opacity:0;transition:opacity .2s linear}
.escaner-doc.midiendo .doc-progreso{opacity:1}
.doc-progreso i{display:block;height:100%;width:100%;border-radius:4px;background:rgb(var(--tono));
  transform:scaleX(var(--avance,0));transform-origin:left center;transition:transform .12s linear}
.doc-listo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:rgba(12,10,11,.55);opacity:0;pointer-events:none}
.escaner-doc.leido .doc-listo{opacity:1;animation:doc-aparece .35s ease-out}
.escaner-doc.leido .doc-linea{animation:none;opacity:0}
.doc-check{width:84px;height:84px;border-radius:50%;background:var(--verde);color:var(--luz);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(124,255,196,.25)}
.escaner-doc.leido .doc-check{animation:doc-check .55s cubic-bezier(.2,1.4,.4,1)}
.doc-check svg{width:46px;height:46px}
.doc-listo-txt{color:var(--luz);font-weight:700;font-size:15px;text-align:center;padding:0 16px;
  text-shadow:0 1px 6px var(--sombra)}
.doc-acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:var(--e3)}
.doc-acciones .btn{width:auto;flex:1 1 auto}
.doc-tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--e3)}
.doc-tarjeta{border:1.5px dashed var(--linea);border-radius:14px;padding:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  font-size:13px;min-height:96px;color:var(--gris)}
.doc-tarjeta.ok{border-style:solid;border-color:var(--verde);background:var(--verde-tinte);color:var(--tinta)}
.doc-tarjeta img{width:100%;max-height:72px;object-fit:cover;border-radius:8px}
.doc-tarjeta .ic{font-size:26px}
.doc-tarjeta .rep{font-size:12px;color:var(--azul-texto);background:none;border:0;padding:4px;
  cursor:pointer;text-decoration:underline;font-family:inherit}
.btn.escanear{margin-top:var(--e3)}
.doc-nota{font-size:13px;color:var(--gris);margin-top:var(--e3);line-height:1.45}
.doc-nota:empty{display:none}
.enlace-suave{display:block;width:100%;margin-top:var(--e3);background:none;border:0;color:var(--gris);
  font-size:13px;text-decoration:underline;cursor:pointer;padding:6px;font-family:inherit}

/* El barrido recorre el marco entero y vuelve. --alto lo pone medirCajaDoc
   con la altura real del marco, que cambia con el teléfono y con la cara. */
@keyframes doc-barre{
  0%{transform:translateY(0)}
  100%{transform:translateY(var(--alto,300px))}
}
@keyframes doc-respira{
  0%,100%{opacity:.55}
  50%{opacity:1}
}
/* EL ROSTRO, con las mismas capas que la cédula. Su óvalo y su malla los sigue
   dibujando el lienzo, porque eso SÍ sale de lo que se mide; esto es el marco
   de alrededor, que es lo que hace que parezca un aparato y no un formulario. */
.escaner{--tono:245,197,66}
.escaner.enganchado{--tono:124,255,196}
.cara-esq{position:absolute;inset:8px;border-radius:16px;pointer-events:none;
  background:
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/26px 3px no-repeat;
  filter:drop-shadow(0 0 6px rgba(var(--tono),.7));
  transform:scale(1.03);opacity:.8;
  transition:transform .22s cubic-bezier(.2,1.3,.4,1),opacity .22s linear}
.escaner.enganchado .cara-esq{transform:scale(1);opacity:1}
.cara-red{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s linear;
  background-image:
    repeating-linear-gradient(90deg,rgba(var(--tono),.18) 0 1px,transparent 1px 30px),
    repeating-linear-gradient(0deg,rgba(var(--tono),.18) 0 1px,transparent 1px 30px)}
.escaner.enganchado .cara-red{opacity:1;animation:doc-respira 2.4s ease-in-out infinite}
.cara-barrido{position:absolute;left:0;right:0;top:-70px;height:70px;pointer-events:none;
  animation:cara-barre 2.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.cara-barrido::before{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
  background:linear-gradient(to top,rgba(var(--tono),.25),transparent)}
.cara-linea{position:absolute;left:6%;right:6%;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgb(var(--tono)) 18%,#fff 50%,rgb(var(--tono)) 82%,transparent);
  box-shadow:0 0 18px 4px rgba(var(--tono),.6)}
@keyframes cara-barre{
  0%{transform:translateY(0)}
  100%{transform:translateY(var(--alto,340px))}
}
/* 22-oct-2026 — la cuenta «3·2·1» del escaneo (es la racha: ver bucleEscaner)
   y el destello del disparo sobre la miniatura. Sin sonido, nunca. */
.cara-cuenta{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-size:64px;font-weight:800;line-height:1;color:#fff;pointer-events:none;
  text-shadow:0 0 18px rgba(var(--tono),.9),0 2px 8px #000}
.cara-cuenta:empty{display:none}
/* 22-oct-2026 — los números del escáner con play/?medir=1 (ver MEDIR LA SELFIE). */
.cam-medir{font:11.5px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;
  max-width:360px;margin:var(--e3) auto 0;padding:var(--e2) var(--e3);border-radius:10px;background:rgba(255,255,255,.06)}
.cam-medir:empty{display:none}
#selfieListo{position:relative}
#selfieListo.destello::after{content:"";position:absolute;inset:0;border-radius:18px;background:#fff;
  pointer-events:none;animation:cara-destello .45s ease-out forwards}
@keyframes cara-destello{
  0%{opacity:.9}
  100%{opacity:0}
}
@keyframes doc-check{
  0%{transform:scale(.4);opacity:0}
  100%{transform:scale(1);opacity:1}
}
@keyframes doc-aparece{
  0%{opacity:0}
  100%{opacity:1}
}
@media (prefers-reduced-motion: reduce){
  /* Quieto no es enseñar menos: el marco, las esquinas y la retícula se
     quedan —que es lo que informa— y lo único que se detiene es el barrido,
     que es lo que se mueve. */
  .doc-barrido,.cara-barrido{animation:none;transform:translateY(var(--alto,300px))}
  .doc-red,.cara-red{animation:none}
  .escaner-doc.leido .doc-check,.escaner-doc.leido .doc-listo{animation:none}
  /* 21-oct-2026 — el destello es un relámpago blanco: a quien pidió menos
     movimiento no se le dispara. Le queda la vibración y el ✓. */
  .escaner-doc.destello .doc-destello{animation:none}
  #selfieListo.destello::after{animation:none;opacity:0}
}
/* 22-oct-2026 — DÓNDE RECIBE LA PLATA: el paso del registro y «¿A dónde te
   consignamos?» al aceptar (el marcado sale de app/cuentas-pago.js, con
   clases cp-). En línea y no en estilo.css por la regla del escáner de
   arriba: lo que viaja dentro del HTML llega fresco con él. Solo tokens. */
.cp-etq{display:inline-block;margin-left:var(--e2);padding:2px var(--e2);border-radius:999px;

   el hash directo para NO llenar el historial con nueve entradas: el botón
   «atrás» del teléfono tiene que sacar de la app, no recorrer el formulario
   paso por paso hacia atrás. */
function marcarVista(hash) {
  try {
    if (history && history.replaceState) {
      history.replaceState(null, '', location.pathname + location.search + (hash || ''));
    }
  } catch (e) {}
}

/* ------------------------------------------------- LA CONTRASEÑA, MIENTRAS DURA
   sessionStorage y NO localStorage, y la diferencia importa: sessionStorage vive
   solo en ESTA pestaña y se borra sola al cerrarla —sobrevive la recarga, que es
   justo lo que hacía falta—, mientras que localStorage se quedaría en el
   teléfono hasta que alguien lo limpie. Se borra en cuanto la cuenta existe.
   Sigue en pie la regla vieja: la contraseña NO toca localStorage ni un
   milisegundo, y no viaja nunca dentro del borrador. */
var LLAVE_CLAVE = 'play_clave_en_curso';
/* 20-oct-2026, otro celular (C2) — LA CONTRASEÑA EN CURSO SE GUARDA CON EL
   CELULAR CON QUE SE CREÓ, {celular, clave}, y solo le sirve a ese celular.
   Iba sola, y «Déjalo en blanco para seguir con la misma» se le ofrecía a
   cualquiera que siguiera en la pestaña: María creaba la suya y dejaba el
   teléfono en «Tu rostro»; Pedro volvía, escribía SU celular, dejaba la casilla
   en blanco como le decía la pantalla, y su cuenta nacía con la contraseña de
   María. Ella, que sabe el celular de él, entraba a su identidad, su chat y sus
   solicitudes; él no podía entrar a la suya. Lo que dejó la versión anterior
   (la contraseña sola, sin celular) no se puede atar a nadie: no se lee, y el
   último paso la pide otra vez (cajaClaveFinal). */
/* 21-oct-2026 — G2: Y CON EL INTENTO, {celular, clave, intento}: la
   contraseña es de UN registro, como el celular confirmado
   (celularDelRegistro) y las fotos (FOTOS.de). Iba sin él, y sobrevivía a
   todo lo que no fuera «Empezar de cero» o la cuenta creada: María tocaba
   «Ya tienes una cuenta… Entrar con mi contraseña», entraba a la suya y
   tocaba «Salir»; en la misma pestaña su hermano abría un registro NUEVO,
   escribía sus datos y ponía SU celular por primera vez, y soltarLoDeOtroCelular
   veía el celular de la contraseña de María, le borraba todo lo suyo y le
   decía «Cambiaste el celular», que era falso. Ahora una contraseña de otro
   intento no cuenta para nada (ni para borrar, ni para «déjalo en blanco», ni
   para el signup), y «Salir» la olvida (salirDeCuenta). Lo que dejó la versión
   anterior, sin intento, tampoco se puede atar a ningún registro: no se lee, y
   el último paso la pide otra vez. */
function guardarClaveEnCurso(c, cel, intento) {
  try {
    sessionStorage.setItem(LLAVE_CLAVE, JSON.stringify({ celular: String(cel || ''), clave: String(c || ''), intento: String(intento || '') }));
  } catch (e) {}
}
function leerClaveEnCurso() {
  try {
    var x = JSON.parse(sessionStorage.getItem(LLAVE_CLAVE) || 'null');
    return (x && typeof x === 'object' && x.clave && x.celular && x.intento)
      ? { celular: String(x.celular), clave: String(x.clave), intento: String(x.intento) } : null;
  } catch (e) { return null; }
}
function olvidarClaveEnCurso() {
  try { sessionStorage.removeItem(LLAVE_CLAVE); } catch (e) {}
  CLAVE_EN_MEMORIA = ''; CLAVE_DEL_CELULAR = ''; CLAVE_DEL_INTENTO = '';
}
/* La única forma de poner una contraseña en curso: con su celular y el intento
   de este registro, en la memoria y en la pestaña a la vez. */
function ponerClaveEnCurso(c, cel) {
  CLAVE_EN_MEMORIA = String(c || ''); CLAVE_DEL_CELULAR = String(cel || '');
  CLAVE_DEL_INTENTO = String(asegurarIntento() || '');
  guardarClaveEnCurso(CLAVE_EN_MEMORIA, CLAVE_DEL_CELULAR, CLAVE_DEL_INTENTO);
}
/* ¿Hay una contraseña en curso, y es de ESTE registro? */
function claveDeEsteIntento() {
  return !!(CLAVE_EN_MEMORIA && CLAVE_DEL_INTENTO && REGISTRO.intento && String(CLAVE_DEL_INTENTO) === String(REGISTRO.intento));
}
/* La contraseña en curso SI es de este registro y de este celular; '' si no
   hay, si se creó con otro celular o si es de otro registro. Es lo único que
   deciden «déjalo en blanco» (pasoEntrada), la caja del último paso
   (cajaClaveFinal) y el signup (enviarRegistro, en la foto del toque). */
function claveDeEsteCelular(cel) {
  return (claveDeEsteIntento() && CLAVE_DEL_CELULAR && cel && String(CLAVE_DEL_CELULAR) === String(cel)) ? CLAVE_EN_MEMORIA : '';
}

function entrar() {
  if (viajando()) return;   // 21-oct-2026 — G1: un «Entrar» a la vez
  var tel = U.normalizarTelefono($('inTel').value);
  var clave = $('inClave').value || '';
  var err = $('errEntrar');
  err.classList.add('oculto');
  if (!tel) return fallo(err, 'Nos falta tu celular completo: son 10 números y empiezan por 3.');
  if (!clave) return fallo(err, 'Nos falta tu contraseña.');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que aún no se puede entrar. ' +
      'Esto es una versión en construcción.');
  }
  /* 21-oct-2026 — G1: LA FOTO DEL TOQUE Y EL VIAJE (ver UNA RESPUESTA DE LA
     RED SOLO VALE PARA QUIEN LA PIDIÓ). Pedro tocaba «Entrar» con señal floja,
     se cansaba y le pasaba el teléfono a María, que abría su registro; cuando
     por fin llegaba la sesión de Pedro, la pestaña de María saltaba a la
     cuenta de él. Ahora, mientras dice «Entrando…», nada de la portada se
     puede tocar; a los 30 s se dice y se puede volver a intentar, y lo que
     llegue con la pestaña ya en otra cosa (otro registro, otro «Entrar») se
     descarta y se cierra en el servidor. Decía «Conectando…»: es lo mismo,
     dicho como lo que pasa.
     21-oct-2026 — H1: a los 30 s se desbloquea, NO se corta: con una llamada
     de más de 30 s (señal floja de verdad) ya no se podía entrar nunca, y el
     aviso pedía volver a tocar lo mismo que acababa de fallar. Ahora la
     respuesta que llega tarde se adopta si nadie hizo otra cosa en la
     pestaña; y el aviso dice eso y la otra salida, sin prometer nada. */
  var foto = fotoDelToque({ celular: tel });
  fallo(err, 'Entrando…');
  empezarViaje(foto, function () {
    fallo(err, 'La conexión tardó demasiado en contestar. Seguimos esperando: si la respuesta llega, entras sin hacer nada ' +
      'más. Si se te cayó el internet, vuelve a tocar «Entrar» cuando vuelva.');
  });
  /* Supabase Auth. El correo lo arma cuenta.js desde el teléfono; el socio nunca
     lo ve. La contraseña se manda una sola vez y no se guarda en ninguna parte
     de este archivo. */
  fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
    body: JSON.stringify({ email: U.correoDeTelefono(tel), password: clave })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) {
      if (!sigueSiendoDeAqui(foto)) {
        if (r.ok) cerrarSesionHuerfana(r.j);
        terminarViaje(foto);
        return;
      }
      terminarViaje(foto);
      if (!r.ok) {
        /* Nunca se dice "ese celular existe pero la contraseña no": eso
           convertiría la app en un oráculo de quién es cliente. */
        return fallo(err, 'Esos datos no nos abren la cuenta. Revísalos con calma, y si ' +
          'sigue sin entrar toca «Olvidé mi contraseña» y te echamos una mano.');
      }
      err.classList.add('oculto');
      pintarCuenta(r.j);
    })
    .catch(function () {
      terminarViaje(foto);
      if (!sigueSiendoDeAqui(foto)) return;
      fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
    });
}

/* pedir_ayuda_clave es la ÚNICA que se llama con la llave pública y sin sesión.

function mandarAyuda() {
  var err = $('errAyuda'); if (!err) return;
  var tel = U.normalizarTelefono(($('ayTel') || {}).value || '');
  if (!tel) return fallo(err, 'Nos falta tu celular: son 10 números y empiezan por 3.');
  var nota = String((($('ayNota') || {}).value || '')).slice(0, 300);
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  }
  fallo(err, 'Enviando…');
  /* 21-oct-2026 (R3) — una escritura en camino: «Volver» lleva a la portada,
     que es de la lista de SE ACTUALIZA SOLA, y la recarga cortaba el recado. */
  escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/pedir_ayuda_clave', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_celular: tel, p_nota: nota })
  })).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      if (!j || j.ok !== true) {
        /* Cada motivo dice algo distinto. «No se pudo» tapando un celular mal
           escrito deja a la persona tocando el mismo botón para siempre. */
        var m = j && j.motivo;
        return fallo(err, m === 'celular'
          ? 'Ese celular no nos cuadra: son 10 números y empiezan por 3.'
          : m === 'muchas'
          ? 'Ya nos dejaste un recado hace poco. Lo tenemos; dale un rato y te escribimos.'
          : 'No pudimos recibir tu recado ahora. Vuelve a intentar en unos minutos.');
      }
      $('titulo').textContent = 'Recado enviado';
      VISTA = 'ayuda';   // 21-oct-2026 — cada pantalla dice cuál es: SE ACTUALIZA SOLA mira VISTA
      $('cuerpo').innerHTML =
        '<div class="card"><div class="aviso verde"><b>Listo, lo recibimos.</b></div>' +
          '<p class="sub" style="margin-top:var(--e4)">Te escribimos al ' +
          esc(U.telefonoBonito(tel)) + ' para devolverte el acceso. Si recuerdas tu ' +
          'contraseña antes, entra normal: el recado no bloquea nada.</p>' +
          '<button class="btn arriba" onclick="pintarEntrar()">Volver a la entrada</button>' +
        '</div>' + pie();
      window.scrollTo(0, 0);
    })
    .catch(function () {
      fallo(err, 'No pude enviar tu recado. Revisa tu internet y vuelve a intentar.');
    });
}

/* ================= LA VERIFICACIÓN POR WHATSAPP =================
   24-ago-2026, decisión de Joan: nada de SMS pagos. El registrado manda su
   código de verificación por WhatsApp DESDE su propio número; como el mensaje
   llega con el remitente puesto por WhatsApp —no por él—, si el número y el
   código cuadran con la bandeja del CRM, el celular queda verificado gratis.
   El verificador es Joan, que de todas formas iba a escribirle antes de
   aprobar: esto solo le ahorra la duda de si el número es de verdad.

   La forma V-##### es A PROPÓSITO distinta de los otros tres códigos de la
   casa (TG-XXXX-XXXX invita, 5 letras abre la app, CL-0001 solo numera): ya
   son tres y confundirlos es el error natural. Puros dígitos, además, se
   dictan fácil por teléfono. */
var VERIF_ULTIMA = '';
function codigoVerificacion() {
  var a = new Uint32Array(1);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else a[0] = Math.floor(Math.random() * 1e9);
  return 'V-' + String(10000 + (a[0] % 90000));
}
/* 8-sep-2026: verificarPorWhatsApp() se retiró — el paso siguiente al registro es
   pedir el primer crédito (pedirPrimerCredito), no mandar un código por WhatsApp. */

/* ============================== REGISTRO ==============================
   En pasos y no en una sola página de 26 campos: nadie llena eso de una
   sentada, y una pantalla de scroll infinito es donde la gente abandona. El
   borrador se guarda solo, menos la contraseña. */
/* 19-oct-2026 — LA CÉDULA VA PRIMERO. Joan: «quiero que lo primero que
   aparezca al momento de que un cliente se registre sea el escanear la cédula
   para que el sistema tome automáticamente toda la información de la cédula y
   se diligencie automáticamente, y que el cliente solo tenga que corregir».
   El escáner y el autollenado ya existían; estaban detrás del celular, las dos
   contraseñas y una casilla: cuatro campos y tres toques antes de la cámara.
   Ahora: la cédula, los datos que salieron de ella para revisar, y después el
   celular y la contraseña. PlataChat usa este mismo PASOS (play/?marca=platachat).
   Lo que esto obligó a cambiar, y por qué:
     · las fotos se toman ANTES de que haya celular, que era su dueño: ahora
       tienen un dueño provisional, el INTENTO (ver marcarDuenoDeLasFotos);
     · todo lo que preguntaba por el NÚMERO del paso pregunta por su NOMBRE
       (indiceDe): con el orden nuevo, «el paso 1» ya no es el del celular. */
var PASOS = [
  { id: 'documento', titulo: 'Tu cédula' },
  { id: 'identidad', titulo: 'Revisa tus datos' },
  { id: 'entrada',  titulo: 'Tu celular y tu contraseña' },
  { id: 'rostro',    titulo: 'Tu rostro' },
  { id: 'contacto',  titulo: 'Cómo te contactamos' },
  { id: 'domicilio', titulo: 'Dónde vives' },
  { id: 'ingresos',  titulo: 'De qué vives' },
  /* 22-oct-2026 — ¿DÓNDE TE ENVIAMOS LA PLATA? Joan: «al momento de que el
     cliente se registra no se le pregunta sobre la información bancaria».
     Va DESPUÉS del celular, y no junto a la identidad, porque Nequi y
     Daviplata se llenan con un toque con ese mismo celular («Es este mismo
     celular»), y antes del paso del celular todavía no hay ninguno. Y después
     de «De qué vives»: es la conversación de la plata. Ver pasoCobro. */
  { id: 'cobro',     titulo: '¿Dónde te enviamos la plata?' },
  { id: 'referencias', titulo: 'Quién puede responder por ti' },
  { id: 'permiso',  titulo: 'Tu autorización' }
];
/* El orden de antes del 19-oct, SOLO para leer un checkpoint guardado por la
   versión anterior (que guardaba el número y no el nombre). No se usa para
   nada más: quien esté a mitad de registro el día que esto se publique vuelve
   al mismo paso por su nombre, no al que hoy tiene ese número. */
var PASOS_HASTA_19OCT = ['entrada', 'documento', 'rostro', 'identidad', 'contacto',
                         'domicilio', 'ingresos', 'referencias', 'permiso'];
/* El número de un paso por su nombre (-1 si no existe). Toda decisión que
   dependa de DÓNDE va la persona se pregunta así: «PASO >= 1» quería decir
   «ya pasó por el celular», y con el orden nuevo habría querido decir otra
   cosa sin que nada avisara. */
function indiceDe(id) {
  for (var i = 0; i < PASOS.length; i++) if (PASOS[i].id === id) return i;
  return -1;
}

/* ===========================================================================
 * EL ACOMPAÑAMIENTO, SIN PREGUNTAR — 8-oct-2026 (antes: «QUIERO QUE MI ASESOR
 * ME ACOMPAÑE», 15-sep-2026)
 *
 * Joan: «en cada paso aparece una opción que le pregunta al cliente si prefiere
 * seguir solo o si un asesor lo acompaña. No quiero que se pregunte eso: yo
 * quiero siempre ver desde mi CRM y poder guiar al cliente». Se quitó la
 * tarjeta de cada paso y el avance se publica siempre.
 *
 * LO QUE NO SE PODÍA QUITAR, Y POR QUÉ: mandar el nombre, la cédula y el
 * celular de alguien a un servidor mientras llena un formulario es tratar sus
 * datos, y la Ley 1581 pide que lo sepa ANTES (autorización previa e
 * informada; el Decreto 1377 de 2013, art. 7, la deja dar con una conducta
 * inequívoca). Por eso el paso 1 —y SOLO el paso 1, no cada paso como la
 * tarjeta de antes— lleva una línea que dice qué ve el equipo y que tocar
 * «Continuar» es la autorización (avisoAcompana). Y por eso no se publica
 * NADA en el paso 1: la primera publicación sale cuando ya tocó «Continuar».
 *
 * 19-oct-2026 — «EL PASO 1» ES AHORA «EL PASO DEL CELULAR» (el tercero; la
 * cédula va primero). El aviso se fue con él, porque es donde nace lo que se
 * publica: sin celular no hay fila que publicar. Por eso la cédula y «Revisa
 * tus datos» —antes del aviso— no publican nada, aunque ya haya nombre y
 * documento en el formulario: la regla es «después de tocar Continuar con el
 * aviso a la vista», no «desde el paso 2».
 *
 * LO QUE SIGUE SIN SALIR NUNCA, con o sin pregunta:
 *   · las referencias — son nombre y celular de DOS personas que no son quien
 *     está registrándose y que no autorizaron nada. Y la Ley 2300 ya le prohíbe
 *     a Joan contactarlas: tenerlas anotadas sería exposición sin ningún uso.
 *   · la contraseña.
 *   · la ubicación.
 *   · la selfie (ver publicarAvance).
 *   · 8-oct-2026 (segunda vuelta) — NINGUNA FOTO, tampoco las de la cédula.
 *     Antes salían si marcaba la casilla de datos sensibles, pero esa casilla
 *     autoriza las fotos «para confirmar que soy yo», no para que alguien las
 *     mire mientras escribe; y para guiar a alguien por teléfono basta saber
 *     en qué paso va. Las fotos le llegan a Joan igual, al terminar.
 * Acá se filtra, y el SERVIDOR lo vuelve a filtrar (registro_vivo_publicar,
 * y la lectura de Joan, registro_vivo_joan). Dos rejas: una pantalla se puede
 * saltar.
 *
 * EL TESTIGO, que faltaba desde el 22-sep. registro_vivo_publicar le entrega
 * a la primera publicación un testigo y desde ahí exige ese testigo para
 * actualizar o borrar la fila de ese celular (base/20260919_asesor.sql y
 * 20260922n). Esta página nunca lo guardó: la PRIMERA publicación entraba y
 * todas las demás volvían «ocupado», así que el asesor veía para siempre el
 * paso 2 sin fotos, y «Prefiero seguir solo» no borraba nada. Ahora se guarda
 * (por celular) y viaja en las dos llamadas.
 *
 * QUIÉN LO VE, dicho sin adornos: Joan, en su CRM (📥 Registrados →
 * «Registrándose ahora», base/20261008c_registro_vivo_joan.sql), a todos; y
 * los asesores con sesión, solo a clientes de su cartera (registro_vivo_mirar).
 * Hasta el 8-oct el CRM de Joan no tenía esa vista y el aviso prometía una
 * ayuda que nadie podía dar: lo marcaron las tres revisiones. El aviso dice
 * «puede ver», no «está viendo»: nadie mira cada registro en vivo.
 *
 * Y SOLO SI LEYÓ EL AVISO EN ESTA VERSIÓN (8-oct-2026, segunda vuelta). Una
 * persona a mitad de registro antes de publicar esto —que pudo haber escogido
 * «Prefiero seguir solo»— vuelve con el paso guardado y nunca ve el paso 1:
 * publicar su avance sería tratar sus datos con un aviso que no leyó. La
 * marca LLAVE_AVISO_VIVO la pone tocar «Continuar» en el paso 1 (donde está
 * el aviso), y sin ella no se publica nada.
 * ========================================================================= */
var LLAVE_AVISO_VIVO = 'tg_vivo_aviso_8oct2026';
function vioAvisoVivo() {
  try { return localStorage.getItem(LLAVE_AVISO_VIVO) === '1'; } catch (e) { return false; }
}
function anotarAvisoVivo() { try { localStorage.setItem(LLAVE_AVISO_VIVO, '1'); } catch (e) {} }
function olvidarAvisoVivo() { try { localStorage.removeItem(LLAVE_AVISO_VIVO); } catch (e) {} }
var LLAVE_TESTIGO_VIVO = 'tg_vivo_testigo';
function testigoVivo(cel) {
  try {
    var t = JSON.parse(localStorage.getItem(LLAVE_TESTIGO_VIVO) || 'null');
    return (t && t.celular === cel && t.testigo) ? String(t.testigo) : '';
  } catch (e) { return ''; }
}
function anotarTestigoVivo(cel, testigo) {
  try { localStorage.setItem(LLAVE_TESTIGO_VIVO, JSON.stringify({ celular: cel, testigo: String(testigo) })); } catch (e) {}
}
function olvidarTestigoVivo() { try { localStorage.removeItem(LLAVE_TESTIGO_VIVO); } catch (e) {} }

/* La línea del paso del celular (hasta el 19-oct, el paso 1). Es de las pocas
   que se quedaron cuando Joan pidió quitar los comentarios de cada pregunta:
   esta no es un comentario, es el aviso que la ley pide antes de tratar los
   datos (ver arriba). */
function avisoAcompana() {
  if (MARCA === 'platachat') return '';   // sin asesores en PlataChat (ver EL MODO PLATACHAT)
  /* 8-oct-2026 (segunda vuelta) — dice TODO lo que sale (le faltaban la fecha
     de nacimiento y el tipo de documento, que sí se publicaban), ya no ofrece
     las fotos, y dice cuándo se borra. */
  return '<div class="ayuda" id="avisoAcompana" style="margin-top:var(--e4)">' +
    '<b>Te acompañamos mientras te registras.</b> Nuestro equipo puede ver en qué paso vas, tus nombres y ' +
    'apellidos, tu tipo y número de documento, tu fecha de nacimiento, tu celular y tu correo, para escribirte ' +
    'si te atascas. Nunca tu contraseña, tus referencias, tu ubicación ni tus fotos. Se borra solo a las dos ' +
    'horas. Al tocar «Continuar» nos das ese permiso.</div>';
}

/* Lo que se publica. Se arma una lista BLANCA —lo que sí entra— y no una negra:
   una lista negra hay que acordarse de ampliarla cada vez que el formulario
   gane un campo, y ese olvido es el que manda de más. */
var CAMPOS_QUE_SE_PUBLICAN = ['nombres', 'apellidos', 'documento', 'tipo_doc',
                              'celular', 'correo', 'nacimiento'];

function publicarAvance() {
  if (MARCA === 'platachat') return Promise.resolve();   // ver EL MODO PLATACHAT
  /* Desde el paso que sigue al del celular: el permiso se da tocando
     «Continuar» ahí — y solo si ese toque fue con el aviso de esta versión a
     la vista (vioAvisoVivo). 19-oct-2026: por NOMBRE (era `PASO >= 1`, que con
     la cédula primero habría publicado desde «Revisa tus datos», antes del aviso). */
  if (!(PASO > indiceDe('entrada')) || !REGISTRO.celular || !vioAvisoVivo()) return Promise.resolve();
  /* 19-oct-2026 — NI MIENTRAS LA IDENTIDAD ESTÁ EN DUDA: la cédula se escaneó
     con otro celular o hace más de una hora (ver identidadEnDuda). Hasta el
     19-oct, cambiar el celular BORRABA la identidad leída para que los datos de
     A no salieran con el celular de B; ahora se conserva (Joan), así que lo que
     no puede pasar es publicarla hasta que la persona diga que es suya.
     20-oct-2026, otro celular — cambiar el celular vuelve a borrarla
     (soltarLoDeOtroCelular), y la fila del celular anterior se borra con su
     testigo. La duda queda para la cédula de más de una hora sin celular.
     21-oct-2026 — E-A1: y borra TODO el registro, también lo escrito a mano,
     y lleva al primer paso: lo que se publique con el celular nuevo lo
     escribió quien lo tiene (y el primer paso no publica nada). */
  if (FOTOS.de && FOTOS.de.duda) return Promise.resolve();
  if (!CFG.url || !CFG.anon) return Promise.resolve();

  var avance = {};
  CAMPOS_QUE_SE_PUBLICAN.forEach(function (k) {
    if (REGISTRO[k]) avance[k] = String(REGISTRO[k]).slice(0, 80);
  });

  /* 8-oct-2026 (segunda vuelta) — SIN FOTOS (ver el encabezado). La selfie ya
     no viajaba; ahora tampoco la cédula. p_fotos va vacío y no se quita de la
     llamada: la firma de registro_vivo_publicar lo pide. */
  var fotos = {};

  var cel = REGISTRO.celular;
  /* 21-oct-2026 (R3) — escritura en camino (ver LO QUE VA EN CAMINO NO SE CORTA). */
  return escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_publicar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: cel,
      p_paso: PASO + 1,
      p_de: PASOS.length,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).trim(),
      p_avance: avance,
      p_fotos: fotos,
      p_testigo: testigoVivo(cel) || null
    })
  }).then(function (r) { return r && r.ok ? r.json() : null; })
    .then(function (j) { if (j && j.ok === true && j.testigo) anotarTestigoVivo(cel, j.testigo); }))
    .catch(function () { /* sin señal se sigue registrando igual */ });
}

/* Borra la fila de ESTE celular, con su testigo. Sin el testigo la base no
   borra nada y contesta ok igual (para no delatar quién se registra): por eso
   sin testigo ni se llama. */
/* 20-oct-2026, otro celular — `celular` (opcional): la fila del celular que
   este registro tenía ANTES de cambiarlo (soltarLoDeOtroCelular). Sin él, la
   del celular de ahora, como siempre. */
function borrarAvance(celular) {
  if (MARCA === 'platachat') return Promise.resolve();
  var cel = String(celular || REGISTRO.celular || '');
  if (!cel || !CFG.url || !CFG.anon) return Promise.resolve();
  var testigo = testigoVivo(cel);
  if (!testigo) return Promise.resolve();
  olvidarTestigoVivo();
  /* 21-oct-2026 (R3) — escritura en camino: quien sale del registro cae en la
     portada (de la lista de SE ACTUALIZA SOLA), y la recarga dejaba su fila
     publicada en el acompañamiento. */
  return escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_borrar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_celular: cel, p_testigo: testigo })
  })).catch(function () {});
}

function pintarRegistro(paso) {
  /* 21-oct-2026 — G1: mientras dice «Creando tu cuenta…», «Volver» (que es
     esto) no lleva a ninguna parte; ver UNA RESPUESTA DE LA RED SOLO VALE
     PARA QUIEN LA PIDIÓ. */
  if (viajando()) return;
  VISTA = 'registro';
  PASO = Math.max(0, Math.min(paso, PASOS.length - 1));
  guardarPaso(PASO);   // por si el teléfono recarga al volver de la cámara
  /* 17-sep-2026 — Y LA DIRECCIÓN TAMBIÉN, que es lo que faltaba desde el 9-sep.
     El paso se guardaba bien, pero el arranque solo lo leía si la dirección
     terminaba en #registro — y esta función nunca la ponía. Quien abre
     tugarantia.net/play/ y toca «Abrir mi cuenta» se quedaba sin ese trozo de
     dirección, así que al volver de la cámara la página lo dejaba en la
     portada, frente a la caja que pide celular y contraseña. Es exactamente lo
     que Joan describió: «la página lo devuelve y nuevamente tiene que ingresar
     la contraseña». Reproducido recargando el banco de pruebas en el paso 2. */
  marcarVista('#registro');
  /* 19-oct-2026 — el intento nace con el registro (ver marcarDuenoDeLasFotos). */
  asegurarIntento();
  var p = PASOS[PASO];
  $('titulo').textContent = 'Abrir mi cuenta';

  var barra = '<div class="pasos">' + PASOS.map(function (_, i) {
    return '<i class="' + (i < PASO ? 'hecho' : (i === PASO ? 'aqui' : '')) + '"></i>';
  }).join('') + '</div>';

  detenerEscaner();   // por si venía del paso del rostro
  detenerEscanerDoc();  // o del de la cédula
  /* 21-oct-2026 — y sus lienzos: con video 4K el del mejor cuadro son ~8 MB, y
     quien sale del paso con «Continuar» o «Volver» a mitad de un lado los
     dejaba vivos el resto de la sesión. Se vuelven a crear si vuelve. */
  soltarLienzosDoc();
  var cuerpo;
  if (p.id === 'entrada')      cuerpo = pasoEntrada();
  else if (p.id === 'documento') cuerpo = pasoDocumento();
  else if (p.id === 'rostro')  cuerpo = pasoRostro();
  else if (p.id === 'permiso') cuerpo = pasoPermiso();
  else if (p.id === 'cobro')   cuerpo = pasoCobro();
  else                         cuerpo = (p.id === 'identidad' ? notaCedulaLeida() + notaDeLaFoto() : '') + pasoCampos(p.id);

  /* 19-oct-2026 — «Revisa tus datos» solo si hay algo que revisar: quien tocó
     «Prefiero escribir mis datos», o cuya cédula no se leyó, encuentra el
     formulario vacío, y decirle «revisa» sería hablarle de unos datos que la
     app no llenó.
     21-oct-2026 — las letras de la cédula también llenan (o están llenando):
     eso también es algo que revisar. */
  var titulo = (p.id === 'identidad' && !cedulaLeidaDeEsteRegistro() && !hayLecturaVisible()) ? 'Escribe tus datos' : p.titulo;
  /* Y en la cédula sin autorizar, «Continuar» sobra: las dos salidas son los
     dos botones del paso («Autorizo y escaneo» y «Prefiero escribir mis
     datos»), y un tercero que hace lo mismo que el segundo con otro nombre
     solo hace dudar. */
  var conContinuar = !(p.id === 'documento' && !autorizoEsteIntento());

  $('cuerpo').innerHTML =
    '<div class="card">' +
      '<div class="etq">Paso ' + (PASO + 1) + ' de ' + PASOS.length + '</div>' +
      barra +
      '<h3 class="tit" style="margin-top:var(--e3)">' + esc(titulo) + '</h3>' +
      cuerpo +
      /* 8-oct-2026 — aquí iba la tarjeta «¿quieres que un asesor te
         acompañe?», en CADA paso. Joan la quitó: el acompañamiento ya no se
         pregunta. El aviso que la ley sí pide va una sola vez, en el paso del
         celular (avisoAcompana, dentro de pasoEntrada). */
      '<div id="errReg" class="aviso ambar oculto"></div>' +
      /* 21-oct-2026 — con id: son los que se apagan mientras viaja «Abrir mi
         cuenta» (empezarViaje). */
      (conContinuar
        ? '<button class="btn arriba" id="btnSeguir" onclick="siguientePaso()">' +
            /* 21-oct-2026 — «Están bien» en «Revisa tus datos» cuando todo
               está lleno y algo salió de la cédula: el toque que confirma. */
            (PASO === PASOS.length - 1 ? 'Abrir mi cuenta' : (p.id === 'identidad' ? textoBotonIdentidad() :
              /* 22-oct-2026 — en «Tu rostro», sin la foto, el botón grande dice lo
                 que hace (ver LA SELFIE QUE NO SE TOMÓ SE DICE). */
              (p.id === 'rostro' && faltaLaSelfie() ? 'Seguir sin la foto' : 'Continuar'))) + '</button>'
        : '') +
      '<button class="btn sec sm" id="btnVolver" style="margin-top:var(--e3)" onclick="' +
        (PASO === 0 ? (MARCA === 'platachat' ? 'volverAPlataChat()' : 'pintarEntrar()') : 'pintarRegistro(' + (PASO - 1) + ')') + '">Volver</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
  /* Cada vez que cambia de paso se publica (después del paso del celular: ver
     publicarAvance). En un try porque un acompañamiento que falle NO puede
     impedirle abrir su cuenta. */
  try { publicarAvance(); } catch (e) {}

/* ===========================================================================
 * QUÉ CÉDULA ES EL RESPALDO GUARDADO — 21 de octubre de 2026 (verificación
 * del lote 1, R1: Ley 1581, el RH es un dato de salud)
 *
 * Las franjas de las letras (app/ocr-cedula.js, ZONAS) son las de la cédula
 * AMARILLA. En la DIGITAL (la del QR) el RH, el sexo y la estatura van en el
 * frente, justo donde cae el bloque que se lee, y el rótulo va encima del
 * valor: los apellidos caían en «nombres» con «leído de tu cédula». La única
 * defensa era OCR_CEDULA.digital, que vivía en la memoria y solo se ponía con
 * un QR leído en vivo: se perdía al relanzar la pestaña (Android, el video
 * 4K) y no existía si el teléfono no leía el QR y la persona tocaba «Tomar la
 * foto ahora», que es lo que TEXTO_CEDULA_NUEVA le pide.
 *
 * LA REGLA, AL REVÉS: las letras de CUALQUIERA de los dos lados se leen solo
 * con prueba POSITIVA de que el respaldo guardado es la amarilla — su PDF417
 * leído, visto sin poder leerlo ('ilegible') o el patrón de sus barras EN EL
 * RECORTE QUE SE GUARDÓ. No haber visto un QR no prueba nada. La decisión se
 * guarda CON LA FOTO, en FOTOS (y por eso en el teléfono): sobrevive a
 * relanzar, y se va con ella (prepararRespaldoNuevo, soltarLasFotos, otro
 * celular, salir del flujo: todos sueltan FOTOS). Va firmada con la huella de
 * la foto: si alguien pone otro respaldo por un camino que no pase por
 * prepararRespaldoNuevo, la marca vieja no le sirve al nuevo.
 *   'amarilla' — prueba de la amarilla; se leen las letras;
 *   'digital'  — se vio un QR (en vivo o en el recorte guardado);
 *   ''         — no se sabe: no se lee nada, y la pantalla no lo promete.
 * ========================================================================= */
/* La huella de una foto: el largo y un FNV-1a de 32 bits. Ni un carácter de
   la foto queda escrito en la marca. (El primo de FNV, 2^24 + 0x193, va
   armado así y no como literal: vitrina.test.js no deja cifras de siete
   dígitos escritas a mano en play/.) */
function firmaDeFoto(s) {
  s = String(s || '');
  var h = 0x811c9dc5, primo = (1 << 24) + 0x193;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, primo); }
  return s.length.toString(36) + '.' + (h >>> 0).toString(36);
}
function anotarTipoDelRespaldo(tipo) {
  if (!FOTOS.cedula_reverso || (tipo !== 'amarilla' && tipo !== 'digital')) { olvidarTipoDelRespaldo(); return; }
  FOTOS.cedula_reverso_tipo = tipo;
  FOTOS.cedula_reverso_tipo_de = firmaDeFoto(FOTOS.cedula_reverso);
}
function olvidarTipoDelRespaldo() {

}
/* 'amarilla' | 'digital' | '' — del respaldo que está guardado AHORA. */
function tipoDelRespaldo() {
  var t = FOTOS && FOTOS.cedula_reverso_tipo;
  if (!FOTOS || !FOTOS.cedula_reverso || (t !== 'amarilla' && t !== 'digital')) return '';

      return escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
        body: JSON.stringify({
          email: U.correoDeTelefono(foto.celular),
          password: foto.clave,
          /* 22-oct-2026 — SIN LOS DATOS DE PAGO: lo de `data` viaja dentro de
             la sesión, y la sesión se guarda en el teléfono (socio.html y
             platachat/sesion.js). La cuenta de pago va solo a la bandeja de

    .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })

         Quien la creó entra con su celular y su contraseña cuando quiera; su

         nadie hizo nada más, ESTA respuesta se adopta, como si hubiera
         llegado a tiempo. */

        return;

           tres días antes; al volver a hacerlo, la bandeja de Joan recibió sus
           datos otra vez (registrar_abierto es idempotente por celular) pero el

           información y no veía ni una foto.

           intenta entrar con ella. Si es la correcta sigue como si nada —con su

        /* 21-oct-2026 — G1: sigue el mismo viaje, con la misma foto del toque. */

      terminarViaje(foto);

      anotarCuentaCreada(foto.celular);
      /* 8-sep-2026 — con «Confirm email» apagado en Supabase, el signup devuelve
         la sesión entera: el recién registrado ya puede pedir. */
      /* 17-sep-2026 — Y SE GUARDA AQUÍ MISMO, que es el peor sitio donde
         perderla. Las dos pantallas que siguen —«tu cuenta quedó abierta» y la

         de nueve pasos, VACÍO (el borrador se acaba de borrar dos líneas más
         arriba) y sin una palabra de explicación, con la cuenta ya creada y sus
         fotos sin subir. Es el mismo defecto de la cámara, en el momento más
         caro del embudo. */
      if (res.j && res.j.access_token) { SESION = res.j; guardarSesionEnCurso(SESION); }
      /* 20-oct-2026, rediseño (A) — AQUÍ, Y SOLO AQUÍ (y en el «ya tenías
         cuenta» de abajo), las fotos salen del registro: a la cola de ESTA
         cuenta, con el documento de ESTE registro. Ver LA COLA DE UNA CUENTA
         YA CREADA. */
      encolarLasFotosDelRegistro(foto.celular);
      /* 19-oct-2026 — ANTES de pintar: en PlataChat pintarRegistrado se lleva
         a la persona a otra página, y la llamada se iría con ella. */
      anotarAparato('registro');
      pintarRegistrado();
      subidaEnSegundoPlano();   // si falla, queda en la cola y se reintenta al abrir la cuenta
      /* 20-oct-2026, revisión (F7) — y lo del registro sale de la memoria
         DESPUÉS de lo de arriba: la subida ya tomó su lote, y PlataChat ya
         tomó el nombre (si reintenta, lo lee de REGISTRADO). */
      cerrarElRegistroEnMemoria();
    })
    .catch(function (e) {

      /* 21-oct-2026 — G1: una respuesta que ya no es de esta pestaña no

      if (e === TARDE || !sigueSiendoDeAqui(foto)) return;
      fallo(err, (e && e.humano) ? e.humano
        : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');

  }
}

/* 21-oct-2026 — H1: LOS SIGNUPS QUE SALIERON EN ESTE REGISTRO. Desde que el
   tope no corta la petición, un signup que salió puede haber creado la cuenta
   aunque su respuesta no se haya adoptado (llegó después de que se volvió a
   tocar, o la señal se cayó a la vuelta). El reintento lo necesita para
   entrar primero (enviarRegistro) y la constancia para saber si la
   autorización que tiene la cuenta ES la de este registro, la que viajó en
   ese signup (guardarLaConstancia). Solo de esta generación y este celular:
   el de otro registro no le dice nada a este. Sin datos: el momento de cada
   autorización que salió. */
var SIGNUP_DEL_REGISTRO = null;   // { generacion, celular, momentos: [] }
function anotarSignup(foto) {
  var s = SIGNUP_DEL_REGISTRO, cel = String(foto.celular || '');
  if (!s || s.generacion !== foto.generacion || s.celular !== cel) {
    s = SIGNUP_DEL_REGISTRO = { generacion: foto.generacion, celular: cel, momentos: [] };
  }
  if (foto.autorizacion && foto.autorizacion.momento) s.momentos.push(String(foto.autorizacion.momento));
}
function yaSalioUnSignup(foto) {
  var s = SIGNUP_DEL_REGISTRO;
  return !!s && s.generacion === foto.generacion && s.celular === String(foto.celular || '') && s.momentos.length > 0;
}

/* ===========================================================================
 * LA CONSTANCIA DE LA AUTORIZACIÓN, ANTES DE LO SENSIBLE — 21-oct-2026 (H4)
 *
 * La autorización de la Ley 1581 solo viajaba en el signup. Quien YA tenía
 * cuenta y se registraba otra vez («ya tenías cuenta»: con la misma
 * contraseña, o con «Entrar y terminar mi registro») recibía un 422 en el
 * signup —GoTrue no toca la cuenta— y después entraba y SUBÍA su cédula, su
 * cara y su ubicación. La única constancia que quedaba era la del signup de
 * hace semanas, que podía decir sensibles:false y nombrar a otro responsable:
 * si reclamaba, no había cómo probar el permiso para datos sensibles (art. 6,
 * 9 y 17-b; Decreto 1377, art. 8). PLAY-FICHA.md llama a esa constancia «la
 * prueba de que nos diste permiso».
 * Ahora, con la sesión recién obtenida y ANTES de encolar o subir nada, se
 * guarda la de ESTE registro en la cuenta (PUT /auth/v1/user, data):
 * `autorizacion` es la nueva y `autorizaciones` el historial anterior más la
 * nueva, sin borrar ninguna. Si no se puede guardar, no se encola ni se sube
 * nada sensible y se dice la verdad. La reja de verdad está en la base:
 * registro_archivos_guardar rechaza cédula, selfie, ubicación y lectura si la
 * cuenta no tiene una autorización con sensibles:true
 * (base/20261020_la_cedula_de_la_cuenta.sql, 'sin_autorizacion').
 * Se salta UN caso: que la autorización que ya tiene la cuenta sea la que
 * viajó en un signup de ESTE registro (el reintento después del tope que
 * entra primero con la contraseña), con las mismas casillas. Esa ya es la
 * constancia de este registro, y pedirla otra vez sumaría una llamada justo
 * con la señal floja.
 * ======================================================================== */
function laConstanciaYaEsDeEsteRegistro(meta, aut, foto) {
  var a = meta && meta.autorizacion, s = SIGNUP_DEL_REGISTRO;
  if (!a || !aut || !s || !foto) return false;
  if (s.generacion !== foto.generacion || s.celular !== String(foto.celular || '')) return false;
  return s.momentos.indexOf(String(a.momento || '')) >= 0 && a.version === aut.version &&
    a.general === aut.general && !!a.sensibles === !!aut.sensibles;
}
/* Nunca rechaza. Con el token de ESA sesión, no con SESION, que todavía no se
   ha adoptado. Resuelve uno de TRES estados:
     · 'guardada'  — la constancia quedó (o ya estaba);
     · 'rechazada' — el servidor contestó que no (o no hay con qué pedirla);
     · 'sin_saber' — la petición no volvió (el fetch se rechazó).
   21-oct-2026 — I4: EL TERCERO EXISTE PORQUE «NO VOLVIÓ» NO ES «NO SE
   GUARDÓ». Con señal floja el PUT llega, la cuenta guarda la autorización y
   la vuelta se cae; resolvía false igual que un «no» del servidor, y la
   pantalla afirmaba «no pudimos guardar la autorización» de una constancia
   que ya estaba en la cuenta. Con 'sin_saber' se dice solo lo que se sabe:
   que no se pudo confirmar. Lo que hace la página es lo mismo en los dos
   casos —no adopta la sesión ni sube nada— porque sin confirmación no hay
   constancia que mostrar si alguien reclama. */
function guardarLaConstancia(sesion, aut, foto) {
  if (!sesion || !sesion.access_token || !aut || !CFG.url || !CFG.anon) return Promise.resolve('rechazada');
  var u = (sesion.user && typeof sesion.user === 'object') ? sesion.user : {};
  var meta = (u.user_metadata && typeof u.user_metadata === 'object') ? u.user_metadata : {};
  if (laConstanciaYaEsDeEsteRegistro(meta, aut, foto)) return Promise.resolve('guardada');
  var antes = Array.isArray(meta.autorizaciones) ? meta.autorizaciones.slice() : [];
  /* La de la cuenta entra al historial si todavía no está (la del signup no
     venía en ninguna lista). */
  if (meta.autorizacion && !antes.some(function (x) { return x && meta.autorizacion && x.momento === meta.autorizacion.momento; })) {
    antes.push(meta.autorizacion);
  }
  var datos = { autorizacion: aut, autorizaciones: antes.concat([aut]) };
  try {
    /* 21-oct-2026 (R3) — escritura en camino (ver LO QUE VA EN CAMINO NO SE CORTA). */
    return escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + sesion.access_token },
      body: JSON.stringify({ data: datos })
    })).then(function (r) {
      if (!r || !r.ok) return 'rechazada';
      /* La copia de la sesión dice lo mismo que la cuenta. */
      try { u.user_metadata = Object.assign({}, meta, datos); sesion.user = u; } catch (e) {}
      return 'guardada';
    }, function () { return 'sin_saber'; });
  } catch (e) { return Promise.resolve('sin_saber'); }
}

/* Entra con el celular y la contraseña del registro, para el caso de quien ya

        'termina sin que hagas nada más. Si se te cayó el internet, vuelve a escribir aquí la contraseña de tu cuenta cuando vuelva.');
    });

    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },

  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!sigueSiendoDeAqui(foto)) {
        if (res.ok && res.j && res.j.access_token) cerrarSesionHuerfana(res.j);
        terminarViaje(foto);
        return;
      }
      if (!res.ok || !res.j || !res.j.access_token) {
        /* 21-oct-2026 — H1: en el reintento que entra primero, que esa
           contraseña no abra nada no es un error: la cuenta no alcanzó a
           crearse (o es de antes, con otra contraseña). Sigue el mismo viaje
           por la cadena de siempre, que lo averigua y lo dice. */
        if (o.siNoEntra) return o.siNoEntra();
        terminarViaje(foto);
        /* La contraseña no es la de esa cuenta. Se le dice sin regañarlo.
           7-oct-2026 — sin «te mandamos un código»: no hay código (Joan los

           le escribimos para devolverle el acceso.

        /* 20-oct-2026, buena fe (A3) — en PlataChat también se escribe aquí

            'tu registro con tus fotos. Si no la recuerdas, entra en PlataChat: ahí mismo nos dejas un recado y te escribimos para devolverte el acceso.'

        anotarCuentaCreada(foto.celular);
        encolarLasFotosDelRegistro(foto.celular);   // 20-oct-2026, rediseño (A): como en la cuenta nueva
        anotarAparato('registro');   // 19-oct-2026: ya tenía cuenta, pero este es su registro
        pintarRegistrado();
        subidaEnSegundoPlano();   // sus fotos, que era lo que se perdía
        cerrarElRegistroEnMemoria();   // 20-oct-2026, revisión (F7): como en la cuenta nueva
      });
    }, function () {
      terminarViaje(foto);
      if (!sigueSiendoDeAqui(foto)) return;   // 21-oct-2026 — G1: ya no es de esta pestaña

      if (o.primero) return fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a tocar «Abrir mi cuenta»: lo que llenaste sigue aquí.');

/* 7-oct-2026 (tercera vuelta) — EL AVISO DE «YA TIENES CUENTA», CON SUS

/* Adónde puede ir quien ya tenía cuenta. En Tu Garantía, a la portada con su

/* «Entrar y terminar mi registro»: la contraseña de la cuenta que ya existía,

/* ================= PEDIR LO QUE NECESITAS — 8-oct-2026 =================
   (Antes: «el primer crédito del nuevo», 8-sep-2026, con la propuesta
   automática al instante.)

   La calculadora es la de app/calculadora-solicitud.js: cuánto y para cuándo,
   SIN PRECIO —el costo lo pone Joan cliente por cliente y se ve en la
   propuesta, antes de aceptar—. El pedido va a solicitar_a_la_medida
   (base/20261008_condiciones_aceptadas.sql), que lo deja 'nuevo' en la
   bandeja del CRM con el monto, la FECHA que escogió y su nota.

   Lo que esta pantalla NO hace: no crea un crédito ni promete uno. Pedir es
   pedir; aceptar es aceptar la propuesta; la plata la entrega Joan, a mano, y
   ahí nace el crédito. Y al cliente se le habla en PESOS: ni un porcentaje.
   19-oct-2026 — YA NO ES «SIN PRECIO»: la calculadora muestra un ESTIMADO en
   pesos (decisión de Joan: el 2% al mes, debajo del techo de usura del día;
   la cuenta y la reja viven en app/calculadora-solicitud.js, no aquí), con el
   rótulo de que la propuesta puede ser distinta. Y ese estimado viaja con la
   solicitud (anotarEstimado) para que Joan lo vea antes de proponer. */
/* ===========================================================================
 * LO QUE PIDE LA CUENTA ES DE LA SESIÓN QUE LO PIDIÓ — 21-oct-2026 (H2)
 *
 * «Salir» no corta lo que va en camino. María toca «Pedir $450.000» con la
 * nota «debo el arriendo de 2 meses…», se queda en «Enviando…», toca «Salir»
 * y presta el teléfono; Pedro entra a SU cuenta. Cuando llegaba la respuesta
 * de María, pintarSolicitud repintaba la pantalla de Pedro con el monto, la
 * fecha y la nota de ella (la Ley 1581 en la salida), y anotarAparato salía
 * con el token de Pedro: el CRM anotaba «pidió» en la cuenta equivocada. Lo
 * mismo «Aceptar» (la propuesta aceptada de María, con sus cifras), la
 * propuesta recargada, la solicitud que pone la calculadora en lo pedido, la
 * contraseña nueva, el chat, la foto del chat y la cola de fotos. La ficha y
 * el chat ya miraban la sesión una por una (G1); los demás no.
 * La regla, en UN sitio y no en quince: toda llamada de la vista de la cuenta
 * toma la sesión AL PEDIR (`ses`), sale con el token de ESA sesión —nunca con
 * SESION en vivo— y su respuesta solo sigue si SESION todavía es esa. Si no,
 * la promesa se queda callada para siempre (enSilencio): ni el .then ni el
 * .catch de quien llamó corren, así que no se pinta, no se anota y no se
 * llama nada más. salirDeCuenta deja en su estado inicial lo que la cuenta
 * tenía a medias (PIDIENDO y compañía).
 * 21-oct-2026 — I3: UNA EXCEPCIÓN, Y SOLO UNA: la subida de la cola de fotos.
 * Lo que anota (soltar la cola de ese celular, la nota de cómo le fue) no
 * pinta nada y es de la cuenta que pidió; callarlo dejaba en el teléfono
 * prestado la cédula que ya había llegado. Sale con rpcSesion «suelta» y se
 * calla solo lo que pinta (ver SUBIDA_EN_CURSO).
 * ======================================================================== */
function enSilencio() { return new Promise(function () {}); }
/* La promesa de una llamada hecha con `ses`, atada a ella. */
function deEstaSesion(ses, promesa) {
  return promesa.then(function (v) { return SESION === ses ? v : enSilencio(); },
                      function (e) { if (SESION === ses) throw e; return enSilencio(); });
}
/* `ses` (opcional) es la sesión que pidió; sin ella, la de este momento.
   21-oct-2026 — I3: `suelta` (opcional): LA MISMA LLAMADA, SIN ATARLA A LA
   PANTALLA. Sale igual con el token de `ses`, pero su respuesta llega
   SIEMPRE, aunque SESION ya sea otra. Solo para lo que no pinta nada y es de
   la cuenta que pidió: la contabilidad de la cola de fotos
   (subirArchivosRegistro), que anota con el celular de esa cuenta. Atada, una
   subida que SÍ llegó dejaba la cédula, la selfie y la ubicación de María en
   el teléfono prestado, y al día siguiente su cuenta le decía que «no
   alcanzaron a subir». Quien pinta lo que pasó la ata aparte, con
   deEstaSesion (subirLaColaYDecirlo, terminarEnPlataChat). */
function rpcSesion(fn, cuerpo, ses, suelta) {
  if (ses === undefined) ses = SESION;
  if (!ses || !ses.access_token) return Promise.reject({ sinSesion: true });
  var p = rpcConToken(fn, cuerpo, ses);
  return suelta ? p : deEstaSesion(ses, p);
}
/* La llamada cruda, con el token de `ses`. Todo lo de la cuenta pasa por
   rpcSesion, que decide si la respuesta se ata a la sesión.
   21-oct-2026 (verificación del lote 1, R3) — y si ESCRIBE, cuenta como
   escritura en camino (escrituraEnCamino): SE ACTUALIZA SOLA no recarga
   encima de ella en ninguna pantalla. */
function rpcConToken(fn, cuerpo, ses) {
  if (!ses || !ses.access_token) return Promise.reject({ sinSesion: true });
  var p = fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + ses.access_token },
    body: JSON.stringify(cuerpo || {})
  }).then(function (r) {
    if (r.ok) return r.json();
    /* 20-oct-2026, cierre (B4) — con el estado a la vista: un 401/403 es la
       sesión vencida, no la red, y la subida de las fotos lo trata distinto
       (ver subirArchivosRegistro). El mensaje sigue siendo el de siempre. */
    var e = new Error('http ' + r.status); e.status = r.status;
    return Promise.reject(e);
  });
  return (LECTURAS_QUE_NO_FRENAN || []).indexOf(fn) >= 0 ? p : escrituraEnCamino(p);
}

/* ===========================================================================
 * LO QUE VA EN CAMINO NO SE CORTA — 21 de octubre de 2026 (verificación del
 * lote 1, R2 y R3)
 *
 * SE ACTUALIZA SOLA recarga la página al llegar a una pantalla de la lista
 * (Crédito, Historial, la portada), y una recarga CORTA lo que el navegador
 * tenga en camino. La lista miraba un pedido (PIDIENDO) y la subida de fotos
 * de la cuenta (SUBIDA_EN_CURSO), y nada más:
 *   · la foto del comprobante en el chat salía, la persona tocaba
 *     «Historial» y la recarga la cortaba a mitad de subida, sin un error;
 *   · lo mismo un mensaje del chat, la contraseña nueva (nunca veía
 *     «Listo»), el estimado del pedido o el aviso de «Salir» al servidor;
 *   · y «Salir» con las fotos del registro subiendo: I3 deja esa subida viva
 *     a propósito (su respuesta suelta la copia del teléfono prestado), pero
 *     SUBIDA_EN_CURSO queda en null y la portada recargaba en el acto. La
 *     cédula, la cara y la ubicación de María se quedaban en el teléfono de
 *     otro, y al día siguiente su cuenta le decía «no alcanzaron a subir».
 * La regla, en UN sitio: toda escritura sale por escrituraEnCamino, que la
 * cuenta (sube al salir, baja al contestar o fallar), y mientras haya una no
 * es momento seguro en NINGUNA pantalla (momentoSeguroPlay). Las lecturas
 * (el latido del chat, la ficha, la solicitud) no frenan nada: cortarlas no
 * pierde nada, la recarga las vuelve a pedir. La subida que «Salir» deja
 * suelta se guarda aparte (SUBIDA_SUELTA), por su nombre: es la promesa de I3.
 * Cuando la última termina se vuelve a preguntar (avisarQueTermino): sin la
 * persona mirando, recarga; mirando, solo cambia la franja.
 * ======================================================================== */
var ESCRITURAS_EN_CAMINO = 0;
var SUBIDA_SUELTA = null;
/* Las RPC de la cuenta que solo leen. Lo que no está aquí cuenta como
   escritura: una función nueva frena la recarga hasta que alguien diga que
   solo lee, y no al revés. */
var LECTURAS_QUE_NO_FRENAN = ['chat_leer_sesion', 'chat_sin_leer_sesion', 'chat_foto_sesion_ver',
                              'mi_cuenta', 'mi_registro', 'mi_solicitud',
                              /* 22-oct-2026 — las cuentas del registro, al aceptar: solo lee. */
                              'mis_cuentas_de_pago'];
/* Devuelve la MISMA promesa: quien llama sigue con su .then y su .catch como
   siempre. El conteo va en una rama aparte que se traga el error (no deja
   una promesa rechazada sin atender). */
function escrituraEnCamino(p) {
  if (!p || typeof p.then !== 'function') return p;
  ESCRITURAS_EN_CAMINO = (ESCRITURAS_EN_CAMINO || 0) + 1;
  avisarQueEmpieza();
  var fin = function () {
    ESCRITURAS_EN_CAMINO = Math.max(0, (ESCRITURAS_EN_CAMINO || 0) - 1);
    avisarQueTermino();
  };
  p.then(fin, fin);
  return p;
}
/* «Salir» suelta la subida de la cola de la cuenta (I3): se guarda aquí hasta
   que conteste, para que ninguna pantalla la tome por momento seguro. */
function soltarLaSubida(p) {
  if (!p || typeof p.then !== 'function') return;
  SUBIDA_SUELTA = p;
  avisarQueEmpieza();
  var fin = function () { if (SUBIDA_SUELTA === p) { SUBIDA_SUELTA = null; avisarQueTermino(); } };
  p.then(fin, fin);
}
function hayEscriturasEnCamino() { return (ESCRITURAS_EN_CAMINO || 0) > 0 || !!SUBIDA_SUELTA; }
/* 22-oct-2026 (verificación de 35f0687) — EMPEZÓ UNA: la franja se vuelve a
   mirar YA. Solo se miraba al terminar, y la que se pintó con la pantalla
   segura seguía ofreciendo «Actualizar ahora» con el pedido, la aceptación o
   el mensaje en el aire; tocarlo los cortaba. Es el único sitio por donde
   salen las escrituras, así que ninguna pantalla tiene que acordarse. */
function avisarQueEmpieza() {
  if (typeof ACT === 'undefined' || !ACT || typeof ACT.volverAMirar !== 'function') return;
  try { ACT.volverAMirar(); } catch (e) {}
}
/* Terminó la última: SE ACTUALIZA SOLA vuelve a mirar con la pantalla de
   ahora (revisar, no yaEsSeguro: la persona puede estar leyendo, y eso no es
   un cambio de pantalla que ella pidió). */
function avisarQueTermino() {
  if (hayEscriturasEnCamino() || typeof ACT === 'undefined' || !ACT) return;
  try { ACT.revisar(); } catch (e) {}
}

/* ================= DESDE QUÉ TELÉFONO — 19-oct-2026 =================
   El «tipo de celular» del CRM salía de la cabecera de la petición, que en
   Android es la misma cadena congelada para todos («Android 10; K»). Aquí se
   le pregunta al navegador lo que sí sabe (app/aparato.js) y se anota en la
   base (aparato_anotar, base/20261019_aparato_del_telefono.sql) en los tres
   momentos que Joan mira: al registrarse, al pedir y al aceptar.
   SIN ESPERAR Y SIN QUE NADA DEPENDA DE ESTO: no se devuelve la promesa, el
   error se traga con nombre (no es del cliente ni se le puede pedir nada), y
   la pregunta al navegador tiene su propio límite de 800 ms. Va aunque no haya
   dado la autorización de datos sensibles: son los datos técnicos que la

   CON keepalive y no por rpcSesion: en PlataChat, justo después del registro,

   salió, no se anota en nadie: con SESION en vivo, el «pidió» de María caía
   en la cuenta de Pedro. */
function anotarAparato(cuando, ses) {
  try {
    if (ses === undefined) ses = SESION;
    if (!APARATO || !APARATO.leerAparato || !ses || !ses.access_token) return;
    var token = ses.access_token;
    APARATO.leerAparato({ navegador: navigator, documento: document, almacen: localStorage,
                          matchMedia: window.matchMedia ? function (q) { return window.matchMedia(q); } : null },
                        { tiempo: APARATO.TIEMPO })
      .then(function (declarado) {
        if (SESION !== ses) return;
        return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/aparato_anotar', {
          method: 'POST', keepalive: true,
          headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + token },
          body: JSON.stringify({ p_cuando: cuando, p_declarado: declarado })
        });
      })['catch'](function () { /* sin la migración del 19-oct, o sin señal: el resto no cambia */ });
  } catch (e) { /* nunca tumba el paso que la llamó */ }
}
