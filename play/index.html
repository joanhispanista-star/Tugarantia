}

/* -------------------------------------------------------------------------
 * EL RAYO — rehecho el 16-sep-2026
 *
 * Joan: «mejora el rayo, que no llegue tan lejos pero que se vea más
 * ramificado, y que sea un movimiento más constante y que se siga moviendo
 * mientras tocamos la pantalla».
 *
 * LO QUE HABÍA Y POR QUÉ NO SERVÍA. El rayo era una cabeza que CAMINABA: un
 * punto por fotograma, con la dirección desviándose al azar. Eso trae tres
 * cosas que Joan notó y tenía razón:
 *   · llegaba lejísimos —veintiséis pasos de hasta 38px son media pantalla— y
 *     el dibujo terminaba siendo un garabato largo en vez de un rayo;
 *   · casi no se ramificaba, porque las ramas salían de un sorteo por paso y
 *     eran tres rayitas de 12px;
 *   · y no se movía: crecía una vez, se quedaba quieto, y se apagaba. Un rayo
 *     de verdad NO se queda quieto — vibra mientras dura.
 *
 * CÓMO ESTÁ HECHO AHORA, y es otro algoritmo. El rayo ya no camina: se tiende
 * entre dos puntos —el dedo y un destino cerca— y el camino entre ellos se
 * REGENERA en cada fotograma por desplazamiento del punto medio, que es la
 * forma clásica de dibujar un relámpago. De ahí salen las tres cosas de una:
 *   · el alcance es un número y se acabó (LARGO), en vez de la suma de veinte
 *     pasos al azar;
 *   · la ramificación es natural: las ramas se tienden igual que el tronco y
 *     pueden tener sus propias ramas;
 *   · y el movimiento constante sale gratis, porque el camino se vuelve a
 *     sortear: es el mismo rayo temblando, no uno nuevo cada vez.
 *
 * MIENTRAS EL DEDO ESTÁ PUESTO, EL RAYO VIVE. Nace en pointerdown, sigue al
 * dedo en pointermove, y solo empieza a apagarse cuando se levanta. Cada dedo
 * tiene el suyo, por su pointerId.
 *
 * LO QUE LO MANTIENE BARATO, que es la parte que importa en un celular de gama
 * baja —y es lo mismo que cuidaba la versión anterior—:
 *   · Un solo lienzo, y el bucle se APAGA cuando no queda ninguno vivo.
 *   · Máximo tres a la vez. El cuarto dedo no crea nada.
 *   · AUTODEGRADADO: se cronometran los primeros fotogramas y si este teléfono
 *     no da los 30 por segundo, el rayo baja a la mitad de detalle y regenera
 *     cada dos fotogramas en vez de cada uno. Un adorno no puede volver lenta
 *     una app de plata.
 *   · UN TOPE DE AGUANTE: por mucho que alguien deje el dedo puesto, a los seis
 *     segundos se apaga solo. Un adorno que corre indefinidamente porque un
 *     bolsillo aprieta la pantalla es batería regalada.
 *   · Sordo al tacto (pointer-events:none) y sin capturar el toque: jamás se
 *     queda con un toque que era para un botón.
 * ----------------------------------------------------------------------- */
var RAYOS = { lienzo: null, ctx: null, vivos: [], corriendo: false, dpr: 1,
              medidos: 0, suma: 0, degradado: false, ultimo: 0 };

/* EL ALCANCE. Joan pidió que no llegara tan lejos: es una fracción de la
   pantalla —para que se vea igual en un celular y en un computador— con un
   techo en píxeles, para que en una pantalla grande no se vuelva un cable que
   cruza el escritorio. */
var RAYO_LARGO_FRAC = 0.20;
var RAYO_LARGO_MAX = 190;
var RAYO_AGUANTE = 6000;   // milisegundos con el dedo puesto, ver la cabecera
var RAYO_APAGON = 320;     // lo que tarda en irse después de soltar

function largoDeRayo() {
  var m = Math.min(window.innerWidth || 0, window.innerHeight || 0);
  return Math.max(70, Math.min(RAYO_LARGO_MAX, m * RAYO_LARGO_FRAC));
}

function iniciarRayos() {
  if (RAYOS.lienzo) return;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) {}
  var c = document.createElement('canvas');
  c.id = 'rayos'; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  var ctx2d = c.getContext('2d');
  /* SIN CONTEXTO NO HAY RAYO, y no pasa nada: se sale y la página sigue.
     16-sep-2026 — getContext devuelve null de verdad: en modo privado con el
     lienzo bloqueado, con poca memoria, o en un navegador viejo. Hasta hoy nadie
     lo miraba, y dos líneas más abajo medirLienzo llamaba setTransform sobre
     null: el arranque lanzaba ANTES de pintarEntrar y la puerta pública quedaba
     EN BLANCO —sin calculadora, sin registro, sin nada—. Comprobado en el banco:
     cero letras. Un adorno no puede apagar el negocio. */
  if (!ctx2d) { if (c.remove) c.remove(); return; }
  RAYOS.lienzo = c; RAYOS.ctx = ctx2d;
  medirLienzo();
  window.addEventListener('resize', medirLienzo);
  /* pointerdown y no click: el rayo tiene que salir en el instante en que el
     dedo toca, no cuando se levanta. `passive` para no frenar el desplazamiento. */
  window.addEventListener('pointerdown', function (e) { nacerRayo(e.clientX, e.clientY, e.pointerId); }, { passive: true });
  window.addEventListener('pointermove', function (e) { moverRayo(e.pointerId, e.clientX, e.clientY); }, { passive: true });
  /* Los tres finales. `pointercancel` importa de verdad en un celular: es el que
     llega cuando el navegador se queda con el gesto para desplazar la página, y
     sin él el rayo se quedaría pegado y encendido hasta el tope de aguante. */
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { soltarRayo(e.pointerId); }, { passive: true });
  });
  /* Y si la pestaña se va a segundo plano con el dedo puesto, no vuelve nunca un
     pointerup: se sueltan todos. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) RAYOS.vivos.forEach(function (r) { r.sujeto = false; });
  });
}
/* Se vuelve a medir sola si hace falta, y no solo cuando el navegador avisa que
   cambió el tamaño. Motivo concreto: si `innerWidth` llega en CERO en el momento
   de cargar —pasa cuando la página arranca en una pestaña que todavía no se
   muestra, y se vio en el banco de pruebas—, el lienzo nace de 0×0 y el rayo no
   vuelve a dibujarse nunca, porque `resize` puede no dispararse jamás. Comparar
   dos números por fotograma no cuesta nada; quedarse con un adorno muerto y sin
   error en consola, sí. */
function medirLienzo() {
  var c = RAYOS.lienzo; if (!c || !RAYOS.ctx) return false;
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if (!w || !h) return false;
  RAYOS.dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = Math.round(w * RAYOS.dpr), H = Math.round(h * RAYOS.dpr);
  if (c.width !== W || c.height !== H) {
    c.width = W; c.height = H;
    RAYOS.ctx.setTransform(RAYOS.dpr, 0, 0, RAYOS.dpr, 0, 0);
  }
  return true;
}

function nacerRayo(x, y, id) {
  if (!RAYOS.ctx || RAYOS.vivos.length >= 3) return;
  /* Un dedo, un rayo. Sin esto, un `pointerdown` repetido del mismo dedo —pasa
     con algunos lápices y con el ratón arrastrando— dejaría dos pegados. */
  if (RAYOS.vivos.some(function (r) { return r.id === id; })) return;
  var L = largoDeRayo();
  var a = Math.random() * Math.PI * 2;
  RAYOS.vivos.push({
    id: id, x: x, y: y,
    /* El destino: a un largo del dedo, en una dirección cualquiera. */
    dx: x + Math.cos(a) * L, dy: y + Math.sin(a) * L,
    /* Y derivando despacio, que es lo que hace que el rayo se pasee en vez de
       temblar en el sitio. */
    va: (Math.random() - 0.5) * 0.06,
    ang: a, largo: L,
    sujeto: true, edad: 0, soltado: 0, alfa: 1,
    camino: [], ramas: [], tic: 0
  });
  if (!RAYOS.corriendo) { RAYOS.corriendo = true; RAYOS.ultimo = 0; requestAnimationFrame(pasoRayos); }
}

function moverRayo(id, x, y) {
  for (var i = 0; i < RAYOS.vivos.length; i++) {
    var r = RAYOS.vivos[i];
    if (r.id === id && r.sujeto) { r.x = x; r.y = y; return; }
  }
}

function soltarRayo(id) {
  for (var i = 0; i < RAYOS.vivos.length; i++) {
    if (RAYOS.vivos[i].id === id) RAYOS.vivos[i].sujeto = false;
  }
}

/* EL CAMINO, POR DESPLAZAMIENTO DEL PUNTO MEDIO. Se parte el segmento por la
   mitad, se empuja ese punto medio de lado una cantidad al azar, y se repite
   con las dos mitades empujando menos. Es la forma clásica de dibujar un
   relámpago, y es barata: `niveles` duplica los puntos cada vuelta, así que
   cuatro niveles son diecisiete puntos y no más. */
function caminoRayo(x0, y0, x1, y1, desvio, niveles) {
  var pts = [{ x: x0, y: y0 }, { x: x1, y: y1 }];
  for (var n = 0; n < niveles; n++) {
    var out = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var ex = b.x - a.x, ey = b.y - a.y;
      var L = Math.sqrt(ex * ex + ey * ey) || 1;
      /* La normal del segmento: se empuja de lado, nunca a lo largo. Empujar a
         lo largo haría que el rayo se doblara sobre sí mismo. */
      var d = (Math.random() - 0.5) * desvio;
      out.push(a, { x: (a.x + b.x) / 2 - (ey / L) * d, y: (a.y + b.y) / 2 + (ex / L) * d });
    }
    out.push(pts[pts.length - 1]);
    pts = out;
    desvio *= 0.52;
  }
  return pts;
}

/* LAS RAMAS. Salen de un punto del tronco, en ángulo, y se tienden con el mismo
   algoritmo — por eso se ven del mismo material que el tronco y no como rayitas
   pegadas. Una rama puede tener su propia rama: eso es lo que da el aire
   ramificado que Joan pidió, y se corta en `profundidad` para que no se vuelva
   un árbol que come fotogramas. */
function ramasDeRayo(pts, largo, cuantas, profundidad) {
  var out = [];
  if (pts.length < 4) return out;
  for (var k = 0; k < cuantas; k++) {
    var i = 1 + Math.floor(Math.random() * (pts.length - 2));
    var a = pts[i], b = pts[i + 1] || pts[i - 1];
    var base = Math.atan2(b.y - a.y, b.x - a.x);
    var ang = base + (Math.random() < 0.5 ? -1 : 1) * (0.45 + Math.random() * 0.75);
    var L = largo * (0.20 + Math.random() * 0.32);
    var camino = caminoRayo(a.x, a.y, a.x + Math.cos(ang) * L, a.y + Math.sin(ang) * L,
                            L * 0.34, profundidad > 0 ? 3 : 2);
    out.push({ pts: camino, nivel: profundidad });
    if (profundidad > 0 && Math.random() < 0.65) {
      out = out.concat(ramasDeRayo(camino, L, 1, profundidad - 1));
    }
  }
  /* AL MENOS UNA RAMA DE RAMA, SIEMPRE — 15-sep-2026.
     Cada rama sorteaba por su cuenta si se ramificaba (0,65), asi que con dos
     ramas la probabilidad de que NINGUNA lo hiciera era 0,35 x 0,35 = 12%.
     Medido sobre 400 rayos: el 6% salia con un solo nivel, o sea con el aspecto
     viejo de «tres rayitas» que Joan pidio cambiar. No se veia mirando —pasa
     una vez de cada dieciseis— y lo delato una prueba que fallaba a veces.

     Una prueba intermitente es peor que ninguna: ensena a ignorar el rojo. Se
     arreglo el rayo, no la prueba. */
  if (profundidad > 0 && out.length) {
    var tieneHija = false;
    for (var q = 0; q < out.length; q++) {
      if (out[q].nivel < profundidad) { tieneHija = true; break; }
    }
    if (!tieneHija) {
      var madre = out[Math.floor(Math.random() * out.length)];
      out = out.concat(ramasDeRayo(madre.pts, largo * 0.3, 1, profundidad - 1));
    }
  }
  return out;
}

/* Rehace el rayo entero: el tronco y sus ramas. Se llama en cada fotograma
   —o cada dos, en un teléfono lento— y eso es TODA la animación: el rayo no se
   mueve, se vuelve a sortear. */
function rehacerRayo(r) {
  var niveles = RAYOS.degradado ? 3 : 4;
  var cuantas = RAYOS.degradado ? 2 : (2 + Math.floor(Math.random() * 3));
  var prof = RAYOS.degradado ? 0 : 1;
  r.camino = caminoRayo(r.x, r.y, r.dx, r.dy, r.largo * 0.42, niveles);
  r.ramas = ramasDeRayo(r.camino, r.largo, cuantas, prof);
}

function pasoRayos(t) {
  var ctx = RAYOS.ctx; if (!ctx) { RAYOS.corriendo = false; return; }
  /* Si el lienzo todavía no tiene tamaño (ver medirLienzo), se espera al
     siguiente fotograma en vez de dibujar en la nada. */
  if (!medirLienzo()) { requestAnimationFrame(pasoRayos); return; }

  /* El autodegradado: diez fotogramas medidos y se decide de una vez. */
  var dt = RAYOS.ultimo ? (t - RAYOS.ultimo) : 16;
  if (RAYOS.ultimo && RAYOS.medidos < 10) {
    RAYOS.suma += dt; RAYOS.medidos++;
    if (RAYOS.medidos === 10 && (RAYOS.suma / 10) > 33) RAYOS.degradado = true;
  }
  RAYOS.ultimo = t;

  var W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);

  RAYOS.vivos = RAYOS.vivos.filter(function (r) {
    r.edad += dt;
    r.tic++;

    if (r.sujeto) {
      /* CON EL DEDO PUESTO NO ENVEJECE: solo el tope de aguante lo apaga. */
      if (r.edad > RAYO_AGUANTE) r.sujeto = false;
      r.alfa = Math.min(1, r.edad / 90);          // un encendido corto, no un salto
    } else {
      r.soltado += dt;
      r.alfa = Math.max(0, 1 - r.soltado / RAYO_APAGON);
      if (r.alfa <= 0) return false;
    }

    /* El destino se pasea alrededor del dedo, a un largo fijo. Que gire en vez
       de saltar es lo que hace que el movimiento se lea como continuo. */
    r.ang += r.va + (Math.random() - 0.5) * 0.05;
    r.largo = largoDeRayo();
    var dx = r.x + Math.cos(r.ang) * r.largo;
    var dy = r.y + Math.sin(r.ang) * r.largo;
    /* Y no se sale de la pantalla: si el destino se iba fuera, media rama se
       dibujaba donde nadie la ve. */
    r.dx = Math.max(6, Math.min(W - 6, dx));
    r.dy = Math.max(6, Math.min(H - 6, dy));

    /* Cada fotograma, o cada dos en un teléfono lento. */
    if (!RAYOS.degradado || r.tic % 2 === 1) rehacerRayo(r);
    if (r.camino.length) dibujarRayo(ctx, r, r.alfa);
    return true;
  });

  if (RAYOS.vivos.length) requestAnimationFrame(pasoRayos);
  else { RAYOS.corriendo = false; ctx.clearRect(0, 0, W, H); }
}

function dibujarRayo(ctx, r, alfa) {
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  /* Tres pasadas: un halo ancho y tenue, el filamento claro, y las ramas.
     Sale más barato que un shadowBlur, que en Android recalcula el desenfoque
     en cada fotograma — y con el camino regenerándose cada fotograma, ese coste
     se pagaría sesenta veces por segundo. */
  ctx.strokeStyle = 'rgba(245,197,66,' + (alfa * 0.20).toFixed(3) + ')';
  ctx.lineWidth = 10; trazo(ctx, r.camino);
  ctx.strokeStyle = 'rgba(255,240,200,' + (alfa * 0.95).toFixed(3) + ')';
  ctx.lineWidth = 2; trazo(ctx, r.camino);

  /* Las ramas, más finas y más apagadas cuanto más hondas: es lo que hace que
     se lean como ramas y no como tres rayos encimados. */
  for (var i = 0; i < r.ramas.length; i++) {
    var b = r.ramas[i];
    var f = b.nivel > 0 ? 1 : 0.6;
    ctx.strokeStyle = 'rgba(245,197,66,' + (alfa * 0.60 * f).toFixed(3) + ')';
    ctx.lineWidth = b.nivel > 0 ? 1.4 : 1;
    trazo(ctx, b.pts);
  }
  ctx.restore();
}
function trazo(ctx, pts) {
  if (!pts || pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

/* ============================== LA CUENTA ==============================
   Etapa 6. Lo que el socio ve cuando entra: su perfil y su cupo, el simulador,
   el botón de pedir, y su historial.

   TODO SALE DE LA SESIÓN, Y LO QUE NO ESTÁ SE DICE. Un historial vacío dibujado
   como si fuera real es la clase de mentira que este proyecto lleva meses
   quitándose: si la nube todavía no responde, la pantalla lo dice. */
var SESION = null;
var MONTO = 500000;
/* El plazo que el socio escogió, de punta a punta: lo mueve el deslizador del
   simulador, lo cotiza el motor y lo manda pedir(). Arranca en el del producto
   —no en un número escrito acá— así que quien no toque nada ve lo de siempre. */
var PLAZO = C.PLAZO_MESES;

function perfilDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  var p = m && m.perfil;
  return C.perfilValido(p) ? p : 'nuevo';
}
function historialDeSesion(s) {
  var m = s && s.user && s.user.user_metadata;
  return (m && Array.isArray(m.creditos)) ? m.creditos : [];
}

/* ==================== LAS CUATRO PESTAÑAS — 14-sep-2026 ====================
   Joan: «después de que ingrese y se registre el cliente quiero que tenga las
   pestañas de perfil, con opciones de cambiar contraseña o usuario u otros,
   aparte una pestaña de historial y una pestaña chat, en el cual esté el chat
   de servicio al cliente y el chat de cobranzas y el chat de créditos nuevos. Y
   una pestaña para solicitar un nuevo crédito o en su defecto que muestre la
   información del crédito activo».

   Cuatro láminas y una barra. Cada lámina se pinta sola: si el chat no puede
   hablar con la nube, el crédito se sigue viendo.

   LO QUE NO ESTÁ ENCENDIDO SE DICE CON ESAS PALABRAS. mi_cuenta y
   chat_leer_sesion viven en una migración que Joan corre a mano; mientras no la
   corra, el servidor contesta 404. Traducir eso a «no tienes mensajes» sería la
   pantalla mintiendo sobre la causa — la casa no lo permite —, así que se dice
   que esa parte todavía no está encendida y se distingue de «no pude
   conectarme», que es otra cosa. */
var TAB = 'credito';
var FICHA = null;          // lo que devolvió mi_cuenta, ya leído por ficha.js
var FICHA_ESTADO = 'sin';  // sin | cargando | nueva | vinculada | apagada | falla

var PESTANAS = [['credito', 'Crédito'], ['historial', 'Historial'],
                ['chat', 'Chat'], ['perfil', 'Perfil']];
var TITULOS = { credito: 'Tu crédito', historial: 'Tu historial',
                chat: 'Tus chats', perfil: 'Tu perfil' };

function barraPestanas() {
  return '<div class="tabs" role="tablist">' + PESTANAS.map(function (x) {
    return '<button class="tab' + (TAB === x[0] ? ' on' : '') + '" role="tab" ' +
      'aria-selected="' + (TAB === x[0] ? 'true' : 'false') + '" ' +
      'onclick="irA(&quot;' + x[0] + '&quot;)">' + esc(x[1]) + '</button>';
  }).join('') + '</div>';
}

function pintarCuenta(sesion) {
  if (sesion) SESION = sesion;
  VISTA = 'cuenta';
  /* La sesión se guarda para que una recarga no la cierre — ver LLAVE_SESION—,
     y se suelta la dirección del registro: quien ya tiene cuenta no vuelve al
     formulario por recargar. El paso se olvida por lo mismo. */
  guardarSesionEnCurso(SESION);
  marcarVista('');
  olvidarPaso(); olvidarCuentaCreada();
  $('cuerpo').innerHTML = '<div id="tabs">' + barraPestanas() + '</div>' +
    '<div id="lamina"></div>' + pie();
  /* La ficha se pide UNA vez al abrir y se reparte a las cuatro láminas. Pedirla
     en cada pestaña sería la misma pregunta cuatro veces por visita. */
  cargarFicha();
  irA(TAB);
  subidaEnSegundoPlano();
  window.scrollTo(0, 0);
}

function irA(tab) {
  TAB = tab;
  var b = $('tabs'); if (b) b.innerHTML = barraPestanas();
  $('titulo').textContent = TITULOS[tab] || 'Mi cuenta';
  pintarLamina();
  window.scrollTo(0, 0);
}

/* Repinta la lámina que se está viendo. Se llama sola cuando llega la ficha: sin
   esto, el que abre en «Crédito» se queda viendo «cargando» hasta que toque otra
   pestaña, aunque la respuesta ya haya llegado. */
function pintarLamina() {
  var l = $('lamina'); if (!l) return;
  if (TAB === 'credito') {
    l.innerHTML = laminaCredito();
    pintarSimulacion();
    moverGCalc();
    cargarMiSolicitud();
  } else if (TAB === 'historial') {
    l.innerHTML = laminaHistorial();
  } else if (TAB === 'chat') {
    l.innerHTML = laminaChat();
    abrirCanal(CANAL);
  } else {
    l.innerHTML = laminaPerfil();
  }
}

/* ------------------------------ LA FICHA ------------------------------ */

/* POR QUÉ FALLÓ, EN UNA SOLA FUNCIÓN. Tres pantallas preguntan a la nube y las
   tres tienen que dar la misma respuesta ante la misma causa.

   Y las causas son distintas de verdad, no matices: al 404 no hay nada que
   hacerle desde el teléfono —es una migración que Joan no ha corrido—; al 401 se
   le contesta volviendo a entrar, que es un toque; y solo la última es de verdad
   un problema de conexión. Decirle «revisa tu internet» a quien tiene la sesión
   vencida lo manda a reiniciar el teléfono por algo que arregla un botón. */
function causaDe(e) {
  if (e && e.sinSesion) return 'sesion';
  var m = String((e && e.message) || '');
  if (/\b404\b/.test(m)) return 'apagado';
  if (/\b401\b/.test(m) || /\b403\b/.test(m)) return 'sesion';
  return 'falla';
}
function cargarFicha() {
  if (!SESION || !SESION.access_token) { FICHA_ESTADO = 'sin'; return; }
  FICHA_ESTADO = 'cargando';
  rpcSesion('mi_cuenta').then(function (j) {
    if (!j || j.ok !== true) { FICHA_ESTADO = 'falla'; return pintarLamina(); }
    if (!j.vinculada) {
      /* NO ES UN ERROR: es un registrado nuevo, o uno antiguo al que Joan
         todavía no le ha cargado el historial. Se le contesta así. */
      FICHA = null; FICHA_ESTADO = 'nueva'; return pintarLamina();
    }
    FICHA = FS.leer(j.datos || {});
    FICHA.nombre = j.nombre || '';
    FICHA.actualizado = j.actualizado_en || '';
    FICHA_ESTADO = 'vinculada';
    pintarLamina();
  }).catch(function (e) {
    /* Cada causa, su palabra: ver causaDe. */
    var c = causaDe(e);
    FICHA_ESTADO = c === 'apagado' ? 'apagada' : (c === 'sesion' ? 'sesion' : 'falla');
    pintarLamina();
  });
}

/* El aviso del estado de la ficha, en palabras, una sola vez y no en cada
   tarjeta. Devuelve cadena vacía cuando hay ficha: no hay nada que explicar. */
function avisoFicha() {
  if (FICHA_ESTADO === 'vinculada') return '';
  if (FICHA_ESTADO === 'cargando') {
    return '<div class="aviso">Buscando tu historial…</div>';
  }
  if (FICHA_ESTADO === 'nueva') {
    return '<div class="aviso">Tu cuenta está abierta y todavía no tiene historial con nosotros. Si ya eras cliente, vete a <b>Perfil</b> y pega el código que te dimos: ahí se junta tu historial con esta cuenta.</div>';
  }
  if (FICHA_ESTADO === 'apagada') {
    return '<div class="aviso ambar"><b>Esta parte todavía no está encendida.</b> Tu cuenta y tu solicitud funcionan; el historial y la garantía los estamos conectando. No es tu teléfono ni tu internet.</div>';
  }
  if (FICHA_ESTADO === 'sesion') {
    return '<div class="aviso ambar"><b>Tu sesión se venció.</b> Vuelve a entrar con tu celular y tu contraseña y sigues donde ibas.' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="salirDeCuenta()">Volver a entrar</button></div>';
  }
  if (FICHA_ESTADO === 'falla') {
    return '<div class="aviso ambar">No pude traer tu historial ahora. Vuelve a abrir la app en un rato.</div>';
  }
  return '';
}

/* ---------------------------- LÁMINA: CRÉDITO ----------------------------
   «Una pestaña para solicitar un nuevo crédito o EN SU DEFECTO que muestre la
   información del crédito activo». El orden es ese: lo que ya debe manda sobre
   lo que podría pedir. */
function laminaCredito() {
  var idPerfil = perfilDeSesion(SESION);
  var perfil = C.PERFILES[idPerfil];
  MONTO = Math.min(MONTO, perfil.cupo_maximo || 500000);
  MONTO = Math.max(MONTO, 100000);
  /* Y el plazo se pinza igual, por si un estado viejo trae uno fuera de rango:
     por debajo del piso de 90 días el motor lanza y la lámina sale en blanco. */
  PLAZO = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, PLAZO));
  return '<div id="solicitudBox"></div>' +
    avisoFicha() +
    tarjetaCreditoActivo() +
    tarjetaMiGarantia() +
    tarjetaCupo(perfil) +
    tarjetaSimulador(idPerfil) +
    tarjetaCalcGarantia();
}

/* EL CRÉDITO ACTIVO, CON SUS CUOTAS SEGMENTADAS. Joan: «que le aparezca
   segmentado la fecha y monto a pagar para mejorar la cobranza y dar claridad».
   Vale para los dos productos: el de garantía trae cuotas, el quincenal trae una
   sola fecha y se dibuja igual, con su renglón. */
function tarjetaCreditoActivo() {
  if (!FICHA) return '';
  var r = FICHA.respaldadoActivo, q = FICHA.activo;
  if (!r && !q) return '';
  var h = '';
  if (r) {
    var sig = FS.proximaCuota(r);
    h += '<div class="card laca">' +
      '<div class="etq">Tu crédito con garantía</div>' +
      (sig ? '<div class="cifra oro">' + COP(sig.total) + '</div>' +
             '<div class="muted" style="font-size:13.5px">es lo que sigue, el ' +
               esc(fmtFecha(sig.fecha)) + '</div>'
           : '<div class="cifra oro">Al día</div>') +
      '<div class="sep"></div>' +
      fila('Te prestamos', COP(r.capital)) +
      fila('Te falta', COP(r.saldo_capital != null ? r.saldo_capital : 0)) +
      '<div class="grupo-tit">Tus cuotas</div>' +
      cuadroCuotas(r.cuotas) +
      '</div>';
  }
  if (q) {
    h += '<div class="card">' +
      '<div class="etq">Tu crédito</div>' +
      fila('Te prestamos', COP(q.capital)) +
      (q.fecha_pago ? fila('El día', esc(fmtFecha(q.fecha_pago))) : '') +
      (q.total != null ? fila('Devuelves', COP(q.total)) : '') +
      '</div>';
  }
  return h;
}

/* LA GARANTÍA DEL SOCIO, en pesos y con lo que significa cada parte. Las cifras
   salen de ficha.js, que las saca del motor: acá no se suma nada. */
function tarjetaMiGarantia() {
  if (!FICHA) return '';
  var g = FICHA.gd;
  return '<div class="card">' +
    '<div class="etq">Tu garantía</div>' +
    '<div class="cifra sm">' + COP(g.ganada) + '</div>' +
    '<div class="muted" style="font-size:13.5px">es la que ganaste pagando</div>' +
    '<div class="sep"></div>' +
    fila('Libre para respaldar', COP(FICHA.maxRespaldado)) +
    (g.comprometida > 0 ? fila('Sosteniendo lo que debes', COP(g.comprometida)) : '') +
    '<div class="ayuda">Con la libre se abre el crédito con garantía, uno a uno: si tienes ' + COP(FICHA.maxRespaldado) + ' libres, puedes pedir hasta esa misma cifra.</div>' +
    '</div>';
}

/* --------------------------- LÁMINA: HISTORIAL --------------------------- */
function laminaHistorial() {
  return avisoFicha() + tarjetaHistorial() + tarjetaRespaldadosPagados();
}

function tarjetaRespaldadosPagados() {
  if (!FICHA || !FICHA.respaldados.length) return '';
  return '<div class="card"><div class="etq">Tus créditos con garantía</div>' +
    FICHA.respaldados.map(function (r) {
      return '<div style="margin-top:var(--e4)"><b>' + COP(r.capital) + '</b>' +
        (r.plazo_meses ? ' a ' + r.plazo_meses + ' meses' : '') +
        (r.pagado ? ' · <b>terminado</b>' : '') +
        '</div>' + cuadroCuotas(r.cuotas);
    }).join('') + '</div>';
}

/* ------------------------------ LÁMINA: CHAT ------------------------------
   Tres canales, como los pidió Joan. No son tres chats distintos por capricho:
   el de cobranzas lo lee quien cobra y el de créditos quien presta, y mezclarlos
   es lo que hace que un reclamo de plata se pierda entre preguntas de tasas.

   El hilo se pinta con chat.js —el mismo que la app quincenal—, así que la marca
   de «esto te lo contestó una máquina» viaja sola. */
var CANAL = 'servicio';
var CANALES = [['servicio', 'Servicio al cliente', 'Preguntas, datos, cualquier cosa.'],
               ['cobranza', 'Cobranzas', 'Tus pagos, tus fechas, un acuerdo.'],
               ['creditos', 'Créditos nuevos', 'Pedir más, o preguntar cuánto te alcanza.']];
var HILO = { canal: null, mensajes: [], estado: 'sin' };  // sin|cargando|listo|apagado|falla

function laminaChat() {
  return '<div class="card">' +
      '<div class="canales">' + botonesDeCanal() + '</div>' +
      '<p class="sub" id="canalPie">' + esc(pieDeCanal()) + '</p>' +
    '</div>' +
    '<div class="card"><div id="hilo" class="ch-hilo"></div>' +
      '<label for="chTexto" class="oculto">Tu mensaje</label>' +
      '<textarea id="chTexto" rows="3" placeholder="Escribe aquí…" ' +
        'style="width:100%;margin-top:var(--e3)"></textarea>' +
      '<button class="btn sm" onclick="enviarChat()">Enviar</button>' +
      /* 22-sep-2026 — MANDAR UNA FOTO. Lo que se pide por nombre en este
         proyecto es el COMPROBANTE DE PAGO, así que el rótulo lo dice: un
         botón que diga «adjuntar» no le cuenta a nadie para qué sirve.
         capture no se pone a propósito: así el teléfono deja elegir entre la
         cámara y la galería, y un comprobante casi siempre ya está guardado. */
      '<input type="file" id="chFoto" accept="image/*" class="oculto" onchange="mandarFoto(this)">' +
      '<button class="btn sec sm" style="margin-top:var(--e2)" ' +
        'onclick="document.getElementById(&quot;chFoto&quot;).click()">📷 Mandar una foto</button>' +
      '<div class="ayuda">Sirve para el comprobante de un pago. Solo fotos: un video no cabe.</div>' +
      '<div id="errChat" class="aviso ambar oculto"></div>' +
    '</div>';
}

function pieDeCanal() {
  for (var i = 0; i < CANALES.length; i++) if (CANALES[i][0] === CANAL) return CANALES[i][2];
  return '';
}

/* Cambiar de canal repinta SOLO la fila de botones y el pie, nunca la lámina
   entera: repintarla borraría lo que la persona ya tenía escrito en el cuadro de
   texto, y ese defecto ya se cometió dos veces en este proyecto. */
function abrirCanal(c) {
  CANAL = c;
  var pieC = $('canalPie'); if (pieC) pieC.textContent = pieDeCanal();
  var lam = $('lamina');
  var filaC = (lam && lam.querySelector) ? lam.querySelector('.canales') : null;
  if (filaC) filaC.innerHTML = botonesDeCanal();

  var caja = $('hilo'); if (!caja) return;
  HILO = { canal: c, mensajes: [], estado: 'cargando' };
  caja.innerHTML = '<div class="ch-vacio">Buscando tus mensajes…</div>';
  rpcSesion('chat_leer_sesion', { p_canal: c, p_desde: 0 }).then(function (j) {
    /* Si mientras llegaba la respuesta la persona cambió de canal, esto ya no es
       suyo: pintarlo pondría los mensajes de cobranzas en la pestaña de
       créditos. */
    if (HILO.canal !== c) return;
    if (!j || j.ok !== true) { HILO.estado = 'falla'; return pintarHilo(); }
    HILO.mensajes = j.mensajes || [];
    HILO.estado = 'listo';
    pintarHilo();
  }).catch(function (e) {
    if (HILO.canal !== c) return;
    HILO.estado = causaDe(e);
    pintarHilo();
  });
}

function botonesDeCanal() {
  return CANALES.map(function (x) {
    return '<button class="canal' + (CANAL === x[0] ? ' on' : '') + '" ' +
      'onclick="abrirCanal(&quot;' + x[0] + '&quot;)">' + esc(x[1]) + '</button>';
  }).join('');
}

function pintarHilo() {
  var caja = $('hilo'); if (!caja) return;
  if (HILO.estado === 'apagado') {
    /* 22-sep-2026 — decía «todavía no está encendido… escríbenos por WhatsApp».
       El chat se encendió y el WhatsApp se fue, así que la frase mentía dos
       veces. Esta rama ya casi no se pisa: queda para el caso de que PostgREST
       no haya recargado el esquema, y dice justo eso sin culpar a nadie. */
    caja.innerHTML = '<div class="aviso ambar"><b>No pude abrir tu chat ahora.</b> ' +
      'Suele ser cosa de un momento: vuelve a entrar a esta pestaña en un rato y ' +
      'tus mensajes siguen donde estaban.</div>';
    return;
  }
  if (HILO.estado === 'sesion') {
    caja.innerHTML = '<div class="aviso ambar"><b>Tu sesión se venció.</b> Vuelve a entrar y tu conversación sigue donde estaba.' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="salirDeCuenta()">Volver a entrar</button></div>';
    return;
  }
  if (HILO.estado === 'falla') {
    caja.innerHTML = '<div class="aviso ambar">No pude traer tus mensajes ahora. Revisa tu internet y vuelve a intentar.</div>';
    return;
  }
  caja.innerHTML = CH.hiloHTML(HILO.mensajes, {
    yo: 'socio', hoy: hoyISO(), alVerFoto: 'verFotoChat',
    vacio: 'Todavía no han hablado por aquí. Escribe y te contestamos.'
  });
}

/* LA FOTO DEL CLIENTE. Se comprime con lo mismo que usa el resto de la casa
   —900 px y calidad 0,6, que da unos 73 KB— y se hace además una miniatura de
   240 px para que el hilo no baje la grande en cada apertura.

   El video se rechaza AQUÍ para poder decirlo con palabras, pero el freno de
   verdad está en la base: un CHECK que no deja entrar nada que no sea imagen.
   Una pantalla se cambia; un CHECK no. */
function mandarFoto(input) {
  var err = $('errChat');
  var f = input && input.files && input.files[0];
  input.value = '';
  if (!f) return;
  if (!/^image\//.test(f.type || '')) {
    return fallo(err, f.type && /^video\//.test(f.type)
      ? 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.'
      : 'Eso no es una foto. Manda una imagen del comprobante.');
  }
  fallo(err, 'Preparando la foto…');
  var lector = new FileReader();
  lector.onerror = function () { fallo(err, 'No pude leer esa foto. Prueba con otra.'); };
  lector.onload = function () {
    var im = new Image();
    im.onerror = function () { fallo(err, 'No pude abrir esa foto. Prueba con otra.'); };
    im.onload = function () {
      var c = document.createElement('canvas');
      c.width = im.naturalWidth || im.width; c.height = im.naturalHeight || im.height;
      if (!c.width || !c.height) return fallo(err, 'Esa foto salió vacía. Prueba con otra.');
      try { c.getContext('2d').drawImage(im, 0, 0); }
      catch (e) { return fallo(err, 'No pude preparar esa foto. Prueba con otra.'); }
      var grande = fotoDeLienzo(c, 900, 0.6);
      var mini = fotoDeLienzo(c, 240, 0.5);
      c.width = c.height = 1;
      if (!grande) return fallo(err, 'Tu teléfono no dejó preparar la foto. Prueba con otra.');
      subirFotoChat(grande, mini, err);
    };
    im.src = lector.result;
  };
  lector.readAsDataURL(f);
}

function subirFotoChat(grande, mini, err) {
  fallo(err, 'Mandando la foto…');
  var pie = String((($('chTexto') || {}).value || '')).trim();
  rpcSesion('chat_foto_sesion', {
    p_canal: CANAL, p_imagen: grande, p_miniatura: mini || null, p_texto: pie || null
  }).then(function (j) {
    if (!j || j.ok !== true) {
      var m = j && j.motivo;
      /* Cada motivo dice algo distinto: «no se pudo» tapando un tope alcanzado
         deja a la persona intentándolo otra vez para siempre. */
      return fallo(err,
        m === 'no_es_imagen' ? 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.'
        : m === 'muy_grande' ? 'Esa foto pesa demasiado. Tómala otra vez con menos calidad.'
        : m === 'tope' ? 'Ya nos mandaste muchas fotos por aquí. Escríbenos y las revisamos.'
        : m === 'muchas' ? 'Espera un momento antes de mandar otra.'
        : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y la mandas.'
        : 'No pude mandar la foto. Vuelve a intentar en un momento.');
    }
    var t = $('chTexto'); if (t) t.value = '';
    err.classList.add('oculto');
    abrirCanal(CANAL);
  }).catch(function () {
    fallo(err, 'No pude mandar la foto. Revisa tu internet y vuelve a intentar.');
  });
}

/* Abrir la grande. Se pide solo cuando alguien toca la miniatura. */
function verFotoChat(id) {
  var caja = $('hilo'); if (!caja) return;
  rpcSesion('chat_foto_sesion_ver', { p_id: Number(id) }).then(function (j) {
    if (!j || j.ok !== true || !j.imagen) return;
    var v = window.open();
    if (v) { v.document.write('<img src="' + j.imagen + '" style="max-width:100%">'); v.document.close(); }
  }).catch(function () {});
}

function enviarChat() {
  var el = $('chTexto'), err = $('errChat');
  if (!el || !err) return;
  /* La revisión del texto es la de chat.js: el mismo largo máximo y el mismo
     motivo en palabras que ve el socio en la app quincenal. */
  var v = CH.revisar(el.value);
  if (!v.ok) return fallo(err, v.motivo);
  err.classList.add('oculto');
  var canal = CANAL, texto = v.texto;
  rpcSesion('chat_escribir_sesion', { p_canal: canal, p_texto: texto }).then(function (j) {
    if (!j || j.ok !== true) {
      return fallo(err, (j && j.motivo) ? j.motivo
        : 'No pude enviar tu mensaje. Vuelve a intentar en un momento.');
    }
    el.value = '';
    abrirCanal(canal);
  }).catch(function (e) {
    var c = causaDe(e);
    fallo(err, c === 'apagado'
      ? 'No pude enviar tu mensaje ahora mismo. Vuelve a intentar en un momento: no se pierde nada.'
      : c === 'sesion'
      ? 'Tu sesión se venció. Vuelve a entrar y mandas tu mensaje de nuevo.'
      : 'No pude enviar tu mensaje. Revisa tu internet y vuelve a intentar.');
  });
}

/* ----------------------------- LÁMINA: PERFIL -----------------------------
   Joan: «perfil, con opciones de cambiar contraseña o usuario u otros».

   EL USUARIO NO SE CAMBIA, y hay que decirlo en vez de ofrecer un botón que no
   existe. El usuario es su celular: de ahí sale el correo interno con el que
   entra, y ese correo es la identidad de la cuenta —hay un disparador en la base
   que impide cambiarlo (20260914). Si el celular cambia de verdad, eso lo mueve
   Joan, porque mover una identidad es justo lo que un estafador quiere poder
   hacer solo. */
function laminaPerfil() {
  var tel = celularDeSesion();
  var v = (SESION && SESION.user && SESION.user.user_metadata &&
           SESION.user.user_metadata.vinculacion) || {};
  var nombre = (FICHA && FICHA.nombre) ||
    [v.nombres, v.apellidos].filter(Boolean).join(' ') || '';
  return '<div class="card">' +
      '<div class="etq">Tu usuario</div>' +
      '<div class="cifra sm">' + esc(tel ? U.telefonoBonito(tel) : '—') + '</div>' +
      (nombre ? '<div class="muted" style="font-size:13.5px">' + esc(nombre) + '</div>' : '') +
      '<div class="ayuda">Tu usuario es tu celular y no se cambia desde aquí: es con lo que te identificamos. Si cambiaste de número, escríbenos por el chat de servicio al cliente y lo movemos nosotros.</div>' +
    '</div>' +
    tarjetaCambiarClave() +
    tarjetaVincular() +
    '<div class="card">' +
      '<button class="btn sec" onclick="salirDeCuenta()">Salir</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarBorrar()">' +
        'Borrar mi cuenta</button>' +
    '</div>';
}

/* El celular de la sesión sale del correo interno, con la MISMA forma que exige
   el servidor (celular_de_sesion, en la base). Si alguien cambiara la forma en
   un lado, acá se vería «—» en vez de un número inventado. */
function celularDeSesion() {
  var correo = (SESION && SESION.user && SESION.user.email) || '';
  var m = String(correo).toLowerCase().match(/^57([0-9]{10})@tugarantia\.net$/);
  return m ? m[1] : '';
}

function tarjetaCambiarClave() {
  return '<div class="card">' +
    '<h3 class="tit">Cambiar mi contraseña</h3>' +
    '<p class="sub">La nueva tiene que tener al menos 8 caracteres.</p>' +
    '<label for="clave1">Contraseña nueva</label>' +
    campoClave('clave1', 'new-password') +
    '<label for="clave2">Escríbela otra vez</label>' +
    campoClave('clave2', 'new-password') +
    '<button class="btn sec arriba" onclick="cambiarClave()">Guardar mi contraseña nueva</button>' +
    '<div id="errClave" class="aviso ambar oculto"></div>' +
    '</div>';
}

function cambiarClave() {
  var a = $('clave1'), b = $('clave2'), err = $('errClave');
  if (!a || !b || !err) return;
  var c1 = a.value || '', c2 = b.value || '';
  if (c1.length < 8) return fallo(err, 'La contraseña nueva necesita al menos 8 caracteres.');
  if (c1 !== c2) return fallo(err, 'Las dos no quedaron iguales. Escríbelas otra vez, sin afán.');
  if (!SESION || !SESION.access_token) return fallo(err, 'Se cerró tu sesión. Entra otra vez y lo hacemos.');
  fallo(err, 'Guardando…');
  /* Se manda SOLO la contraseña. El correo no viaja acá ni por error: es la
     identidad de la cuenta, y la base tiene un disparador que niega el cambio
     —fue por ahí por donde el 14-sep se pudo entrar a la cuenta de otro. */
  fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/user', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + SESION.access_token },
    body: JSON.stringify({ password: c1 })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) {
      if (!r.ok) {
        return fallo(err, (r.j && r.j.msg) || (r.j && r.j.error_description) ||
          'No pude cambiar tu contraseña. Vuelve a intentar en un momento.');
      }
      a.value = ''; b.value = '';
      fallo(err, 'Listo: tu contraseña quedó cambiada. La próxima vez entra con la nueva.');
    })
    .catch(function () { fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.'); });
}

/* JUNTAR EL HISTORIAL VIEJO CON ESTA CUENTA. Es la mitad que faltaba de la
   puerta única: el cliente antiguo se registra como cualquiera y después pega el
   código que ya tenía. La reja está en el servidor (vincular_cuenta): el código
   se compara contra la huella guardada, hay freno por intentos y una ficha solo
   se puede reclamar UNA vez. */
function tarjetaVincular() {
  if (FICHA_ESTADO === 'vinculada') {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<div class="aviso verde" style="margin-top:var(--e3)">Ya está junto con esta cuenta' +
      ((FICHA && FICHA.nombre) ? ', ' + esc(FICHA.nombre) : '') + '.</div></div>';
  }
  return '<div class="card">' +
    '<h3 class="tit">¿Ya eras cliente?</h3>' +
    '<p class="sub">Si te dimos un código antes, pégalo aquí con tu cédula o tu celular y juntamos tu historial con esta cuenta. Se hace una sola vez.</p>' +
    '<label for="vIdent">Tu cédula o tu celular</label>' +
    '<input id="vIdent" type="tel" inputmode="numeric" placeholder="1.234.567.890">' +
    '<label for="vCodigo">El código que te dimos</label>' +
    '<input id="vCodigo" type="text" autocomplete="off" placeholder="XXXX">' +
    '<button class="btn sec arriba" onclick="vincularHistorial()">Juntar mi historial</button>' +
    '<div id="errVinc" class="aviso ambar oculto"></div>' +
    '</div>';
}

function vincularHistorial() {
  var i = $('vIdent'), c = $('vCodigo'), err = $('errVinc');
  if (!i || !c || !err) return;
  if (!i.value.trim()) return fallo(err, 'Nos falta tu cédula o tu celular.');
  if (!c.value.trim()) return fallo(err, 'Nos falta el código que te dimos.');
  fallo(err, 'Buscando…');
  rpcSesion('vincular_cuenta', { p_ident: i.value, p_codigo: c.value }).then(function (j) {
    if (!j || j.ok !== true) {
      /* El servidor contesta con un motivo SOLO cuando decirlo no delata a
         nadie (por ejemplo: esa ficha ya la reclamó otro teléfono). Cuando no lo
         manda, acá no se inventa uno: se dice que no cuadró. */
      return fallo(err, (j && j.motivo) ? j.motivo
        : 'No me cuadran esos datos con ningún historial. Revísalos, y si siguen sin funcionar escríbenos por el chat.');
    }
    fallo(err, j.ya_estaba ? 'Ya estaba junto. Todo en orden.' : 'Listo: tu historial quedó junto con esta cuenta.');
    cargarFicha();
  }).catch(function (e) {
    var c = causaDe(e);
    fallo(err, c === 'apagado'
      ? 'Esta parte todavía no está encendida. Escríbenos y te juntamos el historial nosotros.'
      : c === 'sesion'
      ? 'Tu sesión se venció. Vuelve a entrar y lo intentamos de nuevo.'
      : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  });
}

function salirDeCuenta() {
  /* SE LE AVISA AL SERVIDOR, no solo a la pantalla. Borrar la sesión acá deja el
     token vivo hasta que se venza solo; en un teléfono prestado o perdido, eso
     es una cuenta abierta con el candado puesto por fuera. El aviso se manda y
     no se espera: si no llega, igual salimos — quedarse adentro porque falló la
     red sería lo peor de los dos mundos. */
  if (SESION && SESION.access_token) {
    fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/logout', {
      method: 'POST',
      headers: { apikey: CFG.anon, Authorization: 'Bearer ' + SESION.access_token }
    }).catch(function () {});
  }
  /* Y la copia guardada se borra ANTES que nada: si el aviso al servidor falla
     o la pestaña se cierra en medio, lo que no puede quedar es una sesión que
     una recarga vuelva a abrir. */
  olvidarSesionEnCurso();
  SESION = null; FICHA = null; FICHA_ESTADO = 'sin'; TAB = 'credito';
  CANAL = 'servicio';
  HILO = { canal: null, mensajes: [], estado: 'sin' };
  pintarEntrar();
}

function tarjetaCupo(perfil) {
  if (perfil.cupo_maximo === 0) {
    return '<div class="card laca">' +
      '<div class="etq">Tu cupo</div>' +
      '<div class="cifra">En revisión</div>' +
      '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
        'Todavía estamos revisando tus datos. Te avisamos en el chat de la app en cuanto ' +
        'terminemos y ahí te decimos hasta cuánto puedes pedir. Mientras tanto puedes ' +
        'simular y dejar tu solicitud.</div></div>';
  }
  return '<div class="card laca">' +
    '<div class="etq">Puedes pedir hasta</div>' +
    '<div class="cifra oro">' + COP(perfil.cupo_maximo) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'Socio ' + esc(perfil.nombre.toLowerCase()) + '. ' + esc(perfil.texto) + '</div></div>';
}

/* EL SIMULADOR. Mueve el monto y las cifras cambian; no hay un botón "calcular"
   que devuelva un número que uno ya no sabe de dónde salió. Y las cuotas se ven
   CON FECHA antes de pedir, que es lo que el socio necesita para saber si le
   cuadra con el día que le pagan. */
function tarjetaSimulador(idPerfil) {
  /* 9-sep-2026 — el piso del deslizador sale del perfil más alto y no de un
     número escrito acá. Un socio nuevo tiene cupo cero y aun así puede mover el
     simulador hasta arriba: es justo lo que Joan pidió, «que el cliente sepa
     hasta cuánto puede pedir a futuro». */
  var tope = Math.max(C.PERFILES[idPerfil].cupo_maximo || 0, C.PERFILES.preferente.cupo_maximo);
  /* 16-sep-2026 — EL PLAZO TAMBIÉN SE ELIGE ACÁ, y hasta hoy no se podía.
     La calculadora de la portada deja escoger de 3 a 6 cuotas y cotiza cada
     plazo de verdad… y ese número no viajaba a ninguna parte: adentro no había
     dónde elegirlo, pintarSimulacion llamaba al motor sin `meses` —y el motor
     cae a 6— y pedir() mandaba el 6 fijo. O sea que el visitante escogía tres
     cuotas, memorizaba esa cuota, y la solicitud salía a seis con otra cuota.
     La base sí lo aceptaba desde el 9-sep (play_solicitar valida 1..6): el
     único que tiraba la elección era esta pantalla.
     Los dos deslizadores van FUERA de #simu, que es lo que pintarSimulacion
     reescribe en cada movimiento: un control adentro se repintaría bajo el dedo
     —el defecto que este proyecto ya cometió dos veces. */
  return '<div class="card">' +
    '<h3 class="tit">Simula tu crédito</h3>' +
    '<p class="sub">Mueve el monto y las cuotas, y mira exactamente cuánto pagarías.</p>' +
    '<div class="mando"><div class="cab-mando">' +
      '<label for="rMonto" style="margin:0">Cuánto necesitas</label>' +
      '<b id="rMontoTxt">' + COP(MONTO) + '</b></div>' +
      '<input type="range" id="rMonto" min="100000" max="' + tope + '" step="50000" value="' + MONTO + '" ' +
        'aria-label="Cuánto necesitas" oninput="cambiaMonto(this.value)"></div>' +
    '<div class="mando"><div class="cab-mando">' +
      '<label for="rPlazo" style="margin:0">En cuántas cuotas</label>' +
      '<b id="rPlazoTxt">' + textoCuotas(PLAZO) + '</b></div>' +
      /* El rango sale de las MISMAS constantes que la calculadora de la portada.
         Por debajo del piso de 90 días C.simular lanza y la pantalla se queda en
         blanco; escribir otro número acá sería la misma regla en dos sitios. */
      '<input type="range" id="rPlazo" min="' + CALC_MESES_MIN + '" max="' + CALC_MESES_MAX + '" ' +
        'step="1" value="' + PLAZO + '" aria-label="En cuántas cuotas" ' +
        'oninput="cambiaPlazo(this.value)"></div>' +
    /* 22-sep-2026 — EL MONTO A LA MEDIDA. Joan: «deja que el cliente pida lo
       que el quiera». El deslizador se queda porque es lo cómodo y lo que usa
       casi todo el mundo; esta casilla es para el que necesita una cifra que no
       cae en el paso de 50.000 o que se sale del tope de su cupo. Pedir por
       encima del cupo NO es un error: es una solicitud, y Joan contrapropone.
       El servidor sigue poniendo el piso y el techo de verdad. */
    '<div class="mando"><label for="rMontoLibre">¿Necesitas otra cifra? Escríbela</label>' +
      '<input id="rMontoLibre" type="tel" inputmode="numeric" ' +
        'placeholder="Por ejemplo 1.250.000" oninput="escribeMonto(this)"></div>' +
    /* 22-sep-2026 — EL PLAZO, COMO PETICIÓN Y NO COMO PROMESA. Joan pidió que
       el cliente eligiera «el plazo que quiera». No se puede soltar el
       deslizador: el motor con el que Joan contrapropone LANZA fuera de 1..6 y
       su formulario está clavado al mismo rango, así que una solicitud a 24
       cuotas entraría y él no tendría con qué contestarle.
       Lo que sí se puede es que lo ESCRIBA. La ayuda dice exactamente lo que
       pasa —lo leemos y te contestamos— y no dice que se lo damos, porque eso
       sería prometer un producto que hoy no existe. */
    '<div class="mando"><label for="rPlazoLibre">¿Necesitas más tiempo? Escríbelo</label>' +
      '<input id="rPlazoLibre" type="text" maxlength="40" ' +
        'placeholder="Por ejemplo 10 cuotas" oninput="anotarPlazoLibre(this)">' +
      '<div class="ayuda">Hoy prestamos de 3 a 6 cuotas. Si necesitas otro plazo, ' +
        'escríbelo: lo leemos con tu solicitud y te contestamos por el chat.</div></div>' +
    '<div class="mando"><label for="rNota">¿Para qué lo necesitas? (opcional)</label>' +
      '<input id="rNota" type="text" maxlength="300" ' +
        'placeholder="Surtir el negocio, una deuda, una emergencia…"></div>' +
    '<div id="simu"></div>' +
    '</div>';
}

/* «6 cuotas» y no «6 meses»: el rótulo pregunta por cuotas y la respuesta tiene
   que contestar lo que se preguntó. */
function textoCuotas(n) { return n + (n === 1 ? ' cuota' : ' cuotas'); }

function cambiaMonto(v) {
  MONTO = Number(v) || 100000;
  var t = $('rMontoTxt'); if (t) t.textContent = COP(MONTO);
  var libre = $('rMontoLibre'); if (libre) libre.value = '';
  pintarSimulacion();
}

/* 22-sep-2026 — la cifra escrita a mano. Se limpian los puntos mientras teclea
   (en Colombia se escriben) y se vuelven a poner, que es lo que la gente espera
   al ver un monto. El deslizador NO se mueve a su tope si la cifra se le sale:
   mostraría un número distinto del que la persona acaba de escribir. */
function escribeMonto(el) {
  var d = String(el.value || '').replace(/[^0-9]/g, '').slice(0, 9);
  el.value = d ? Number(d).toLocaleString('es-CO') : '';
  if (!d) return;
  MONTO = Number(d);
  var t = $('rMontoTxt'); if (t) t.textContent = COP(MONTO);
  var r = $('rMonto');
  if (r && MONTO >= Number(r.min) && MONTO <= Number(r.max)) r.value = MONTO;
  pintarSimulacion();
}

function cambiaPlazo(v) {
  PLAZO = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, Number(v) || C.PLAZO_MESES));
  var t = $('rPlazoTxt'); if (t) t.textContent = textoCuotas(PLAZO);
  pintarSimulacion();
}

function pintarSimulacion() {
  var idPerfil = perfilDeSesion(SESION);
  var r = C.simular({ perfil: idPerfil, capital: MONTO, fecha_desembolso: hoyISO(), meses: PLAZO });
  var c = r.puede ? r : r.cotizacion;
  var el = $('simu');
  if (!el) return;

  if (!c) {
    el.innerHTML = '<div class="aviso ambar">' + esc(r.mensaje) + '</div>';
    return;
  }

  var sobreCupo = !r.puede && r.motivo === 'sobre_cupo';
  var sinCupo = !r.puede && r.motivo === 'sin_cupo';

  el.innerHTML =
    '<div class="cifra sm" style="margin-top:var(--e3)">' + COP(c.capital) + '</div>' +
    '<div class="muted" style="font-size:13.5px">' + c.meses + ' cuotas de <b>' +
      COP(c.cuota_tipica) + '</b></div>' +
    '<div class="sep"></div>' +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Total a pagar', COP(c.total_a_pagar)) +
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +

    /* 16-sep-2026 — con cuadroCuotas, igual que las dos calculadoras y que la
       propuesta que manda Joan. Era la CUARTA copia de la misma lista, y la
       única que se habría quedado vieja el día que las otras tres cambiaran. La
       cazó la prueba que exige que las cuotas se pinten en un solo sitio. */
    /* 17-sep-2026 — Y PLEGADA, como las de la puerta. La regla que separa las
       dos cosas en esta pantalla: LO QUE YA DEBES SE VE, LO QUE ESTÁS
       CALCULANDO SE PLIEGA. El crédito activo de arriba deja sus cuotas a la
       vista —son las fechas en que le toca pagar— y este simulador las pliega,
       porque todavía no debe nada. Sin esa regla quedaban dos listas iguales,
       una desplegada y otra no, una encima de la otra, y eso se lee como un
       error de pintado. */
    plegableCuotas(c.cuotas, 'simulador') +

    /* LA DIVULGACIÓN, AQUÍ Y NO EN UN RINCÓN. Google la exige "en el mismo lugar
       donde el usuario solicita el crédito", y además es lo correcto: el precio
       completo justo antes del botón, no en una pantalla de términos que nadie
       abre. El texto sale de cumplimiento.js, el mismo que va en la ficha. */
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      /* Tambien con el credito que tiene en pantalla: esta letra va justo debajo
         de SU cotizacion, asi que un ejemplo de otro monto seria el mismo
         defecto que en la calculadora de la portada. */
      esc(divulgacionHoy({ capital: c.capital, meses: c.meses })) + '</div>' +

    (sobreCupo
      ? '<div class="aviso ambar">Estás pidiendo más que tu cupo (' + COP(r.cupo_maximo) + '). ' +
        'Puedes dejar la solicitud igual: la revisamos y te respondemos.</div>'
      : '') +
    (sinCupo
      ? '<div class="aviso ambar">Todavía no tienes cupo asignado. Puedes dejar tu ' +
        'solicitud y la revisamos.</div>'
      : '') +

    '<button class="btn arriba" onclick="pedir()">' +
      (r.puede ? 'Pedir ' + COP(c.capital) : 'Dejar mi solicitud') + '</button>' +
    '<div id="errPedir" class="aviso ambar oculto"></div>';
}

/* LA LETRA DEL PRÉSTAMO CON GARANTÍA ES OTRA, y tiene que serlo. Durante unas
   horas del 14-sep esta calculadora imprimió «Tasa efectiva anual 26,82%» y
   debajo, como letra obligatoria, la del otro producto: «Tasa efectiva anual
   MÁXIMA: 23,99%». La única frase de la app que existe para no afirmar nada
   falso estaba afirmando que el máximo era menor que el precio de tres
   renglones arriba. Lo vio el navegador, no las pruebas. */
/* 17-sep-2026 — Y LA CACHÉ VA POR COMBINACIÓN, igual que la del otro producto y
   por el mismo motivo. Acá había UNA sola entrada, así que aunque
   divulgacionRespaldado aprendiera a seguir el deslizador, la primera respuesta
   se quedaría pegada y el arreglo no habría servido de nada: es el mismo error
   que se corrigió el 15-sep en DIVULGACION, unas líneas más abajo.

   La caché no sobra —esto se llama cien veces por arrastre, porque la tarjeta
   entera se repinta en cada movimiento del dedo y la letra vive DENTRO de la
   tarjeta— pero ahora guarda un texto por cada monto y plazo.

   EL VACÍO NO SE CACHEA, y es la decisión del 9-sep escrita a mano. Antes se
   cumplía de casualidad: la cadena vacía es falsa, así que `if (!DIVULGACION_G)`
   volvía a preguntar sola. Con un objeto por llave esa casualidad se pierde, y
   lo que está en juego no es poco: si la primera llamada cae en un día sin
   certificación de usura vigente, la letra que Google exige al lado de todo
   precio desaparecería el resto de la sesión, sin decir nada. */
var DIVULGACION_G = null;
function divulgacionGarantiaHoy(muestra) {
  var K = window.Cumplimiento;
  if (!K || !K.divulgacionRespaldado) return '';
  /* Y LA LLAVE EMPIEZA POR LA FECHA. Medido el 17-sep con la fecha fijada a
     mano: en un banco abierto el 17 —día en que este producto SÍ se puede
     ofrecer— y movido al 20 —día en que NO, porque su peor plazo se pasa del
     techo de usura—, la tarjeta seguía cotizando, porque la respuesta del 17
     estaba guardada y nadie volvía a preguntar. Era el guardián del techo
     apagado por una caché.

     No es hipotético ni raro: entre septiembre y noviembre de 2026 hay 38 días
     de 91 en que este producto no se puede anunciar, y son rachas de seis días
     seguidos. Basta una pestaña abierta cruzando la medianoche —o una app
     instalada que el sistema despierta— para caer en el día equivocado. El
     artículo 305 no distingue entre anunciar y cobrar.

     Cuesta una concatenación y cierra el agujero entero: cambiado el día,
     ninguna llave de ayer coincide y todo se vuelve a preguntar. */
  var m = muestra || null;
  var llave = hoyISO() + '|' + (m ? (m.capital + '|' + m.meses) : 'ejemplo');
  if (DIVULGACION_G && DIVULGACION_G[llave]) return DIVULGACION_G[llave];
  var d = K.divulgacionRespaldado(hoyISO(), m);
  var texto = (d && d.puede) ? d.texto : '';
  if (texto) {
    if (!DIVULGACION_G) DIVULGACION_G = {};
    DIVULGACION_G[llave] = texto;
  }
  return texto;
}
/* Y la pregunta que hay que hacerse antes de imprimir la primera cifra de este
   producto, igual que hayQueCotizar para el otro. */
function hayQueCotizarGarantia() { return !!divulgacionGarantiaHoy(); }

var DIVULGACION = null;
/* 9-sep-2026 — EL VACÍO NO SE CACHEA. Antes, si la primera llamada caía en un
   día sin certificación de usura vigente, esto guardaba '' y lo devolvía el
   resto de la sesión sin decir nada. La letra que Google exige al lado de todo
   precio desaparecía sola y en silencio — y con una calculadora que se repinta
   en cada movimiento del dedo, esa llamada ocurre cien veces por visita.
   Ahora el vacío se vuelve a preguntar, y quien pinta cifras tiene que
   comprobar que hay texto ANTES de pintar la primera (ver hayQueCotizar). */
/* 15-sep-2026 — EL EJEMPLO ES EL DEL CLIENTE, Y LA CACHE VA POR COMBINACION.
   Joan lo vio: con el deslizador en ocho millones, la pantalla decia «En total
   vas a pagar $8.513.600» y tres centimetros mas abajo «Ejemplo: por $500.000
   (...) un total de $532.100». Dos juegos de cifras juntos y nada que dijera
   cual era el suyo.

   La cache sigue existiendo —esto se llama cien veces por arrastre— pero ahora
   guarda una entrada POR COMBINACION de monto y plazo. Con una sola entrada,
   hacer que el ejemplo siguiera al deslizador no habria servido de nada: la
   primera respuesta se quedaria pegada, que es exactamente el defecto que
   habia. */
function divulgacionHoy(muestra) {
  var K = window.Cumplimiento;
  if (!K) return '';
  /* 17-sep-2026 — LA LLAVE EMPIEZA POR LA FECHA, igual que la del otro
     producto y por la misma razón, que acá es más callada pero igual de mala:
     la frase «Tasa máxima legal vigente en Colombia: X%» sale de la tabla de
     topes, que se vence el último día de cada mes por diseño. Sin la fecha en
     la llave, una sesión abierta cruzando esa medianoche sigue publicando el
     techo del mes pasado como vigente — una afirmación falsa en el único texto
     de la app que existe para no afirmar ninguna. */
  var m = muestra || null;
  var llave = hoyISO() + '|' + (m ? (m.capital + '|' + m.meses) : 'ejemplo');
  if (DIVULGACION && DIVULGACION[llave]) return DIVULGACION[llave];
  var d = K.divulgacion(hoyISO(), m);
  var texto = (d && d.puede) ? d.texto : '';
  /* El vacio NO se cachea (ver el comentario de arriba: el 9-sep se perdio la
     letra obligatoria toda una sesion por guardar ''). */
  if (texto) {
    if (!DIVULGACION) DIVULGACION = {};
    DIVULGACION[llave] = texto;
  }
  return texto;
}
/* La pregunta que toda pantalla con precios tiene que hacerse primero. Sin
   divulgación no se cotiza: es el artículo 305 del Código Penal por un lado y
   la ficha de Google por el otro, y la app ya estuvo a punto de publicar
   «tasa máxima legal: 0,00%» una vez (4-sep-2026). */
function hayQueCotizar() { return !!divulgacionHoy(); }

function fmtFecha(iso) {
  var p = String(iso).split('-');
  var mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}

function pedir() {
  var err = $('errPedir');
  err.classList.add('oculto');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la solicitud no ' +
      'se puede enviar. Esto es una versión en construcción.');
  }
  fallo(err, 'Enviando…');
  /* La solicitud NO es un crédito: entra a la bandeja de Joan y él responde. La
     pantalla lo dice con esas palabras para que nadie salga creyendo que ya le
     desembolsaron. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/play_solicitar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', apikey: CFG.anon,
      Authorization: 'Bearer ' + ((SESION && SESION.access_token) || CFG.anon)
    },
    /* El plazo que el socio escogió, no el del producto: play_solicitar acepta
       de 1 a 6 y lo guarda en plazo_meses desde el 9-sep. Mandar el fijo era
       tirar su elección en el último metro.
       Y desde el 22-sep va la nota: es lo que Joan lee en su CRM antes de
       contraproponer, en las palabras del cliente. */
    /* El plazo pedido viaja PEGADO A LA NOTA y no en p_meses: p_meses es lo que
       se va a registrar y tiene que ser un plazo que exista. Lo que el cliente
       pide de más es información para Joan, no una instrucción para la base. */
    body: JSON.stringify({ p_capital: MONTO, p_meses: PLAZO,
                           p_nota: notaConPlazo() })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      /* La función contesta {ok:false} con HTTP 200 cuando algo no cuadra o el
         freno de solicitudes está lleno: decir «recibimos» ahí sería mentir.
         22-sep-2026 — y desde hoy trae MOTIVO. Antes los cinco casos salían con
         la misma frase y el que se pasaba del techo por un cero de más se
         quedaba tocando el botón sin saber qué corregir. */
      if (!j || j.ok !== true) {
        var m = j && j.motivo;
        return fallo(err,
          /* Las dos cifras las dice el SERVIDOR, en la misma respuesta que el
             motivo. Escribirlas aquí de respaldo sería tener el piso y el techo
             en dos sitios, y el día que Joan mueva uno la app diría el otro.
             Si no vinieran, se dice lo que pasó sin inventar la cifra. */
          m === 'minimo' ? (j.minimo ? 'El mínimo que podemos estudiar es ' + COP(j.minimo) + '. Sube la cifra y lo vemos.'
                                     : 'Esa cifra se nos queda corta. Sube un poco y lo vemos.')
          : m === 'maximo' ? (j.maximo ? 'Por aquí llegamos hasta ' + COP(j.maximo) + '. Si necesitas más, escríbenos en el chat y lo hablamos.'
                                       : 'Esa cifra se nos sale por arriba. Escríbenos en el chat y lo hablamos.')
          : m === 'plazo' ? 'Escoge entre 1 y 6 cuotas y volvemos a intentar.'
          : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y tu solicitud sale al instante.'
          : m === 'muchas' ? 'Ya nos dejaste varias solicitudes hoy. Las tenemos todas; dale un rato y te respondemos en el chat.'
          : 'No pudimos recibir la solicitud ahora. Espera unos minutos y vuelve a intentar.');
      }
      pintarPedido();
    })
    .catch(function () {
      fallo(err, 'No pude enviar la solicitud. Revisa tu internet y vuelve a intentar.');
    });
}

/* Junta lo que el cliente escribió: el plazo que pidió, si pidió otro, y para
   qué lo quiere. Va todo en pedido_nota, que Joan lee en su CRM. */
function notaConPlazo() {
  var plazo = String((($('rPlazoLibre') || {}).value || '')).trim();
  var nota = String((($('rNota') || {}).value || '')).trim();
  var partes = [];
  if (plazo) partes.push('Pide el plazo: ' + plazo);
  if (nota) partes.push(nota);
  return partes.join(' · ').slice(0, 300);
}
/* Se anota mientras escribe, como el resto del formulario: quien lo teclea y
   pierde la pestaña no lo vuelve a escribir. */
function anotarPlazoLibre(el) {
  try { sessionStorage.setItem('play_plazo_libre', String(el.value || '')); } catch (e) {}
}

function pintarPedido() {
  $('titulo').textContent = 'Solicitud enviada';
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Recibimos tu solicitud.</b></div>' +
      /* El plazo que se MANDÓ, no el del producto: decirle «a 6 meses» a quien
         pidió tres es contestarle una solicitud que no hizo. */
      '<p class="sub" style="margin-top:var(--e4)">Pediste ' + COP(MONTO) + ' en ' +
      textoCuotas(PLAZO) + '. <b>Todavía no es un crédito:</b> la revisamos y te ' +
      'respondemos <b>en el chat de la app</b>, en la pestaña Chat. Si la aprobamos, ' +
      'ahí mismo te decimos cuándo recibes la plata.</p>' +
      '<button class="btn arriba" onclick="pintarCuenta()">Volver a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* EL HISTORIAL. Sale de la sesión. Si no hay nada, se distingue "no tienes
   créditos todavía" de "no pudimos cargarlos": son cosas distintas y confundirlas
   le haría creer al socio que perdió su historial. */
function tarjetaHistorial() {
  var creditos = historialDeSesion(SESION);
  if (!SESION) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">No pudimos cargar tu historial. Vuelve a entrar en un momento.</p></div>';
  }
  if (!creditos.length) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">Todavía no tienes créditos con nosotros. Cuando pidas el primero, ' +
      'aquí vas a ver cada cuota y cada pago.</p></div>';
  }
  return '<div class="card"><div class="etq">Tu historial</div>' +
    creditos.map(function (cr) {
      var pagadas = (cr.cuotas || []).filter(function (q) { return q.pagada; }).length;
      return '<div style="margin-top:var(--e4)">' +
        '<b>' + COP(cr.capital) + '</b> a ' + cr.meses + ' meses' +
        '<div class="ayuda">' + esc(fmtFecha(cr.fecha_desembolso)) + ' · ' +
          pagadas + ' de ' + (cr.cuotas || []).length + ' cuotas pagadas' +
          (cr.pagado ? ' · <b>terminado</b>' : '') + '</div>' +
        /* 16-sep-2026 — con cuadroCuotas, que ya sabe pintar el ✓ de lo pagado.
           Era la quinta copia de la misma lista en este archivo. */
        cuadroCuotas(cr.cuotas) +
        '</div>';
    }).join('') +
    '<button class="btn sec sm arriba" onclick="imprimirCertificado()">' +
      'Descargar mi certificado de pagos</button>' +
    '</div>';
}

/* El certificado y el contrato: una ventana imprimible que el teléfono guarda
   como PDF con "Imprimir → Guardar como PDF". Sin librerías, sin subir nada a
   ningún servidor, y funciona igual en Android y en iPhone. */
function imprimirCertificado() {
  var creditos = historialDeSesion(SESION);
  var nombre = (SESION && SESION.user && SESION.user.user_metadata &&
                SESION.user.user_metadata.vinculacion &&
                (SESION.user.user_metadata.vinculacion.nombres + ' ' +
                 SESION.user.user_metadata.vinculacion.apellidos)) || 'Socio';
  var filas = creditos.map(function (cr) {
    return '<h3>' + COP(cr.capital) + ' a ' + cr.meses + ' meses · ' +
      esc(fmtFecha(cr.fecha_desembolso)) + '</h3><table>' +
      (cr.cuotas || []).map(function (q) {
        return '<tr><td>Cuota ' + q.n + '</td><td>' + esc(fmtFecha(q.fecha)) + '</td>' +
          '<td>' + COP(q.total) + '</td><td>' + (q.pagada ? 'Pagada' : 'Pendiente') + '</td></tr>';
      }).join('') + '</table>';
  }).join('');

  var w = window.open('', '_blank');
  if (!w) return;
  w.document.write(
    '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Certificado de pagos · Tu Garantía</title><style>' +
    'body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#111}' +
    'h1{font-size:20px} h3{font-size:15px;margin-top:24px}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}' +
    'td{padding:6px 4px;border-bottom:1px solid #ddd}' +
    '.pie{margin-top:34px;font-size:12px;color:#666;line-height:1.6}' +
    '</style></head><body>' +
    '<h1>Certificado de pagos</h1>' +
    '<p>' + esc(nombre) + '<br>Expedido el ' + esc(fmtFecha(hoyISO())) + '</p>' +
    (filas || '<p>Sin créditos registrados.</p>') +
    '<div class="pie">Tu Garantía · Este documento refleja lo registrado en la ' +
      'plataforma a la fecha de expedición.</div>' +
    '</body></html>');
  w.document.close();
  w.focus();
  w.print();
}

/* ============================== ARRANQUE ============================== */
(function () {
  /* El guardián de «no llegaron las reglas» se mudó ARRIBA del todo, junto a los
     globales: acá abajo ya era tarde. Ver el comentario de allá. */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).catch(function () {});
    });
  }
  /* 8-sep-2026 — #registro abre el formulario de una: es adonde manda el botón
     «Registrarme» de app/socio.html, que es el único enlace que Joan reparte.
     Quien llega así es un socio nuevo del quincenal: no tiene por qué ver la
     portada del producto a 6 meses ni un login con contraseña que no es suyo. */
  /* PRIMERO SE PINTA EL NEGOCIO, DESPUÉS EL ADORNO — 16-sep-2026, y el orden es
     la corrección de verdad.
     El rayo se encendía ANTES que la pantalla, así que cualquier tropiezo suyo
     se llevaba por delante lo único que importa: esta página es un <div> vacío
     que solo existe cuando el JavaScript la llena. Pasó de verdad —getContext
     devolviendo null en modo privado, y medirLienzo llamando setTransform sobre
     null— y el resultado medido en el banco fue CERO letras: ni calculadora, ni
     registro, ni forma de entrar. Invertido el orden, un adorno roto es un
     adorno roto y nada más. */
  /* 17-sep-2026 — DÓNDE CAE LA PERSONA AL ABRIR, EN ORDEN, Y CADA RAMA TIENE SU
     MOTIVO. Esto estaba mal y era el defecto que Joan reportó:

       «el cliente toma la foto de la cédula y la página lo devuelve y
        nuevamente tiene que ingresar la contraseña»

     Lo que pasaba, reproducido recargando el banco de pruebas en el paso 2:
     la cámara del sistema hace que un teléfono barato descarte la pestaña y la
     recargue. Al volver, el arranque solo miraba si la dirección terminaba en
     #registro — y nadie la ponía nunca —, así que caía en la portada, que es
     donde está la caja «¿Ya abriste tu cuenta? Entra con tu celular y la
     contraseña». El paso SÍ estaba guardado desde el 9-sep; nadie lo leía.

     Y había un segundo agujero, del mismo tamaño: la sesión no se guardaba en
     ninguna parte, así que el socio que YA había entrado también volvía al
     login con solo recargar.

     El orden manda:
     1. QUIEN YA TIENE SESIÓN vuelve a su cuenta. Tener cuenta gana sobre
        cualquier formulario a medias que haya quedado por ahí.
     2. QUIEN IBA A MITAD DEL REGISTRO vuelve a su paso. Se pregunta por el paso
        guardado Y por la dirección: el paso cubre la recarga de la cámara, la
        dirección cubre el enlace que Joan reparte (…/play/#registro) y el caso
        en que el navegador reabre sin el sessionStorage.
     3. EL RESTO ve la portada. */
  var sesionGuardada = leerSesionEnCurso();
  var veniaDelRegistro = hayPasoGuardado();
  var reciente = cuentaRecienCreada();
  if (sesionGuardada) {
    pintarCuenta(sesionGuardada);
  } else if (reciente && !veniaDelRegistro) {
    /* 21-sep-2026 — la cuenta ya nació y la sesión se fue con la relanzada:
       se dice, con el celular puesto, en vez de mandarlo a llenar nueve pasos
       para que al final le digan que ya existe. */
    pintarEntrar();
    avisarCuentaCreada(reciente);
  } else if (veniaDelRegistro || location.hash === '#registro') {
    var donde = veniaDelRegistro ? leerPaso() : 0;
    pintarRegistro(donde);
    /* El aviso solo cuando de verdad hubo una interrupción: quien llega por el
       enlace, al paso 1 y sin nada guardado, no tiene ningún susto que
       explicarle. */
    if (veniaDelRegistro && donde > 0) {
      var aviso = $('errReg');
      if (aviso) {
        aviso.classList.remove('oculto');
        /* 17-sep-2026 — NI SE INVENTA LA CAUSA NI SE PROMETE DE MÁS.
           Decía «tu teléfono cerró la página mientras usabas la cámara» y
           «no perdiste nada». Lo primero es una causa que la página no conoce
           —la recarga puede ser el botón de recargar, quedarse sin memoria en
           otro paso, o el navegador reabriendo la pestaña— y lo segundo no
           siempre es verdad: lo que se estaba tecleando sin haber tocado
           «Continuar» sí se perdía. Lo de teclear ya se guarda mientras se
           escribe (ver anotarCampo), así que la promesa hoy se cumple; la
           causa sigue sin saberse, y no se afirma.
           Y va el botón de salida: en un teléfono prestado, quien abre la
           página se encuentra el registro de otro y tiene que poder soltarlo. */
        aviso.innerHTML = 'La página se volvió a abrir. Seguimos en el paso donde ibas, ' +
          'con lo que ya habías escrito' +
          ((hayFotoLista('cedula_reverso') || hayFotoLista('cedula_frente')) ? ' y las fotos que ya habías tomado' : '') + '.' +
          '<button class="btn sec sm" style="margin-top:var(--e3)" ' +
          'onclick="empezarDeNuevo()">No soy yo · empezar de cero</button>';
      }
    } else if (!veniaDelRegistro && (REGISTRO.celular || REGISTRO.nombres)) {
      /* Un borrador de hace días —o de otro— abriéndose por el enlace: se
         empieza por el principio y se da la salida, en vez de meterlo en un
         formulario a medias que no es suyo. */
      var viejo = $('errReg');
      if (viejo) {
        viejo.classList.remove('oculto');
        viejo.innerHTML = 'Encontramos un registro a medias en este teléfono, de hace rato. ' +
          'Si es tuyo, sigue desde aquí.' +
          '<button class="btn sec sm" style="margin-top:var(--e3)" ' +
          'onclick="empezarDeNuevo()">No soy yo · empezar de cero</button>';
      }
    }
  } else pintarEntrar();

  /* Y el cinturón, además del orden: el día que el rayo falle por otra cosa que
     nadie previó, que se quede en la consola y no en la pantalla del cliente. */
  try { iniciarRayos(); } catch (e) {
    if (window.console && console.warn) console.warn('el rayo no arrancó:', e);
  }
})();
