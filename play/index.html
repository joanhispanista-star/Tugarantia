<!-- ============================================================================
     LA APP PUBLICABLE — Etapa 2 (entrar y registrarse) + parte de la 4 (catálogo)

     QUÉ ES ESTO Y QUÉ NO ES. Esta es la PUERTA PÚBLICA del negocio (decisión
     del 24-ago-2026): el desconocido se registra solo, ve la calculadora del
     producto a 6 meses, y su registro cae al apartado «Registrados» del CRM.
     Cuando Joan lo aprueba y le manda su código de membresía, entra a la app
     REAL (app/socio.html) — que es OTRA dirección, a propósito: la política
     de Play prohíbe desbloquear el quincenal dentro de esta app, así que la
     frontera es estructural, no una promesa. También es la candidata a Play
     cuando la tienda se retome. Tiene UN solo producto: 6 meses en cuotas,
     por debajo del techo de usura del mes.

     18-ago-2026 — PLAY QUEDÓ DESCARTADO COMO CANAL (ver android/LEEME.md). El
     APK se reparte directo por enlace y envuelve app/socio.html con alcance en
     todo /Tugarantia/: hoy esta página abriría DENTRO de la app instalada, no
     fuera. La carpeta queda lista por si la tienda se retoma; en ese caso el
     alcance vuelve a /Tugarantia/play/ y lo de abajo vuelve a estar en presente.

     Lo que sigue siendo cierto de un TWA: no tiene versiones que colar — el
     .aab es una cáscara que abre este sitio, y el contenido cambia en el
     instante en que se hace push. La app aprobada SERÍA este archivo, siempre.
     Por eso la frontera tiene que ser estructural —una carpeta y un alcance—
     y no una promesa.
     ========================================================================= -->

<div class="cab laca"><div class="wrap">

<script src="../app/creditos.js"></script>

<!-- 14-sep-2026 — el motor del préstamo con garantía y el lector de la ficha.
     Son los MISMOS que usa el CRM de Joan: la calculadora de la garantía que
     ve el cliente y la cuota que le cobra Joan salen de la misma función.
     EL MOTOR VA ANTES DE cumplimiento.js y no después: aquél lo toma de la
     ventana en cuanto se carga, para poder armar la letra obligatoria del

<script src="../app/ficha.js"></script>

<!-- El hilo del chat se pinta con el mismo código que en la app quincenal: la
     marca de «esto te lo contestó una máquina» y el «leído» son reglas, no
     adorno, y no se escriben dos veces. -->
<script src="../app/ruleta.js"></script>
<script src="../app/chat.js"></script>
<script>
'use strict';

var VERSION_PLAY = '2026-09-16';

/* La conexión con la nube VIENE PUESTA DE FÁBRICA — 24-ago-2026, la misma
   decisión que salvó a socio.html el 20-ago: con el cajón vacío, cada aparato
   nuevo mostraba «versión en construcción» y nadie podía registrarse. La llave
   publishable es PÚBLICA POR DISEÑO (lo que protege los datos es el RLS de la
   base, no esconder esta cadena); una guardada a mano en play_cfg no se pisa. */
var CFG = {
  url: 'https://wnsioekvjspwtghbodbg.supabase.co',
  anon: 'sb_publishable_uWFyReBljFSh7l0KYkWmmg_Swo4SOxj'
};
try {
  var g = JSON.parse(localStorage.getItem('play_cfg') || 'null');
  if (g && g.url && g.anon) CFG = g;
} catch (e) {}

var C = window.CreditosPublicables;
var U = window.CuentaSocio;
var M = window.MotorReglas;
var FS = window.FichaSocio;
var CH = window.ChatTuGarantia;

/* EL GUARDIÁN VA AQUÍ ARRIBA, Y ESO ES TODO EL ARREGLO — 16-sep-2026.
   Estaba al final, dentro del arranque, y por eso NUNCA SE EJECUTABA cuando
   hacía falta: unas líneas más abajo hay constantes de primer nivel que leen
   estos módulos —CALC_MAX lee C.PERFILES, GCALC lee M.MONTO_MINIMO_RESPALDADO,
   PLAZO lee C.PLAZO_MESES— y si uno de los <script src> no llegó, la primera de
   ellas lanza y se lleva el bloque entero. El arranque no corre, el aviso no se
   pinta, y la puerta pública queda en CERO letras. Medido en el banco.
   Y no es hipotético: este mismo proyecto ya vio a su service worker contestar
   `index.html` a una petición de `.js` (ver sw.js, v19, 28-ago-2026).
   El `throw` es a propósito: el mensaje ya está en pantalla y lo que sigue no
   tiene con qué funcionar. Mejor parar acá que pintar media página rota. */
if (!C || !U || !M || !FS) {
  document.body.innerHTML = '<div class="wrap"><div class="aviso ambar" style="margin-top:40px">' +
    'No pude cargar las reglas del crédito. Revisa tu internet y vuelve a abrir la página.' +
    '</div></div>';
  throw new Error('play/: faltan las reglas del crédito');
}
var $ = function (id) { return document.getElementById(id); };
var COP = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CO'); };
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
}
function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function pct(x) { return (x * 100).toFixed(2).replace('.', ',') + '%'; }

/* El borrador del registro vive en el teléfono mientras se llena: son 26 campos
   y nadie los completa de una sentada sin que le entre una llamada. Se borra al
   enviarlo. NUNCA guarda la contraseña — esa no toca localStorage ni un
   milisegundo. */
var LLAVE_BORRADOR = 'play_registro_borrador';
function leerBorrador() {
  try { return JSON.parse(localStorage.getItem(LLAVE_BORRADOR) || '{}') || {}; }
  catch (e) { return {}; }
}
function guardarBorrador(d) {
  var limpio = {};
  Object.keys(d).forEach(function (k) { if (k !== 'clave' && k !== 'clave2') limpio[k] = d[k]; });
  try { localStorage.setItem(LLAVE_BORRADOR, JSON.stringify(limpio)); } catch (e) {}
}

/* ------------------------------------------------- POR DÓNDE IBA (9-sep-2026)
   Sin esto, el que abre la cámara del sistema y vuelve con la pestaña recargada
   aparece en el paso 1 de 9, con nueve pasos por delante otra vez. Es el defecto
   que Joan describió como «el sistema los devuelve y no pueden continuar», y
   está reproducido: recargar la página en el paso 2 devuelve al 1.
   Va aparte del borrador porque el borrador viaja entero a la nube como
   los datos del registro, y el número de paso no tiene nada que hacer ahí. */
var LLAVE_PASO = 'play_registro_paso';
function guardarPaso(n) { try { sessionStorage.setItem(LLAVE_PASO, String(n)); } catch (e) {} }
function leerPaso() {
  try { var n = parseInt(sessionStorage.getItem(LLAVE_PASO), 10); return isNaN(n) ? 0 : n; }
  catch (e) { return 0; }
}
function olvidarPaso() { try { sessionStorage.removeItem(LLAVE_PASO); } catch (e) {} }

/* ------------------------------------------------- LA CONTRASEÑA, MIENTRAS DURA
   sessionStorage y NO localStorage, y la diferencia importa: sessionStorage vive
   solo en ESTA pestaña y se borra sola al cerrarla —sobrevive la recarga, que es
   justo lo que hacía falta—, mientras que localStorage se quedaría en el
   teléfono hasta que alguien lo limpie. Se borra en cuanto la cuenta existe.
   Sigue en pie la regla vieja: la contraseña NO toca localStorage ni un
   milisegundo, y no viaja nunca dentro del borrador. */
var LLAVE_CLAVE = 'play_clave_en_curso';
function guardarClaveEnCurso(c) { try { sessionStorage.setItem(LLAVE_CLAVE, String(c || '')); } catch (e) {} }
function leerClaveEnCurso() { try { return sessionStorage.getItem(LLAVE_CLAVE) || ''; } catch (e) { return ''; } }
function olvidarClaveEnCurso() { try { sessionStorage.removeItem(LLAVE_CLAVE); } catch (e) {} }

var VISTA = 'entrar';
var REGISTRO = leerBorrador();
var PASO = 0;

/* ====================== EL CATÁLOGO, QUE SE VE SIN CUENTA ======================
   A propósito: Joan pidió que el costo real se vea desde el primer momento, y
   una app de crédito que esconde el precio hasta que te registras es justo lo
   que la política de Play mira con lupa. Acá el número está antes de pedir nada.
   Se muestra el perfil `nuevo`, que es el que le toca a quien todavía no entra. */
/* 9-sep-2026 — SE FUE tarjetaCatalogo. Pintaba un ejemplo fijo de 500.000 con
   su cifra grande, y desde hoy arriba está la calculadora, que hace lo mismo
   pero con el monto que la persona elige. Las dos juntas eran dos precios
   distintos del mismo producto en la misma pantalla, y quien mira no sabe cuál
   es el suyo. Su código está en el historial (commit anterior a la vitrina). */

/* `fila` vivía pegada a la tarjeta que se fue y se la llevó por delante: la
   página quedó en blanco con «fila is not defined», que es exactamente el modo
   de fallar de este archivo —todo se pinta con JavaScript sobre un div vacío—.
   La prueba que compila play/ NO lo vio, porque compilar no es ejecutar. Lo vio
   el navegador. */
function fila(k, v) {
  return '<div class="fila"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
}

function pintarEntrar() {
  VISTA = 'entrar';
  $('titulo').textContent = 'Tu crédito a 6 meses';
  /* 25-ago-2026 — EL REGISTRO VA PRIMERO Y EL LOGIN DESPUÉS. Esta es la puerta
     del DESCONOCIDO: casi todo el que llega aquí no tiene cuenta todavía, y
     tener de primero un formulario de contraseña le dice, sin decirlo, que
     esto no es para él. El orden es el mensaje. */
  $('cuerpo').innerHTML =
    /* LA CALCULADORA VA PRIMERO Y ES LO MÁS GRANDE. El visitante saca algo útil
       en los primeros cinco segundos —cuánto le costaría— sin cuenta, sin
       registro y sin pedirle nada a cambio. Todo lo demás cuelga de ahí. */
    tarjetaCalculadora() +
    /* Y debajo, adónde se llega pagando: el crédito con garantía. Va acá y no
       escondido detrás del login porque es lo que explica para qué sirve pagar
       en fecha, y porque Joan pidió que TODOS la vieran. */
    tarjetaCalcGarantia() +
    '<div class="card">' +
      /* 14-sep-2026 — UNA SOLA PUERTA. Antes este título decía «¿Eres nuevo?»,
         y el cliente de toda la vida leía eso y se iba a buscar otra entrada que
         ya no existe. Abre su cuenta igual que cualquiera y junta su historial
         desde adentro, en Perfil. */
      '<h3 class="tit">Abre tu cuenta</h3>' +
      '<p class="sub"><b>No necesitas que nadie te presente.</b> Te tomará unos minutos: ' +
        'te pedimos los datos con los que evaluamos el crédito, y cada uno te decimos ' +
        'para qué es. Después revisamos tu solicitud y te escribimos por WhatsApp.</p>' +
      '<p class="sub"><b>¿Ya eras cliente nuestro?</b> Ábrela igual: adentro, en ' +
        'Perfil, pegas el código que te dimos y tu historial queda junto con tu ' +
        'cuenta.</p>' +
      '<div class="muted" style="font-size:13px;margin-top:var(--e3)">' + esc(TEXTOS.empujon_visitante) + '</div>' +
      '<button class="btn arriba" onclick="pintarRegistro(0)">Abrir mi cuenta</button>' +
    '</div>' +
    tarjetaRuleta() +
    tarjetaRecorrido() +
    '<div class="card">' +
      '<h3 class="tit">¿Ya abriste tu cuenta?</h3>' +
      '<p class="sub">Entra con tu celular y la contraseña que tú pusiste.</p>' +
      '<label for="inTel">Tu celular</label>' +
      '<input id="inTel" type="tel" inputmode="numeric" autocomplete="username" ' +
        'placeholder="300 111 2233" oninput="tecleaTel(this)">' +
      '<label for="inClave">Tu contraseña</label>' +
      '<input id="inClave" type="password" autocomplete="current-password" placeholder="••••••••">' +
      '<button class="btn sec arriba" id="btnEntrar">Entrar</button>' +
      '<div id="errEntrar" class="aviso ambar oculto"></div>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="olvide()">Olvidé mi contraseña</button>' +
    '</div>' +
    /* La caja del instalador nace vacía y se llena sola SI el navegador avisa
       que de verdad puede instalar. Un botón que promete instalar donde no se
       puede es la clase de mentira chica que este proyecto no se permite. */
    '<div id="cajaInstalar">' + tarjetaInstalarPlay() + '</div>' +
    plegable('quePasa', TEXTOS.confianza_titulo, TEXTOS.confianza) +
    plegable('laHistoria', TEXTOS.historia_titulo, TEXTOS.historia) +
    pie();
  $('btnEntrar').addEventListener('click', entrar);
  $('inClave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  /* La rueda se enciende DESPUES de que el documento ya tiene el lienzo. Y va
     dentro de un try: si la ruleta revienta, la puerta publica sigue en pie —
     es la leccion del 16-sep, cuando un adorno dejo la pantalla en blanco. */
  try { arrancarRuleta(); }
  catch (e) { if (window.console && console.warn) console.warn('la ruleta no arranco:', e); }
}

function tecleaTel(el) {
  var t = U.normalizarTelefono(el.value);
  if (t) el.value = U.telefonoBonito(t);
}

function entrar() {
  var tel = U.normalizarTelefono($('inTel').value);
  var clave = $('inClave').value || '';
  var err = $('errEntrar');
  err.classList.add('oculto');
  if (!tel) return fallo(err, 'Escribe tu celular completo: son 10 números y empiezan por 3.');
  if (!clave) return fallo(err, 'Escribe tu contraseña.');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que aún no se puede entrar. ' +
      'Esto es una versión en construcción.');
  }
  fallo(err, 'Conectando…');
  /* Supabase Auth. El correo lo arma cuenta.js desde el teléfono; el socio nunca
     lo ve. La contraseña se manda una sola vez y no se guarda en ninguna parte
     de este archivo. */
  fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
    body: JSON.stringify({ email: U.correoDeTelefono(tel), password: clave })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) {
      if (!r.ok) {
        /* Nunca se dice "ese celular existe pero la contraseña no": eso
           convertiría la app en un oráculo de quién es cliente. */
        return fallo(err, 'No pudimos entrar con esos datos. Revísalos, y si siguen sin ' +
          'funcionar toca «Olvidé mi contraseña».');
      }
      err.classList.add('oculto');
      pintarCuenta(r.j);
    })
    .catch(function () { fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.'); });
}

function fallo(el, msg) { el.textContent = msg; el.classList.remove('oculto'); }

/* El WhatsApp del negocio, escrito ENTERO (57 + los 10 dígitos). Es la única
   línea que se edita para cambiarlo. VACÍO, WhatsApp abre con el mensaje listo
   y deja elegir el chat — le sirve al que ya conoce a Joan, pero el registrado
   NUEVO no tiene su chat: llenar esto es lo que vuelve la verificación de un
   solo toque. (Va horneado y no en un paquete editable por la misma razón que
   NEGOCIO_OFICIAL en socio.html: un número que viajara en datos falsificables
   mandaría a los clientes al WhatsApp de un estafador.) */
var WA_NEGOCIO = '573103606348';
function abrirWhatsApp(texto) {
  var n = String(WA_NEGOCIO || '').replace(/\D/g, '');
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
}

function olvide() {
  var tel = U.normalizarTelefono(($('inTel') || {}).value || '');
  /* La recuperación es por WhatsApp y con Joan en el medio, decisión del
     11-ago: no hay SMS que pagar, y el número ya está en su Panel. */
  var texto = 'Hola, olvidé mi contraseña de la app de Tu Garantía.' +
    (tel ? ' Mi celular es ' + U.telefonoBonito(tel) + '.' : '') +
    ' ¿Me ayudas a recuperarla?';
  abrirWhatsApp(texto);
}

/* ================= LA VERIFICACIÓN POR WHATSAPP =================
   24-ago-2026, decisión de Joan: nada de SMS pagos. El registrado manda su
   código de verificación por WhatsApp DESDE su propio número; como el mensaje
   llega con el remitente puesto por WhatsApp —no por él—, si el número y el
   código cuadran con la bandeja del CRM, el celular queda verificado gratis.
   El verificador es Joan, que de todas formas iba a escribirle antes de
   aprobar: esto solo le ahorra la duda de si el número es de verdad.

   La forma V-##### es A PROPÓSITO distinta de los otros tres códigos de la
   casa (TG-XXXX-XXXX invita, 5 letras abre la app, CL-0001 solo numera): ya
   son tres y confundirlos es el error natural. Puros dígitos, además, se
   dictan fácil por teléfono. */
var VERIF_ULTIMA = '';
function codigoVerificacion() {
  var a = new Uint32Array(1);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else a[0] = Math.floor(Math.random() * 1e9);
  return 'V-' + String(10000 + (a[0] % 90000));
}
/* 8-sep-2026: verificarPorWhatsApp() se retiró — el paso siguiente al registro es
   pedir el primer crédito (pedirPrimerCredito), no mandar un código por WhatsApp. */

/* ============================== REGISTRO ==============================
   En pasos y no en una sola página de 26 campos: nadie llena eso de una
   sentada, y una pantalla de scroll infinito es donde la gente abandona. El
   borrador se guarda solo, menos la contraseña. */
var PASOS = [
  { id: 'entrada',  titulo: 'Tu celular y tu contraseña' },
  { id: 'documento', titulo: 'Tu cédula' },
  { id: 'rostro',    titulo: 'Tu rostro' },
  { id: 'identidad', titulo: 'Quién eres' },
  { id: 'contacto',  titulo: 'Cómo te contactamos' },
  { id: 'domicilio', titulo: 'Dónde vives' },
  { id: 'ingresos',  titulo: 'De qué vives' },
  { id: 'referencias', titulo: 'Quién puede responder por ti' },
  { id: 'permiso',  titulo: 'Tu autorización' }
];

/* ===========================================================================
 * «QUIERO QUE MI ASESOR ME ACOMPAÑE» — 15-sep-2026
 *
 * Joan pidió poder ver al cliente registrándose, con sus fotos, para guiarlo por
 * teléfono. Construirlo sin más tenía un problema que no es de opinión:
 *
 * HOY NADA SALE DE ESTE TELÉFONO HASTA EL PASO 9, y la casilla que autoriza las
 * fotos está EN el paso 9. Quien la desmarca consigue que sus fotos no salgan —
 * eso funciona de verdad, está en tomarFoto/siguientePaso. Publicar la foto en
 * el paso 2 volvería esa garantía papel mojado: cuando la persona llegue a
 * decidir, el asesor ya la vio, y eso no se deshace.
 *
 * Así que el permiso va PRIMERO y es del cliente: toca el botón, y solo desde
 * ahí se publica. Se apaga cuando quiera, con el mismo botón.
 *
 * LO QUE NO SE MANDA NUNCA, ni con el permiso puesto:
 *   · las referencias — son nombre y celular de DOS personas que no son quien
 *     está registrándose y que no autorizaron nada. Y la Ley 2300 ya le prohíbe
 *     a Joan contactarlas: tenerlas anotadas sería exposición sin ningún uso.
 *   · la contraseña.
 *   · la ubicación — el GPS se pide en el paso 2 pero se autoriza en el 9.
 * Acá se filtra, y el SERVIDOR lo vuelve a filtrar (registro_vivo_publicar).
 * Dos rejas para lo mismo: una pantalla se puede saltar.
 * ========================================================================= */
var ACOMPANA = false;
try { ACOMPANA = localStorage.getItem('tg_acompana') === '1'; } catch (e) {}

function tarjetaAcompanar() {
  /* Sin celular no hay a quién asociarlo: el asesor lo encuentra por su número. */
  if (!REGISTRO.celular) return '';
  return '<div class="aviso ' + (ACOMPANA ? 'verde' : 'info') + '" style="margin-top:var(--e3)">' +
    (ACOMPANA
      ? '<b>Tu asesor te está acompañando.</b> Ve en qué paso vas y las fotos que subas, ' +
        'para poder guiarte si llamas. No ve tu contraseña, ni tus referencias, ni dónde estás.' +
        '<button class="btn sec sm" style="margin-top:var(--e2)" onclick="acompanar(false)">' +
        'Prefiero seguir solo</button>'
      : '<b>¿Quieres que un asesor te acompañe?</b> Si lo activas, podrá ver en qué paso vas ' +
        'y las fotos que subas, para guiarte por teléfono. Nunca ve tu contraseña, ni tus ' +
        'referencias, ni dónde estás. Lo puedes apagar cuando quieras.' +
        '<button class="btn sec sm" style="margin-top:var(--e2)" onclick="acompanar(true)">' +
        'Sí, que me acompañe</button>') +
    '</div>';
}

function acompanar(si) {
  ACOMPANA = !!si;
  try { localStorage.setItem('tg_acompana', si ? '1' : '0'); } catch (e) {}
  if (si) publicarAvance();
  else borrarAvance();
  pintarRegistro(PASO);
}

/* Lo que se publica. Se arma una lista BLANCA —lo que sí entra— y no una negra:
   una lista negra hay que acordarse de ampliarla cada vez que el formulario
   gane un campo, y ese olvido es el que manda de más. */
var CAMPOS_QUE_SE_PUBLICAN = ['nombres', 'apellidos', 'documento', 'tipo_doc',
                              'celular', 'correo', 'nacimiento'];

function publicarAvance() {
  if (!ACOMPANA || !REGISTRO.celular) return Promise.resolve();
  if (!CFG.url || !CFG.anon) return Promise.resolve();

  var avance = {};
  CAMPOS_QUE_SE_PUBLICAN.forEach(function (k) {
    if (REGISTRO[k]) avance[k] = String(REGISTRO[k]).slice(0, 80);
  });

  /* Las fotos SOLO si la persona ya marcó la autorización de fotos. Es la misma
     casilla del paso 9: si todavía no la marcó, el acompañamiento muestra el
     avance pero no las imágenes. Dos permisos distintos para dos cosas
     distintas, y ninguno vale por el otro. */
  var fotos = {};
  if (FOTOS.sensibles) {
    ['cedula_frente', 'cedula_reverso'].forEach(function (k) {
      if (FOTOS[k]) fotos[k] = FOTOS[k];
    });
    /* LA SELFIE NO VIAJA. Es biometría —la categoría más sensible de la Ley
       1581— y para guiar a alguien por teléfono no hace falta: lo que se
       atasca es el código de barras de la cédula, no la cara. */
  }

  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_publicar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: REGISTRO.celular,
      p_paso: PASO + 1,
      p_de: PASOS.length,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).trim(),
      p_avance: avance,
      p_fotos: fotos
    })
  }).catch(function () { /* sin señal se sigue registrando igual */ });
}

function borrarAvance() {
  if (!REGISTRO.celular || !CFG.url || !CFG.anon) return Promise.resolve();
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_borrar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_celular: REGISTRO.celular })
  }).catch(function () {});
}

function pintarRegistro(paso) {
  VISTA = 'registro';
  PASO = Math.max(0, Math.min(paso, PASOS.length - 1));
  guardarPaso(PASO);   // por si el teléfono recarga al volver de la cámara
  var p = PASOS[PASO];
  $('titulo').textContent = 'Abrir mi cuenta';

  var barra = '<div class="pasos">' + PASOS.map(function (_, i) {
    return '<i class="' + (i < PASO ? 'hecho' : (i === PASO ? 'aqui' : '')) + '"></i>';
  }).join('') + '</div>';

  detenerEscaner();   // por si venía del paso del rostro
  var cuerpo;
  if (p.id === 'entrada')      cuerpo = pasoEntrada();
  else if (p.id === 'documento') cuerpo = pasoDocumento();
  else if (p.id === 'rostro')  cuerpo = pasoRostro();
  else if (p.id === 'permiso') cuerpo = pasoPermiso();
  else                         cuerpo = pasoCampos(p.id);

  $('cuerpo').innerHTML =
    '<div class="card">' +
      '<div class="etq">Paso ' + (PASO + 1) + ' de ' + PASOS.length + '</div>' +
      barra +
      '<h3 class="tit" style="margin-top:var(--e3)">' + esc(p.titulo) + '</h3>' +
      cuerpo +
      /* 15-sep-2026 — el acompanamiento. Va DESPUES del contenido del paso y
         antes del boton: es una eleccion sobre lo que acaba de hacer, no una
         puerta para entrar. */
      tarjetaAcompanar() +
      '<div id="errReg" class="aviso ambar oculto"></div>' +
      '<button class="btn arriba" onclick="siguientePaso()">' +
        (PASO === PASOS.length - 1 ? 'Abrir mi cuenta' : 'Continuar') + '</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="' +
        (PASO === 0 ? 'pintarEntrar()' : 'pintarRegistro(' + (PASO - 1) + ')') + '">Volver</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
  /* Cada vez que cambia de paso, si dio permiso, se publica. En un try porque un
     acompanamiento que falle NO puede impedirle abrir su cuenta. */
  try { publicarAvance(); } catch (e) {}
  if (p.id === 'rostro' && FOTOS.sensibles && !FOTOS.selfie) setTimeout(iniciarEscaner, 50);
  if (p.id === 'documento' && FOTOS.sensibles && !FOTOS.gps && !FOTOS.gps_error) pedirGps();
}

function pasoEntrada() {
  return '<p class="sub">Tu celular es tu usuario. Con él entras y por ahí te escribimos.</p>' +
    '<label for="rTel">Tu celular</label>' +
    '<input id="rTel" type="tel" inputmode="numeric" autocomplete="username" placeholder="300 111 2233" value="' +
      esc(REGISTRO.celular ? U.telefonoBonito(REGISTRO.celular) : '') + '">' +
    '<div class="ayuda">Son 10 números y empiezan por 3. Tiene que tener WhatsApp: ' +
      'por ahí te mandamos tu código si olvidas la contraseña.</div>' +
    '<label for="rClave">Crea tu contraseña</label>' +
    '<input id="rClave" type="password" autocomplete="new-password" placeholder="••••••••">' +
    '<div class="ayuda">Mínimo ' + U.LARGO_MINIMO_CLAVE + ' caracteres. No uses tu celular ' +
      'ni tu cédula: son lo primero que alguien probaría.</div>' +
    '<label for="rClave2">Escríbela otra vez</label>' +
    '<input id="rClave2" type="password" autocomplete="new-password" placeholder="••••••••">';
}

function pasoCampos(grupo) {
  return U.camposDelGrupo(grupo).map(function (c) {
    var v = REGISTRO[c.id] === undefined ? '' : REGISTRO[c.id];
    var etiqueta = '<label for="f_' + c.id + '">' + esc(c.etiqueta) +
      (c.obligatorio ? '' : ' <span class="opc">· opcional</span>') + '</label>';
    var campo;
    if (c.tipo === 'opcion') {
      campo = '<select id="f_' + c.id + '"><option value="">Escoge…</option>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      var tipo = c.tipo === 'celular' ? 'tel'
               : c.tipo === 'correo'  ? 'email'
               : c.tipo === 'fecha'   ? 'date'
               : c.tipo === 'numero' || c.tipo === 'pesos' ? 'text' : 'text';
      var modo = (c.tipo === 'celular' || c.tipo === 'numero' || c.tipo === 'pesos')
        ? ' inputmode="numeric"' : '';
      campo = '<input id="f_' + c.id + '" type="' + tipo + '"' + modo + ' value="' + esc(v) + '">';
    }
    /* El porqué se le MUESTRA al socio, no se queda en el código. Si un dato
       vale la pena pedirlo, vale la pena decir para qué; y si da vergüenza
       escribirlo, ese es el aviso de que no había que pedirlo. */
    return etiqueta + campo + '<div class="ayuda">' + esc(c.porque) + '</div>';
  }).join('');
}

function pasoPermiso() {
  return '<p class="sub">Para abrir tu cuenta necesitamos tu permiso para tratar tus datos, ' +
      'como manda la Ley 1581 de 2012.</p>' +
    '<label class="permiso"><input type="checkbox" id="autGeneral"><span>' +
      '<b>Autorizo el tratamiento de mis datos personales.</b>' +
      '<span class="muted">Los usamos para evaluar y llevar tu crédito, y para escribirte ' +
      'sobre tus pagos. No los vendemos. Puedes pedirnos que te digamos qué tenemos tuyo, ' +
      'que lo corrijamos o que lo borremos, cuando quieras.</span></span></label>' +
    '<label class="permiso"><input type="checkbox" id="autSensible"' + (FOTOS.sensibles ? ' checked' : '') + '><span>' +
      'Autorizo también la foto de mi cédula, la de mi rostro y mi ubicación.' +
      '<span class="muted">Esto es aparte y es opcional: tu cuenta se abre igual sin ' +
      'marcarlo. La ley no permite condicionarte el servicio a que lo des.</span></span></label>' +
    '<div class="aviso" style="margin-top:var(--e4)"><b>Lo que esta app NO te pide:</b> ' +
      'no accede a tus mensajes, ni a tus llamadas, ni a tus contactos, ni a tus fotos guardadas. ' +
      'Solo la cámara en el momento de tomar la foto, y tu ubicación una sola vez, si la autorizas.</div>' +
    '<div class="ayuda" style="margin-top:var(--e3)">' +
      '<a href="../legal/privacidad.html" target="_blank" rel="noopener">Leer la política completa</a> · ' +
      '<a href="../legal/terminos.html" target="_blank" rel="noopener">Términos</a></div>';
}

function recogerPaso() {
  var p = PASOS[PASO];
  if (p.id === 'entrada') {
    var tel = U.normalizarTelefono($('rTel').value);
    if (tel) REGISTRO.celular = tel;
    return { clave: $('rClave').value, clave2: $('rClave2').value };
  }
  if (p.id === 'permiso') {
    return { general: $('autGeneral').checked, sensibles: $('autSensible').checked };
  }
  if (p.id === 'documento' || p.id === 'rostro') return {};
  U.camposDelGrupo(p.id).forEach(function (c) {
    var el = $('f_' + c.id);
    if (el) REGISTRO[c.id] = el.value;
  });
  guardarBorrador(REGISTRO);
  return {};
}

var CLAVE_EN_MEMORIA = leerClaveEnCurso();   // vive solo mientras la pestaña está abierta

function siguientePaso() {
  var err = $('errReg');
  err.classList.add('oculto');
  var extra = recogerPaso();
  var p = PASOS[PASO];

  if (p.id === 'entrada') {
    if (!REGISTRO.celular) return fallo(err, 'Escribe tu celular: son 10 números y empiezan por 3.');
    var rc = U.revisarContrasena(extra.clave, { telefono: REGISTRO.celular, cedula: REGISTRO.documento });
    if (!rc.ok) return fallo(err, rc.motivo);
    if (extra.clave !== extra.clave2) return fallo(err, 'Las dos contraseñas no son iguales.');
    CLAVE_EN_MEMORIA = extra.clave;
    guardarClaveEnCurso(extra.clave);
    guardarBorrador(REGISTRO);
    return pintarRegistro(PASO + 1);
  }

  if (p.id === 'permiso') {
    if (!extra.general) {
      return fallo(err, 'Sin tu autorización no podemos abrir la cuenta. Es un requisito de la ley.');
    }
    /* Si al final quita la casilla de sensibles, las fotos y el GPS que tomó no
       salen del teléfono: se borran antes de mandar nada. */
    if (!extra.sensibles) { FOTOS = { sensibles: false }; guardarFotos(); }
    return enviarRegistro(extra.sensibles);
  }
  /* Los dos pasos de fotos son opcionales: se pasa con o sin foto. */
  if (p.id === 'documento' || p.id === 'rostro') return pintarRegistro(PASO + 1);

  /* Falta algo obligatorio de ESTE paso. No se revisa el formulario entero:
     mandar al socio a un paso anterior por algo que aún no ha llenado es la
     forma más rápida de que cierre la app. */
  var r = U.revisarVinculacion(REGISTRO);
  var idsDelPaso = U.camposDelGrupo(p.id).map(function (c) { return c.id; });
  var faltanAqui = r.faltan.filter(function (f) { return idsDelPaso.indexOf(f.id) !== -1; });
  var errosAqui = r.errores.filter(function (e) { return idsDelPaso.indexOf(e.id) !== -1; });
  if (errosAqui.length) return fallo(err, errosAqui[0].motivo);
  if (faltanAqui.length) {
    return fallo(err, 'Falta ' + faltanAqui.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') + '.');
  }
  pintarRegistro(PASO + 1);
}

function enviarRegistro(sensibles) {
  var err = $('errReg');
  var r = U.revisarVinculacion(REGISTRO);
  if (!r.ok) {
    return fallo(err, 'Falta completar: ' +
      r.faltan.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') + '.');
  }
  var autorizacion = U.armarAutorizacion(new Date().toISOString(), sensibles);

  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la cuenta no se ' +
      'puede crear todavía. Tus datos quedaron guardados en este teléfono y no se ' +
      'perdieron. Esto es una versión en construcción.');
  }

  /* El código de verificación nace aquí y viaja DENTRO de la vinculación: así
     llega a la bandeja del CRM sin una sola pieza nueva de plomería, y Joan lo
     compara con el que le llegue por WhatsApp. */
  VERIF_ULTIMA = codigoVerificacion();
  REGISTRO.verificacion = VERIF_ULTIMA;

  fallo(err, 'Creando tu cuenta…');
  /* PRIMERO la bandeja de Joan, DESPUÉS la cuenta — y el orden es la garantía.
     Si fuera al revés y la bandeja fallara, la cuenta quedaría creada pero
     invisible para Joan (el defecto que este flujo tuvo hasta el 24-ago: el
     registro se iba solo a Supabase Auth y nadie lo leía). Así, si la bandeja
     falla no se crea nada y el cliente reintenta; y si la cuenta falla después,
     el registro YA está en la bandeja — reintentar no lo duplica, porque
     registrar_abierto es idempotente por celular. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registrar_abierto', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: REGISTRO.celular,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).replace(/\s+/g, ' ').trim(),
      p_cedula: REGISTRO.documento || '',
      p_datos: REGISTRO
    })
  }).then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status)); })
    .then(function (r) {
      if (!r || r.ok !== true) {
        throw { humano: 'No pudimos recibir tu registro. Revisa tu celular y tu nombre, y vuelve a intentar en unos minutos.' };
      }
      return fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
        body: JSON.stringify({
          email: U.correoDeTelefono(REGISTRO.celular),
          password: CLAVE_EN_MEMORIA,
          data: { telefono: REGISTRO.celular, vinculacion: REGISTRO, autorizacion: autorizacion }
        })
      });
    })
    .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        var yaExiste = /registered|already/i.test(JSON.stringify(res.j || {}));
        return fallo(err, yaExiste
          ? 'Ya hay una cuenta con ese celular. Entra con tu contraseña, o toca «Olvidé mi contraseña».'
          : 'No pudimos crear la cuenta. Vuelve a intentar en un momento.');
      }
      try { localStorage.removeItem(LLAVE_BORRADOR); } catch (e) {}
      olvidarPaso(); olvidarClaveEnCurso();
      CLAVE_EN_MEMORIA = '';
      /* 8-sep-2026 — con «Confirm email» apagado en Supabase, el signup devuelve
         la sesión entera: el recién registrado ya puede pedir. */
      if (res.j && res.j.access_token) SESION = res.j;
      pintarRegistrado();
      subirArchivosRegistro().catch(function () {});   // si falla, se reintenta al abrir la cuenta
    })
    .catch(function (e) {
      fallo(err, (e && e.humano) ? e.humano
        : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
    });
}

function pintarRegistrado() {
  VISTA = 'listo';
  $('titulo').textContent = 'Tu cuenta quedó abierta';
  /* 8-sep-2026 — Joan: «lo que quiero es que el cliente, después de que se
     registre, pueda automáticamente aplicar a un crédito». Antes esta pantalla
     mandaba a WhatsApp con un código de verificación; ahora el siguiente paso
     es pedir, y la propuesta sale al instante. El código de verificación sigue
     viajando en los datos del registro, para el CRM, sin pedirle nada a él. */
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Listo.</b> Tu cuenta quedó creada.</div>' +
      '<p class="sub" style="margin-top:var(--e4)"><b>Ahora pide tu primer crédito.</b> ' +
      'Te mostramos de una la propuesta para clientes nuevos, en pesos, y la aceptas si te sirve. ' +
      'La plata te la entrega Joan después de revisar.</p>' +
      '<button class="btn arriba" onclick="pedirPrimerCredito()">Pedir mi primer crédito</button>' +
      '<div id="errPrimer" class="aviso ambar oculto"></div>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarCuenta()">Ir a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* ================= EL PRIMER CRÉDITO DEL NUEVO — 8-sep-2026 =================
   Pedido de Joan: que el recién registrado pida de una, reciba la contrapropuesta
   estándar para nuevos (la arma la base al instante, con la política que Joan
   edita en su CRM), la acepte aquí, y Joan solo tenga que desembolsar.

   Lo que esta pantalla NO hace: no crea un crédito. Aceptar es aceptar la
   propuesta; la plata la entrega Joan, a mano, y ahí nace el crédito. Se dice
   con esas palabras. Y al cliente se le habla en PESOS: ni un porcentaje. */
function rpcSesion(fn, cuerpo) {
  if (!SESION || !SESION.access_token) return Promise.reject({ sinSesion: true });
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + SESION.access_token },
    body: JSON.stringify(cuerpo || {})
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); });
}

function pedirPrimerCredito() {
  var err = $('errPrimer'); if (err) err.classList.add('oculto');
  if (!SESION || !SESION.access_token) {
    /* Sin sesión no se puede pedir. Pasa si la cuenta se creó en otro aparato:
       entra con su celular y su contraseña y de ahí sale la propuesta. */
    pintarEntrar();
    return;
  }
  if (err) fallo(err, 'Pidiendo…');
  rpcSesion('solicitar_primer_credito').then(function (j) {
    if (!j || j.ok !== true || !j.solicitud) {
      if (err) fallo(err, 'No pudimos recibir tu solicitud ahora. Espera unos minutos y vuelve a intentar.');
      return;
    }
    pintarSolicitud(j.solicitud);
  }).catch(function () {
    if (err) fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  });
}

/* La propuesta, en pesos y con la explicación de Joan. El botón de aceptar dice
   exactamente lo que se registra, y lo que NO pasa se dice también. */
function tarjetaContrapropuesta(sol) {
  var cp = sol.contrapropuesta || {};
  var aceptada = sol.estado === 'aceptada';
  var cambiada = cp.por === 'joan' && !aceptada;
  var h = '<div class="card">' +
    (cambiada ? '<div class="aviso ambar"><b>Te hicimos una propuesta nueva.</b> Léela y decide.</div>' : '') +
    '<div class="etq">' + (aceptada ? 'Tu primer crédito, aceptado' : 'Tu primer crédito') + '</div>' +
    (cp.texto ? '<p class="sub">' + esc(cp.texto) + '</p>' : '') +
    fila('Te prestamos', COP(cp.capital)) +
    fila('Lo que cuesta', COP(cp.costo)) +
    fila('Devuelves', COP(cp.total)) +
    '<div class="grupo-tit">Cuándo pagas</div>' +
    cuotasDePropuesta(cp);
  if (aceptada) {
    h += '<div class="aviso verde" style="margin-top:var(--e3)"><b>Listo: aceptaste ' + COP(cp.capital) + '.</b> ' +
      'Te escribimos por WhatsApp para entregarte la plata y te mandamos <b>tu código de acceso</b>: ' +
      'con él entras por el mismo enlace de siempre. No tienes que hacer nada más por ahora.</div>';
  } else {
    h += '<p class="sub" style="margin-top:var(--e3)">Aceptar no te entrega la plata todavía: ' +
        'Joan te escribe por WhatsApp y la entrega él. Si no te sirve, no aceptes y ya.</p>' +
      '<button class="btn arriba" onclick="aceptarContrapropuesta(' + Number(sol.id) + ')">' +
        'Acepto: recibo ' + COP(cp.capital) + ' y devuelvo ' + COP(cp.total) + '</button>' +
      '<div id="errAceptar" class="aviso ambar oculto"></div>';
  }
  return h + '</div>';
}

/* Las cuotas de una propuesta, segmentadas. Si la propuesta trae cuotas se
   pintan una por una; si trae un solo pago se pinta ESE, con su fecha y su
   monto. Partir un pago único en tres renglones inventados sería la pantalla
   fabricando un acuerdo que nadie hizo. */
function cuotasDePropuesta(cp) {
  if (cp.cuotas && cp.cuotas.length) return cuadroCuotas(cp.cuotas);
  if (!cp.fecha_pago) return '';
  return fila('Pago único · ' + fmtFecha(cp.fecha_pago), COP(cp.total)) +
    '<div class="ayuda">Es un solo pago, ' + Number(cp.dias) + ' días después de ' +
      'que recibas la plata. No hay cuotas intermedias ni nada que pagar antes.</div>';
}

function pintarSolicitud(sol) {
  VISTA = 'solicitud';
  $('titulo').textContent = sol.estado === 'aceptada' ? 'Tu primer crédito' : 'Tu propuesta';

/* ================= LA CÉDULA, EL ROSTRO Y LA HUELLA — 8-sep-2026 =================

   código de barras PDF417 trae número, apellidos, nombres, sexo y nacimiento);

   DIBUJA (óvalo, ojos, malla, cuenta regresiva) y dispara solo; la biometría

/* La misma compresión que usa el CRM: JPEG, lado mayor a `max`, calidad `q`. */
/* 9-sep-2026 — SE LEE CON createObjectURL Y NO COMO TEXTO. FileReader
   .readAsDataURL convierte el archivo entero en base64: una foto de 4 MB pasaba
   a ser una cadena de 5,3 MB en memoria, y encima justo cuando el navegador
   acababa de volver de la cámara y está en su peor momento de memoria. Ese es
   el gasto que hacía que el sistema descartara la pestaña. Un objeto URL no
   copia nada: apunta al archivo y se suelta al terminar. */

  return new Promise(function (res, rej) {
    var url;

        if (w > h && w > max) { h = h * max / w; w = max; } else if (h >= w && h > max) { w = w * max / h; h = max; }
        var c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h);

      /* Un iPhone puede entregar HEIC, que Chrome de Android no dibuja. El
         mensaje tiene que decir qué hacer, no qué pasó. */
      rej(new Error('formato de imagen que este teléfono no puede abrir'));
    };
    img.src = url;
  });
}

/* ---------------------------------------------------------- paso: el rostro */
var ESCANER = { stream: null, activo: false, estables: 0, temporizador: null,

/* Cuántos píxeles de lado se miran. 32×32 son 1.024 números por fotograma: en
   un celular de gama baja eso es nada, y alcanza de sobra para saber si hay una
   cara o una pared. Subirlo no mejora la decisión y sí calienta el teléfono. */
var LADO_MEDIR = 32;
function pasoRostro() {
  if (!FOTOS.sensibles) {
    return '<p class="sub">No marcaste la autorización de fotos en el paso anterior, así que este paso se ' +
      'salta: tu cuenta se abre igual.</p>';

    '</div>' +

      '<div class="aviso verde">Rostro registrado.</div>' +
      '<button class="btn sec sm" type="button" onclick="repetirRostro()">Repetir la foto</button>' +
    '</div>' +
    '<button class="btn sec sm' + (tiene ? ' oculto' : '') + '" id="btnCapturar" type="button" style="margin-top:var(--e3)" onclick="capturarRostro()">Tomar la foto ahora</button>' +
    '<label class="foto-caja' + (tiene ? ' oculto' : '') + '" id="fot_selfie_fallback" style="display:none"><span class="ic">🤳</span>' +
      '<span class="lbl">Tomar una selfie</span><input type="file" accept="image/*" capture="user" onchange="tomarFoto(event,\'selfie\')"></label>';
}
function repetirRostro() {

function iniciarEscaner() {
  var v = $('camVideo'), estado = $('camEstado'); if (!v) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return escanerSinCamara('Tu navegador no deja usar la cámara en vivo.');
  ESCANER.activo = true; ESCANER.estables = 0; ESCANER.desde = 0; ESCANER.previa = null; ESCANER.ultima = null;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } }, audio: false })
    .then(function (stream) {
      ESCANER.stream = stream; v.srcObject = stream;
      return v.play().catch(function () {});
    })
    .then(function () { if (estado) estado.textContent = 'Pon tu rostro dentro del óvalo'; bucleEscaner(); })
    .catch(function (e) {
      escanerSinCamara(e && e.name === 'NotAllowedError' ? 'No diste permiso de cámara.' : 'No pude encender el escáner.');
    });
}
function escanerSinCamara(motivo) {
  detenerEscaner();
  var e = $('escaner'); if (e) e.classList.add('oculto');
  var b = $('btnCapturar'); if (b) b.classList.add('oculto');
  var f = $('fot_selfie_fallback'); if (f) { f.style.display = ''; f.querySelector('.lbl').textContent = motivo + ' Toma una selfie con la cámara del celular.'; }
}
function detenerEscaner() {
  ESCANER.activo = false;
  if (ESCANER.temporizador) { clearTimeout(ESCANER.temporizador); ESCANER.temporizador = null; }
  if (ESCANER.stream) { ESCANER.stream.getTracks().forEach(function (t) { t.stop(); }); ESCANER.stream = null; }
}
/* El escáner DIBUJA, no reconoce: el óvalo, las esquinas, los anillos de los
   ojos y una malla que respira. En el teléfono no se detecta ni se mide nada
   del rostro (eso sería biometría, y la app declara que no la procesa). A los
   tres segundos con la cámara encendida, dispara solo. */
/* Recorta el interior del óvalo del VÍDEO —no del lienzo pintado, que solo
   tiene el dibujo— y lo devuelve en gris, de LADO_MEDIR×LADO_MEDIR. El lienzo
   de medir no está en la pantalla: nadie lo ve y nunca sale del teléfono. */
function fotogramaGris(v) {
  if (!ESCANER.lienzoMedir) {
    ESCANER.lienzoMedir = document.createElement('canvas');
    ESCANER.lienzoMedir.width = LADO_MEDIR; ESCANER.lienzoMedir.height = LADO_MEDIR;
  }
  var c = ESCANER.lienzoMedir, x = c.getContext('2d', { willReadFrequently: true });
  var w = v.videoWidth, h = v.videoHeight;
  /* El mismo recorte que dibuja el óvalo (0,32 y 0,36 del ancho y del alto),
     para que lo que se mide sea exactamente lo que la persona ve enmarcado. */
  var rx = w * 0.32, ry = h * 0.36;
  try { x.drawImage(v, w / 2 - rx, h / 2 - ry, rx * 2, ry * 2, 0, 0, LADO_MEDIR, LADO_MEDIR); }
  catch (e) { return null; }
  var d;
  try { d = x.getImageData(0, 0, LADO_MEDIR, LADO_MEDIR).data; } catch (e) { return null; }
  var g = new Array(LADO_MEDIR * LADO_MEDIR);
  for (var i = 0, j = 0; i < d.length; i += 4, j++) {
    g[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;   // gris como lo ve el ojo
  }
  return g;
}

/* EL BUCLE MIRA EL FOTOGRAMA, NO EL RELOJ (9-sep-2026).
   Hasta ayer disparaba a los 3,2 segundos pasara lo que pasara —la pantalla
   prometía «cuando tu rostro esté quieto y centrado» y era mentira: apuntando
   al techo salía igual—. Ahora se piden CUADROS seguidos en verde, y la racha
   se cae en cuanto la persona se mueve o se sale del óvalo.
   Lo que decide está en app/cuenta.js, fuera de esta pantalla, para poder
   probarlo con fotogramas de mentira. Y lo que decide es un ENCUADRE: acá no se
   reconoce a nadie (eso sería biometría en el teléfono, y cambiaría la ficha de
   Data Safety). El parecido con la cédula lo saca el CRM de Joan. */
function bucleEscaner() {
  if (!ESCANER.activo) return;
  var v = $('camVideo'), c = $('camLienzo'), estado = $('camEstado');
  if (!v || !c || !v.videoWidth) { ESCANER.temporizador = setTimeout(bucleEscaner, 120); return; }
  if (!ESCANER.desde) ESCANER.desde = Date.now();
  var t = (Date.now() - ESCANER.desde) / 1000;

  var g = fotogramaGris(v);
  var m = g ? U.medirEncuadre(g, ESCANER.previa, LADO_MEDIR) : null;
  ESCANER.previa = g;
  ESCANER.ultima = m;
  if (m && m.ok) ESCANER.estables++; else ESCANER.estables = 0;
  var avance = Math.min(1, ESCANER.estables / U.ENCUADRE.CUADROS);

  c.width = v.videoWidth; c.height = v.videoHeight;
  var ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  dibujarMarco(ctx, c.width, c.height, t, !!(m && m.ok), avance);

  if (estado) {
    /* Ni un fotograma mudo: si algo falta, se dice QUÉ hacer. Y si lleva mucho
       rato peleando, se le recuerda que puede disparar a mano — quedarse
       atascado en el paso 3 de 9 con el teléfono en la cara es peor que una
       foto mal encuadrada. */
    var txt = m && m.ok
      ? 'Quieto… ' + Math.max(1, Math.ceil((U.ENCUADRE.CUADROS - ESCANER.estables) / 6))
      : U.textoDeEncuadre(m);
    if (!g) txt = 'Encendiendo la cámara…';
    else if (t > 18 && !(m && m.ok)) txt = 'Si no lo logras, toca «Tomar la foto ahora»';
    estado.textContent = txt;
  }

  if (ESCANER.estables >= U.ENCUADRE.CUADROS) { capturarRostro(); return; }
  ESCANER.temporizador = setTimeout(bucleEscaner, 80);
}
/* 9-sep-2026 — el dibujo dice la verdad: ámbar y punteado mientras busca,
   verde y entero cuando de verdad hay una cara centrada y quieta. Un escáner
   que se ve igual en los dos casos es decoración; este es una señal. */
function dibujarMarco(ctx, w, h, t, enganchado, avance) {
  ctx.save();
  var cx = w / 2, cy = h / 2, rx = w * 0.32, ry = h * 0.36;
  var col = enganchado ? '124,255,196' : '245,197,66';

  if (!enganchado) ctx.setLineDash([9, 9]);

  ctx.setLineDash([]);

    ctx.beginPath(); ctx.moveTo(k[0], k[1] + L * k[3]); ctx.lineTo(k[0], k[1]); ctx.lineTo(k[0] + L * k[2], k[1]); ctx.stroke();
  });

     encendidos sobre una pared vacía serían la misma mentira de ayer. */

  /* la malla que respira dentro del óvalo */
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
  ctx.strokeStyle = 'rgba(120,255,190,' + (0.18 + 0.12 * Math.sin(t * 3)) + ')'; ctx.lineWidth = 1;
  var paso = Math.max(18, w / 14), d = (t * 12) % paso;
  for (var x = -paso + d; x < w; x += paso) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (var y = -paso + d; y < h; y += paso) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.restore();
  /* los anillos de los ojos, donde suelen estar, latiendo */
  var pulso = 1 + 0.08 * Math.sin(t * 5);
  [[cx - rx * 0.42, cy - ry * 0.18], [cx + rx * 0.42, cy - ry * 0.18]].forEach(function (o) {
    ctx.strokeStyle = 'rgba(120,255,190,.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o[0], o[1], rx * 0.20 * pulso, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(o[0], o[1], rx * 0.06, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o[0] - rx * 0.28, o[1]); ctx.lineTo(o[0] - rx * 0.22, o[1]); ctx.moveTo(o[0] + rx * 0.22, o[1]); ctx.lineTo(o[0] + rx * 0.28, o[1]); ctx.stroke();
  });
  /* El arco de progreso sale de la RACHA de fotogramas buenos, no del reloj:
     si la persona se mueve, se cae y vuelve a empezar — que es justo lo que
     tiene que ver para entender qué le piden. */
  ctx.strokeStyle = 'rgba(120,255,190,.25)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx + 6, ry + 6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,255,190,.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx + 6, ry + 6, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, avance || 0)); ctx.stroke();
  ctx.restore();
}

/* 9-sep-2026 — SE LEE DEL PERFIL, no se escribe. Estaba clavado en 2.000.000 y

/* Las cifras se repintan solas; los deslizadores NO están adentro de esto y es

function cifrasDeCalc() {

     Si el dueno del negocio no lo entiende, el cliente tampoco. La etiqueta va
