/* 8-sep-2026 — la cédula y el rostro */
.foto-caja{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border:1.5px dashed rgba(255,255,255,.35);border-radius:14px;cursor:pointer;background:rgba(255,255,255,.04)}
.foto-caja.ok{border-style:solid;border-color:rgba(120,255,190,.7)}
.foto-caja .ic{font-size:26px}.foto-caja .lbl{font-size:14px;line-height:1.3}
.foto-caja img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.foto-caja input{display:none}
.escaner{position:relative;width:100%;max-width:360px;margin:12px auto 0;aspect-ratio:3/4;background:#000;border-radius:18px;overflow:hidden}
.escaner video,.escaner canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.escaner video{transform:scaleX(-1)}.escaner canvas{transform:scaleX(-1)}
.escaner-linea{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#F5C542,transparent);box-shadow:0 0 14px #F5C542;animation:escaneo 2.2s ease-in-out infinite}
@keyframes escaneo{0%{top:12%}50%{top:86%}100%{top:12%}}
.escaner-estado{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:14px;font-weight:600;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.selfie-prev{display:block;width:160px;height:200px;object-fit:cover;border-radius:14px;margin:12px auto;transform:scaleX(-1)}

/* 22-sep-2026 — AQUÍ FALTABA EL «/*» QUE ABRE ESTE COMENTARIO, y llevaba así
   desde el 21-sep, cuando esta hoja se movió aquí adentro. No es cosmético: sin
   la apertura, el navegador lee toda esta prosa como un SELECTOR y sigue
   leyendo hasta la primera llave que encuentra — o sea que se tragaba entera la
   PRIMERA REGLA de abajo, en silencio y sin un error en ninguna parte.

   La regla que se estaba comiendo era «.clave-caja{position:relative}», que es
   justo la que mete el ojo DENTRO de la barra de la contraseña. Por eso Joan
   dijo «se ve muy feo»: el ojo no estaba mal diseñado, estaba suelto.

   Hay una prueba que ahora cuenta las aperturas y los cierres de comentario en
   esta hoja, porque un defecto así no da ningún error: solo desaparece una
   regla y nadie sabe cuál.
   ---------------------------------------------------------------------------
   EL ESCÁNER DE LA CÉDULA Y EL OJO DE LA CONTRASEÑA — 21-sep-2026

   El ojo: un botón DENTRO del campo que alterna type password/text sobre el
   mismo <input>; el campo no cambia de sitio ni de id, solo se ve.

   El escáner: la caja es 9:16 (no 3:4 como la del rostro) porque en un
   teléfono vertical el video es 9:16 y así se ve ENTERO: la cédula va de pie y
   ocupa el 84 % del alto, que es lo que le da al código de barras los 3 px por
   módulo que el lector necesita. Recortada a 3:4 se perdería un cuarto del
   cuadro y el código saldría a 2 px: al borde de no leerse.
   El video de la cédula NO se espeja (el del rostro sí, para que se sienta un
   espejo): un código de barras espejado no se lee y una cédula espejada
   desconcierta. La regla lleva dos clases para ganarle a la del rostro, que
   vive en línea en play/index.html y se aplica después de esta hoja.
   La línea que barre anima transform (nada de top): en un teléfono barato
   mover geometría se siente, y pruebas/vitrina.test.js lo exige.
   ------------------------------------------------------------------------- */
/* 22-sep-2026 — DONDE SE ESCRIBE, BLANCO CON LETRA NEGRA, EN LOS DOS MODOS.
   Joan: «no quiero que sea oscuro donde uno escribe si no blanco con letras
   negras». No era un color mal elegido: los campos usan var(--papel) y
   var(--tinta), que en MODO OSCURO del telefono valen #151113 y #EDE7E4. El
   telefono de la clienta estaba en oscuro y por eso escribia en negro sobre
   negro.

   Se fija solo en las casillas donde se TECLEA. El resto de la pantalla
   sigue respetando el modo del telefono: lo que se pidio es poder leer lo
   que uno escribe, no apagar el tema oscuro. */
input[type=text],input[type=tel],input[type=password],input[type=number],
input[type=email],input[type=date],textarea{
  background:#FFFFFF;color:#0C0A0B;border-color:#D8D2CC}
input::placeholder,textarea::placeholder{color:#8A807B;opacity:1}

/* EL OJO, DISCRETO Y DENTRO DE LA BARRA. Joan: «se ve muy feo, quisa un poco
   mas discreto dentro de la barra donde uno escribe».
   Mas chico a la vista (20px de trazo) pero con 44px de zona tocable, que es
   el minimo para un dedo: achicar el icono no puede achicar el blanco al que
   se apunta. Gris claro en reposo, tinta cuando esta mostrando la clave, y
   sin fondo ni borde: lo que se ve es el trazo, no un boton encima. */
.clave-caja{position:relative}
.clave-caja input{padding-right:46px}
.clave-caja .ojo{position:absolute;right:2px;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border:0;background:none;padding:0;cursor:pointer;
  color:#9C918B;display:flex;align-items:center;justify-content:center;
  transition:color .15s ease}
.clave-caja .ojo svg{width:20px;height:20px}
.clave-caja .ojo:hover{color:#6E6460}
.clave-caja .ojo .ojo-raya{opacity:0}
.clave-caja .ojo.viendo{color:#0C0A0B}
.clave-caja .ojo.viendo .ojo-raya{opacity:1}
/* El foco se ve en la casilla, no en el ojo: dos aros juntos se leen como un
   error de pintado. Pero el ojo sigue siendo alcanzable con el teclado. */
.clave-caja .ojo:focus-visible{outline:2px solid var(--rojo-texto);outline-offset:-4px;
  border-radius:10px}

.escaner.escaner-doc{aspect-ratio:9/16;max-width:300px;border-radius:20px;background:var(--laca);
  --tono:245,197,66}
.escaner.escaner-doc.enganchado{--tono:124,255,196}
.escaner.escaner-doc video,.escaner.escaner-doc canvas{transform:none}
.escaner.escaner-doc canvas{pointer-events:none}

/* EL MARCO. La máscara de afuera es un box-shadow gigante: una sola capa que el
   compositor resuelve solo, en vez de repintar el lienzo entero doce veces por
   segundo. El borde cambia de punteado a entero y de ámbar a verde con una
   transición, así que el enganche se SIENTE en vez de parpadear. */
.doc-guia{position:absolute;border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(12,10,11,.52);
  outline:2px dashed rgba(var(--tono),.85);outline-offset:0;
  transition:outline-color .18s linear,box-shadow .25s linear}
.escaner-doc.enganchado .doc-guia{outline-style:solid;
  box-shadow:0 0 0 9999px rgba(12,10,11,.62),0 0 22px 2px rgba(var(--tono),.45) inset}

/* LAS CUATRO ESQUINAS, que se cierran al enganchar. Dos capas con el mismo
   gradiente cónico: la de arriba solo pinta las esquinas porque el resto del
   borde queda transparente. */
.doc-esq{position:absolute;inset:-3px;border-radius:17px;pointer-events:none;
  background:
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/22px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/3px 22px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/22px 3px no-repeat;
  filter:drop-shadow(0 0 6px rgba(var(--tono),.7));
  transform:scale(1.04);opacity:.75;
  transition:transform .22s cubic-bezier(.2,1.3,.4,1),opacity .22s linear}
.escaner-doc.enganchado .doc-esq{transform:scale(1);opacity:1}

/* LA RETÍCULA. Solo aparece cuando de verdad hay una tarjeta enganchada: es la
   diferencia entre una señal y un adorno. */
.doc-red{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none;
  opacity:0;transition:opacity .3s linear;
  background-image:
    repeating-linear-gradient(90deg,rgba(var(--tono),.22) 0 1px,transparent 1px 26px),
    repeating-linear-gradient(0deg,rgba(var(--tono),.22) 0 1px,transparent 1px 26px)}
.escaner-doc.enganchado .doc-red{opacity:1;animation:doc-respira 2.4s ease-in-out infinite}

/* EL BARRIDO, con estela. La línea es el filo; el halo de abajo es la estela
   que deja, y las dos se mueven juntas con el mismo keyframe. */
.doc-barrido{position:absolute;left:0;right:0;top:-64px;height:64px;pointer-events:none;
  animation:doc-barre 2.1s cubic-bezier(.45,0,.55,1) infinite alternate}
.doc-barrido::before{content:'';position:absolute;left:0;right:0;bottom:0;height:64px;
  background:linear-gradient(to top,rgba(var(--tono),.28),transparent)}
.doc-linea{position:absolute;left:4%;right:4%;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgb(var(--tono)) 18%,#fff 50%,rgb(var(--tono)) 82%,transparent);
  box-shadow:0 0 18px 4px rgba(var(--tono),.6)}
/* El progreso del FRENTE, que es el único que tiene un progreso de verdad: la
   racha de cuadros quietos. El respaldo no lo lleva a propósito — ahí no hay
   nada que contar hasta que el código de barras se lee, y una barra que avanza
   sin saber hacia dónde es justamente la clase de mentira que este escáner no
   se permite. */
.doc-progreso{position:absolute;left:0;right:0;bottom:-10px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.18);overflow:hidden;opacity:0;transition:opacity .2s linear}
.escaner-doc.midiendo .doc-progreso{opacity:1}
.doc-progreso i{display:block;height:100%;width:100%;border-radius:4px;background:rgb(var(--tono));
  transform:scaleX(var(--avance,0));transform-origin:left center;transition:transform .12s linear}
.doc-listo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:rgba(12,10,11,.55);opacity:0;pointer-events:none}
.escaner-doc.leido .doc-listo{opacity:1;animation:doc-aparece .35s ease-out}
.escaner-doc.leido .doc-linea{animation:none;opacity:0}
.doc-check{width:84px;height:84px;border-radius:50%;background:var(--verde);color:var(--luz);
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(124,255,196,.25)}
.escaner-doc.leido .doc-check{animation:doc-check .55s cubic-bezier(.2,1.4,.4,1)}
.doc-check svg{width:46px;height:46px}
.doc-listo-txt{color:var(--luz);font-weight:700;font-size:15px;text-align:center;padding:0 16px;
  text-shadow:0 1px 6px var(--sombra)}
.doc-acciones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:var(--e3)}
.doc-acciones .btn{width:auto;flex:1 1 auto}
.doc-tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:var(--e3)}
.doc-tarjeta{border:1.5px dashed var(--linea);border-radius:14px;padding:10px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  font-size:13px;min-height:96px;color:var(--gris)}
.doc-tarjeta.ok{border-style:solid;border-color:var(--verde);background:var(--verde-tinte);color:var(--tinta)}
.doc-tarjeta img{width:100%;max-height:72px;object-fit:cover;border-radius:8px}
.doc-tarjeta .ic{font-size:26px}
.doc-tarjeta .rep{font-size:12px;color:var(--azul-texto);background:none;border:0;padding:4px;
  cursor:pointer;text-decoration:underline;font-family:inherit}
.btn.escanear{margin-top:var(--e3)}
.doc-nota{font-size:13px;color:var(--gris);margin-top:var(--e3);line-height:1.45}
.doc-nota:empty{display:none}
.enlace-suave{display:block;width:100%;margin-top:var(--e3);background:none;border:0;color:var(--gris);
  font-size:13px;text-decoration:underline;cursor:pointer;padding:6px;font-family:inherit}

/* El barrido recorre el marco entero y vuelve. --alto lo pone medirCajaDoc
   con la altura real del marco, que cambia con el teléfono y con la cara. */
@keyframes doc-barre{
  0%{transform:translateY(0)}
  100%{transform:translateY(var(--alto,300px))}
}
@keyframes doc-respira{
  0%,100%{opacity:.55}
  50%{opacity:1}
}
/* EL ROSTRO, con las mismas capas que la cédula. Su óvalo y su malla los sigue
   dibujando el lienzo, porque eso SÍ sale de lo que se mide; esto es el marco
   de alrededor, que es lo que hace que parezca un aparato y no un formulario. */
.escaner{--tono:245,197,66}
.escaner.enganchado{--tono:124,255,196}
.cara-esq{position:absolute;inset:8px;border-radius:16px;pointer-events:none;
  background:
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 0/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 0/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 0 100%/26px 3px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/3px 26px no-repeat,
    linear-gradient(rgb(var(--tono)) 0 0) 100% 100%/26px 3px no-repeat;
  filter:drop-shadow(0 0 6px rgba(var(--tono),.7));
  transform:scale(1.03);opacity:.8;
  transition:transform .22s cubic-bezier(.2,1.3,.4,1),opacity .22s linear}
.escaner.enganchado .cara-esq{transform:scale(1);opacity:1}
.cara-red{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s linear;
  background-image:
    repeating-linear-gradient(90deg,rgba(var(--tono),.18) 0 1px,transparent 1px 30px),
    repeating-linear-gradient(0deg,rgba(var(--tono),.18) 0 1px,transparent 1px 30px)}
.escaner.enganchado .cara-red{opacity:1;animation:doc-respira 2.4s ease-in-out infinite}
.cara-barrido{position:absolute;left:0;right:0;top:-70px;height:70px;pointer-events:none;
  animation:cara-barre 2.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.cara-barrido::before{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;
  background:linear-gradient(to top,rgba(var(--tono),.25),transparent)}
.cara-linea{position:absolute;left:6%;right:6%;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgb(var(--tono)) 18%,#fff 50%,rgb(var(--tono)) 82%,transparent);
  box-shadow:0 0 18px 4px rgba(var(--tono),.6)}
@keyframes cara-barre{
  0%{transform:translateY(0)}
  100%{transform:translateY(var(--alto,340px))}
}
@keyframes doc-check{
  0%{transform:scale(.4);opacity:0}
  100%{transform:scale(1);opacity:1}
}
@keyframes doc-aparece{
  0%{opacity:0}
  100%{opacity:1}
}
@media (prefers-reduced-motion: reduce){
  /* Quieto no es enseñar menos: el marco, las esquinas y la retícula se
     quedan —que es lo que informa— y lo único que se detiene es el barrido,
     que es lo que se mueve. */
  .doc-barrido,.cara-barrido{animation:none;transform:translateY(var(--alto,300px))}
  .doc-red,.cara-red{animation:none}
  .escaner-doc.leido .doc-check,.escaner-doc.leido .doc-listo{animation:none}
}
</style>

   que Joan describió como «el sistema los devuelve y no pueden continuar», y
   está reproducido: recargar la página en el paso 2 devuelve al 1.

   que el arreglo del 17-sep no sirviera en el teléfono del cliente aunque
   estuviera publicado: Android NUNCA restaura el sessionStorage de una
   pestaña. Cuando la app de cámara tapa al navegador y el sistema lo mata
   por memoria —Android lo advierte: «casi seguro» con la cámara—, la pestaña
   vuelve con su dirección (#registro incluido) pero con un almacén de sesión
   NUEVO (Chromium: kClearDiskStateOnOpen, «Session Storage doesn't support
   restore»). El paso valía 0 otra vez, y 0 es «Tu celular y tu contraseña».
   Verificado en escritorio funcionaba, porque ahí sí existe el servicio de
   sesión que lo restaura; en el celular, nunca.

   la actividad pasa a segundo plano (el borrador y las fotos ya vivían ahí y
   por eso volvían). Va con la hora: un registro de hace más de un día no se
   retoma solo (ver EC.checkpointFresco). */
var LLAVE_PASO = 'play_registro_paso';

}

  try {

}
function leerPaso() { var c = leerCheckpoint(); return c ? c.paso : 0; }
/* 17-sep-2026 — «NO HAY PASO» Y «PASO 1» NO SON LO MISMO, y confundirlos era la
   mitad del problema. `leerPaso` devuelve 0 en los dos casos, así que con solo
   ese dato no se puede decidir si a alguien hay que devolverlo al registro o
   dejarlo en la portada. Esta pregunta es la que lo distingue. */

  var c = leerCheckpoint();

     Joan vio con una clienta de verdad: «desde el link te lleva directo a crear
     cuenta y no a la pagina de inicio».

     siguientes, CADA visita al enlace cayera en el formulario y la persona no

     guarda por tecla (anotarCampo) y se repinta al entrar al formulario. */

/* ------------------------------------------------- DÓNDE ESTÁ LA PERSONA
   El registro tiene su propia dirección (#registro) y las otras dos vistas la
   quitan. No es cosmética: es lo que hace que una recarga —la que provoca la
   cámara del sistema— caiga donde la persona estaba. Se usa replaceState y no
   el hash directo para NO llenar el historial con nueve entradas: el botón
   «atrás» del teléfono tiene que sacar de la app, no recorrer el formulario

function marcarVista(hash) {
  try {

}

function entrar() {
  var tel = U.normalizarTelefono($('inTel').value);
  var clave = $('inClave').value || '';
  var err = $('errEntrar');
  err.classList.add('oculto');
  if (!tel) return fallo(err, 'Nos falta tu celular completo: son 10 números y empiezan por 3.');
  if (!clave) return fallo(err, 'Nos falta tu contraseña.');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que aún no se puede entrar. ' +
      'Esto es una versión en construcción.');

  fallo(err, 'Conectando…');

     lo ve. La contraseña se manda una sola vez y no se guarda en ninguna parte
     de este archivo. */

    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
    body: JSON.stringify({ email: U.correoDeTelefono(tel), password: clave })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (r) {
      if (!r.ok) {

           convertiría la app en un oráculo de quién es cliente. */
        return fallo(err, 'Esos datos no nos abren la cuenta. Revísalos con calma, y si ' +
          'sigue sin entrar toca «Olvidé mi contraseña» y te echamos una mano.');

    .catch(function () { fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.'); });
}

   dentro de rpcSesion, deja de funcionar para el único que la necesita. */
function mandarAyuda() {
  var err = $('errAyuda'); if (!err) return;
  var tel = U.normalizarTelefono(($('ayTel') || {}).value || '');
  if (!tel) return fallo(err, 'Nos falta tu celular: son 10 números y empiezan por 3.');
  var nota = String((($('ayNota') || {}).value || '')).slice(0, 300);
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  }
  fallo(err, 'Enviando…');
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/pedir_ayuda_clave', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_celular: tel, p_nota: nota })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      if (!j || j.ok !== true) {
        /* Cada motivo dice algo distinto. «No se pudo» tapando un celular mal
           escrito deja a la persona tocando el mismo botón para siempre. */
        var m = j && j.motivo;
        return fallo(err, m === 'celular'
          ? 'Ese celular no nos cuadra: son 10 números y empiezan por 3.'
          : m === 'muchas'
          ? 'Ya nos dejaste un recado hace poco. Lo tenemos; dale un rato y te escribimos.'
          : 'No pudimos recibir tu recado ahora. Vuelve a intentar en unos minutos.');
      }
      $('titulo').textContent = 'Recado enviado';
      $('cuerpo').innerHTML =
        '<div class="card"><div class="aviso verde"><b>Listo, lo recibimos.</b></div>' +
          '<p class="sub" style="margin-top:var(--e4)">Te escribimos al ' +
          esc(U.telefonoBonito(tel)) + ' para devolverte el acceso. Si recuerdas tu ' +
          'contraseña antes, entra normal: el recado no bloquea nada.</p>' +
          '<button class="btn arriba" onclick="pintarEntrar()">Volver a la entrada</button>' +
        '</div>' + pie();
      window.scrollTo(0, 0);
    })
    .catch(function () {
      fallo(err, 'No pude enviar tu recado. Revisa tu internet y vuelve a intentar.');
    });
}

/* ================= LA VERIFICACIÓN POR WHATSAPP =================
   24-ago-2026, decisión de Joan: nada de SMS pagos. El registrado manda su
   código de verificación por WhatsApp DESDE su propio número; como el mensaje
   llega con el remitente puesto por WhatsApp —no por él—, si el número y el
   código cuadran con la bandeja del CRM, el celular queda verificado gratis.
   El verificador es Joan, que de todas formas iba a escribirle antes de
   aprobar: esto solo le ahorra la duda de si el número es de verdad.

   La forma V-##### es A PROPÓSITO distinta de los otros tres códigos de la
   casa (TG-XXXX-XXXX invita, 5 letras abre la app, CL-0001 solo numera): ya
   son tres y confundirlos es el error natural. Puros dígitos, además, se
   dictan fácil por teléfono. */
var VERIF_ULTIMA = '';
function codigoVerificacion() {
  var a = new Uint32Array(1);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else a[0] = Math.floor(Math.random() * 1e9);
  return 'V-' + String(10000 + (a[0] % 90000));
}
/* 8-sep-2026: verificarPorWhatsApp() se retiró — el paso siguiente al registro es
   pedir el primer crédito (pedirPrimerCredito), no mandar un código por WhatsApp. */

/* ============================== REGISTRO ==============================
   En pasos y no en una sola página de 26 campos: nadie llena eso de una
   sentada, y una pantalla de scroll infinito es donde la gente abandona. El
   borrador se guarda solo, menos la contraseña. */
var PASOS = [
  { id: 'entrada',  titulo: 'Tu celular y tu contraseña' },
  { id: 'documento', titulo: 'Tu cédula' },
  { id: 'rostro',    titulo: 'Tu rostro' },
  { id: 'identidad', titulo: 'Quién eres' },
  { id: 'contacto',  titulo: 'Cómo te contactamos' },
  { id: 'domicilio', titulo: 'Dónde vives' },
  { id: 'ingresos',  titulo: 'De qué vives' },
  { id: 'referencias', titulo: 'Quién puede responder por ti' },
  { id: 'permiso',  titulo: 'Tu autorización' }
];

/* ===========================================================================
 * «QUIERO QUE MI ASESOR ME ACOMPAÑE» — 15-sep-2026
 *
 * Joan pidió poder ver al cliente registrándose, con sus fotos, para guiarlo por
 * teléfono. Construirlo sin más tenía un problema que no es de opinión:
 *
 * HOY NADA SALE DE ESTE TELÉFONO HASTA EL PASO 9, y la casilla que autoriza las
 * fotos está EN el paso 9. Quien la desmarca consigue que sus fotos no salgan —
 * eso funciona de verdad, está en tomarFoto/siguientePaso. Publicar la foto en
 * el paso 2 volvería esa garantía papel mojado: cuando la persona llegue a
 * decidir, el asesor ya la vio, y eso no se deshace.
 *
 * Así que el permiso va PRIMERO y es del cliente: toca el botón, y solo desde
 * ahí se publica. Se apaga cuando quiera, con el mismo botón.
 *
 * LO QUE NO SE MANDA NUNCA, ni con el permiso puesto:
 *   · las referencias — son nombre y celular de DOS personas que no son quien
 *     está registrándose y que no autorizaron nada. Y la Ley 2300 ya le prohíbe
 *     a Joan contactarlas: tenerlas anotadas sería exposición sin ningún uso.
 *   · la contraseña.
 *   · la ubicación — el GPS se pide en el paso 2 pero se autoriza en el 9.
 * Acá se filtra, y el SERVIDOR lo vuelve a filtrar (registro_vivo_publicar).
 * Dos rejas para lo mismo: una pantalla se puede saltar.
 * ========================================================================= */
var ACOMPANA = false;
try { ACOMPANA = localStorage.getItem('tg_acompana') === '1'; } catch (e) {}

function tarjetaAcompanar() {
  /* Sin celular no hay a quién asociarlo: el asesor lo encuentra por su número. */
  if (!REGISTRO.celular) return '';
  return '<div class="aviso ' + (ACOMPANA ? 'verde' : 'info') + '" style="margin-top:var(--e3)">' +
    (ACOMPANA
      ? '<b>Tu asesor te está acompañando.</b> Ve en qué paso vas y las fotos que subas, ' +
        'para poder guiarte si llamas. No ve tu contraseña, ni tus referencias, ni dónde estás.' +
        '<button class="btn sec sm" style="margin-top:var(--e2)" onclick="acompanar(false)">' +
        'Prefiero seguir solo</button>'
      : '<b>¿Quieres que un asesor te acompañe?</b> Si lo activas, podrá ver en qué paso vas ' +
        'y las fotos que subas, para guiarte por teléfono. Nunca ve tu contraseña, ni tus ' +
        'referencias, ni dónde estás. Lo puedes apagar cuando quieras.' +
        '<button class="btn sec sm" style="margin-top:var(--e2)" onclick="acompanar(true)">' +
        'Sí, que me acompañe</button>') +
    '</div>';
}

function acompanar(si) {
  ACOMPANA = !!si;
  try { localStorage.setItem('tg_acompana', si ? '1' : '0'); } catch (e) {}
  if (si) publicarAvance();
  else borrarAvance();
  pintarRegistro(PASO);
}

/* Lo que se publica. Se arma una lista BLANCA —lo que sí entra— y no una negra:
   una lista negra hay que acordarse de ampliarla cada vez que el formulario
   gane un campo, y ese olvido es el que manda de más. */
var CAMPOS_QUE_SE_PUBLICAN = ['nombres', 'apellidos', 'documento', 'tipo_doc',
                              'celular', 'correo', 'nacimiento'];

function publicarAvance() {
  if (!ACOMPANA || !REGISTRO.celular) return Promise.resolve();
  if (!CFG.url || !CFG.anon) return Promise.resolve();

  var avance = {};
  CAMPOS_QUE_SE_PUBLICAN.forEach(function (k) {
    if (REGISTRO[k]) avance[k] = String(REGISTRO[k]).slice(0, 80);
  });

  /* Las fotos SOLO si la persona ya marcó la autorización de fotos. Es la misma
     casilla del paso 9: si todavía no la marcó, el acompañamiento muestra el
     avance pero no las imágenes. Dos permisos distintos para dos cosas
     distintas, y ninguno vale por el otro. */
  var fotos = {};
  if (FOTOS.sensibles) {
    ['cedula_frente', 'cedula_reverso'].forEach(function (k) {
      if (FOTOS[k]) fotos[k] = FOTOS[k];
    });
    /* LA SELFIE NO VIAJA. Es biometría —la categoría más sensible de la Ley
       1581— y para guiar a alguien por teléfono no hace falta: lo que se
       atasca es el código de barras de la cédula, no la cara. */
  }

  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_publicar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: REGISTRO.celular,
      p_paso: PASO + 1,
      p_de: PASOS.length,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).trim(),
      p_avance: avance,
      p_fotos: fotos
    })
  }).catch(function () { /* sin señal se sigue registrando igual */ });
}

function borrarAvance() {
  if (!REGISTRO.celular || !CFG.url || !CFG.anon) return Promise.resolve();
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registro_vivo_borrar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_celular: REGISTRO.celular })
  }).catch(function () {});
}

function pintarRegistro(paso) {
  VISTA = 'registro';
  PASO = Math.max(0, Math.min(paso, PASOS.length - 1));
  guardarPaso(PASO);   // por si el teléfono recarga al volver de la cámara
  /* 17-sep-2026 — Y LA DIRECCIÓN TAMBIÉN, que es lo que faltaba desde el 9-sep.
     El paso se guardaba bien, pero el arranque solo lo leía si la dirección
     terminaba en #registro — y esta función nunca la ponía. Quien abre
     tugarantia.net/play/ y toca «Abrir mi cuenta» se quedaba sin ese trozo de
     dirección, así que al volver de la cámara la página lo dejaba en la
     portada, frente a la caja que pide celular y contraseña. Es exactamente lo
     que Joan describió: «la página lo devuelve y nuevamente tiene que ingresar
     la contraseña». Reproducido recargando el banco de pruebas en el paso 2. */
  marcarVista('#registro');
  var p = PASOS[PASO];
  $('titulo').textContent = 'Abrir mi cuenta';

  var barra = '<div class="pasos">' + PASOS.map(function (_, i) {
    return '<i class="' + (i < PASO ? 'hecho' : (i === PASO ? 'aqui' : '')) + '"></i>';
  }).join('') + '</div>';

  detenerEscaner();   // por si venía del paso del rostro
  detenerEscanerDoc();  // o del de la cédula
  var cuerpo;
  if (p.id === 'entrada')      cuerpo = pasoEntrada();
  else if (p.id === 'documento') cuerpo = pasoDocumento();
  else if (p.id === 'rostro')  cuerpo = pasoRostro();
  else if (p.id === 'permiso') cuerpo = pasoPermiso();
  else                         cuerpo = (p.id === 'identidad' ? notaCedulaLeida() : '') + pasoCampos(p.id);

  $('cuerpo').innerHTML =
    '<div class="card">' +
      '<div class="etq">Paso ' + (PASO + 1) + ' de ' + PASOS.length + '</div>' +
      barra +
      '<h3 class="tit" style="margin-top:var(--e3)">' + esc(p.titulo) + '</h3>' +
      cuerpo +
      /* 15-sep-2026 — el acompanamiento. Va DESPUES del contenido del paso y
         antes del boton: es una eleccion sobre lo que acaba de hacer, no una
         puerta para entrar. */
      tarjetaAcompanar() +
      '<div id="errReg" class="aviso ambar oculto"></div>' +
      '<button class="btn arriba" onclick="siguientePaso()">' +
        (PASO === PASOS.length - 1 ? 'Abrir mi cuenta' : 'Continuar') + '</button>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="' +
        (PASO === 0 ? 'pintarEntrar()' : 'pintarRegistro(' + (PASO - 1) + ')') + '">Volver</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
  /* Cada vez que cambia de paso, si dio permiso, se publica. En un try porque un
     acompanamiento que falle NO puede impedirle abrir su cuenta. */
  try { publicarAvance(); } catch (e) {}
  if (p.id === 'rostro' && FOTOS.sensibles && !hayFotoLista('selfie')) setTimeout(iniciarEscaner, 50);
  if (p.id === 'documento' && FOTOS.sensibles && !FOTOS.gps && !FOTOS.gps_error) pedirGps();
}

function pasoEntrada() {
  return '<p class="sub">Tu celular es tu usuario: con él entras a la app. Todo lo que ' +
    'tengamos que decirte te lo decimos en el chat, aquí adentro.</p>' +
    '<label for="rTel">Tu celular</label>' +
    '<input id="rTel" type="tel" inputmode="numeric" autocomplete="username" placeholder="300 111 2233" ' +
      'oninput="anotarCelular(this)" value="' +
      esc(REGISTRO.celular ? U.telefonoBonito(REGISTRO.celular) : '') + '">' +
    '<div class="ayuda">Son 10 números y empiezan por 3. Tiene que tener WhatsApp: ' +
      'por ahí te mandamos tu código si olvidas la contraseña.</div>' +
    /* 17-sep-2026 — LA CONTRASEÑA NO SE DEVUELVE AL CAMPO, Y SE PUEDE SEGUIR
       SIN TECLEARLA. Las dos mitades importan.

       Se intentó rellenarla —para que quien vuelve del susto de la cámara no la
       escriba otra vez, y dos veces— y se deshizo el mismo día: en un teléfono
       que se presta, la siguiente persona que abre esa pestaña se encuentra el
       registro del anterior con su contraseña puesta en el formulario. Podría
       crear la cuenta con ella, y la tiene en el DOM. El ahorro de teclear no
       paga eso.

       Lo que sí se hace: si en esta pestaña ya se creó una contraseña, se dice
       y se deja continuar en blanco. La clave sigue viviendo solo en
       sessionStorage, no toca localStorage y no viaja en el borrador. */
    '<label for="rClave">' + (CLAVE_EN_MEMORIA ? 'Tu contraseña' : 'Crea tu contraseña') + '</label>' +
    campoClave('rClave', 'new-password') +
    '<div class="ayuda">' + (CLAVE_EN_MEMORIA
      ? 'Ya creaste tu contraseña en este teléfono. Déjalo en blanco para seguir con la misma, o escribe una nueva.'
      : 'Mínimo ' + U.LARGO_MINIMO_CLAVE + ' caracteres. No uses tu celular ' +
        'ni tu cédula: son lo primero que alguien probaría.') + '</div>' +
    '<label for="rClave2">' + (CLAVE_EN_MEMORIA ? 'Si la cambias, escríbela otra vez' : 'Escríbela otra vez') + '</label>' +
    campoClave('rClave2', 'new-password');
}

/* BORRAR EL REGISTRO DE OTRO — 17-sep-2026.
   El borrador, las fotos y el paso viven en el teléfono para que nadie pierda
   media hora de trabajo por una recarga. El precio es que en un teléfono
   prestado la siguiente persona se encuentra el registro del anterior, con su
   nombre, su cédula y las fotos. Hasta hoy no había forma de soltarlo: el
   borrador solo se borraba al crear la cuenta. Esto es esa forma, y borra TODO
   —incluida la contraseña en curso y la marca que autoriza a subir las fotos—,
   no solo lo que se ve. */
function empezarDeNuevo() {
  try { localStorage.removeItem(LLAVE_BORRADOR); } catch (e) {}
  try { localStorage.removeItem(LLAVE_FOTOS); } catch (e) {}
  olvidarPaso(); olvidarClaveEnCurso(); olvidarDuenoDeLasFotos(); olvidarCuentaCreada();
  /* 21-sep-2026 — el acompañamiento también. «Empezar de cero» prometía borrar
     TODO y dejaba encendido el del anterior: el asesor de otra persona seguiría
     viendo el paso y las fotos del que llegue después en ese teléfono. */
  ACOMPANA = false;
  try { localStorage.setItem('tg_acompana', '0'); } catch (e) {}
  REGISTRO = {}; FOTOS = {}; CLAVE_EN_MEMORIA = '';
  pintarRegistro(0);
}

/* Anota un campo del registro en cuanto se escribe. El id del elemento lleva el
   prefijo «f_» porque así los pinta pasoCampos y así los lee recogerPaso: un
   solo sitio decide el nombre. */
/* Los tres campos que el código de barras rellena solo. Son los únicos donde
   «lo escribió la persona» y «lo leyó la máquina» se pueden confundir. */
var CAMPOS_DE_LA_CEDULA = ['nombres', 'apellidos', 'documento'];

function anotarCampo(el) {
  if (!el || !el.id || el.id.indexOf('f_') !== 0) return;
  var campo = el.id.slice(2);
  /* 22-sep-2026 — SE ANOTA QUIÉN ESCRIBIÓ CADA COSA, y hace falta por un
     camino concreto: «Volver» deja regresar al paso de la cédula después de
     haber corregido la identidad, y un reescaneo pisaba lo corregido en
     silencio. Sin esta marca, quien reescanea sale como si nunca hubiera
     tocado nada — y el cotejo del servidor diría lo contrario de lo que pasó.

     La marca la pone el teléfono, así que es falsificable: es una PISTA para
     Joan, nunca una prueba. El veredicto de verdad lo sigue calculando el
     servidor comparando los dos textos. */
  if (CAMPOS_DE_LA_CEDULA.indexOf(campo) >= 0 && FOTOS.cedula_leida
      && String(el.value || '') !== String(FOTOS.cedula_leida[campo] || '')) {
    FOTOS.cedula_editado = FOTOS.cedula_editado || {};
    FOTOS.cedula_editado[campo] = true;
    guardarFotos();
  }
  REGISTRO[campo] = el.value;
  guardarBorrador(REGISTRO);
}
/* 21-sep-2026 — el celular del paso 1 también se anota por tecla. Solo llegaba
   al borrador al tocar «Continuar», así que quien lo escribía y perdía la
   pestaña volvía a un campo vacío mientras la página le prometía «con lo que
   ya habías escrito». La contraseña NO: esa sigue sin guardarse por tecla. */
function anotarCelular(el) {
  var t = U.normalizarTelefono(el && el.value);
  if (t) { REGISTRO.celular = t; guardarBorrador(REGISTRO); }
}

/* ------------------------------------------------- VER LA CONTRASEÑA
   21-sep-2026 — Joan: «el cliente no puede ver la contraseña que está
   poniendo». Un campo de contraseña en un celular, con el teclado tapando
   media pantalla y puntos en vez de letras, es donde más se equivoca la
   gente y donde menos lo nota: la crea mal dos veces iguales y no vuelve a
   entrar. El ojo alterna type password/text sobre el MISMO campo, así que
   nada más cambia: los ids, el autocompletado y las pruebas que los leen
   siguen iguales. */
function campoClave(id, autocompletar) {
  return '<div class="clave-caja">' +
    '<input id="' + id + '" type="password" autocomplete="' + autocompletar + '" ' +
      'autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">' +
    '<button type="button" class="ojo" aria-label="Mostrar la contraseña" title="Ver la contraseña" ' +
      'onclick="verClave(\'' + id + '\', this)">' + iconoOjo() + '</button></div>';
}
function iconoOjo() {
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">' +
    '<path class="ojo-abierto" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
    '<circle class="ojo-abierto" cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
    '<path class="ojo-raya" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
}
function verClave(id, btn) {
  var i = $(id); if (!i) return;
  var ver = i.type === 'password';
  i.type = ver ? 'text' : 'password';
  if (btn) {
    btn.setAttribute('aria-label', ver ? 'Ocultar la contraseña' : 'Mostrar la contraseña');
    btn.classList.toggle('viendo', ver);
  }
  try { i.focus(); } catch (e) {}
}

function pasoCampos(grupo) {
  return U.camposDelGrupo(grupo).map(function (c) {
    var v = REGISTRO[c.id] === undefined ? '' : REGISTRO[c.id];
    var etiqueta = '<label for="f_' + c.id + '">' + esc(c.etiqueta) +
      (c.obligatorio ? '' : ' <span class="opc">· opcional</span>') + '</label>';
    /* 17-sep-2026 — SE GUARDA MIENTRAS SE ESCRIBE, no al tocar «Continuar».
       El borrador solo se escribía al pasar de paso, así que quien tecleaba su
       dirección y perdía la pestaña —la cámara la tumba, pero la memoria de un
       teléfono barato la tumba en cualquier paso— volvía y se encontraba el
       paso en blanco. Y desde hoy con un agravante: la página le dice «no
       perdiste nada». Una pantalla que promete eso tiene que cumplirlo.
       Sin temporizador a propósito: el borrador es un objeto de texto de un par
       de kilos y escribirlo cuesta menos que el temporizador que lo evitaría. */
    var apunta = ' oninput="anotarCampo(this)" onchange="anotarCampo(this)"';
    var campo;
    if (c.tipo === 'opcion') {
      campo = '<select id="f_' + c.id + '"' + apunta + '>' +
        /* 21-sep-2026 — Joan: «en el cuestionario aparece una opción de escoge
           como una opción de respuesta lo cual es incorrecto». Tenía razón: se
           veía como una respuesta más. Pero BORRARLA sería peor — sin una
           opción vacía el navegador escoge la primera de la lista sola, y el
           cliente manda un dato que nunca eligió, en campos que deciden su
           cupo. Deshabilitada y oculta no se puede escoger y no sale en la
           lista; sigue siendo el valor inicial y `revisarVinculacion` sigue
           exigiendo que la persona elija. */
        '<option value="" disabled hidden' + (String(v) ? '' : ' selected') + '>Toca para elegir</option>' +
        c.opciones.map(function (o) {
          return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    } else {
      var tipo = c.tipo === 'celular' ? 'tel'
               : c.tipo === 'correo'  ? 'email'
               : c.tipo === 'fecha'   ? 'date'
               : c.tipo === 'numero' || c.tipo === 'pesos' ? 'text' : 'text';
      var modo = (c.tipo === 'celular' || c.tipo === 'numero' || c.tipo === 'pesos')
        ? ' inputmode="numeric"' : '';
      campo = '<input id="f_' + c.id + '" type="' + tipo + '"' + modo + apunta +
        ' value="' + esc(v) + '">';
    }
    /* El porqué se le MUESTRA al socio, no se queda en el código. Si un dato
       vale la pena pedirlo, vale la pena decir para qué; y si da vergüenza
       escribirlo, ese es el aviso de que no había que pedirlo. */
    return etiqueta + campo + '<div class="ayuda">' + esc(c.porque) + '</div>';
  }).join('');
}

function pasoPermiso() {
  return '<p class="sub">Para abrir tu cuenta necesitamos tu permiso para tratar tus datos, ' +
      'como manda la Ley 1581 de 2012.</p>' +
    '<label class="permiso"><input type="checkbox" id="autGeneral"><span>' +
      '<b>Autorizo el tratamiento de mis datos personales.</b>' +
      '<span class="muted">Los usamos para evaluar y llevar tu crédito, y para escribirte ' +
      'sobre tus pagos. No los vendemos. Puedes pedirnos que te digamos qué tenemos tuyo, ' +
      'que lo corrijamos o que lo borremos, cuando quieras.</span></span></label>' +
    '<label class="permiso"><input type="checkbox" id="autSensible"' + (FOTOS.sensibles ? ' checked' : '') + '><span>' +
      'Autorizo también la foto de mi cédula, la de mi rostro y mi ubicación.' +
      '<span class="muted">Esto es aparte y es opcional: tu cuenta se abre igual sin ' +
      'marcarlo. La ley no permite condicionarte el servicio a que lo des.</span></span></label>' +
    '<div class="aviso" style="margin-top:var(--e4)"><b>Lo que esta app NO te pide:</b> ' +
      'no accede a tus mensajes, ni a tus llamadas, ni a tus contactos, ni a tus fotos guardadas. ' +
      'Solo la cámara en el momento de tomar la foto, y tu ubicación una sola vez, si la autorizas.</div>' +
    '<div class="ayuda" style="margin-top:var(--e3)">' +
      '<a href="../legal/privacidad.html" target="_blank" rel="noopener">Leer la política completa</a> · ' +
      '<a href="../legal/terminos.html" target="_blank" rel="noopener">Términos</a></div>' +
    cajaClaveFinal();
}
/* Solo aparece cuando la contraseña en curso no está (la relanzada de Android
   se la lleva con el sessionStorage). Ver siguientePaso, rama «permiso». */
function cajaClaveFinal() {
  if (CLAVE_EN_MEMORIA) return '';
  return '<div class="aviso ambar" id="cajaClaveFin" style="margin-top:var(--e4)">' +
      '<b>Una cosa más: tu contraseña.</b> Por seguridad no se guarda en el teléfono, ' +
      'y si la página se volvió a abrir ya no la tenemos. Escríbela una vez más y abrimos tu cuenta con ella.' +
      '<label for="rClaveFin">Tu contraseña</label>' + campoClave('rClaveFin', 'new-password') +
      '<label for="rClaveFin2">Escríbela otra vez</label>' + campoClave('rClaveFin2', 'new-password') +
    '</div>';
}

function recogerPaso() {
  var p = PASOS[PASO];
  if (p.id === 'entrada') {
    var tel = U.normalizarTelefono($('rTel').value);
    if (tel) REGISTRO.celular = tel;
    return { clave: $('rClave').value, clave2: $('rClave2').value };
  }
  if (p.id === 'permiso') {
    var cf = $('rClaveFin'), cf2 = $('rClaveFin2');
    return { general: $('autGeneral').checked, sensibles: $('autSensible').checked,
             claveFin: cf ? (cf.value || '') : '', claveFin2: cf2 ? (cf2.value || '') : '' };
  }
  if (p.id === 'documento' || p.id === 'rostro') return {};
  U.camposDelGrupo(p.id).forEach(function (c) {
    var el = $('f_' + c.id);
    if (el) REGISTRO[c.id] = el.value;
  });
  guardarBorrador(REGISTRO);
  return {};
}

var CLAVE_EN_MEMORIA = leerClaveEnCurso();   // vive solo mientras la pestaña está abierta

function siguientePaso() {
  var err = $('errReg');
  err.classList.add('oculto');
  var extra = recogerPaso();
  var p = PASOS[PASO];

  if (p.id === 'entrada') {
    if (!REGISTRO.celular) return fallo(err, 'Nos falta tu celular: son 10 números y empiezan por 3.');
    /* En blanco Y con una contraseña ya creada en esta pestaña = «sigo con la
       misma». Es lo que dice la ayuda del campo, y es lo que le permite a quien
       volvió del susto de la cámara continuar sin teclearla dos veces sin que
       la contraseña tenga que volver al formulario. */
    if (!extra.clave && !extra.clave2 && CLAVE_EN_MEMORIA) {
      extra.clave = extra.clave2 = CLAVE_EN_MEMORIA;
    }
    var rc = U.revisarContrasena(extra.clave, { telefono: REGISTRO.celular, cedula: REGISTRO.documento });
    if (!rc.ok) return fallo(err, rc.motivo);
    if (extra.clave !== extra.clave2) return fallo(err, 'Las dos contraseñas no quedaron iguales. Escríbelas otra vez, sin afán.');
    /* Las fotos guardadas son de un celular. Si este es otro, son de otra
       persona (o de otro intento): no se le pegan a este registro — ni ellas ni
       lo que se leyó de esa cédula, que si no viajaría al CRM con el nombre del
       anterior debajo del celular del nuevo. */
    if (FOTOS.de && FOTOS.de.celular && FOTOS.de.celular !== REGISTRO.celular) {
      soltarLasFotos();
      ['nombres', 'apellidos', 'documento', 'tipo_doc', 'expedicion'].forEach(function (k) { delete REGISTRO[k]; });
      guardarBorrador(REGISTRO);
    }
    CLAVE_EN_MEMORIA = extra.clave;
    guardarClaveEnCurso(extra.clave);
    guardarBorrador(REGISTRO);
    return pintarRegistro(PASO + 1);
  }

  if (p.id === 'permiso') {
    if (!extra.general) {
      /* 21-sep-2026 — decía «Sin tu autorización no podemos abrir la cuenta. Es
         un requisito de la ley.» Es cierto y suena a ventanilla. Lo mismo, pero
         explicando para qué sirve la casilla y de su lado. */
      return fallo(err, 'Nos falta tu permiso para usar tus datos: es la casilla de arriba, ' +
        'y sin ella la ley no nos deja abrirte la cuenta. Léela con calma; solo la usamos ' +
        'para tu crédito.');
    }
    /* 21-sep-2026 — LA CONTRASEÑA SE CONFIRMA AQUÍ SI NO ESTÁ. Vive solo en
       sessionStorage (la regla: nunca toca localStorage), y sessionStorage
       no vuelve de la relanzada de Android. Antes esto mandaba password ""
       al signup: «No pudimos crear la cuenta», sin camino de vuelta. Ahora el
       paso 9 la pide una sola vez, con el celular y los ocho pasos ya puestos,
       y nunca se manda una contraseña vacía. */
    if (!CLAVE_EN_MEMORIA) {
      var rcf = U.revisarContrasena(extra.claveFin, { telefono: REGISTRO.celular, cedula: REGISTRO.documento });
      if (!rcf.ok) return fallo(err, 'Nos falta tu contraseña. ' + rcf.motivo);
      if (extra.claveFin !== extra.claveFin2) return fallo(err, 'Las dos contraseñas no quedaron iguales. Escríbelas otra vez, sin afán.');
      CLAVE_EN_MEMORIA = extra.claveFin;
      guardarClaveEnCurso(CLAVE_EN_MEMORIA);
    }
    /* Si al final quita la casilla de sensibles, las fotos y el GPS que tomó no
       salen del teléfono: se borran antes de mandar nada. */
    if (!extra.sensibles) { FOTOS = { sensibles: false }; guardarFotos(); }
    return enviarRegistro(extra.sensibles);
  }
  /* Los dos pasos de fotos son opcionales: se pasa con o sin foto. */
  if (p.id === 'documento' || p.id === 'rostro') return pintarRegistro(PASO + 1);

  /* Falta algo obligatorio de ESTE paso. No se revisa el formulario entero:
     mandar al socio a un paso anterior por algo que aún no ha llenado es la
     forma más rápida de que cierre la app. */
  var r = U.revisarVinculacion(REGISTRO);
  var idsDelPaso = U.camposDelGrupo(p.id).map(function (c) { return c.id; });
  var faltanAqui = r.faltan.filter(function (f) { return idsDelPaso.indexOf(f.id) !== -1; });
  var errosAqui = r.errores.filter(function (e) { return idsDelPaso.indexOf(e.id) !== -1; });
  if (errosAqui.length) return fallo(err, errosAqui[0].motivo);
  if (faltanAqui.length) {
    return fallo(err, 'Nos falta ' + faltanAqui.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') + '. Con eso seguimos.');
  }
  pintarRegistro(PASO + 1);
}

function enviarRegistro(sensibles) {
  var err = $('errReg');
  var r = U.revisarVinculacion(REGISTRO);
  if (!r.ok) {
    return fallo(err, 'Antes de abrir tu cuenta nos falta: ' +
      r.faltan.map(function (f) { return f.etiqueta.toLowerCase(); }).join(', ') +
      '. Toca «Volver» y lo completamos.');
  }
  var autorizacion = U.armarAutorizacion(new Date().toISOString(), sensibles);

  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la cuenta no se ' +
      'puede crear todavía. Tus datos quedaron guardados en este teléfono y no se ' +
      'perdieron. Esto es una versión en construcción.');
  }

  /* El código de verificación nace aquí y viaja DENTRO de la vinculación: así
     llega a la bandeja del CRM sin una sola pieza nueva de plomería, y Joan lo
     compara con el que le llegue por WhatsApp. */
  VERIF_ULTIMA = codigoVerificacion();
  REGISTRO.verificacion = VERIF_ULTIMA;

  /* 21-sep-2026 — la reja: sin contraseña en memoria no se llama a nadie. El
     paso 9 la pide (cajaClaveFinal); esto es por si algún camino nuevo llega
     acá sin pasar por ahí. Antes salía password "" al signup y la bandeja de
     Joan recibía el registro de una cuenta que nunca se creó. */
  if (!CLAVE_EN_MEMORIA) {
    return fallo(err, 'Nos falta tu contraseña: escríbela en la casilla de arriba y vuelve a tocar «Abrir mi cuenta».');
  }

  fallo(err, 'Creando tu cuenta…');
  /* PRIMERO la bandeja de Joan, DESPUÉS la cuenta — y el orden es la garantía.
     Si fuera al revés y la bandeja fallara, la cuenta quedaría creada pero
     invisible para Joan (el defecto que este flujo tuvo hasta el 24-ago: el
     registro se iba solo a Supabase Auth y nadie lo leía). Así, si la bandeja
     falla no se crea nada y el cliente reintenta; y si la cuenta falla después,
     el registro YA está en la bandeja — reintentar no lo duplica, porque
     registrar_abierto es idempotente por celular. */
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/registrar_abierto', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({
      p_celular: REGISTRO.celular,
      p_nombre: ((REGISTRO.nombres || '') + ' ' + (REGISTRO.apellidos || '')).replace(/\s+/g, ' ').trim(),
      p_cedula: REGISTRO.documento || '',
      p_datos: REGISTRO
    })
  }).then(function (res) { return res.ok ? res.json() : Promise.reject(new Error('http ' + res.status)); })
    .then(function (r) {
      if (!r || r.ok !== true) {
        throw { humano: 'No pudimos recibir tu registro. Revisa tu celular y tu nombre, y vuelve a intentar en unos minutos.' };
      }
      return fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
        body: JSON.stringify({
          email: U.correoDeTelefono(REGISTRO.celular),
          password: CLAVE_EN_MEMORIA,
          data: { telefono: REGISTRO.celular, vinculacion: REGISTRO, autorizacion: autorizacion }
        })
      });
    })
    .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        var yaExiste = /registered|already/i.test(JSON.stringify(res.j || {}));
        /* 21-sep-2026 — YA TENÍA CUENTA: SE ENTRA, NO SE LE CIERRA LA PUERTA.
           Es lo que le pasó a la primera clienta de verdad. Se había registrado
           tres días antes; al volver a hacerlo, la bandeja de Joan recibió sus
           datos otra vez (registrar_abierto es idempotente por celular) pero el
           signup contestó «ya existe» y todo se cortaba aquí: sin sesión, y sin
           sesión `subirArchivosRegistro` ni siquiera se llama. Joan veía su
           información y no veía ni una foto.
           Como la contraseña que acaba de escribir es la misma cuenta, se
           intenta entrar con ella. Si es la correcta sigue como si nada —con su
           sesión, y sus fotos suben—. Si no lo es, recién ahí se le dice, y con
           el celular ya puesto en la caja de entrar. */
        if (yaExiste) return entrarConLaClaveDelRegistro(err, autorizacion);
        return fallo(err, 'No pudimos crear tu cuenta en este momento. Vuelve a intentarlo en un ratico; tus datos no se perdieron.');
      }
      try { localStorage.removeItem(LLAVE_BORRADOR); } catch (e) {}
      olvidarPaso(); olvidarClaveEnCurso();
      CLAVE_EN_MEMORIA = '';
      anotarCuentaCreada(REGISTRO.celular);
      /* 8-sep-2026 — con «Confirm email» apagado en Supabase, el signup devuelve
         la sesión entera: el recién registrado ya puede pedir. */
      /* 17-sep-2026 — Y SE GUARDA AQUÍ MISMO, que es el peor sitio donde
         perderla. Las dos pantallas que siguen —«tu cuenta quedó abierta» y la
         propuesta— no pasaban por pintarCuenta, así que la sesión solo vivía en
         memoria: una recarga en ese punto devolvía a la persona al formulario
         de nueve pasos, VACÍO (el borrador se acaba de borrar dos líneas más
         arriba) y sin una palabra de explicación, con la cuenta ya creada y sus
         fotos sin subir. Es el mismo defecto de la cámara, en el momento más
         caro del embudo. */
      if (res.j && res.j.access_token) { SESION = res.j; guardarSesionEnCurso(SESION); }
      pintarRegistrado();
      subidaEnSegundoPlano();   // si falla, queda anotado y se reintenta al abrir la cuenta
    })
    .catch(function (e) {
      fallo(err, (e && e.humano) ? e.humano
        : 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
    });
}

/* Entra con el celular y la contraseña del registro, para el caso de quien ya
   tenía cuenta. Devuelve la misma promesa que el camino normal, así que el
   resto de enviarRegistro no se entera de por dónde vino la sesión. */
function entrarConLaClaveDelRegistro(err, autorizacion) {
  fallo(err, 'Ya tenías una cuenta con este celular. Te estamos entrando…');
  return fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon },
    body: JSON.stringify({ email: U.correoDeTelefono(REGISTRO.celular), password: CLAVE_EN_MEMORIA })
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j || !res.j.access_token) {
        /* La contraseña no es la de esa cuenta. Se le dice sin regañarlo y se
           le deja el celular puesto abajo, para que entre o recupere la clave. */
        fallo(err, 'Ya tienes una cuenta con este celular, pero esa contraseña no es la suya. ' +
          'Entra con la tuya aquí abajo, o toca «Olvidé mi contraseña» y te mandamos un código.');
        var t = $('inTel'); if (t) t.value = U.telefonoBonito(REGISTRO.celular);
        return;
      }
      SESION = res.j; guardarSesionEnCurso(SESION);
      try { localStorage.removeItem(LLAVE_BORRADOR); } catch (e) {}
      olvidarPaso(); olvidarClaveEnCurso();
      CLAVE_EN_MEMORIA = '';
      anotarCuentaCreada(REGISTRO.celular);
      pintarRegistrado();
      subidaEnSegundoPlano();   // sus fotos, que era lo que se perdía
    }, function () {
      fallo(err, 'Ya tienes una cuenta con este celular. Revisa tu internet e inténtalo otra vez, ' +
        'o entra con tu contraseña aquí abajo.');
    });
}

function pintarRegistrado() {
  VISTA = 'listo';
  /* 21-sep-2026 — se suelta #registro: una relanzada aquí caía en «Paso 1 de
     9» con el formulario vacío. Con la dirección limpia y la marca de cuenta
     creada, cae en la portada diciendo la verdad. */
  marcarVista('');
  $('titulo').textContent = 'Tu cuenta quedó abierta';
  /* 8-sep-2026 — Joan: «lo que quiero es que el cliente, después de que se
     registre, pueda automáticamente aplicar a un crédito». Antes esta pantalla
     mandaba a WhatsApp con un código de verificación; ahora el siguiente paso
     es pedir, y la propuesta sale al instante. El código de verificación sigue
     viajando en los datos del registro, para el CRM, sin pedirle nada a él. */
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Listo.</b> Tu cuenta quedó creada.</div>' +
      /* 21-sep-2026 — sin nombres propios. Joan: «no quiero que le digas al
         cliente que joan decide». Y sin inventar una verificación que no
         existe: se dice lo que de verdad pasa —se revisa y se contesta—, que
         es honesto y suena mejor que una persona decidiendo a mano. */
      '<p class="sub" style="margin-top:var(--e4)"><b>Ahora pide tu primer crédito.</b> ' +
      'Te mostramos de una la propuesta para clientes nuevos, en pesos, y la aceptas solo si te sirve. ' +
      'Revisamos tu solicitud y te avisamos aquí mismo cuándo y por dónde recibes la plata.</p>' +
      '<button class="btn arriba" onclick="pedirPrimerCredito()">Pedir mi primer crédito</button>' +
      '<div id="errPrimer" class="aviso ambar oculto"></div>' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="pintarCuenta()">Ir a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* ================= EL PRIMER CRÉDITO DEL NUEVO — 8-sep-2026 =================
   Pedido de Joan: que el recién registrado pida de una, reciba la contrapropuesta
   estándar para nuevos (la arma la base al instante, con la política que Joan
   edita en su CRM), la acepte aquí, y Joan solo tenga que desembolsar.

   Lo que esta pantalla NO hace: no crea un crédito. Aceptar es aceptar la
   propuesta; la plata la entrega Joan, a mano, y ahí nace el crédito. Se dice
   con esas palabras. Y al cliente se le habla en PESOS: ni un porcentaje. */
function rpcSesion(fn, cuerpo) {
  if (!SESION || !SESION.access_token) return Promise.reject({ sinSesion: true });
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + SESION.access_token },
    body: JSON.stringify(cuerpo || {})
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); });
}

function pedirPrimerCredito() {
  var err = $('errPrimer'); if (err) err.classList.add('oculto');
  if (!SESION || !SESION.access_token) {
    /* Sin sesión no se puede pedir. Pasa si la cuenta se creó en otro aparato:
       entra con su celular y su contraseña y de ahí sale la propuesta. */
    pintarEntrar();
    return;
  }
  if (err) fallo(err, 'Pidiendo…');
  rpcSesion('solicitar_primer_credito').then(function (j) {
    if (!j || j.ok !== true || !j.solicitud) {
      if (err) fallo(err, 'No pudimos recibir tu solicitud ahora. Espera unos minutos y vuelve a intentar.');
      return;
    }
    pintarSolicitud(j.solicitud);
  }).catch(function () {
    if (err) fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  });
}

/* La propuesta, en pesos y con la explicación de Joan. El botón de aceptar dice
   exactamente lo que se registra, y lo que NO pasa se dice también. */
function tarjetaContrapropuesta(sol) {
  var cp = sol.contrapropuesta || {};
  var aceptada = sol.estado === 'aceptada';
  var cambiada = cp.por === 'joan' && !aceptada;
  var h = '<div class="card">' +
    (cambiada ? '<div class="aviso ambar"><b>Te hicimos una propuesta nueva.</b> Léela y decide.</div>' : '') +
    '<div class="etq">' + (aceptada ? 'Tu primer crédito, aceptado' : 'Tu primer crédito') + '</div>' +
    (cp.texto ? '<p class="sub">' + esc(cp.texto) + '</p>' : '') +
    fila('Te prestamos', COP(cp.capital)) +
    fila('Lo que cuesta', COP(cp.costo)) +
    fila('Devuelves', COP(cp.total)) +
    '<div class="grupo-tit">Cuándo pagas</div>' +
    cuotasDePropuesta(cp);
  if (aceptada) {
    h += '<div class="aviso verde" style="margin-top:var(--e3)"><b>Listo: aceptaste ' + COP(cp.capital) + '.</b> ' +
      'Te avisamos <b>en el chat de la app</b> cuándo y por dónde recibes la plata, y ahí mismo ' +
      'te mandamos <b>tu código de acceso</b>: con él entras por el mismo enlace de siempre. ' +
      'No tienes que hacer nada más por ahora.</div>';
  } else {
    h += '<p class="sub" style="margin-top:var(--e3)">Aceptar todavía no te entrega la plata: ' +
        'es tu visto bueno a estas cifras. Después te avisamos cuándo y por dónde la recibes. ' +
        'Y si no te cuadra, no aceptes: no pasa nada y no pierdes nada.</p>' +
      '<button class="btn arriba" onclick="aceptarContrapropuesta(' + Number(sol.id) + ')">' +
        'Acepto: recibo ' + COP(cp.capital) + ' y devuelvo ' + COP(cp.total) + '</button>' +
      '<div id="errAceptar" class="aviso ambar oculto"></div>';
  }
  return h + '</div>';
}

/* Las cuotas de una propuesta, segmentadas. Si la propuesta trae cuotas se
   pintan una por una; si trae un solo pago se pinta ESE, con su fecha y su
   monto. Partir un pago único en tres renglones inventados sería la pantalla
   fabricando un acuerdo que nadie hizo. */
function cuotasDePropuesta(cp) {
  if (cp.cuotas && cp.cuotas.length) return cuadroCuotas(cp.cuotas);
  if (!cp.fecha_pago) return '';
  return fila('Pago único · ' + fmtFecha(cp.fecha_pago), COP(cp.total)) +
    '<div class="ayuda">Es un solo pago, ' + Number(cp.dias) + ' días después de ' +
      'que recibas la plata. No hay cuotas intermedias ni nada que pagar antes.</div>';
}

function pintarSolicitud(sol) {
  VISTA = 'solicitud';
  marcarVista('');
  $('titulo').textContent = sol.estado === 'aceptada' ? 'Tu primer crédito' : 'Tu propuesta';
  $('cuerpo').innerHTML = tarjetaContrapropuesta(sol) +
    '<div class="card"><button class="btn sec" onclick="pintarCuenta()">Ir a mi cuenta</button></div>' + pie();
  window.scrollTo(0, 0);
}

function aceptarContrapropuesta(id) {
  var err = $('errAceptar'); if (err) fallo(err, 'Registrando…');
  rpcSesion('aceptar_contrapropuesta', { p_id: id }).then(function (j) {
    if (!j || j.ok !== true || !j.solicitud) {
      if (err) fallo(err, 'No pudimos registrar tu aceptación. Vuelve a abrir la app: si la propuesta cambió, verás la nueva.');
      return;
    }
    pintarSolicitud(j.solicitud);
  }).catch(function () {
    if (err) fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.');
  });
}

/* La «notificación»: cada vez que abre su cuenta, la app pregunta por su
   solicitud. Si hay una propuesta esperando (nueva o cambiada por Joan), sale
   arriba de todo; si ya aceptó, sale el aviso de que Joan le escribe. */
function cargarMiSolicitud() {
  var caja = $('solicitudBox'); if (!caja || !SESION || !SESION.access_token) return;
  rpcSesion('mi_solicitud').then(function (j) {
    var sol = j && j.ok === true ? j.solicitud : null;
    if (!sol || !sol.contrapropuesta) { caja.innerHTML = ''; return; }

/* UNA SOLA DECODIFICACIÓN, VARIOS TAMAÑOS — 16-sep-2026.
   Decodificar la foto de un celular cuesta memoria de verdad: doce millones de
   píxeles son unos cuarenta megas de mapa de bits, y eso pasa justo cuando el
   navegador acaba de volver de la cámara y está en su peor momento. Antes se
   decodificaba TRES veces la misma foto (1600 para el código de barras, otra vez
   adentro del lector, y 900 para guardar). Ahora se decodifica una y de ahí
   salen los dos tamaños. */
function comprimirVarias(file, tamanos) {
  return new Promise(function (res, rej) {
    var url;
    try { url = URL.createObjectURL(file); } catch (e) { return rej(e); }
    var img = new Image();
    img.onload = function () {
      try {
        if (!img.width || !img.height) throw new Error('imagen vacia');
        var salidas = tamanos.map(function (t, indice) {
          var max = t[0], q = t[1];
          try {
          var w = img.width, h = img.height;
          if (w > h && w > max) { h = h * max / w; w = max; }
          else if (h >= w && h > max) { w = w * max / h; h = max; }
          var c = document.createElement('canvas');
          c.width = Math.round(w); c.height = Math.round(h);
          /* willReadFrequently desde el principio: a este lienzo se le pide
             getImageData para leer el código, y los atributos del contexto se
             fijan en la PRIMERA llamada — pedirlo después no sirve de nada y
             deja la lectura bajando de la GPU. */
          c.getContext('2d', q == null ? { willReadFrequently: true } : undefined).drawImage(img, 0, 0, c.width, c.height);
          /* 21-sep-2026 — con q en null se devuelve el LIENZO, no una cadena:
             es la versión que va al lector del código de barras, y el lector
             ya no quiere un data URL (tenía que volver a decodificar el JPEG y
             pasarlo por un <img> y un segundo lienzo: 15 MB de más). Quien lo
             recibe lo suelta al terminar (soltarLienzo). */
          if (q == null) return c;
          var out = c.toDataURL('image/jpeg', q);
          /* El lienzo se suelta a mano: en algunos Android se queda con la
             memoria del bitmap hasta la siguiente recolección. */
          c.width = c.height = 1;
          return out;
          } catch (e) {
            /* 21-sep-2026 — el PRIMER tamaño es la foto y sin ella no hay nada
               que hacer; los demás son comodidades (el grande para leer el
               código de barras) y su fallo no puede costarle la foto a nadie. */
            if (indice === 0) throw e;
            return null;
          }
        });
        res(salidas);
      } catch (e) { rej(e); }
      finally {
        try { URL.revokeObjectURL(url); } catch (e) {}
        img.src = ''; img.onload = img.onerror = null;
      }
    };
    img.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (e) {}
      rej(new Error('no pude abrir esa imagen'));
    };
    img.src = url;
  });
}

   ojos y una malla que respira. En el teléfono no se detecta ni se mide nada
   del rostro (eso sería biometría, y la app declara que no la procesa). A los
   tres segundos con la cámara encendida, dispara solo. */
/* Recorta el interior del óvalo del VÍDEO —no del lienzo pintado, que solo
   tiene el dibujo— y lo devuelve en gris, de LADO_MEDIR×LADO_MEDIR. El lienzo
   de medir no está en la pantalla: nadie lo ve y nunca sale del teléfono. */
function fotogramaGris(v) {
  if (!ESCANER.lienzoMedir) {
    ESCANER.lienzoMedir = document.createElement('canvas');
    ESCANER.lienzoMedir.width = LADO_MEDIR; ESCANER.lienzoMedir.height = LADO_MEDIR;
  }
  var c = ESCANER.lienzoMedir, x = c.getContext('2d', { willReadFrequently: true });

  /* El mismo recorte que dibuja el óvalo (0,32 y 0,36 del ancho y del alto),
     para que lo que se mide sea exactamente lo que la persona ve enmarcado. */
  var rx = w * 0.32, ry = h * 0.36;
  try { x.drawImage(v, w / 2 - rx, h / 2 - ry, rx * 2, ry * 2, 0, 0, LADO_MEDIR, LADO_MEDIR); }
  catch (e) { return null; }
  var d;
  try { d = x.getImageData(0, 0, LADO_MEDIR, LADO_MEDIR).data; } catch (e) { return null; }
  var g = new Array(LADO_MEDIR * LADO_MEDIR);
  for (var i = 0, j = 0; i < d.length; i += 4, j++) {
    g[j] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000;   // gris como lo ve el ojo
  }
  return g;
}

/* EL BUCLE MIRA EL FOTOGRAMA, NO EL RELOJ (9-sep-2026).
   Hasta ayer disparaba a los 3,2 segundos pasara lo que pasara —la pantalla
   prometía «cuando tu rostro esté quieto y centrado» y era mentira: apuntando
   al techo salía igual—. Ahora se piden CUADROS seguidos en verde, y la racha
   se cae en cuanto la persona se mueve o se sale del óvalo.
   Lo que decide está en app/cuenta.js, fuera de esta pantalla, para poder
   probarlo con fotogramas de mentira. Y lo que decide es un ENCUADRE: acá no se
   reconoce a nadie (eso sería biometría en el teléfono, y cambiaría la ficha de

function bucleEscaner() {
  if (!ESCANER.activo) return;

  if (!v || !c || !v.videoWidth) { ESCANER.temporizador = setTimeout(bucleEscaner, 120); return; }
  if (!ESCANER.desde) ESCANER.desde = Date.now();

  if (m && m.ok) ESCANER.estables++; else ESCANER.estables = 0;

     cara centrada y quieta, nunca por reloj. */

     número sea el mismo: a 720x960 son 2,76 MB por cuadro, y esto corría doce
     veces por segundo durante todo el escaneo del rostro, que puede pasar de
     los dieciocho segundos. Unos 33 MB por segundo de basura para el
     recolector, en el peor momento de memoria del teléfono y mientras la
     cámara ya tiene sus propios búferes.
     No es el pico de la foto: es la presión de fondo que hace que el pico
     siguiente sea el que mata.
     Ojo: redimensionar también BORRA el lienzo, así que el clearRect de abajo
     dejó de ser redundante y pasó a ser obligatorio. */

       rato peleando, se le recuerda que puede disparar a mano — quedarse
       atascado en el paso 3 de 9 con el teléfono en la cara es peor que una
       foto mal encuadrada. */
    var txt = m && m.ok
      ? 'Quieto… ' + Math.max(1, Math.ceil((U.ENCUADRE.CUADROS - ESCANER.estables) / 6))
      : U.textoDeEncuadre(m);
    if (!g) txt = 'Encendiendo la cámara…';
    else if (t > 18 && !(m && m.ok)) txt = 'Si no lo logras, toca «Tomar la foto ahora»';
    estado.textContent = txt;
  }

  if (ESCANER.estables >= U.ENCUADRE.CUADROS) { capturarRostro(); return; }
  ESCANER.temporizador = setTimeout(bucleEscaner, 80);
}
/* 9-sep-2026 — el dibujo dice la verdad: ámbar y punteado mientras busca,
   verde y entero cuando de verdad hay una cara centrada y quieta. Un escáner
   que se ve igual en los dos casos es decoración; este es una señal. */
function dibujarMarco(ctx, w, h, t, enganchado, avance) {
  ctx.save();

  ctx.setLineDash([]);
  var L = Math.min(w, h) * 0.08, m = Math.min(w, h) * 0.06;
  [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]].forEach(function (k) {
    ctx.beginPath(); ctx.moveTo(k[0], k[1] + L * k[3]); ctx.lineTo(k[0], k[1]); ctx.lineTo(k[0] + L * k[2], k[1]); ctx.stroke();
  });

     encendidos sobre una pared vacía serían la misma mentira de ayer. */
  if (!enganchado) { ctx.restore(); return; }
  /* la malla que respira dentro del óvalo */
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.clip();

  for (var y = -paso + d; y < h; y += paso) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.restore();
  /* los anillos de los ojos, donde suelen estar, latiendo */
  var pulso = 1 + 0.08 * Math.sin(t * 5);
  [[cx - rx * 0.42, cy - ry * 0.18], [cx + rx * 0.42, cy - ry * 0.18]].forEach(function (o) {
    ctx.strokeStyle = 'rgba(120,255,190,.95)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(o[0], o[1], rx * 0.20 * pulso, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(o[0], o[1], rx * 0.06, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o[0] - rx * 0.28, o[1]); ctx.lineTo(o[0] - rx * 0.22, o[1]); ctx.moveTo(o[0] + rx * 0.22, o[1]); ctx.lineTo(o[0] + rx * 0.28, o[1]); ctx.stroke();
  });

     si la persona se mueve, se cae y vuelve a empezar — que es justo lo que
     tiene que ver para entender qué le piden. */
  ctx.strokeStyle = 'rgba(120,255,190,.25)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx + 6, ry + 6, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,255,190,.95)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(cx, cy, rx + 6, ry + 6, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, avance || 0)); ctx.stroke();
  ctx.restore();
}
