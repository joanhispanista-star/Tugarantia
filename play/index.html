  }
  if (FICHA_ESTADO === 'sesion') {
    return '<div class="aviso ambar"><b>Tu sesión se venció.</b> Vuelve a entrar con tu celular y tu contraseña y sigues donde ibas.' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="salirDeCuenta()">Volver a entrar</button></div>';
  }
  if (FICHA_ESTADO === 'falla') {
    return '<div class="aviso ambar">No pude traer tu historial ahora. Vuelve a abrir la app en un rato.</div>';
  }
  return '';
}

/* ---------------------------- LÁMINA: CRÉDITO ----------------------------
   «Una pestaña para solicitar un nuevo crédito o EN SU DEFECTO que muestre la
   información del crédito activo». El orden es ese: lo que ya debe manda sobre
   lo que podría pedir. */
function laminaCredito() {
  var idPerfil = perfilDeSesion(SESION);
  var perfil = C.PERFILES[idPerfil];
  MONTO = Math.min(MONTO, perfil.cupo_maximo || 500000);
  MONTO = Math.max(MONTO, 100000);
  /* Y el plazo se pinza igual, por si un estado viejo trae uno fuera de rango:
     por debajo del piso de 90 días el motor lanza y la lámina sale en blanco. */
  PLAZO = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, PLAZO));
  /* 8-oct-2026 — EL SIMULADOR SE FUE, Y EN SU SITIO VA EL PEDIDO. El simulador
     cotizaba el producto a 6 meses (de 3 a 6 cuotas, con su precio y su tasa)
     y mandaba la solicitud por play_solicitar como préstamo con garantía: en el
     CRM de Joan caía con la etiqueta de un producto que el cliente no pidió.
     Ahora se pide igual que al terminar el registro —cuánto y para cuándo— y
     Joan contesta con la propuesta. tarjetaSimulador sigue en el archivo con
     sus pruebas; ver LA CALCULADORA (del producto a 6 meses). */
  return '<div id="solicitudBox"></div>' +
    avisoFicha() +
    tarjetaCreditoActivo() +
    tarjetaMiGarantia() +
    tarjetaCupo(perfil) +
    tarjetaPedir('enviarPedido()', 'Pide lo que necesitas') +
    tarjetaCalcGarantia();
}

/* EL CRÉDITO ACTIVO, CON SUS CUOTAS SEGMENTADAS. Joan: «que le aparezca
   segmentado la fecha y monto a pagar para mejorar la cobranza y dar claridad».
   Vale para los dos productos: el de garantía trae cuotas, el quincenal trae una
   sola fecha y se dibuja igual, con su renglón. */
function tarjetaCreditoActivo() {
  if (!FICHA) return '';
  var r = FICHA.respaldadoActivo, q = FICHA.activo;
  if (!r && !q) return '';
  var h = '';
  if (r) {
    var sig = FS.proximaCuota(r);
    h += '<div class="card laca">' +
      '<div class="etq">Tu crédito con garantía</div>' +
      (sig ? '<div class="cifra oro">' + COP(sig.total) + '</div>' +
             '<div class="muted" style="font-size:13.5px">es lo que sigue, el ' +
               esc(fmtFecha(sig.fecha)) + '</div>'
           : '<div class="cifra oro">Al día</div>') +
      '<div class="sep"></div>' +
      fila('Te prestamos', COP(r.capital)) +
      fila('Te falta', COP(r.saldo_capital != null ? r.saldo_capital : 0)) +
      '<div class="grupo-tit">Tus cuotas</div>' +
      cuadroCuotas(r.cuotas) +
      '</div>';
  }
  if (q) {
    h += '<div class="card">' +
      '<div class="etq">Tu crédito</div>' +
      fila('Te prestamos', COP(q.capital)) +
      (q.fecha_pago ? fila('El día', esc(fmtFecha(q.fecha_pago))) : '') +
      (q.total != null ? fila('Devuelves', COP(q.total)) : '') +
      '</div>';
  }
  return h;
}

/* LA GARANTÍA DEL SOCIO, en pesos y con lo que significa cada parte. Las cifras
   salen de ficha.js, que las saca del motor: acá no se suma nada. */
function tarjetaMiGarantia() {
  if (!FICHA) return '';
  var g = FICHA.gd;
  return '<div class="card">' +
    '<div class="etq">Tu garantía</div>' +
    '<div class="cifra sm">' + COP(g.ganada) + '</div>' +
    '<div class="muted" style="font-size:13.5px">es la que ganaste pagando</div>' +
    '<div class="sep"></div>' +
    fila('Libre para respaldar', COP(FICHA.maxRespaldado)) +
    (g.comprometida > 0 ? fila('Sosteniendo lo que debes', COP(g.comprometida)) : '') +
    '<div class="ayuda">Con la libre se abre el crédito con garantía, uno a uno: si tienes ' + COP(FICHA.maxRespaldado) + ' libres, puedes pedir hasta esa misma cifra.</div>' +
    '</div>';
}

/* --------------------------- LÁMINA: HISTORIAL --------------------------- */
function laminaHistorial() {
  return avisoFicha() + tarjetaHistorial() + tarjetaRespaldadosPagados();
}

function tarjetaRespaldadosPagados() {
  if (!FICHA || !FICHA.respaldados.length) return '';
  return '<div class="card"><div class="etq">Tus créditos con garantía</div>' +
    FICHA.respaldados.map(function (r) {
      return '<div style="margin-top:var(--e4)"><b>' + COP(r.capital) + '</b>' +
        (r.plazo_meses ? ' a ' + r.plazo_meses + ' meses' : '') +
        (r.pagado ? ' · <b>terminado</b>' : '') +
        '</div>' + cuadroCuotas(r.cuotas);
    }).join('') + '</div>';
}

/* ------------------------------ LÁMINA: CHAT ------------------------------
   Tres canales, como los pidió Joan. No son tres chats distintos por capricho:
   el de cobranzas lo lee quien cobra y el de créditos quien presta, y mezclarlos
   es lo que hace que un reclamo de plata se pierda entre preguntas de tasas.

   El hilo se pinta con chat.js —el mismo que la app quincenal—, así que la marca
   de «esto te lo contestó una máquina» viaja sola. */
var CANAL = 'servicio';
var CANALES = [['servicio', 'Servicio al cliente', 'Preguntas, datos, cualquier cosa.'],
               ['cobranza', 'Cobranzas', 'Tus pagos, tus fechas, un acuerdo.'],
               ['creditos', 'Créditos nuevos', 'Pedir más, o preguntar cuánto te alcanza.']];
var HILO = { canal: null, mensajes: [], estado: 'sin' };  // sin|cargando|listo|apagado|falla

/* ==================== LO QUE LE FALTA POR LEER — 19-oct-2026 ====================
   El chat funcionaba de punta a punta y el cliente no se enteraba de la
   respuesta: la pestaña abría siempre en «Servicio», leía UN canal, una vez, y
   no volvía a mirar. Si Joan contestaba en «Créditos nuevos» o en «Cobranzas»
   —y el CRM contesta en el canal del último mensaje del cliente—, la respuesta
   se quedaba ahí sin que nadie la viera.

   Ahora: «Chat (n)» en la barra, «(n)» en cada canal, se entra donde hay algo
   sin leer (irA), y un latido de 20 s —el mismo de app/socio.html— mientras
   la página esté a la vista: cuenta, y si el chat está abierto trae lo nuevo
   del canal que se está mirando.

   EL NÚMERO NO PUEDE SALIR DE chat_leer_sesion: esa función MARCA como visto lo
   que devuelve, y Joan vería «Lo vio» en el CRM sobre mensajes que nadie leyó.
   Lo cuenta chat_sin_leer_sesion (base/20261019b_chat_sin_leer_sesion.sql),
   que solo cuenta. Mientras esa migración no esté corrida contesta 404, y
   entonces no se pinta ningún número —«no sé» no es «0»— ni se le vuelve a
   preguntar en esta visita; el resto del chat funciona igual.

   SU LÍMITE: con la app cerrada no le llega nada al teléfono. Eso no se
   promete en ninguna parte de esta pantalla. */
var SIN_LEER = null;            // null = no se sabe; si no, {servicio, cobranza, creditos, total}
var SIN_LEER_APAGADO = false;   // la base contestó 404: todavía no tiene la función
/* Cuántas veces se leyó cada canal en esta visita. Una cuenta pedida ANTES de
   leer un canal llega vieja para ese canal: sin esto, abrir «Cobranzas» y
   recibir justo después la cuenta de hace un segundo le volvía a poner «(1)»
   a lo que el cliente estaba mirando. */
var LEIDAS = { servicio: 0, cobranza: 0, creditos: 0 };
var CHAT_CADA_MS = 20000;
var LATIDO = null;              // la sesión para la que corre el latido

function contarSinLeer() {
  if (SIN_LEER_APAGADO || !SESION || !SESION.access_token || !CH || !CH.sinLeerDe) return Promise.resolve();
  var ses = SESION;
  var foto = { servicio: LEIDAS.servicio, cobranza: LEIDAS.cobranza, creditos: LEIDAS.creditos };
  return rpcSesion('chat_sin_leer_sesion', {}).then(function (j) {
    if (SESION !== ses) return;
    var s = CH.sinLeerDe(j);
    if (!s) return;
    Object.keys(foto).forEach(function (c) {
      if (LEIDAS[c] !== foto[c]) { s.total -= s[c]; s[c] = 0; }
    });
    SIN_LEER = s;
    pintarContadores();
  }, function (e) {
    if (SESION !== ses) return;
    var c = causaDe(e);
    if (c === 'apagado') SIN_LEER_APAGADO = true;
    /* Sesión vencida: ya no se sabe nada de esta cuenta, y el número viejo
       no se puede quedar como si se supiera. Sin red, sí se queda: es lo
       último que se supo, y la próxima vuelta lo corrige. */
    if (c === 'sesion') { SIN_LEER = null; LATIDO = null; pintarContadores(); }
  });
}

/* Leer un canal lo deja en cero en la pantalla sin esperar a la próxima
   cuenta: chat_leer_sesion acaba de marcarlo visto en la base. */
function yaLeido(canal) {
  if (Object.prototype.hasOwnProperty.call(LEIDAS, canal)) LEIDAS[canal]++;
  if (SIN_LEER && SIN_LEER[canal]) {
    SIN_LEER.total -= SIN_LEER[canal];
    SIN_LEER[canal] = 0;
    pintarContadores();
  }
}

/* Los números se repintan en su sitio: la barra y la fila de canales. Nunca la
   lámina entera, que se llevaría lo que el cliente está escribiendo. */
function pintarContadores() {
  var b = $('tabs'); if (b && VISTA === 'cuenta') b.innerHTML = barraPestanas();
  if (TAB !== 'chat') return;
  var lam = $('lamina');
  var filaC = (lam && lam.querySelector) ? lam.querySelector('.canales') : null;
  if (filaC) filaC.innerHTML = botonesDeCanal();
}

function ultimoIdDe(lista) {
  return (lista || []).reduce(function (a, m) { return Math.max(a, Number(m && m.id) || 0); }, 0);
}

/* Lo nuevo del canal que se está mirando, sin volver a bajar lo que ya está.
   Se pinta SOLO el hilo (no el cuadro de texto). Un fallo aquí no borra nada:
   lo que se cayó fue la pregunta, no lo que ya se dijo. */
function traerNuevosDelCanal() {
  if (TAB !== 'chat' || HILO.estado !== 'listo' || !HILO.canal) return Promise.resolve();
  var h = HILO, c = HILO.canal;
  return rpcSesion('chat_leer_sesion', { p_canal: c, p_desde: h.ultimo || 0 }).then(function (j) {
    if (HILO !== h || !j || j.ok !== true) return;
    var nuevos = (j.mensajes || []).filter(function (m) { return Number(m.id) > (h.ultimo || 0); });
    yaLeido(c);
    if (!nuevos.length) return;
    h.mensajes = h.mensajes.concat(nuevos);
    h.ultimo = ultimoIdDe(h.mensajes);
    pintarHilo();
  }, function () { /* ver arriba */ });
}

function paginaEscondida() {
  return typeof document.hidden === 'boolean' && document.hidden;
}

/* El latido. Uno por sesión: pintarCuenta se llama más de una vez por visita
   (al entrar, al volver de una solicitud), y dos latidos serían el doble de
   preguntas. Se apaga solo al salir de la cuenta; con la página en segundo
   plano sigue latiendo sin preguntar nada. */
function arrancarLatidoChat() {
  if (!SESION || LATIDO === SESION) return;
  LATIDO = SESION;
  latidoChat(SESION);
}
function latidoChat(ses) {
  setTimeout(function () {
    if (LATIDO !== ses) return;
    if (SESION !== ses || VISTA !== 'cuenta') { LATIDO = null; return; }
    if (paginaEscondida()) { latidoChat(ses); return; }
    traerNuevosDelCanal().then(contarSinLeer).then(function () { latidoChat(ses); });
  }, CHAT_CADA_MS);
}
/* Al volver a la app, sin esperar la vuelta: es cuando más se mira. */
document.addEventListener('visibilitychange', function () {
  if (paginaEscondida() || VISTA !== 'cuenta' || !SESION) return;
  traerNuevosDelCanal().then(contarSinLeer);
});

function laminaChat() {
  return '<div class="card">' +
      '<div class="canales">' + botonesDeCanal() + '</div>' +
      '<p class="sub" id="canalPie">' + esc(pieDeCanal()) + '</p>' +
    '</div>' +
    '<div class="card"><div id="hilo" class="ch-hilo"></div>' +
      '<label for="chTexto" class="oculto">Tu mensaje</label>' +
      '<textarea id="chTexto" rows="3" placeholder="Escribe aquí…" ' +
        'style="width:100%;margin-top:var(--e3)"></textarea>' +
      '<button class="btn sm" onclick="enviarChat()">Enviar</button>' +
      /* 22-sep-2026 — MANDAR UNA FOTO. Lo que se pide por nombre en este
         proyecto es el COMPROBANTE DE PAGO, así que el rótulo lo dice: un
         botón que diga «adjuntar» no le cuenta a nadie para qué sirve.
         capture no se pone a propósito: así el teléfono deja elegir entre la
         cámara y la galería, y un comprobante casi siempre ya está guardado. */
      '<input type="file" id="chFoto" accept="image/*" class="oculto" onchange="mandarFoto(this)">' +
      '<button class="btn sec sm" style="margin-top:var(--e2)" ' +
        'onclick="document.getElementById(&quot;chFoto&quot;).click()">📷 Mandar una foto</button>' +
      '<div class="ayuda">Sirve para el comprobante de un pago. Solo fotos: un video no cabe.</div>' +
      '<div id="errChat" class="aviso ambar oculto"></div>' +
    '</div>';
}

function pieDeCanal() {
  for (var i = 0; i < CANALES.length; i++) if (CANALES[i][0] === CANAL) return CANALES[i][2];
  return '';
}

/* Cambiar de canal repinta SOLO la fila de botones y el pie, nunca la lámina
   entera: repintarla borraría lo que la persona ya tenía escrito en el cuadro de
   texto, y ese defecto ya se cometió dos veces en este proyecto. */
function abrirCanal(c) {
  CANAL = c;
  var pieC = $('canalPie'); if (pieC) pieC.textContent = pieDeCanal();
  var lam = $('lamina');
  var filaC = (lam && lam.querySelector) ? lam.querySelector('.canales') : null;
  if (filaC) filaC.innerHTML = botonesDeCanal();

  var caja = $('hilo'); if (!caja) return;
  HILO = { canal: c, mensajes: [], estado: 'cargando' };
  caja.innerHTML = '<div class="ch-vacio">Buscando tus mensajes…</div>';
  var ses = SESION;
  rpcSesion('chat_leer_sesion', { p_canal: c, p_desde: 0 }).then(function (j) {
    /* Si mientras llegaba la respuesta la persona cambió de canal, esto ya no es
       suyo: pintarlo pondría los mensajes de cobranzas en la pestaña de
       créditos. 21-oct-2026 — G1: ni si cambió de CUENTA (salió y entró
       otra al mismo canal): serían los mensajes de otra persona. */
    if (HILO.canal !== c || SESION !== ses) return;
    if (!j || j.ok !== true) { HILO.estado = 'falla'; return pintarHilo(); }
    HILO.mensajes = j.mensajes || [];
    /* 19-oct-2026 — desde dónde pedir lo nuevo en el latido, y el canal en
       cero: la base acaba de marcar visto lo que se trajo. */
    HILO.ultimo = ultimoIdDe(HILO.mensajes);
    HILO.estado = 'listo';
    pintarHilo();
    yaLeido(c);
  }).catch(function (e) {
    if (HILO.canal !== c || SESION !== ses) return;
    HILO.estado = causaDe(e);
    pintarHilo();
  });
}

function botonesDeCanal() {
  return CANALES.map(function (x) {
    /* 19-oct-2026 — cada canal dice cuántos tiene sin leer: «Créditos nuevos
       (1)» es lo que lleva al cliente a la respuesta que Joan le dejó ahí. */
    var n = SIN_LEER ? Number(SIN_LEER[x[0]]) || 0 : 0;
    return '<button class="canal' + (CANAL === x[0] ? ' on' : '') + '" ' +
      'onclick="abrirCanal(&quot;' + x[0] + '&quot;)">' + esc(x[1]) + (n ? ' (' + n + ')' : '') + '</button>';
  }).join('');
}

function pintarHilo() {
  var caja = $('hilo'); if (!caja) return;
  if (HILO.estado === 'apagado') {
    /* 22-sep-2026 — decía «todavía no está encendido… escríbenos por WhatsApp».
       El chat se encendió y el WhatsApp se fue, así que la frase mentía dos
       veces. Esta rama ya casi no se pisa: queda para el caso de que PostgREST
       no haya recargado el esquema, y dice justo eso sin culpar a nadie. */
    caja.innerHTML = '<div class="aviso ambar"><b>No pude abrir tu chat ahora.</b> ' +
      'Suele ser cosa de un momento: vuelve a entrar a esta pestaña en un rato y ' +
      'tus mensajes siguen donde estaban.</div>';
    return;
  }
  if (HILO.estado === 'sesion') {
    caja.innerHTML = '<div class="aviso ambar"><b>Tu sesión se venció.</b> Vuelve a entrar y tu conversación sigue donde estaba.' +
      '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="salirDeCuenta()">Volver a entrar</button></div>';
    return;
  }
  if (HILO.estado === 'falla') {
    caja.innerHTML = '<div class="aviso ambar">No pude traer tus mensajes ahora. Revisa tu internet y vuelve a intentar.</div>';
    return;
  }
  caja.innerHTML = CH.hiloHTML(HILO.mensajes, {
    yo: 'socio', hoy: hoyISO(), alVerFoto: 'verFotoChat',
    vacio: 'Todavía no han hablado por aquí. Escribe y te contestamos.'
  });
}

/* LA FOTO DEL CLIENTE. Se comprime con lo mismo que usa el resto de la casa
   —900 px y calidad 0,6, que da unos 73 KB— y se hace además una miniatura de
   240 px para que el hilo no baje la grande en cada apertura.

   El video se rechaza AQUÍ para poder decirlo con palabras, pero el freno de
   verdad está en la base: un CHECK que no deja entrar nada que no sea imagen.
   Una pantalla se cambia; un CHECK no. */
function mandarFoto(input) {
  var err = $('errChat');
  var f = input && input.files && input.files[0];
  input.value = '';
  if (!f) return;
  /* El tipo que declara el teléfono NO decide: decide el decodificador. El
     lienzo vuelve a codificar a JPEG pase lo que pase, así que da igual si
     llega PNG, HEIC o WebP. Y hay gestores de archivos de Android que mandan
     el tipo VACÍO sobre una foto perfecta: rechazarla ahí sería decirle
     «eso no es una foto» a una foto. Solo se ataja el video, y no porque no
     se pueda abrir, sino para poder explicar POR QUÉ no cabe. */
  if (/^video\//.test(f.type || '')) {
    return fallo(err, 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.');
  }
  progreso(err, 'Preparando la foto…');
  var ses = SESION;   // H2: ver subirFotoChat
  var lector = new FileReader();
  lector.onerror = function () { fallo(err, 'No pude leer esa foto. Prueba con otra.'); };
  lector.onload = function () {
    var im = new Image();
    im.onerror = function () { fallo(err, 'Eso no se pudo abrir como foto. Prueba con otra.'); };
    im.onload = function () {
      var c = document.createElement('canvas');
      c.width = im.naturalWidth || im.width; c.height = im.naturalHeight || im.height;
      if (!c.width || !c.height) return fallo(err, 'Esa foto salió vacía. Prueba con otra.');
      try { c.getContext('2d').drawImage(im, 0, 0); }
      catch (e) { return fallo(err, 'No pude preparar esa foto. Prueba con otra.'); }
      var grande = fotoDeLienzo(c, 900, 0.6);
      var mini = fotoDeLienzo(c, 240, 0.5);
      c.width = c.height = 1;
      if (!grande) return fallo(err, 'Tu teléfono no dejó preparar la foto. Prueba con otra.');
      subirFotoChat(grande, mini, err, ses);
    };
    im.src = lector.result;
  };
  lector.readAsDataURL(f);
}

/* 21-oct-2026 — H2: `ses`, la sesión que escogió la foto (sin ella, la de
   este momento). Si ya no es la de la pestaña, no se manda nada. */
function subirFotoChat(grande, mini, err, ses) {
  if (ses === undefined) ses = SESION;
  if (SESION !== ses) return;
  progreso(err, 'Mandando la foto…');
  var pie = String((($('chTexto') || {}).value || '')).trim();
  /* El largo se revisa AQUÍ y no se deja que la base lo recorte: un pie que
     llega cortado a mil deja a la persona creyendo que mandó el resto. Es la
     misma regla que `enviarChat`, menos la de «escribe algo»: sin pie la foto
     vale igual. */
  if (pie.length > CH.LARGO_MAX) {
    return fallo(err, 'El texto que acompaña la foto es muy largo. Déjalo en ' +
      CH.LARGO_MAX + ' caracteres o menos.');
  }
  rpcSesion('chat_foto_sesion', {
    p_canal: CANAL, p_imagen: grande, p_miniatura: mini || null, p_texto: pie || null
  }, ses).then(function (j) {
    if (!j || j.ok !== true) {
      var m = j && j.motivo;
      /* Cada motivo dice algo distinto: «no se pudo» tapando un tope alcanzado
         deja a la persona intentándolo otra vez para siempre. */
      return fallo(err,
        m === 'no_es_imagen' ? 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.'
        : m === 'muy_grande' ? 'Esa foto pesa demasiado. Tómala otra vez con menos calidad.'
        /* Las dos mitades de lo que decía antes eran falsas: el tope no era
           «por aquí» (cuenta los tres canales juntos) y «escríbenos y las
           revisamos» ofrecía un trámite que no existe — no hay forma de borrar
           UNA foto, solo la conversación entera. Ahora el tope es por mes
           (20260922i) y se dice lo que de verdad pasa. */
        : m === 'tope' ? 'Ya mandaste el máximo de fotos de este mes. Escríbenos por aquí y seguimos por texto.'
        /* El freno son 20 mensajes cada 15 minutos, así que «un momento» podía
           ser un cuarto de hora. */
        : m === 'muchas' ? 'Espera unos minutos antes de mandar otra.'
        /* El cortacircuito de 20260922j. No es culpa de quien manda, así que
           no se le dice que haga nada distinto: se le dice qué pasa y cómo
           seguir. Lo arregla Joan, no el cliente. */
        : m === 'lleno' ? 'Ahora mismo no podemos recibir fotos. Escríbenos por aquí y te decimos cómo hacernos llegar el comprobante.'
        : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y la mandas.'
        : 'No pude mandar la foto. Vuelve a intentar en un momento.');
    }
    var t = $('chTexto'); if (t) t.value = '';
    err.classList.add('oculto');
    abrirCanal(CANAL);
  }).catch(function (e) {
    /* Igual que `enviarChat`: un 404 (la base todavía sin la migración) o un
       401 (sesión vencida) no son el internet de nadie, y decirle a alguien que
       revise su wifi cuando el problema es nuestro lo manda a cambiar de red,
       reintentar y acabar escribiendo — justo en el canal donde estaba
       mandando el comprobante de un pago. */
    var c = causaDe(e);
    fallo(err, c === 'apagado'
      ? 'Mandar fotos todavía no está disponible. Escríbenos por aquí y te decimos cómo hacernos llegar el comprobante.'
      : c === 'sesion'
      ? 'Tu sesión se venció. Vuelve a entrar y la mandas de nuevo.'
      : 'No pude mandar la foto. Revisa tu internet y vuelve a intentar.');
  });
}

/* 22-sep-2026 — EL VISOR DE LA FOTO GRANDE. Tenía dos defectos a la vez y el
   segundo tapaba al primero:

   1. Se pintaba con document.write('<img src="' + imagen + '"…'), con la
      cadena que viene de la base metida CRUDA dentro de un atributo. La
      comprobación buena existía en chat.js —con su comentario explicando este
      mismo ataque— pero solo se le aplicaba a la miniatura. Y el CHECK de la
      tabla solo exigía que la cadena EMPEZARA por data:image/, así que
      «data:image/png;base64,AAAA" onerror="…» entraba sin tocar nada.
   2. Se abría con window.open() SIN dirección, y un about:blank así HEREDA el
      origen de quien lo abre. O sea que ese onerror no corría en una pestaña
      cualquiera: corría DENTRO del CRM, donde localStorage guarda la clave de
      sincronización de Joan. Con esa clave, chat_foto_panel(clave, 1), (clave,
      2), (clave, 3)… —el id es correlativo— se baja los comprobantes de todos
      los clientes.

   Ahora: se comprueba la forma entera con CH.esFoto, la fuente se ASIGNA
   como propiedad (que no puede salirse de ningún atributo aunque la
   comprobación fallara algún día), y se enseña aquí mismo en vez de en otra
   pestaña. Lo último no es solo por seguridad: en un Android el navegador
   bloquea la pestaña emergente la mitad de las veces y la persona se queda
   mirando una foto que nunca abre, sin que nadie le diga por qué. */
function mostrarFoto(imagen) {
  if (!CH || !CH.esFoto(imagen)) {
    alert('Esa foto lleg\u00f3 da\u00f1ada. Pide que la manden otra vez.');
    return;
  }
  var capa = document.createElement('div');
  capa.setAttribute('role', 'dialog');
  capa.setAttribute('aria-label', 'Foto del chat');
  capa.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);' +
    'display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';

  var img = document.createElement('img');
  img.alt = 'Foto que se mand\u00f3 en el chat';
  img.style.cssText = 'max-width:100%;max-height:100%;border-radius:10px';
  img.src = imagen;               /* propiedad, nunca texto de un atributo */
  capa.appendChild(img);

  var pie = document.createElement('p');
  pie.textContent = 'Toca para cerrar';
  pie.style.cssText = 'position:absolute;bottom:14px;left:0;right:0;text-align:center;' +
    'color:#FFFFFF;font-size:13px;opacity:.75;margin:0';
  capa.appendChild(pie);

  function cerrar() {
    if (capa.parentNode) capa.parentNode.removeChild(capa);
    document.removeEventListener('keydown', porTecla);
  }
  function porTecla(e) { if (e.key === 'Escape') cerrar(); }
  capa.addEventListener('click', cerrar);
  document.addEventListener('keydown', porTecla);
  document.body.appendChild(capa);
}

/* Abrir la grande. Se pide solo cuando alguien toca la miniatura. */
function verFotoChat(id) {
  var caja = $('hilo'); if (!caja) return;
  var ses = SESION;   // 21-oct-2026 — G1: la foto que llega después de «Salir» no se le abre al siguiente
  rpcSesion('chat_foto_sesion_ver', { p_id: Number(id) }).then(function (j) {
    if (SESION !== ses) return;
    if (!j || j.ok !== true || !j.imagen) {
      /* Un `return` pelado deja a la persona tocando una foto que nunca abre y
         sin saber por qué. Una función muda no existe. */
      return alert('No pude abrir esa foto. Vuelve a intentar en un momento.');
    }
    mostrarFoto(j.imagen);
  }).catch(function (e) {
    if (SESION !== ses) return;
    var c = causaDe(e);
    alert(c === 'sesion'
      ? 'Tu sesión se venció. Vuelve a entrar para ver la foto.'
      : 'No pude abrir esa foto. Revisa tu internet y vuelve a intentar.');
  });
}

function enviarChat() {
  var el = $('chTexto'), err = $('errChat');
  if (!el || !err) return;
  /* La revisión del texto es la de chat.js: el mismo largo máximo y el mismo
     motivo en palabras que ve el socio en la app quincenal. */
  var v = CH.revisar(el.value);
  if (!v.ok) return fallo(err, v.motivo);
  err.classList.add('oculto');
  var canal = CANAL, texto = v.texto;
  /* 21-oct-2026 — H2: si sale antes de la respuesta, ni se borra la casilla
     del siguiente ni se le abre el canal con su token. */
  var ses = SESION;
  rpcSesion('chat_escribir_sesion', { p_canal: canal, p_texto: texto }, ses).then(function (j) {
    if (!j || j.ok !== true) {
      return fallo(err, (j && j.motivo) ? j.motivo
        : 'No pude enviar tu mensaje. Vuelve a intentar en un momento.');
    }
    el.value = '';
    abrirCanal(canal);
  }).catch(function (e) {
    var c = causaDe(e);
    fallo(err, c === 'apagado'
      ? 'No pude enviar tu mensaje ahora mismo. Vuelve a intentar en un momento: no se pierde nada.'
      : c === 'sesion'
      ? 'Tu sesión se venció. Vuelve a entrar y mandas tu mensaje de nuevo.'
      : 'No pude enviar tu mensaje. Revisa tu internet y vuelve a intentar.');
  });
}

/* El celular de la sesión sale del correo interno, con la MISMA forma que exige
   el servidor (celular_de_sesion, en la base). Si alguien cambiara la forma en
   un lado, acá se vería «—» en vez de un número inventado. */
function celularDeSesion() {
  var correo = (SESION && SESION.user && SESION.user.email) || '';
  var m = String(correo).toLowerCase().match(/^57([0-9]{10})@tugarantia\.net$/);
  return m ? m[1] : '';
}

function tarjetaCambiarClave() {
  return '<div class="card">' +
    '<h3 class="tit">Cambiar mi contraseña</h3>' +
    '<p class="sub">La nueva tiene que tener al menos 8 caracteres.</p>' +
    '<label for="clave1">Contraseña nueva</label>' +
    campoClave('clave1', 'new-password') +
    '<label for="clave2">Escríbela otra vez</label>' +
    campoClave('clave2', 'new-password') +
    '<button class="btn sec arriba" onclick="cambiarClave()">Guardar mi contraseña nueva</button>' +
    '<div id="errClave" class="aviso ambar oculto"></div>' +
    '</div>';
}

function cambiarClave() {
  var a = $('clave1'), b = $('clave2'), err = $('errClave');
  if (!a || !b || !err) return;
  var c1 = a.value || '', c2 = b.value || '';
  if (c1.length < 8) return fallo(err, 'La contraseña nueva necesita al menos 8 caracteres.');
  if (c1 !== c2) return fallo(err, 'Las dos no quedaron iguales. Escríbelas otra vez, sin afán.');
  if (!SESION || !SESION.access_token) return fallo(err, 'Se cerró tu sesión. Entra otra vez y lo hacemos.');
  fallo(err, 'Guardando…');
  /* 21-oct-2026 — H2: con el token de la sesión que la pidió, y atada a ella:
     el «Listo: tu contraseña quedó cambiada» de María no se le pinta al
     siguiente que entre (deEstaSesion). */
  var ses = SESION;
  /* Se manda SOLO la contraseña. El correo no viaja acá ni por error: es la
     identidad de la cuenta, y la base tiene un disparador que niega el cambio
     —fue por ahí por donde el 14-sep se pudo entrar a la cuenta de otro.
     19-oct-2026 — el «no» de Supabase sale en español y con qué hacer
     (U.traducirErrorAuth, el mismo de la app del cliente y del Panel: es la
     misma cuenta). Antes se pintaba r.j.msg tal cual, en inglés. El cuerpo
     puede no ser JSON (un 502 de una puerta intermedia): eso no es «sin
     internet», y por eso se lee aparte en vez de caer al catch. */
  /* 21-oct-2026 (R3) — una escritura en camino: la recarga sola no la corta
     (sin esto, tocar «Historial» mientras guardaba dejaba sin «Listo» y sin
     saber cuál contraseña servía). */
  deEstaSesion(ses, escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/auth/v1/user', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon,
               Authorization: 'Bearer ' + ses.access_token },
    body: JSON.stringify({ password: c1 })
  }).then(function (r) {
    return r.json().catch(function () { return null; })
      .then(function (j) { return { ok: r.ok, estado: r.status, j: j }; });
  })))
    .then(function (r) {
      if (!r.ok) {
        return fallo(err, (U && U.traducirErrorAuth) ? U.traducirErrorAuth(r.j, r.estado)
          : 'No pude cambiar tu contraseña. Vuelve a intentar en un momento.');
      }
      a.value = ''; b.value = '';
      fallo(err, 'Listo: tu contraseña quedó cambiada. La próxima vez entra con la nueva.');
    })
    .catch(function () { fallo(err, 'No pude conectarme. Revisa tu internet y vuelve a intentar.'); });
}

function salirDeCuenta() {

  olvidarSesionEnCurso();

  SIN_LEER = null; LATIDO = null;

     21-oct-2026 — I3: la subida de la cola SÍ sigue y anota lo que pasó con
     el celular de su dueña (ver SUBIDA_EN_CURSO); se suelta aquí solo para
     que la cuenta del siguiente no la tome por «la que ya va».
     21-oct-2026 (verificación del lote 1, R2) — SUELTA, PERO A LA VISTA:
     queda en SUBIDA_SUELTA hasta que conteste. Sin eso, la portada (que es

  if (SUBIDA_EN_CURSO && SUBIDA_EN_CURSO.p) soltarLaSubida(SUBIDA_EN_CURSO.p);
  PIDIENDO = false; SUBIDA_EN_CURSO = null;
  SOL_EN_PANTALLA = null; CONDICIONES_LEIDAS = {}; PEDIDO_PUESTO = '';
  /* 22-oct-2026 — y sus cuentas de pago: las del registro que trajo
     mis_cuentas_de_pago y la que estaba escribiendo al aceptar. */
  CUENTAS_DEL_REGISTRO = {}; DESTINOS = {};
  MI_REGISTRO = ''; AVISO_RESPONSABLE_PLAY_CERRADO = false;
  LEIDAS = { servicio: 0, cobranza: 0, creditos: 0 };
  /* 20-oct-2026, revisión (F7; regla 3) — y nada del registro de esta cuenta

  /* 21-oct-2026 — G3: …PERO LA MEMORIA DICE LO MISMO QUE EL TELÉFONO. Aquí
     se vaciaba REGISTRO y el borrador del teléfono se quedaba: si había un

/* EL SIMULADOR. Mueve el monto y las cifras cambian; no hay un botón "calcular"
   que devuelva un número que uno ya no sabe de dónde salió. Y las cuotas se ven
   CON FECHA antes de pedir, que es lo que el socio necesita para saber si le
   cuadra con el día que le pagan. */
function tarjetaSimulador(idPerfil) {
  /* 9-sep-2026 — el piso del deslizador sale del perfil más alto y no de un
     número escrito acá. Un socio nuevo tiene cupo cero y aun así puede mover el
     simulador hasta arriba: es justo lo que Joan pidió, «que el cliente sepa
     hasta cuánto puede pedir a futuro». */
  var tope = Math.max(C.PERFILES[idPerfil].cupo_maximo || 0, C.PERFILES.preferente.cupo_maximo);
  /* 16-sep-2026 — EL PLAZO TAMBIÉN SE ELIGE ACÁ, y hasta hoy no se podía.
     La calculadora de la portada deja escoger de 3 a 6 cuotas y cotiza cada
     plazo de verdad… y ese número no viajaba a ninguna parte: adentro no había
     dónde elegirlo, pintarSimulacion llamaba al motor sin `meses` —y el motor
     cae a 6— y pedir() mandaba el 6 fijo. O sea que el visitante escogía tres
     cuotas, memorizaba esa cuota, y la solicitud salía a seis con otra cuota.
     La base sí lo aceptaba desde el 9-sep (play_solicitar valida 1..6): el
     único que tiraba la elección era esta pantalla.
     Los dos deslizadores van FUERA de #simu, que es lo que pintarSimulacion
     reescribe en cada movimiento: un control adentro se repintaría bajo el dedo
     —el defecto que este proyecto ya cometió dos veces. */
  return '<div class="card">' +
    '<h3 class="tit">Simula tu crédito</h3>' +
    '<p class="sub">Mueve el monto y las cuotas, y mira exactamente cuánto pagarías.</p>' +
    '<div class="mando"><div class="cab-mando">' +
      '<label for="rMonto" style="margin:0">Cuánto necesitas</label>' +
      '<b id="rMontoTxt">' + COP(MONTO) + '</b></div>' +
      '<input type="range" id="rMonto" min="100000" max="' + tope + '" step="50000" value="' + MONTO + '" ' +
        'aria-label="Cuánto necesitas" oninput="cambiaMonto(this.value)"></div>' +
    '<div class="mando"><div class="cab-mando">' +
      '<label for="rPlazo" style="margin:0">En cuántas cuotas</label>' +
      '<b id="rPlazoTxt">' + textoCuotas(PLAZO) + '</b></div>' +
      /* El rango sale de las MISMAS constantes que la calculadora de la portada.
         Por debajo del piso de 90 días C.simular lanza y la pantalla se queda en
         blanco; escribir otro número acá sería la misma regla en dos sitios. */
      '<input type="range" id="rPlazo" min="' + CALC_MESES_MIN + '" max="' + CALC_MESES_MAX + '" ' +
        'step="1" value="' + PLAZO + '" aria-label="En cuántas cuotas" ' +
        'oninput="cambiaPlazo(this.value)"></div>' +
    /* 22-sep-2026 — EL MONTO A LA MEDIDA. Joan: «deja que el cliente pida lo
       que el quiera». El deslizador se queda porque es lo cómodo y lo que usa
       casi todo el mundo; esta casilla es para el que necesita una cifra que no
       cae en el paso de 50.000 o que se sale del tope de su cupo. Pedir por
       encima del cupo NO es un error: es una solicitud, y Joan contrapropone.
       El servidor sigue poniendo el piso y el techo de verdad. */
    '<div class="mando"><label for="rMontoLibre">¿Necesitas otra cifra? Escríbela</label>' +
      '<input id="rMontoLibre" type="tel" inputmode="numeric" ' +
        'placeholder="Por ejemplo 1.250.000" oninput="escribeMonto(this)"></div>' +
    /* 22-sep-2026 — EL PLAZO, COMO PETICIÓN Y NO COMO PROMESA. Joan pidió que
       el cliente eligiera «el plazo que quiera». No se puede soltar el
       deslizador: el motor con el que Joan contrapropone LANZA fuera de 1..6 y
       su formulario está clavado al mismo rango, así que una solicitud a 24
       cuotas entraría y él no tendría con qué contestarle.
       Lo que sí se puede es que lo ESCRIBA. La ayuda dice exactamente lo que
       pasa —lo leemos y te contestamos— y no dice que se lo damos, porque eso
       sería prometer un producto que hoy no existe. */
    '<div class="mando"><label for="rPlazoLibre">¿Necesitas más tiempo? Escríbelo</label>' +
      '<input id="rPlazoLibre" type="text" maxlength="40" ' +
        'placeholder="Por ejemplo 10 cuotas" oninput="anotarPlazoLibre(this)">' +
      '<div class="ayuda">Hoy prestamos de 3 a 6 cuotas. Si necesitas otro plazo, ' +
        'escríbelo: lo leemos con tu solicitud y te contestamos por el chat.</div></div>' +
    '<div class="mando"><label for="rNota">¿Para qué lo necesitas? (opcional)</label>' +
      '<input id="rNota" type="text" maxlength="300" ' +
        'placeholder="Surtir el negocio, una deuda, una emergencia…"></div>' +
    '<div id="simu"></div>' +
    '</div>';
}

/* «6 cuotas» y no «6 meses»: el rótulo pregunta por cuotas y la respuesta tiene
   que contestar lo que se preguntó. */
function textoCuotas(n) { return n + (n === 1 ? ' cuota' : ' cuotas'); }

function cambiaMonto(v) {
  MONTO = Number(v) || 100000;
  var t = $('rMontoTxt'); if (t) t.textContent = COP(MONTO);
  var libre = $('rMontoLibre'); if (libre) libre.value = '';
  pintarSimulacion();
}

/* 22-sep-2026 — la cifra escrita a mano. Se limpian los puntos mientras teclea
   (en Colombia se escriben) y se vuelven a poner, que es lo que la gente espera
   al ver un monto. El deslizador NO se mueve a su tope si la cifra se le sale:
   mostraría un número distinto del que la persona acaba de escribir. */
function escribeMonto(el) {
  var d = String(el.value || '').replace(/[^0-9]/g, '').slice(0, 9);
  el.value = d ? Number(d).toLocaleString('es-CO') : '';
  if (!d) return;
  MONTO = Number(d);
  var t = $('rMontoTxt'); if (t) t.textContent = COP(MONTO);
  var r = $('rMonto');
  if (r && MONTO >= Number(r.min) && MONTO <= Number(r.max)) r.value = MONTO;
  pintarSimulacion();
}

function cambiaPlazo(v) {
  PLAZO = Math.max(CALC_MESES_MIN, Math.min(CALC_MESES_MAX, Number(v) || C.PLAZO_MESES));
  var t = $('rPlazoTxt'); if (t) t.textContent = textoCuotas(PLAZO);
  pintarSimulacion();
}

function pintarSimulacion() {
  var idPerfil = perfilDeSesion(SESION);
  var r = C.simular({ perfil: idPerfil, capital: MONTO, fecha_desembolso: hoyISO(), meses: PLAZO });
  var c = r.puede ? r : r.cotizacion;
  var el = $('simu');
  if (!el) return;

  if (!c) {
    el.innerHTML = '<div class="aviso ambar">' + esc(r.mensaje) + '</div>';
    return;
  }

  var sobreCupo = !r.puede && r.motivo === 'sobre_cupo';
  var sinCupo = !r.puede && r.motivo === 'sin_cupo';

  el.innerHTML =
    '<div class="cifra sm" style="margin-top:var(--e3)">' + COP(c.capital) + '</div>' +
    '<div class="muted" style="font-size:13.5px">' + c.meses + ' cuotas de <b>' +
      COP(c.cuota_tipica) + '</b></div>' +
    '<div class="sep"></div>' +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Total a pagar', COP(c.total_a_pagar)) +
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +

    /* 16-sep-2026 — con cuadroCuotas, igual que las dos calculadoras y que la
       propuesta que manda Joan. Era la CUARTA copia de la misma lista, y la
       única que se habría quedado vieja el día que las otras tres cambiaran. La
       cazó la prueba que exige que las cuotas se pinten en un solo sitio. */
    /* 17-sep-2026 — Y PLEGADA, como las de la puerta. La regla que separa las
       dos cosas en esta pantalla: LO QUE YA DEBES SE VE, LO QUE ESTÁS
       CALCULANDO SE PLIEGA. El crédito activo de arriba deja sus cuotas a la
       vista —son las fechas en que le toca pagar— y este simulador las pliega,
       porque todavía no debe nada. Sin esa regla quedaban dos listas iguales,
       una desplegada y otra no, una encima de la otra, y eso se lee como un
       error de pintado. */
    plegableCuotas(c.cuotas, 'simulador') +

    /* LA DIVULGACIÓN, AQUÍ Y NO EN UN RINCÓN. Google la exige "en el mismo lugar
       donde el usuario solicita el crédito", y además es lo correcto: el precio
       completo justo antes del botón, no en una pantalla de términos que nadie
       abre. El texto sale de cumplimiento.js, el mismo que va en la ficha. */
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      /* Tambien con el credito que tiene en pantalla: esta letra va justo debajo
         de SU cotizacion, asi que un ejemplo de otro monto seria el mismo
         defecto que en la calculadora de la portada. */
      esc(divulgacionHoy({ capital: c.capital, meses: c.meses })) + '</div>' +

    (sobreCupo
      ? '<div class="aviso ambar">Estás pidiendo más que tu cupo (' + COP(r.cupo_maximo) + '). ' +
        'Puedes dejar la solicitud igual: la revisamos y te respondemos.</div>'
      : '') +
    (sinCupo
      ? '<div class="aviso ambar">Todavía no tienes cupo asignado. Puedes dejar tu ' +
        'solicitud y la revisamos.</div>'
      : '') +

    '<button class="btn arriba" onclick="pedir()">' +
      (r.puede ? 'Pedir ' + COP(c.capital) : 'Dejar mi solicitud') + '</button>' +
    '<div id="errPedir" class="aviso ambar oculto"></div>';
}

/* LA LETRA DEL PRÉSTAMO CON GARANTÍA ES OTRA, y tiene que serlo. Durante unas
   horas del 14-sep esta calculadora imprimió «Tasa efectiva anual 26,82%» y
   debajo, como letra obligatoria, la del otro producto: «Tasa efectiva anual
   MÁXIMA: 23,99%». La única frase de la app que existe para no afirmar nada
   falso estaba afirmando que el máximo era menor que el precio de tres
   renglones arriba. Lo vio el navegador, no las pruebas. */
/* 17-sep-2026 — Y LA CACHÉ VA POR COMBINACIÓN, igual que la del otro producto y
   por el mismo motivo. Acá había UNA sola entrada, así que aunque
   divulgacionRespaldado aprendiera a seguir el deslizador, la primera respuesta
   se quedaría pegada y el arreglo no habría servido de nada: es el mismo error
   que se corrigió el 15-sep en DIVULGACION, unas líneas más abajo.

   La caché no sobra —esto se llama cien veces por arrastre, porque la tarjeta
   entera se repinta en cada movimiento del dedo y la letra vive DENTRO de la
   tarjeta— pero ahora guarda un texto por cada monto y plazo.

   EL VACÍO NO SE CACHEA, y es la decisión del 9-sep escrita a mano. Antes se
   cumplía de casualidad: la cadena vacía es falsa, así que `if (!DIVULGACION_G)`
   volvía a preguntar sola. Con un objeto por llave esa casualidad se pierde, y
   lo que está en juego no es poco: si la primera llamada cae en un día sin
   certificación de usura vigente, la letra que Google exige al lado de todo
   precio desaparecería el resto de la sesión, sin decir nada. */
var DIVULGACION_G = null;
function divulgacionGarantiaHoy(muestra) {
  var K = window.Cumplimiento;
  if (!K || !K.divulgacionRespaldado) return '';
  /* Y LA LLAVE EMPIEZA POR LA FECHA. Medido el 17-sep con la fecha fijada a
     mano: en un banco abierto el 17 —día en que este producto SÍ se puede
     ofrecer— y movido al 20 —día en que NO, porque su peor plazo se pasa del
     techo de usura—, la tarjeta seguía cotizando, porque la respuesta del 17
     estaba guardada y nadie volvía a preguntar. Era el guardián del techo
     apagado por una caché.

     No es hipotético ni raro: entre septiembre y noviembre de 2026 hay 38 días
     de 91 en que este producto no se puede anunciar, y son rachas de seis días
     seguidos. Basta una pestaña abierta cruzando la medianoche —o una app
     instalada que el sistema despierta— para caer en el día equivocado. El
     artículo 305 no distingue entre anunciar y cobrar.

     Cuesta una concatenación y cierra el agujero entero: cambiado el día,
     ninguna llave de ayer coincide y todo se vuelve a preguntar. */
  var m = muestra || null;
  var llave = hoyISO() + '|' + (m ? (m.capital + '|' + m.meses) : 'ejemplo');
  if (DIVULGACION_G && DIVULGACION_G[llave]) return DIVULGACION_G[llave];
  var d = K.divulgacionRespaldado(hoyISO(), m);
  var texto = (d && d.puede) ? d.texto : '';
  if (texto) {
    if (!DIVULGACION_G) DIVULGACION_G = {};
    DIVULGACION_G[llave] = texto;
  }
  return texto;
}
/* Y la pregunta que hay que hacerse antes de imprimir la primera cifra de este
   producto, igual que hayQueCotizar para el otro. */
function hayQueCotizarGarantia() { return !!divulgacionGarantiaHoy(); }

var DIVULGACION = null;
/* 9-sep-2026 — EL VACÍO NO SE CACHEA. Antes, si la primera llamada caía en un
   día sin certificación de usura vigente, esto guardaba '' y lo devolvía el
   resto de la sesión sin decir nada. La letra que Google exige al lado de todo
   precio desaparecía sola y en silencio — y con una calculadora que se repinta
   en cada movimiento del dedo, esa llamada ocurre cien veces por visita.
   Ahora el vacío se vuelve a preguntar, y quien pinta cifras tiene que
   comprobar que hay texto ANTES de pintar la primera (ver hayQueCotizar). */
/* 15-sep-2026 — EL EJEMPLO ES EL DEL CLIENTE, Y LA CACHE VA POR COMBINACION.
   Joan lo vio: con el deslizador en ocho millones, la pantalla decia «En total
   vas a pagar $8.513.600» y tres centimetros mas abajo «Ejemplo: por $500.000
   (...) un total de $532.100». Dos juegos de cifras juntos y nada que dijera
   cual era el suyo.

   La cache sigue existiendo —esto se llama cien veces por arrastre— pero ahora
   guarda una entrada POR COMBINACION de monto y plazo. Con una sola entrada,
   hacer que el ejemplo siguiera al deslizador no habria servido de nada: la
   primera respuesta se quedaria pegada, que es exactamente el defecto que
   habia. */
function divulgacionHoy(muestra) {
  var K = window.Cumplimiento;
  if (!K) return '';
  /* 17-sep-2026 — LA LLAVE EMPIEZA POR LA FECHA, igual que la del otro
     producto y por la misma razón, que acá es más callada pero igual de mala:
     la frase «Tasa máxima legal vigente en Colombia: X%» sale de la tabla de
     topes, que se vence el último día de cada mes por diseño. Sin la fecha en
     la llave, una sesión abierta cruzando esa medianoche sigue publicando el
     techo del mes pasado como vigente — una afirmación falsa en el único texto
     de la app que existe para no afirmar ninguna. */
  var m = muestra || null;
  var llave = hoyISO() + '|' + (m ? (m.capital + '|' + m.meses) : 'ejemplo');
  if (DIVULGACION && DIVULGACION[llave]) return DIVULGACION[llave];
  var d = K.divulgacion(hoyISO(), m);
  var texto = (d && d.puede) ? d.texto : '';
  /* El vacio NO se cachea (ver el comentario de arriba: el 9-sep se perdio la
     letra obligatoria toda una sesion por guardar ''). */
  if (texto) {
    if (!DIVULGACION) DIVULGACION = {};
    DIVULGACION[llave] = texto;
  }
  return texto;
}
/* La pregunta que toda pantalla con precios tiene que hacerse primero. Sin
   divulgación no se cotiza: es el artículo 305 del Código Penal por un lado y
   la ficha de Google por el otro, y la app ya estuvo a punto de publicar
   «tasa máxima legal: 0,00%» una vez (4-sep-2026). */
function hayQueCotizar() { return !!divulgacionHoy(); }

function fmtFecha(iso) {
  var p = String(iso).split('-');
  var mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}

function pedir() {
  var err = $('errPedir');
  err.classList.add('oculto');
  if (!CFG.url || !CFG.anon) {
    return fallo(err, 'Todavía no está conectada la base de datos, así que la solicitud no ' +
      'se puede enviar. Esto es una versión en construcción.');
  }
  fallo(err, 'Enviando…');
  /* La solicitud NO es un crédito: entra a la bandeja de Joan y él responde. La
     pantalla lo dice con esas palabras para que nadie salga creyendo que ya le
     desembolsaron. */
  /* 21-oct-2026 — H2: la sesión que pide (o ninguna); la respuesta se calla si
     al volver la pestaña ya es de otra (deEstaSesion). */
  var ses = SESION;
  /* 21-oct-2026 (R3) — escritura en camino: ver LO QUE VA EN CAMINO NO SE CORTA. */
  deEstaSesion(ses, escrituraEnCamino(fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/play_solicitar', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json', apikey: CFG.anon,
      Authorization: 'Bearer ' + ((ses && ses.access_token) || CFG.anon)
    },
    /* El plazo que el socio escogió, no el del producto: play_solicitar acepta
       de 1 a 6 y lo guarda en plazo_meses desde el 9-sep. Mandar el fijo era
       tirar su elección en el último metro.
       Y desde el 22-sep va la nota: es lo que Joan lee en su CRM antes de
       contraproponer, en las palabras del cliente. */
    /* El plazo pedido viaja PEGADO A LA NOTA y no en p_meses: p_meses es lo que
       se va a registrar y tiene que ser un plazo que exista. Lo que el cliente
       pide de más es información para Joan, no una instrucción para la base. */
    body: JSON.stringify({ p_capital: MONTO, p_meses: PLAZO,
                           p_nota: notaConPlazo() })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })))
    .then(function (j) {
      /* La función contesta {ok:false} con HTTP 200 cuando algo no cuadra o el
         freno de solicitudes está lleno: decir «recibimos» ahí sería mentir.
         22-sep-2026 — y desde hoy trae MOTIVO. Antes los cinco casos salían con
         la misma frase y el que se pasaba del techo por un cero de más se
         quedaba tocando el botón sin saber qué corregir. */
      if (!j || j.ok !== true) {
        var m = j && j.motivo;
        return fallo(err,
          /* Las dos cifras las dice el SERVIDOR, en la misma respuesta que el
             motivo. Escribirlas aquí de respaldo sería tener el piso y el techo
             en dos sitios, y el día que Joan mueva uno la app diría el otro.
             Si no vinieran, se dice lo que pasó sin inventar la cifra. */
          m === 'minimo' ? (j.minimo ? 'El mínimo que podemos estudiar es ' + COP(j.minimo) + '. Sube la cifra y lo vemos.'
                                     : 'Esa cifra se nos queda corta. Sube un poco y lo vemos.')
          : m === 'maximo' ? (j.maximo ? 'Por aquí llegamos hasta ' + COP(j.maximo) + '. Si necesitas más, escríbenos en el chat y lo hablamos.'
                                       : 'Esa cifra se nos sale por arriba. Escríbenos en el chat y lo hablamos.')
          : m === 'plazo' ? 'Escoge entre 1 y 6 cuotas y volvemos a intentar.'
          : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y tu solicitud sale al instante.'
          : m === 'muchas' ? 'Ya nos dejaste varias solicitudes hoy. Las tenemos todas; dale un rato y te respondemos en el chat.'
          : 'No pudimos recibir la solicitud ahora. Espera unos minutos y vuelve a intentar.');
      }
      anotarAparato('solicitud', ses);   // 19-oct-2026: desde qué teléfono pidió (solo con sesión)
      pintarPedido();
    })
    .catch(function () {
      fallo(err, 'No pude enviar la solicitud. Revisa tu internet y vuelve a intentar.');
    });
}

/* Junta lo que el cliente escribió: el plazo que pidió, si pidió otro, y para
   qué lo quiere. Va todo en pedido_nota, que Joan lee en su CRM. */
function notaConPlazo() {
  var plazo = String((($('rPlazoLibre') || {}).value || '')).trim();
  var nota = String((($('rNota') || {}).value || '')).trim();
  var partes = [];
  if (plazo) partes.push('Pide el plazo: ' + plazo);
  if (nota) partes.push(nota);
  return partes.join(' · ').slice(0, 300);
}
/* Se anota mientras escribe, como el resto del formulario: quien lo teclea y
   pierde la pestaña no lo vuelve a escribir. */
function anotarPlazoLibre(el) {
  try { sessionStorage.setItem('play_plazo_libre', String(el.value || '')); } catch (e) {}
}

function pintarPedido() {
  VISTA = 'pedido';   // 21-oct-2026 — era 'cuenta' por herencia: SE ACTUALIZA SOLA la habría creído la cuenta
  $('titulo').textContent = 'Solicitud enviada';
  $('cuerpo').innerHTML =
    '<div class="card"><div class="aviso verde"><b>Recibimos tu solicitud.</b></div>' +
      /* El plazo que se MANDÓ, no el del producto: decirle «a 6 meses» a quien
         pidió tres es contestarle una solicitud que no hizo. */
      '<p class="sub" style="margin-top:var(--e4)">Pediste ' + COP(MONTO) + ' en ' +
      textoCuotas(PLAZO) + '. <b>Todavía no es un crédito:</b> la revisamos y te ' +
      'respondemos <b>en el chat de la app</b>, en la pestaña Chat. Si la aprobamos, ' +
      'ahí mismo te decimos cuándo recibes la plata.</p>' +
      '<button class="btn arriba" onclick="pintarCuenta()">Volver a mi cuenta</button>' +
    '</div>' + pie();
  window.scrollTo(0, 0);
}

/* EL HISTORIAL. Sale de la sesión. Si no hay nada, se distingue "no tienes
   créditos todavía" de "no pudimos cargarlos": son cosas distintas y confundirlas
   le haría creer al socio que perdió su historial. */
function tarjetaHistorial() {
  var creditos = historialDeSesion(SESION);
  if (!SESION) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">No pudimos cargar tu historial. Vuelve a entrar en un momento.</p></div>';
  }
  if (!creditos.length) {
    return '<div class="card"><div class="etq">Tu historial</div>' +
      '<p class="sub">Todavía no tienes créditos con nosotros. Cuando pidas el primero, ' +
      'aquí vas a ver cada cuota y cada pago.</p></div>';
  }
  return '<div class="card"><div class="etq">Tu historial</div>' +
    creditos.map(function (cr) {
      var pagadas = (cr.cuotas || []).filter(function (q) { return q.pagada; }).length;
      return '<div style="margin-top:var(--e4)">' +
        '<b>' + COP(cr.capital) + '</b> a ' + cr.meses + ' meses' +
        '<div class="ayuda">' + esc(fmtFecha(cr.fecha_desembolso)) + ' · ' +
          pagadas + ' de ' + (cr.cuotas || []).length + ' cuotas pagadas' +
          (cr.pagado ? ' · <b>terminado</b>' : '') + '</div>' +
        /* 16-sep-2026 — con cuadroCuotas, que ya sabe pintar el ✓ de lo pagado.
           Era la quinta copia de la misma lista en este archivo. */
        cuadroCuotas(cr.cuotas) +
        '</div>';
    }).join('') +
    '<button class="btn sec sm arriba" onclick="imprimirCertificado()">' +
      'Descargar mi certificado de pagos</button>' +
    '</div>';
}

/* El certificado y el contrato: una ventana imprimible que el teléfono guarda
   como PDF con "Imprimir → Guardar como PDF". Sin librerías, sin subir nada a
   ningún servidor, y funciona igual en Android y en iPhone. */
function imprimirCertificado() {
  var creditos = historialDeSesion(SESION);
  var nombre = (SESION && SESION.user && SESION.user.user_metadata &&
                SESION.user.user_metadata.vinculacion &&
                (SESION.user.user_metadata.vinculacion.nombres + ' ' +
                 SESION.user.user_metadata.vinculacion.apellidos)) || 'Socio';
  var filas = creditos.map(function (cr) {
    return '<h3>' + COP(cr.capital) + ' a ' + cr.meses + ' meses · ' +
      esc(fmtFecha(cr.fecha_desembolso)) + '</h3><table>' +
      (cr.cuotas || []).map(function (q) {
        return '<tr><td>Cuota ' + q.n + '</td><td>' + esc(fmtFecha(q.fecha)) + '</td>' +
          '<td>' + COP(q.total) + '</td><td>' + (q.pagada ? 'Pagada' : 'Pendiente') + '</td></tr>';
      }).join('') + '</table>';
  }).join('');

  var w = window.open('', '_blank');
  if (!w) return;
  w.document.write(
    '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<title>Certificado de pagos · Tu Garantía</title><style>' +
    'body{font-family:Georgia,serif;max-width:700px;margin:40px auto;padding:0 20px;color:#111}' +
    'h1{font-size:20px} h3{font-size:15px;margin-top:24px}' +
    'table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}' +
    'td{padding:6px 4px;border-bottom:1px solid #ddd}' +
    '.pie{margin-top:34px;font-size:12px;color:#666;line-height:1.6}' +
    '</style></head><body>' +
    '<h1>Certificado de pagos</h1>' +
    '<p>' + esc(nombre) + '<br>Expedido el ' + esc(fmtFecha(hoyISO())) + '</p>' +
