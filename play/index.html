  }
  return '<div class="card laca">' +
    CS.html(estadoInicialDelPedido(), { titulo: TEXTOS.gancho, boton: 'Abrir mi cuenta y pedirlo',
                                        accion: 'pedirDesdeLaPortada()', hoy: hoyISO(),
                                        alCambiar: guardarPedidoMovido }) +
    '</div>';
}
function pedirDesdeLaPortada() {
  if (CS) CS.guardar(CS.estado());
  abrirRegistro();   // 20-oct-2026, revisión: la misma puerta que «Abrir mi cuenta» (ver abrirRegistro)
}

/* -------------------------------------------------------------------------
 * LA CALCULADORA (del producto a 6 meses)
 *
 * 8-oct-2026 — YA NO SE PINTA en la portada ni en la cuenta: la reemplazó la
 * calculadora del pedido, sin precio (ver arriba y tarjetaPedir). Se queda en
 * el archivo porque sus funciones son las que prueban, contra el motor, que un
 * precio publicado nunca pase el techo de usura (pruebas/vitrina.test.js): si
 * algún día Joan vuelve a publicar un precio, este es el código que ya sabe
 * hacerlo sin romper la ley. Si eso no pasa, se borra en una limpieza, con
 * sus pruebas.
 *
 * Los números salen TODOS de C.simular(): ninguno se calcula acá. Es la regla
 * de la casa y en este archivo importa el doble, porque una cuenta escrita a
 * mano en la vitrina sería un precio distinto del que se cobra.
 *
 * Se usa el perfil preferente para cotizar y NO es una promesa de cupo: el
 * perfil decide cuánto y qué tan rápido, nunca el precio (app/creditos.js).
 * Con preferente el motor cotiza cualquier monto del rango sin devolver
 * 'sin_cupo', y el precio que sale es exactamente el mismo que pagaría
 * cualquiera. Lo que el visitante puede pedir se dice aparte, en el recorrido.
 * ----------------------------------------------------------------------- */
var CALC_MIN = 100000;      // el mínimo que acepta el servidor (play_solicitar)
/* 9-sep-2026 — SE LEE DEL PERFIL, no se escribe. Estaba clavado en 2.000.000 y
   el día que Joan subiera el tope, la calculadora se habría quedado ofreciendo
   el viejo sin que nadie lo notara: la pantalla diría una cosa y el motor otra.
   Hay una prueba que exige que estos dos números sean el mismo. */
var CALC_MAX = C.PERFILES.preferente.cupo_maximo;
var CALC_PASO = 50000;
var CALC_MESES_MIN = 3;     // 90 días. Por debajo, simular() lanza: la app dejaría de ser publicable.
var CALC_MESES_MAX = 6;
/* Arranca en 500.000 y a 6 meses a propósito: es el mismo ejemplo que trae la
   divulgación obligatoria, así que lo primero que ve el visitante son dos
   cifras que coinciden en vez de dos precios distintos del mismo producto. */
var CALC = { monto: 500000, meses: 6 };

function cotizacionDeCalc() {
  var r = C.simular({ perfil: 'preferente', capital: CALC.monto,
                      fecha_desembolso: hoyISO(), meses: CALC.meses });
  return r.puede ? r : r.cotizacion;
}

function tarjetaCalculadora() {
  /* Sin la letra obligatoria no se pinta ni una cifra. Es el artículo 305 por un
     lado y la ficha de Google por el otro, y esta app ya estuvo a punto de
     publicar «tasa máxima legal: 0,00%» una vez. */
  if (!hayQueCotizar()) {
    return '<div class="card"><h3 class="tit">No podemos cotizar hoy</h3>' +
      '<p class="sub">Nos falta la certificación de la tasa máxima legal de este mes, y sin ella ' +
      'no publicamos un precio. Abre tu cuenta y lo resolvemos en el chat de la app.</p></div>';
  }
  /* 16-sep-2026 — EL SELLO DE EJEMPLO ENTRA A LA CALCULADORA, y llevaba faltando
     desde que existe. Los escalones lo tienen por una razón escrita —lo que
     viaja por WhatsApp es un recorte, y un recorte se lleva la cifra y deja el
     descargo— y esta tarjeta es la MÁS recortable de la página: es la que tiene
     la cifra grande. Su descargo («Esto es un cálculo, no una aprobación») vive
     en la tarjeta de al lado, así que un recorte de ésta viajaba desnudo.
     Va antes del gancho, que es antes de la primera cifra. */
  return '<div class="card laca">' +
      '<span class="ej-sello">Ejemplo</span>' +
      '<div class="etq">' + esc(TEXTOS.gancho) + '</div>' +
      lluviaDeCalc() +
      '<div id="calcCifras">' + cifrasDeCalc() + '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="calcMonto" style="margin:0">Cuánto necesitas</label>' +
          '<b id="calcMontoTxt">' + COP(CALC.monto) + '</b></div>' +
        '<input type="range" id="calcMonto" min="' + CALC_MIN + '" max="' + CALC_MAX + '" ' +
          'step="' + CALC_PASO + '" value="' + CALC.monto + '" ' +
          'aria-label="Cuánto necesitas" oninput="moverCalc()">' +
      '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="calcMeses" style="margin:0">En cuántas cuotas</label>' +
          '<b id="calcMesesTxt">' + CALC.meses + ' meses</b></div>' +
        '<input type="range" id="calcMeses" min="' + CALC_MESES_MIN + '" max="' + CALC_MESES_MAX + '" ' +
          'step="1" value="' + CALC.meses + '" aria-label="En cuántas cuotas" oninput="moverCalc()">' +
      '</div>' +
    '</div>' +
    '<div class="card"><div id="calcLetra">' + letraDeCalc() + '</div></div>';
}

/* Las cifras se repintan solas; los deslizadores NO están adentro de esto y es
   deliberado: en este proyecto ya se borró dos veces un campo a mitad de
   escribir por repintar el contenedor que lo contenía. */
function cifrasDeCalc() {
  var c = cotizacionDeCalc();
  if (!c) return '<div class="aviso ambar">No podemos cotizar hoy.</div>';
  /* LA CUOTA MANDA Y EL TOTAL VA APARTE. Son las dos cifras con las que una
     persona decide, y antes la segunda vivía metida en una línea gris del mismo
     tamaño que todo lo demás: se leía la cuota y el total se perdía.
     «Última cuota» se fue: con las seis fechas en pantalla era el mismo dato
     dos veces, y el dato repetido es el que se queda viejo. */
  /* 15-sep-2026 — EL NUMERO GRANDE NO DECIA QUE ERA.
     Joan: «me refiero al valor en color amarillo (...) miro el capital del
     prestamo y lo que el cliente paga al final y no cuadra con el valor en
     color amarillo o no entiendo que significa».

     Y tenia razon. Encima del numero decia «MIRA CUANTO TE COSTARIA», debajo
     —en gris chiquito— «cada mes, durante 6 meses». Un titulo que habla de
     COSTO justo encima de una cifra grande hace que la cifra se lea como el
     costo, y lo que hay ahi es la CUOTA. Tres numeros en la tarjeta ($88.683 de
     cuota, $32.100 de costo, $532.100 de total) y el mas grande era el unico
     sin nombre propio.

     Si el dueno del negocio no lo entiende, el cliente tampoco. La etiqueta va
     ARRIBA de la cifra, que es donde se lee antes. */
  /* 16-sep-2026 — AHORA LA CIFRA GRANDE ES LO QUE RECIBE, y el cambio es de
     Joan: «el monto que RECIBE grande y de primero, con el costo pequeño y
     abajo».

     LO QUE SE CONSERVA DEL ARREGLO DEL 15-sep, porque era lo que de verdad
     importaba: la cifra grande sigue teniendo su nombre ENCIMA. Lo que cambió
     no es que se pueda dejar un número sin nombre — eso sigue prohibido y hay
     una prueba— sino CUÁL es el número que manda.

     LO QUE NO SE PUEDE HACER, Y JOAN QUEDÓ ENTERADO: esconder lo que paga. El
     costo total y la tasa efectiva anual son divulgación obligatoria en la
     oferta de un crédito en Colombia, y app/cumplimiento.js existe justo para
     imprimirlos. Mostrar solo lo que recibe y callar lo que paga es el patrón
     que la SIC sanciona. Así que se reordena, no se esconde: el total se queda
     en su propia caja —no vuelve a ser un renglón—, y el costo y la tasa bajan
     a renglón, que es «pequeño y abajo» sin dejar de estar.

     Y LA CUOTA NO SE PIERDE: es con lo que la gente decide si puede o no, así
     que va en el pie, en negrita y a 16 px, pegada al plazo. */
  return '<div class="etq-cifra">Lo que recibes</div>' +
    '<div class="calc-cifra">' + COP(c.capital) + '</div>' +
    '<div class="muted calc-pie">y lo pagas en ' + c.meses + ' cuotas de ' +
      '<b class="pie-cuota">' + COP(c.cuota_tipica) + '</b>' +
      avisoUltimaCuota(c) + '</div>' +
    '<div class="granTotal"><span>En total vas a pagar</span><b>' +
      COP(c.total_a_pagar) + '</b></div>' +
    fila('Lo que cuesta', COP(c.costo_total)) +
    /* La E.A. es la ÚNICA cifra en porcentaje que el cliente ve en todo el
       sistema, y va porque Google la exige junto a cualquier precio de crédito. */
    fila('Tasa efectiva anual', pct(c.efectivo_anual)) +
    /* LAS CUOTAS, UNA POR UNA, CON SU FECHA. Es lo que Joan pidió con esas
       palabras, y se pinta con cuadroCuotas —el mismo que usa la calculadora del
       crédito con garantía y el que pinta la propuesta que él manda—. Tres
       sitios, una función. Desde el 16-sep van PLEGADAS: ver plegableCuotas. */
    plegableCuotas(c.cuotas);
}

/* LAS CUOTAS, PLEGADAS — 16-sep-2026. Joan: «menos cuotas en la lista», y de la
   de abajo dijo directamente que confundía.

   NO SE BORRA NINGUNA, y esto no es terquedad con el pedido: seis renglones con
   su fecha son lo que él mismo pidió el 16 por la mañana «para mejorar la
   cobranza y dar claridad», y quitarlos dejaría a la pantalla diciendo un total
   sin decir cómo se llega a él. Lo que estorbaba no era el dato: era que
   ocupaba media pantalla entre la cifra y el botón. Cerrado es una línea; el
   que quiere ver las fechas las abre con un toque y no pierde el sitio.

   Es el mismo <details> de la historia y del recorrido, con otra piel para que
   funcione también dentro de la laca. */
/* Y SE ACUERDA DE SI ESTABA ABIERTO, que no es un lujo: las cifras se repintan
   enteras en CADA movimiento del deslizador, así que sin esto el que abre el
   plan y mueve un peso lo ve cerrarse en la cara — y lo que estaba mirando era
   justamente cómo cambian las fechas con el monto. Se guarda por calculadora y
   no en una sola bandera: la de arriba y la de la garantía son dos lecturas
   distintas, y abrir una no tiene por qué abrir la otra. */
var PLAN_ABIERTO = {};
function recordarPlan(el) {
  var k = el.getAttribute ? el.getAttribute('data-plan') : null;
  if (k) PLAN_ABIERTO[k] = !!el.open;
}
function plegableCuotas(cuotas, clave) {
  var k = clave || 'calc';
  return '<details class="plegable det-cuotas" data-plan="' + k + '"' +
      (PLAN_ABIERTO[k] ? ' open' : '') + ' ontoggle="recordarPlan(this)">' +
    '<summary>Cuándo pagarías cada cuota</summary>' +
    '<div class="adentro">' + cuadroCuotas(cuotas) + '</div></details>';
}

function letraDeCalc() {
  return '<div class="aviso ambar" style="margin-top:0"><b>Esto es un cálculo, no una aprobación.</b> ' +
      'El precio es real y es el que se cobra. Cuánto te podemos prestar a ti lo decidimos ' +
      'cuando abras tu cuenta y hablemos.</div>' +
    '<div class="muted" style="font-size:12.5px;margin-top:12px;line-height:1.55">' +
      esc(divulgacionHoy({ capital: CALC.monto, meses: CALC.meses })) + '</div>' +
    '<div class="muted" style="font-size:12.5px;margin-top:10px">Sin cuotas de manejo, sin seguros ' +
      'y sin cargos aparte: lo que ves es todo lo que se cobra.</div>';
}

/* ===================== LA CALCULADORA DE LA GARANTÍA =====================
   Joan, 14-sep-2026: «una calculadora abierta para que la gente pueda ver los
   créditos que se solicitan con garantía… y que está a 6 meses si el cliente
   quiere, pero ser claros explicando que para esta calculadora solo se puede
   acceder de acuerdo al acumulado de garantía».

   LAS DOS MITADES DE ESA FRASE VAN JUNTAS O NO VA NINGUNA. La calculadora se le
   muestra a todo el mundo —es lo que explica para qué sirve pagar en fecha—,
   pero encima de la primera cifra va siempre hasta dónde le alcanza HOY a quien
   está mirando. Una cuota de tres millones enseñada a quien tiene cero de
   garantía, sin esa línea, es una oferta que no existe.

   Las cifras salen de motor.js (simularPrestamoRespaldado), el mismo que cobra
   en el CRM: 2% mensual SOBRE EL SALDO —no sobre el original—, cuota fija, a 6
   meses como máximo y desde un millón. */
var GCALC = { monto: M.MONTO_MINIMO_RESPALDADO, meses: M.PLAZO_RESPALDADO_MAX, arranque: null };
var GCALC_MIN = M.MONTO_MINIMO_RESPALDADO;
/* EL PISO ES EL DE LA PÁGINA, no el del motor. El motor acepta el préstamo con
   garantía desde UN mes y así lo opera Joan en su CRM; esta pantalla lleva
   declarado el piso de 90 días desde agosto (ver CALC_MESES_MIN, unas líneas
   arriba, con su razón). Se deriva del mismo número para que no haya dos. */
var GCALC_MESES_MIN = Math.ceil(C.PLAZO_MINIMO_DIAS / 30);
var GCALC_MESES_MAX = M.PLAZO_RESPALDADO_MAX;
/* El tope del deslizador sale del mínimo, no de una cifra escrita acá: el techo
   de verdad es la garantía de cada uno, y esto es solo hasta dónde deja
   arrastrar el dedo. */
var GCALC_MAX = M.MONTO_MINIMO_RESPALDADO * 4;
var GCALC_PASO = 100000;

/* La entrada del motor. Con ficha, la de la ficha; sin ficha, una en cero — que
   es la verdad de quien todavía no ha pagado nada. */
function entradaGarantia() {
  return (FICHA && FICHA.entrada) ||
    { datos: {}, referidos: 0, acumulada: 0, ajuste: 0, comprometida: 0 };
}
function respaldoDisponible() { return (FICHA && FICHA.maxRespaldado) || 0; }

function cotizacionGarantia(saltar) {
  try {
    return M.simularPrestamoRespaldado(GCALC.monto, GCALC.meses, entradaGarantia(),
                                       { fechaDesembolso: hoyISO(),
                                         saltarCortes: saltar == null ? arranqueElegido() : saltar });
  } catch (e) { return null; }
}

/* ---------------------------------------------------------------------------
 * CUANDO QUIERE PAGAR — 15-sep-2026, pedido de Joan con estas palabras:
 * «quiero ver la opcion para yo escoger el numero de cuotas y las fechas de
 * pago». Las cuotas ya se elegian con el deslizador; las fechas, no.
 *
 * No es un calendario libre, y eso es a proposito: las cuotas de este producto
 * caen en los CORTES de la casa (el 15 y el fin de mes, corridos si hay domingo
 * o festivo), asi que dejar escribir una fecha cualquiera seria ofrecer un dia
 * en el que nadie recauda. Lo que se elige es CUAL corte, y la pantalla lo dice
 * con la fecha de verdad —«el 31 de octubre»—, no con una regla que habria que
 * explicar.
 *
 * Y hay una razon de plata, no de comodidad: correr la primera cuota un corte
 * BAJA la efectiva anual. Medido sobre septiembre, un millon, los treinta dias
 * de desembolso: a tres meses, doce de los treinta se pasaban del techo de
 * usura; corriendo el arranque, CERO, y el peor caso baja de 33,07% a 24,34%.
 * A seis meses, de seis de treinta a cero. O sea que esta pantalla no solo
 * ofrece elegir: ofrece la opcion que cabe debajo de la ley.
 *
 * Por eso cada opcion se cotiza POR SEPARADO y se le pregunta a
 * garantiaSePuedeCotizar. La que no pasa no se ofrece, y se dice por que en
 * palabras —no se esconde, porque una opcion que desaparece sin explicacion es
 * la pantalla mintiendo por omision.
 * ------------------------------------------------------------------------- */
function arranquesPosibles() {
  var salida = [];
  try {
    var ops = M.opcionesDeArranque(hoyISO(), GCALC.meses);
    for (var i = 0; i < ops.length; i++) {
      var c = cotizacionGarantia(ops[i].saltar);
      salida.push({
        saltar: ops[i].saltar,
        primera: ops[i].primera,
        dias: ops[i].dias_a_la_primera,
        cotizacion: c,
        sirve: !!(c && c.cumple_minimo && garantiaSePuedeCotizar(c))
      });
    }
  } catch (e) { return []; }
  return salida;
}

/* Cual arranque manda. Si el dedo ya eligio uno y ese sirve, ese; si no, el
   PRIMERO que sirva. Nunca se devuelve uno que no sirva: de este numero cuelga
   el precio que se publica, y publicar el precio de una opcion ilegal por no
   tener a mano una legal es justo lo que el articulo 305 castiga. */
function arranqueElegido() {
  var ops;
  try { ops = M.opcionesDeArranque(hoyISO(), GCALC.meses); } catch (e) { return 0; }
  var legales = [];
  for (var i = 0; i < ops.length; i++) {
    var c = null;
    try {
      c = M.simularPrestamoRespaldado(GCALC.monto, GCALC.meses, entradaGarantia(),
        { fechaDesembolso: hoyISO(), saltarCortes: ops[i].saltar });
    } catch (e) { c = null; }
    if (c && c.cumple_minimo && garantiaSePuedeCotizar(c)) legales.push(ops[i].saltar);
  }
  if (!legales.length) return 0;
  for (var k = 0; k < legales.length; k++) if (legales[k] === GCALC.arranque) return GCALC.arranque;
  return legales[0];
}

function eligeArranque(v) {
  GCALC.arranque = Number(v);
  var caja = $('gcalcCifras'); if (caja) caja.innerHTML = cifrasDeGarantia();
  var f = $('gcalcFechas'); if (f) f.innerHTML = mandoDeFechas();
}

/* El mando, con la fecha REAL de cada opcion. Si solo hay una que sirva, no se
   pinta una eleccion de una sola cosa: se dice cuando seria la primera cuota y
   ya. Un boton solo, marcado, que no se puede cambiar, es un boton que engana
   sobre lo que hay para elegir. */
function mandoDeFechas() {
  var ops = arranquesPosibles();
  var sirven = ops.filter(function (o) { return o.sirve; });
  if (!sirven.length) return '';
  if (sirven.length === 1) {
    return '<div class="mando"><div class="cab-mando">' +
      '<span>Tu primera cuota</span><b>' + fmtFecha(sirven[0].primera) + '</b></div>' +
      '<div class="muted" style="font-size:12.5px">Las siguientes, una cada mes. ' +
      'Siempre en dia habil: si la fecha cae domingo o festivo, se corre.</div></div>';
  }
  var elegido = arranqueElegido();
  var botones = sirven.map(function (o) {
    return '<button type="button" class="opFecha' + (o.saltar === elegido ? ' sel' : '') + '" ' +
      'aria-pressed="' + (o.saltar === elegido) + '" onclick="eligeArranque(' + o.saltar + ')">' +
      '<b>' + fmtFecha(o.primera) + '</b>' +
      '<span>en ' + o.dias + ' dias</span></button>';
  }).join('');
  return '<div class="mando"><div class="cab-mando">' +
    '<label style="margin:0">Cuando pagas la primera</label></div>' +
    '<div class="opFechas">' + botones + '</div>' +
    '<div class="muted" style="font-size:12.5px">Las siguientes, una cada mes. ' +
    'Siempre en dia habil: si la fecha cae domingo o festivo, se corre.</div></div>';
}

/* La efectiva anual del flujo REAL, no de una fórmula aparte: se le da al mismo
   cálculo que usa el producto a 6 meses, con las cuotas que se acaban de pintar.
   Es la única cifra en porcentaje que el cliente ve, y va porque es obligatoria. */
/* 16-sep-2026 — CON LAS FECHAS DE VERDAD, y la diferencia no es cosmética.
   Esto usaba C.efectivoAnual, que supone cuotas cada treinta días parejos. Las
   de este producto caen en los CORTES —el 15 y el fin de mes—, así que con
   desembolso el 10 la primera cae a VEINTE días y el crédito de «tres meses»
   dura 81. La plata vuelve antes: la tasa de verdad es más alta.
   Medido sobre septiembre, un millón, los treinta días de desembolso: a tres
   meses, DOCE de los treinta quedan por encima del techo de usura, y el peor da
   33,07% mientras esta línea publicaba 26,82%. La única cifra en porcentaje que
   el cliente ve estaba diciendo un número que no era el de su propio plan.
   Devuelve null si no se puede calcular, y quien la llame tiene que tratarlo:
   una tasa que no se puede calcular no se publica. */
function eaDeGarantia(c) {
  return C.efectivoAnualPorFechas(hoyISO(), c.capital,
    c.cuotas.map(function (q) { return { fecha: q.fecha_corte, total: q.total }; }));
}

/* EL TECHO DE USURA, COMPROBADO EN PANTALLA Y NO SOLO EN LAS PRUEBAS. Las
   pruebas comparan contra el tope más bajo de la tabla; esto compara contra el
   tope DE HOY, que es el que manda. Si un mes la Superfinanciera bajara el techo
   por debajo de este producto, la app deja de cotizarlo sola en vez de publicar
   un precio que el artículo 305 castiga con cárcel. */
/* 16-sep-2026 — SIN CERTIFICACIÓN NO SE PROHÍBE: SE CALLA LA FRASE, NO EL PRECIO.
   Es la decisión escrita del 4-sep, y esta función la estaba contradiciendo. La
   tabla de topes se vence el último día de cada mes por diseño —la
   Superfinanciera certifica mes a mes y nadie adivina el siguiente— y hasta hoy
   un `topeVigente` nulo devolvía false: el 1 de octubre, dentro de dos semanas,
   la tarjeta entera del crédito con garantía habría desaparecido de la puerta
   pública. La cuota, el total, las seis fechas, el cuadro de lo que gana
   pagando: todo, y hasta que alguien se acordara de agregarle una fila a la
   tabla.
   El precio de este producto NO sale del techo (es 2% mensual sobre el saldo),
   así que la cotización sobrevive igual que la del otro producto. Lo que se
   calla es la frase del techo, y de eso ya se encarga divulgacionRespaldado.
   El `return false` se queda para el caso que de verdad importa: hay techo
   certificado y el precio se le pasa por encima. */
function garantiaSePuedeCotizar(c) {
  if (!hayQueCotizarGarantia()) return false;
  /* Una tasa que no se pudo calcular no se publica, y tampoco se deja pasar:
     sin ella no hay con qué comparar contra el techo. */
  var ea = eaDeGarantia(c);
  if (ea == null) return false;
  /* 15-sep-2026 — AQUI DECIA `if (!t) return true`, Y ESO ERA UNA REJA CON
     FECHA DE APERTURA. `topeVigente` devuelve null desde el dia en que la tabla
     se vence —el 30 de septiembre— y a partir de ahi esta linea daba por bueno
     CUALQUIER precio.

     Medido sobre octubre, un millon: el credito con garantia a tres meses se
     pasa del ultimo techo conocido en DOCE de los treinta y un dias, y el peor
     da 32,81%. O sea que el 1 de octubre esta pagina habria empezado a publicar
     precios de usura sola, sin que nadie tocara nada.

     El techo del mes que viene no se puede saber. Pero NO se mueve de golpe: en
     toda la tabla va de 28,79% a 29,24%. Mientras llega el nuevo se compara
     contra el ultimo conocido, que es conservador y es lo unico honesto que se
     puede hacer con lo que hay. Si no hay tabla NINGUNA, no se publica. */
  var t = C.topeDeReferencia ? C.topeDeReferencia(hoyISO()) : null;
  if (!t) return false;
  return ea <= t.tope;
}

/* 7-oct-2026 (tercera vuelta) — QUÉ HACER CUANDO NO SE PUEDE PUBLICAR EL
   PRECIO, SEGÚN QUIÉN MIRA. La misma tarjeta sale en la fachada y en la
   pestaña Crédito de la cuenta, y a quien ya abrió la cuenta le decía «Abre tu
   cuenta y lo resolvemos». Con sesión, la salida es el chat de «Créditos
   nuevos» (CANALES), que es donde se pide y se pregunta cuánto alcanza.
   `enMedio`: la frase va después de una coma, en minúscula. */
function salidaSinPrecio(enMedio) {
  if (SESION && SESION.access_token) {
    return (enMedio ? 'escríbenos' : 'Escríbenos') + ' por el chat de <b>Créditos nuevos</b> y lo resolvemos.';
  }
  return (enMedio ? 'abre' : 'Abre') + ' tu cuenta y lo resolvemos en el chat de la app.';
}

function tarjetaCalcGarantia() {
  var c = cotizacionGarantia();
  if (!c || !garantiaSePuedeCotizar(c)) {
    return '<div class="card"><h3 class="tit">El crédito con garantía</h3>' +
      '<p class="sub">Hoy no podemos publicar su precio. ' + salidaSinPrecio() + '</p></div>';
  }
  /* 16-sep-2026 — AQUÍ DECÍA «MÁS BARATO», Y EN ESTA MISMA PANTALLA ES MENTIRA.
     Se midieron los dos motores en las dieciséis combinaciones donde los dos
     rangos se pisan (de un millón a cuatro, de 3 a 6 meses): el de garantía sale
     más caro SIEMPRE. Con un millón a seis meses, arriba son $64.200 de costo y
     23,98% efectivo anual; acá abajo son $71.154 y 26,82%. Las dos cifras las
     imprime la propia página a tres centímetros de distancia, y la única cifra
     en porcentaje que la casa permite mostrar lo confirma.

     «Más barato» era cierto contra el crédito quincenal —20% a quince días—,
     que es lo que Joan opera; pero el quincenal no se cotiza en esta página, y
     lo que está justo encima es el producto a 6 meses, que sale más barato que
     el «barato». Una comparación es contra lo que se ve, no contra lo que uno
     tiene en la cabeza.

     «Más grande» también era falso acá: el deslizador de arriba llega al cupo
     preferente y el de esta tarjeta a cuatro millones. Y «hasta 6 meses» no
     distingue nada: arriba también son 6.

     Lo que queda es lo único que es verdad Y se puede comprobar en la misma
     pantalla: el costo se cobra sobre el saldo que va bajando. */
  /* 16-sep-2026 — EL TÍTULO Y LA EXPLICACIÓN SE ACORTARON, Y ES UN PEDIDO DE
     JOAN: «quitar la explicación de cuando tengas garantía, que confunde».

     Tenía razón y el motivo se ve en el texto que estaba acá: cuatro
     afirmaciones encadenadas —pagas en fecha, guardas garantía, la garantía
     abre otro crédito, el costo se cobra sobre el saldo— antes de la primera
     cifra, en la puerta de alguien que todavía no tiene cuenta. Para el que
     llega hoy, que tiene CERO garantía, todo eso es teoría.

     LO QUE NO SE HIZO, Y ES DELIBERADO: borrar la tarjeta. Es un producto que
     Joan vende de verdad y hay una prueba que exige que exista con su línea de
     acceso pegada (vitrina.test.js, «la garantía se enseña, pero nunca sin
     decir hasta dónde alcanza»). Lo que sí se hizo, además de acortar: la
     tarjeta BAJÓ en la portada, debajo de «Abre tu cuenta» — ver pintarEntrar.
     Sigue estando; deja de ser lo segundo que ve un desconocido.

     Ni una palabra más de las que se pueden comprobar acá mismo. Se pensó en
     agregar «y se desembolsa sin volver a estudiarte»: eso está escrito para el
     segundo escalón del OTRO producto, no para éste, y afirmarlo sería
     exactamente lo que este comentario vino a impedir. */
  return '<div class="card">' +
      '<h3 class="tit">El crédito con garantía</h3>' +
      /* 17-sep-2026 — LA INVITACIÓN A COMPARAR VUELVE, y no es cortesía.
         Al acortar el párrafo se quedó una sola frase, en negrita, que dice que
         el costo se cobra sobre el saldo. Eso es cierto, pero solo, y en
         negrita, se lee como «es más barato» — y este es el producto MÁS CARO
         de esta misma pantalla: medido en las dieciséis combinaciones donde los
         dos rangos se pisan, sale más caro SIEMPRE. La frase que invitaba a
         comparar era lo que impedía esa lectura. */
      /* 8-oct-2026 (segunda vuelta) — «Compáralo con el de arriba» comparaba
         contra NADA: lo de arriba ahora es la calculadora del pedido, que no
         tiene precio. La advertencia que esa frase cuidaba (que «sobre el
         saldo» no se lea como «más barato») sigue, dicha sin señalar otra
         tarjeta. */
      '<p class="sub">Se abre pagando en fecha, y <b>el costo se cobra sobre lo que te va quedando, no sobre lo que pediste</b>. Que el costo baje con el saldo no quiere decir que pagues menos: mira el costo total en pesos antes de pedirlo.</p>' +
      '<div id="gcalcTecho">' + techoDeGarantia() + '</div>' +
      '<div id="gcalcCifras">' + cifrasDeGarantia() + '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="gcalcMonto" style="margin:0">Cuánto pedirías</label>' +
          '<b id="gcalcMontoTxt">' + COP(GCALC.monto) + '</b></div>' +
        '<input type="range" id="gcalcMonto" min="' + GCALC_MIN + '" max="' + GCALC_MAX + '" ' +
          'step="' + GCALC_PASO + '" value="' + GCALC.monto + '" ' +
          'aria-label="Cuánto pedirías" oninput="moverGCalc()">' +
      '</div>' +
      '<div class="mando">' +
        '<div class="cab-mando"><label for="gcalcMeses" style="margin:0">En cuántos meses</label>' +
          '<b id="gcalcMesesTxt">' + GCALC.meses + ' meses</b></div>' +
        '<input type="range" id="gcalcMeses" min="' + GCALC_MESES_MIN + '" max="' + GCALC_MESES_MAX + '" ' +
          'step="1" value="' + GCALC.meses + '" aria-label="En cuántos meses" oninput="moverGCalc()">' +
      '</div>' +
      '<div id="gcalcFechas">' + mandoDeFechas() + '</div>' +
    '</div>';
}

/* LA LÍNEA DEL ACCESO. Es la que Joan pidió que fuera clara, y cambia según
   quién mira: el visitante sin cuenta, el registrado que todavía no ha pagado
   nada, y el que ya tiene garantía ganada. Ninguno de los tres ve una promesa
   que no le corresponde. */
function techoDeGarantia() {
  /* 16-sep-2026 — «HOY TIENES $0» SOLO SI DE VERDAD SE SABE QUE TIENE CERO.
     Esta línea decía eso siempre que no hubiera ficha, y no tener ficha son
     cuatro cosas distintas: el visitante que no tiene cuenta, el socio cuyo
     historial se está cargando, el que no se pudo traer, y el que de verdad
     todavía no ha ganado nada. Decirle «hoy tienes $0» a alguien que lleva
     medio año pagando, porque la nube no contestó, es la casa mintiendo sobre
     la causa de un fallo. */
  if (FICHA_ESTADO === 'cargando') {
    return '<div class="aviso" style="margin-top:0">Estamos buscando tu garantía…</div>';
  }
  if (FICHA_ESTADO === 'falla' || FICHA_ESTADO === 'apagada' || FICHA_ESTADO === 'sesion') {
    return '<div class="aviso ambar" style="margin-top:0">No pude traer tu garantía ahora. ' +
      'Eso <b>no</b> quiere decir que no tengas: quiere decir que no pude preguntar. ' +
      'Mira las cifras de abajo como un cálculo, no como tu cupo.</div>';
  }
  var d = respaldoDisponible();
  if (d <= 0) {
    /* Al visitante sin cuenta no se le afirma un saldo que nadie ha mirado: se
       le explica de dónde sale. Al registrado que sí sabemos que está en cero,
       se le dice el cero. */
    /* 7-oct-2026 (tercera vuelta) — 'nueva' YA NO ES «SABEMOS QUE TIENE
       CERO». Desde la puerta única, todo cliente antiguo queda en 'nueva'
       hasta que Joan junta su cuenta con su ficha, y trae garantía de verdad;
       el aviso de arriba le dice «no tienes que hacer nada» y esta línea le
       decía «hoy tienes $0». Solo la cuenta junta sabe su cero. */
    var suyo = FICHA_ESTADO === 'vinculada';
    return '<div class="aviso ambar" style="margin-top:0"><b>Esto todavía no lo puedes pedir.</b> ' +
      'El crédito con garantía se abre con la garantía que se gana pagando, peso a peso. ' +
      (suyo ? 'Hoy tienes <b>$0</b>: empieza' : 'Empieza') +
      ' por un crédito normal y cada cuota que pagues en fecha te va abriendo este.</div>';
  }
  /* NI SE PROMETE UN MONTO QUE EL PRODUCTO NO PRESTA. La garantía puede alcanzar
     para trescientos mil y este crédito empieza en un millón: decirle «puedes
     pedir hasta $300.000» es ofrecerle algo que la misma tarjeta rechaza dos
     renglones más abajo. */
  if (d < GCALC_MIN) {
    return '<div class="aviso ambar" style="margin-top:0">Llevas <b>' + COP(d) + '</b> de ' +
      'garantía ganada. Este crédito empieza en <b>' + COP(GCALC_MIN) + '</b>, así que ' +
      'todavía no te alcanza: te faltan <b>' + COP(GCALC_MIN - d) + '</b>, y cada cuota que ' +
      'pagues en fecha te acerca.</div>';
  }
  if (GCALC.monto > d) {
    return '<div class="aviso ambar" style="margin-top:0">Con tu garantía de hoy puedes pedir hasta <b>' + COP(d) + '</b>. Puedes pedir más y lo miramos, pero te vamos a contestar con una propuesta por lo que alcanza.</div>';
  }
  return '<div class="aviso verde" style="margin-top:0">Con tu garantía de hoy puedes pedir hasta <b>' + COP(d) + '</b>. Lo que estás moviendo te alcanza.</div>';
}

function cifrasDeGarantia() {
  var c = cotizacionGarantia();
  if (!c) return '<div class="aviso ambar">No podemos cotizar ese monto.</div>';
  if (!c.cumple_minimo) {
    return '<div class="aviso ambar">El crédito con garantía va desde <b>' +
      COP(c.monto_minimo) + '</b>. Por debajo de eso se pide el crédito normal.</div>';
  }
  /* 16-sep-2026 — EL GUARDIÁN DEL TECHO, TAMBIÉN ACÁ. tarjetaCalcGarantia lo
     comprobaba UNA vez, con el monto y el plazo de arranque, y a partir de ahí
     moverGCalc repintaba estas cifras en cada movimiento del dedo sin volver a
     preguntar. La efectiva anual no es constante en todo el rango —el redondeo
     de la cuota la mueve— así que el día que la Superfinanciera certifique un
     techo que caiga dentro de esa ventana, la tarjeta se pintaría porque el
     combo inicial pasa, y el visitante publicaría un precio ilegal con solo
     arrastrar. Es el artículo 305, y el único aviso sería que nadie lo mirara.
     Ahora el guardián está en los DOS caminos: el primer pintado y cada arrastre. */
  if (!garantiaSePuedeCotizar(c)) {
    return '<div class="aviso ambar">Con ese monto y ese plazo no podemos publicar un ' +
      'precio hoy. Prueba con otro, o ' + salidaSinPrecio(true) + '</div>';
  }
  /* 17-sep-2026 — ESTE COMENTARIO DECÍA QUE LAS DOS CALCULADORAS ENCABEZAN CON
     LA MISMA CIFRA, y desde ayer ya no es verdad: la de arriba encabeza con lo
     que RECIBE (lo pidió Joan) y ésta sigue encabezando con la CUOTA.

     No es descuido, es la diferencia entre las dos pantallas. Arriba está el
     desconocido decidiendo si esto le sirve, y lo que lo engancha es cuánto le
     llega. Acá abajo está alguien que ya tiene garantía ganada mirando si puede
     con el pago mensual: la cuota es su decisión.

     Lo que SÍ se mantiene igual en las dos, y es lo que aquel comentario
     protegía de verdad: el total va en su propia caja, el costo y la tasa a
     renglón con los mismos rótulos, y el plan de pago plegado igual. Comparar
     las dos sigue sin obligar a traducir nada. */
  return '<div class="etq-cifra">Pagarías cada mes</div>' +
    '<div class="cifra sm">' + COP(c.cuota_fija) + '</div>' +
    '<div class="muted" style="font-size:13.5px">durante ' + c.plazo_meses +
      (c.plazo_meses === 1 ? ' mes' : ' meses') + avisoUltimaCuota(c) + '</div>' +
    '<div class="granTotal"><span>En total vas a pagar</span><b>' +
      COP(c.total_a_pagar) + '</b></div>' +
    fila('Lo que recibes', COP(c.capital)) +
    fila('Lo que cuesta', COP(c.costo_total)) +
    fila('Tasa efectiva anual', pct(eaDeGarantia(c))) +
    /* Plegadas, igual que en la calculadora de arriba: es «la lista de cuotas
       del final» que Joan señaló como lo que más confundía. La lista no se fue
       —el plan completo sigue a un toque—, se quitó de en medio. */
    plegableCuotas(c.cuotas, 'garantia') +
    /* 17-sep-2026 — LA LETRA, CON EL CRÉDITO QUE ESTÁ TRES RENGLONES ARRIBA.
       Sin `c`, esta línea anunciaba siempre el ejemplo del mínimo: medido, en
       123 de las 124 combinaciones del deslizador la caja gris decía «En total
       vas a pagar X» y la letra de abajo «para un total de Y», con X distinto
       de Y. Es la pantalla contradiciéndose, y es exactamente lo que se arregló
       ayer en la calculadora de arriba (ver moverCalc y letraDeCalc).

       ACÁ NO HACE FALTA REPINTAR NADA APARTE, y esa es la única diferencia con
       la de arriba: allí la letra vive en su propia caja (`calcLetra`) y
       moverCalc tiene que acordarse de ella; acá va DENTRO de gcalcCifras, así
       que moverGCalc y eligeArranque ya la traen puesta al repintar la tarjeta.
       Se dice por las dos direcciones: para que nadie agregue un repintado que
       no hace falta, y para que quien algún día saque esta línea de la tarjeta
       sepa que al hacerlo la deja congelada otra vez. */
    '<div class="aviso" style="margin-top:var(--e4);font-size:12.5px;line-height:1.55">' +
      esc(divulgacionGarantiaHoy({ capital: c.capital, meses: c.plazo_meses })) + '</div>' +
    tarjetaGanancia(c);
}

/* EL CUADRO DE LO QUE GANA AL PAGAR — Joan lo pidió con esas palabras: «que
   muestre un cuadro o una imagen de cuánto gana en garantía cuando pague».
   No es una imagen: son las mismas cifras del motor, con una barra que crece.
   Una imagen se queda vieja; esto no puede. */
function tarjetaGanancia(c) {
  var deja = c.garantia_que_deja || 0;
  if (deja <= 0) return '';
  var acum = 0, total = deja || 1;
  var barras = c.cuotas.map(function (q) {
    acum += q.garantia_generada || 0;
    var alto = Math.max(6, Math.round(acum / total * 100));
    return '<div class="tramo"><i style="height:' + alto + '%"></i>' +
      '<span>' + q.numero + '</span></div>';
  }).join('');
  return '<div class="gana">' +
    '<div class="etq">Lo que ganas pagando</div>' +
    '<div class="barras">' + barras + '</div>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e2)">Si pagas las ' +
      c.plazo_meses + ' cuotas en fecha, terminas con <b>' + COP(deja) +
      '</b> más de garantía. Esa garantía es la que te abre el siguiente crédito, más grande.</div></div>';
}

/* LA ÚLTIMA CUOTA NO SIEMPRE ES IGUAL A LAS DEMÁS, y desde que el plan está en
   pantalla eso se ve. Los dos motores cuadran el sobrante en la última —uno
   porque reparte el total entre los meses y le carga el resto, el otro porque
   liquida el saldo— así que la cifra grande multiplicada por el plazo puede no
   dar el total por dos o tres pesos. Antes no importaba: nadie veía la última.
   Ahora está tres renglones más abajo, y una cifra grande que dice «cada mes» al
   lado de una lista donde la última es distinta es la pantalla contradiciéndose.
   Se dice, y solo cuando de verdad difiere. Sale del motor, no de una resta. */
function avisoUltimaCuota(c) {
  var cs = c.cuotas || [];
  if (!cs.length) return '';
  var grande = c.cuota_fija != null ? c.cuota_fija : c.cuota_tipica;
  var ultima = cs[cs.length - 1].total;
  if (ultima === grande) return '';
  return ' · la última, ' + COP(ultima);
}

/* Las cuotas, SEGMENTADAS: una línea por cuota, con su fecha y su monto. Es lo
   que Joan pidió «para mejorar la cobranza y dar claridad», y sirve igual en la
   calculadora, en la propuesta y en el crédito activo — por eso está una vez. */
function cuadroCuotas(cuotas) {
  return (cuotas || []).map(function (q) {
    var f = q.fecha_corte || q.fecha;
    return fila('Cuota ' + (q.numero || q.n) + (f ? ' · ' + fmtFecha(f) : ''),
                COP(q.total) + (q.pagada || q.pagado ? ' ✓' : ''));
  }).join('');
}

function moverGCalc() {
  var m = $('gcalcMonto'), p = $('gcalcMeses');

 * El oyente se queda y SOLO calla a Chrome (preventDefault): sin él, Chrome
 * podría ofrecer instalar esta página con su propia franja, y volveríamos a

/* -------------------------------------------------------------------------
 * EL RAYO — rehecho el 16-sep-2026, y otra vez el 13-oct-2026
 *
 * 16-sep — Joan: «que no llegue tan lejos pero que se vea más ramificado, y
 * que sea un movimiento más constante y que se siga moviendo mientras tocamos

 *   · SE SORTEABA ENTERO EN CADA FOTOGRAMA. El camino se volvía a tirar al azar
 *     sesenta veces por segundo: cada punto saltaba en promedio 6,5 px de un
 *     fotograma al siguiente, el 8% del largo. El ojo no lee eso como un rayo
 *     que se mueve sino como ruido que parpadea. Ese era el «no es continuo».
 *   · ERA UN SOLO HILO hacia un lado, y en el dedo no había nada. No salía
 *     energía del dedo: salía un cable desde ahí.
 *   · SOBRE EL FONDO CLARO CASI NO SE VEÍA: dorado pálido con el centro casi
 *     blanco, encima de crema.
 *
 * CÓMO ES AHORA:
 *   · CONTINUO. Cada desvío del camino es un número que se GUARDA y que camina
 *     despacio hacia un objetivo que cambia cada décima de segundo; encima va un
 *     chisporroteo fino que no se guarda. Es el mismo rayo de un fotograma al
 *     otro, retorciéndose, y no uno nuevo cada vez. pruebas/rayo.test.js mide el
 *     salto por fotograma para que no vuelva el parpadeo.
 *   · ENERGÍA QUE SALE DEL DEDO. Un núcleo que late en la yema, cuatro rayos
 *     que salen hacia afuera y giran despacio, como en una bola de plasma, y
 *     chispas que salen disparadas y se frenan. Al tocar hay un golpe: los
 *     rayos salen disparados desde la yema, se abre una onda y sale una ráfaga
 *     de chispas. Al soltar, una última descarga. Un toque rápido también
 *     descarga entero: no hace falta dejar el dedo para que se vea.
 *   · SE VE EN LOS DOS FONDOS. En oscuro las capas se SUMAN como luz
 *     ('lighter'); en claro van en ámbar profundo por fuera, para que el
 *     dorado tenga contra qué brillar.
 *
 * MIENTRAS EL DEDO ESTÁ PUESTO, VIVE. Nace en pointerdown, sigue al dedo en
 * pointermove, y solo se apaga cuando se levanta. Cada dedo tiene el suyo, por
 * su pointerId.
 *
 * LO QUE LO MANTIENE BARATO, que es lo que importa en un celular de gama baja:
 *   · Un solo lienzo, y el bucle se APAGA cuando no queda nada vivo: ni rayo,
 *     ni chispa, ni onda.
 *   · Máximo tres dedos a la vez, y un tope de chispas para toda la pantalla.
 *   · AUTODEGRADADO: se cronometran los primeros fotogramas y, si este teléfono
 *     no da los 30 por segundo, cada dedo saca dos rayos en vez de cuatro, con
 *     menos detalle, ramas sin ramas y la mitad de chispas. Un adorno no puede
 *     volver lenta una app de plata.
 *   · UN TOPE DE AGUANTE: por mucho que alguien deje el dedo puesto, a los seis
 *     segundos se apaga solo. Un adorno que corre indefinidamente porque un
 *     bolsillo aprieta la pantalla es batería regalada.

 *   · Sordo al tacto (pointer-events:none): jamás se queda con un toque que era

   techo en píxeles, para que en una pantalla grande no se vuelva un cable que
   cruza el escritorio. */

var RAYO_LARGO_MAX = 190;
var RAYO_AGUANTE = 6000;      // milisegundos con el dedo puesto, ver la cabecera
var RAYO_APAGON = 420;        // lo que tarda en irse después de soltar
var RAYO_HILOS = 4;           // rayos que salen de cada dedo (2 en un teléfono lento)
var RAYO_NIVELES = 4;         // 17 puntos por rayo y 15 desvíos guardados
var RAYO_CRECE = 120;         // lo que tardan los rayos en salir disparados al tocar
var RAYO_CHISPAS_MAX = 48;    // para toda la pantalla, sumando los tres dedos
var RAYO_CHISPA_VIDA = 420;   // lo que dura la chispa que más dura

/* LOS COLORES, por fondo. Cada uno es «r,g,b» y la opacidad se pone al dibujar.
   En claro el halo es ámbar oscuro a propósito: un halo dorado pálido sobre
   crema no tiene contraste, y era lo que hacía que el rayo casi no se viera.
   Y en claro el filamento es el dorado MÁS VIVO, no el más pálido: con el
   centro pálido dentro de un borde ámbar, sobre blanco se leía como un tubo y
   no como electricidad (visto en el navegador el 13-oct). */
var PALETA_RAYO = {
  oscuro: { halo: '245,197,66', medio: '255,210,90', centro: '255,250,235',
            aHalo: 0.22, aMedio: 0.55, aCentro: 0.95,
            n0: '255,252,240', n1: '255,214,102', n2: '245,197,66',
            chispa0: '255,250,235', chispa1: '255,205,80' },
  claro:  { halo: '214,120,0', medio: '240,150,0', centro: '255,176,20',
            aHalo: 0.16, aMedio: 0.45, aCentro: 1,
            n0: '255,200,60', n1: '245,150,0', n2: '214,120,0',
            chispa0: '255,170,0', chispa1: '214,120,0' }
};
function rgbaRayo(c, a) { return 'rgba(' + c + ',' + Math.max(0, Math.min(1, a)).toFixed(3) + ')'; }

function largoDeRayo() {
  var m = Math.min(window.innerWidth || 0, window.innerHeight || 0);
  return Math.max(70, Math.min(RAYO_LARGO_MAX, m * RAYO_LARGO_FRAC));
}

function iniciarRayos() {
  if (RAYOS.lienzo) return;
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  } catch (e) {}
  var c = document.createElement('canvas');
  c.id = 'rayos'; c.setAttribute('aria-hidden', 'true');
  document.body.appendChild(c);
  var ctx2d = c.getContext('2d');
  /* SIN CONTEXTO NO HAY RAYO, y no pasa nada: se sale y la página sigue.
     16-sep-2026 — getContext devuelve null de verdad: en modo privado con el
     lienzo bloqueado, con poca memoria, o en un navegador viejo. Hasta hoy nadie
     lo miraba, y dos líneas más abajo medirLienzo llamaba setTransform sobre
     null: el arranque lanzaba ANTES de pintarEntrar y la puerta pública quedaba
     EN BLANCO —sin calculadora, sin registro, sin nada—. Comprobado en el banco:
     cero letras. Un adorno no puede apagar el negocio. */
  if (!ctx2d) { if (c.remove) c.remove(); return; }
  RAYOS.lienzo = c; RAYOS.ctx = ctx2d;
  medirLienzo();
  window.addEventListener('resize', medirLienzo);
  /* pointerdown y no click: el rayo tiene que salir en el instante en que el
     dedo toca, no cuando se levanta. `passive` para no frenar el desplazamiento. */
  window.addEventListener('pointerdown', function (e) { nacerRayo(e.clientX, e.clientY, e.pointerId); }, { passive: true });
  window.addEventListener('pointermove', function (e) { moverRayo(e.pointerId, e.clientX, e.clientY); }, { passive: true });
  /* Los tres finales. `pointercancel` importa de verdad en un celular: es el que
     llega cuando el navegador se queda con el gesto para desplazar la página, y
     sin él el rayo se quedaría pegado y encendido hasta el tope de aguante. */
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { soltarRayo(e.pointerId); }, { passive: true });
  });
  /* Y si la pestaña se va a segundo plano con el dedo puesto, no vuelve nunca un
     pointerup: se sueltan todos, sin descarga, y las chispas se van con ellos. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) return;
    RAYOS.vivos.forEach(function (r) { r.sujeto = false; });
    RAYOS.chispas = []; RAYOS.ondas = [];
  });
}
/* Se vuelve a medir sola si hace falta, y no solo cuando el navegador avisa que
   cambió el tamaño. Motivo concreto: si `innerWidth` llega en CERO en el momento
   de cargar —pasa cuando la página arranca en una pestaña que todavía no se
   muestra, y se vio en el banco de pruebas—, el lienzo nace de 0×0 y el rayo no
   vuelve a dibujarse nunca, porque `resize` puede no dispararse jamás. Comparar
   dos números por fotograma no cuesta nada; quedarse con un adorno muerto y sin
   error en consola, sí. */
function medirLienzo() {
  var c = RAYOS.lienzo; if (!c || !RAYOS.ctx) return false;
  var w = window.innerWidth || 0, h = window.innerHeight || 0;
  if (!w || !h) return false;
  RAYOS.dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = Math.round(w * RAYOS.dpr), H = Math.round(h * RAYOS.dpr);
  if (c.width !== W || c.height !== H) {
    c.width = W; c.height = H;
    RAYOS.ctx.setTransform(RAYOS.dpr, 0, 0, RAYOS.dpr, 0, 0);
  }
  return true;
}

/* EL FONDO SE MIRA DEBAJO DEL DEDO, en cada toque. No basta el modo del
   teléfono: la página clara tiene partes oscuras —la placa de la calculadora,
   que es justo donde más se toca—, y ahí el rayo tiene que brillar como luz.
   Se mira el color de la LETRA bajo el dedo, que es más fiable que el del
   fondo (la placa es un degradado y no tiene color de fondo): letra clara es
   fondo oscuro. El lienzo no estorba: es sordo al tacto y elementFromPoint lo
   salta. Si no se puede mirar, se usa el modo del teléfono. */
function temaOscuroRayo(x, y) {
  try {
    var el = document.elementFromPoint && document.elementFromPoint(x, y);
    var m = el && window.getComputedStyle && String(window.getComputedStyle(el).color).match(/[\d.]+/g);
    if (m && m.length >= 3) {
      return (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255 > 0.6;
    }
  } catch (e) {}
  try {
    var t = document.documentElement && document.documentElement.getAttribute &&
            document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  } catch (e) { return false; }
}

function semillasRayo(n) {
  var s = [];
  for (var i = 0; i < n; i++) s.push(Math.random() - 0.5);
  return s;
}
function sortearRayo(a) { for (var i = 0; i < a.length; i++) a[i] = Math.random() - 0.5; }
function acercarRayo(sem, obj, k) { for (var i = 0; i < sem.length; i++) sem[i] += (obj[i] - sem[i]) * k; }

function nacerRayo(x, y, id) {
  if (!RAYOS.ctx || RAYOS.vivos.length >= 3) return;
  /* Un dedo, un rayo. Sin esto, un `pointerdown` repetido del mismo dedo —pasa
     con algunos lápices y con el ratón arrastrando— dejaría dos pegados. */
  if (RAYOS.vivos.some(function (r) { return r.id === id; })) return;
  RAYOS.oscuro = temaOscuroRayo(x, y);
  var L = largoDeRayo();
  var n = RAYOS.degradado ? 2 : RAYO_HILOS;
  var hilos = [];
  for (var i = 0; i < n; i++) hilos.push(nuevoHilo(i, n));
  RAYOS.vivos.push({
    id: id, x: x, y: y, px: x, py: y,
    /* Todos los rayos de un dedo giran juntos, despacio, y cada uno además se
       mece por su cuenta: así se reparten alrededor de la yema y no se amontonan
       hacia un lado. */
    giro: Math.random() * Math.PI * 2,
    vgiro: (Math.random() < 0.5 ? -1 : 1) * (0.0004 + Math.random() * 0.0005),
    hilos: hilos, largo: L,
    sujeto: true, edad: 0, soltado: 0, alfa: 1, destello: 1, acum: 0,
    /* El primer rayo, el que leen las pruebas del 16-sep: su camino, sus ramas
       y su punta. */
    camino: [], ramas: [], dx: x, dy: y
  });
  /* El golpe del toque: la onda que se abre y la ráfaga de chispas. */
  RAYOS.ondas.push({ x: x, y: y, edad: 0, vida: 420, R: L * 0.8 });
  soltarChispas(x, y, RAYOS.degradado ? 8 : 16, 0.42, null, 0);
  if (!RAYOS.corriendo) { RAYOS.corriendo = true; RAYOS.ultimo = 0; requestAnimationFrame(pasoRayos); }
}

function nuevoHilo(i, n) {
  return {
    /* Repartidos en círculo, con poco desorden: con más, dos rayos se juntan y
       queda un hueco grande del otro lado. */
    base: (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.3,
    fase: Math.random() * Math.PI * 2, w: 0.0015 + Math.random() * 0.0015,
    frac: 0.62 + Math.random() * 0.38,
    sem: semillasRayo(Math.pow(2, RAYO_NIVELES) - 1),
    obj: semillasRayo(Math.pow(2, RAYO_NIVELES) - 1), cambio: 0,
    specs: ramasDeRayo(RAYOS.degradado ? 1 : 1 + Math.floor(Math.random() * 2), RAYOS.degradado ? 0 : 1),
    rehace: 300 + Math.random() * 500, creceRamas: 1,
    ang: 0, camino: [], ramas: [], dx: 0, dy: 0
  };
}

function moverRayo(id, x, y) {
  for (var i = 0; i < RAYOS.vivos.length; i++) {
    var r = RAYOS.vivos[i];
    if (r.id === id && r.sujeto) { r.x = x; r.y = y; return; }
  }
}

function soltarRayo(id) {
  for (var i = 0; i < RAYOS.vivos.length; i++) {
    if (RAYOS.vivos[i].id === id && RAYOS.vivos[i].sujeto) descargarRayo(RAYOS.vivos[i]);
  }
}
/* Al levantar el dedo, la última descarga: un destello y otra ráfaga. */
function descargarRayo(r) {
  r.sujeto = false; r.destello = 1;
  soltarChispas(r.x, r.y, RAYOS.degradado ? 4 : 10, 0.5, null, 0);
}

/* LAS CHISPAS. Salen de la yema a toda velocidad y se frenan, como algo que se
   suelta y no como algo que cae: no hay gravedad. `ang` null es en cualquier
   dirección; con ángulo, salen por un abanico alrededor de él. */
function soltarChispas(x, y, n, rapidez, ang, abanico) {
  var tope = RAYOS.degradado ? RAYO_CHISPAS_MAX / 2 : RAYO_CHISPAS_MAX;
  for (var i = 0; i < n && RAYOS.chispas.length < tope; i++) {
    var a = ang == null ? Math.random() * Math.PI * 2 : ang + (Math.random() - 0.5) * abanico;
    var v = rapidez * (0.45 + Math.random() * 0.75);
    RAYOS.chispas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, edad: 0,
                         vida: 220 + Math.random() * (RAYO_CHISPA_VIDA - 220) });
  }
}

/* EL CAMINO, POR DESPLAZAMIENTO DEL PUNTO MEDIO. Se parte el segmento por la
   mitad, se empuja ese punto medio de lado, y se repite con las dos mitades
   empujando menos. Es la forma clásica de dibujar un relámpago, y es barata:
   cuatro niveles son diecisiete puntos y no más.
   13-oct-2026 — CUÁNTO se empuja cada punto ya no se sortea aquí: viene en
   `sem`, un desvío GUARDADO por punto, que es lo que hace que el rayo sea el
   mismo de un fotograma al otro. `temblor` es el chisporroteo que va encima y
   no se guarda; solo toca los niveles finos, para que el rayo crepite sin
   saltar. Sin `sem` se sortea como antes. */
function caminoRayo(x0, y0, x1, y1, desvio, niveles, sem, temblor) {
  var pts = [{ x: x0, y: y0 }, { x: x1, y: y1 }], k = 0;
  for (var n = 0; n < niveles; n++) {
    var out = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      var ex = b.x - a.x, ey = b.y - a.y;
      var L = Math.sqrt(ex * ex + ey * ey) || 1;
      var s = sem ? sem[k % sem.length] : (Math.random() - 0.5);
      k++;
      if (temblor && n >= 2) s += (Math.random() - 0.5) * temblor;
      /* La normal del segmento: se empuja de lado, nunca a lo largo. Empujar a
         lo largo haría que el rayo se doblara sobre sí mismo. */
      var d = s * desvio;
      out.push(a, { x: (a.x + b.x) / 2 - (ey / L) * d, y: (a.y + b.y) / 2 + (ex / L) * d });
    }
    out.push(pts[pts.length - 1]);
    pts = out;
    desvio *= 0.52;
  }
  return pts;
}

/* LAS RAMAS. Esta función decide CUÁNTAS y CÓMO son —de qué punto del tronco
   salen, hacia qué lado, cuánto abren, qué tan largas—, y eso se guarda; el
   dibujo de cada fotograma lo hace tenderRamas con lo guardado. Una rama puede
   tener su propia rama: eso es lo que da el aire ramificado que Joan pidió, y
   se corta en `profundidad` para que no se vuelva un árbol que come
   fotogramas. */
function ramasDeRayo(cuantas, profundidad) {
  var out = [];
  for (var k = 0; k < cuantas; k++) {
    var s = { en: 0.2 + Math.random() * 0.55, lado: Math.random() < 0.5 ? -1 : 1,
              abre: 0.45 + Math.random() * 0.7, frac: 0.25 + Math.random() * 0.3,
              sem: semillasRayo(7), obj: semillasRayo(7), nivel: profundidad, hijas: [] };
    if (profundidad > 0 && Math.random() < 0.65) s.hijas = ramasDeRayo(1, profundidad - 1);
    out.push(s);
  }
  /* AL MENOS UNA RAMA DE RAMA, SIEMPRE — 15-sep-2026.
     Cada rama sorteaba por su cuenta si se ramificaba (0,65), asi que con dos
     ramas la probabilidad de que NINGUNA lo hiciera era 0,35 x 0,35 = 12%.
     Medido sobre 400 rayos: el 6% salia con un solo nivel, o sea con el aspecto
     viejo de «tres rayitas» que Joan pidio cambiar. No se veia mirando —pasa
     una vez de cada dieciseis— y lo delato una prueba que fallaba a veces.

     Una prueba intermitente es peor que ninguna: ensena a ignorar el rojo. Se
     arreglo el rayo, no la prueba. */
  if (profundidad > 0 && out.length) {
    var tieneHija = false;
    for (var q = 0; q < out.length; q++) {
      if (out[q].hijas.length) { tieneHija = true; break; }
    }
    if (!tieneHija) out[Math.floor(Math.random() * out.length)].hijas = ramasDeRayo(1, profundidad - 1);
  }
  return out;
}

/* Tiende las ramas guardadas sobre el tronco de este fotograma. El ángulo sale
   de la dirección del rayo entero y no del trocito de tronco de donde nace: el
   trocito crepita, y la rama crepitaría con él de un lado al otro. */
function tenderRamas(pts, specs, ang0, largo, crece, out) {
  for (var k = 0; k < specs.length; k++) {
    var s = specs[k];
    var i = Math.max(1, Math.min(pts.length - 2, Math.round(s.en * (pts.length - 1))));
    var a = pts[i];
    var ang = ang0 + s.lado * s.abre;
    var L = largo * s.frac * crece;
    var camino = caminoRayo(a.x, a.y, a.x + Math.cos(ang) * L, a.y + Math.sin(ang) * L,
                            L * 0.34, s.nivel > 0 ? 3 : 2, s.sem, 0.5);
    out.push({ pts: camino, nivel: s.nivel });
    if (s.hijas.length) tenderRamas(camino, s.hijas, ang, L, 1, out);
  }
  return out;
}
function moverSemillas(specs, k, nuevo) {
  for (var i = 0; i < specs.length; i++) {
    if (nuevo) sortearRayo(specs[i].obj);
    acercarRayo(specs[i].sem, specs[i].obj, k);
    moverSemillas(specs[i].hijas, k, nuevo);
  }
}

/* Rehace los rayos de un dedo para este fotograma. Nada se sortea de cero: los
   desvíos guardados caminan hacia su objetivo (`k` es cuánto del trecho se
   anda en este fotograma, y depende del tiempo y no de cuántos fotogramas da
   el teléfono), el objetivo cambia cada décima de segundo, y las ramas se
   renuevan cada medio segundo creciendo desde el tronco. */
function rehacerRayo(r, t, dt, W, H) {
  var c = Math.min(1, r.edad / RAYO_CRECE);
  var crece = 1 - (1 - c) * (1 - c) * (1 - c);     // sale disparado y frena
  var k = 1 - Math.exp(-dt / 60);
  var niveles = RAYOS.degradado ? 3 : RAYO_NIVELES;
  r.giro += r.vgiro * dt;
  for (var i = 0; i < r.hilos.length; i++) {
    var h = r.hilos[i];
    h.cambio -= dt;
    var nuevo = h.cambio <= 0;
    if (nuevo) { sortearRayo(h.obj); h.cambio = 70 + Math.random() * 110; }
    acercarRayo(h.sem, h.obj, k);
    moverSemillas(h.specs, k, nuevo);
    h.rehace -= dt;
    if (h.rehace <= 0) {
      h.specs = ramasDeRayo(RAYOS.degradado ? 1 : 1 + Math.floor(Math.random() * 2), RAYOS.degradado ? 0 : 1);
      h.creceRamas = 0; h.rehace = 350 + Math.random() * 550;
    }
    h.creceRamas = Math.min(1, h.creceRamas + dt / 90);
    h.ang = r.giro + h.base + 0.25 * Math.sin(t * h.w + h.fase);
    var L = r.largo * h.frac * (0.88 + 0.12 * Math.sin(t * h.w * 1.7 + h.fase * 2)) * crece;
    /* Y no se sale de la pantalla: si la punta se iba fuera, medio rayo se
       dibujaba donde nadie lo ve. */
    h.dx = Math.max(6, Math.min(W - 6, r.x + Math.cos(h.ang) * L));
    h.dy = Math.max(6, Math.min(H - 6, r.y + Math.sin(h.ang) * L));
    h.camino = caminoRayo(r.x, r.y, h.dx, h.dy, Math.max(L, 8) * 0.42, niveles, h.sem, 0.35);
    h.ramas = tenderRamas(h.camino, h.specs, h.ang, L, h.creceRamas, []);
  }
  var p = r.hilos[0];
  r.camino = p.camino; r.ramas = p.ramas; r.dx = p.dx; r.dy = p.dy;
}

function pasoRayos(t) {
  var ctx = RAYOS.ctx; if (!ctx) { RAYOS.corriendo = false; return; }
  /* Si el lienzo todavía no tiene tamaño (ver medirLienzo), se espera al
     siguiente fotograma en vez de dibujar en la nada. */
  if (!medirLienzo()) { requestAnimationFrame(pasoRayos); return; }

  /* El autodegradado: diez fotogramas medidos y se decide de una vez. */
  var dt = RAYOS.ultimo ? (t - RAYOS.ultimo) : 16;
  if (RAYOS.ultimo && RAYOS.medidos < 10) {
    RAYOS.suma += dt; RAYOS.medidos++;
    if (RAYOS.medidos === 10 && (RAYOS.suma / 10) > 33) RAYOS.degradado = true;
  }
  RAYOS.ultimo = t;
  /* Un fotograma que llega tarde —el teléfono se trabó un momento— no puede
     mandar las chispas al otro lado de la pantalla de un salto. */
  dt = Math.max(0, Math.min(50, dt));

  var W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);
  var P = RAYOS.oscuro ? PALETA_RAYO.oscuro : PALETA_RAYO.claro;

  try {
    ctx.save();
    ctx.globalCompositeOperation = RAYOS.oscuro ? 'lighter' : 'source-over';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    RAYOS.ondas = RAYOS.ondas.filter(function (o) {
      o.edad += dt;
      if (o.edad >= o.vida) return false;
      dibujarOnda(ctx, o, P);
      return true;
    });

    RAYOS.vivos = RAYOS.vivos.filter(function (r) {
      r.edad += dt;
      if (r.sujeto) {
        /* CON EL DEDO PUESTO NO SE APAGA: solo el tope de aguante lo suelta. */
        if (r.edad > RAYO_AGUANTE) descargarRayo(r);
        else r.alfa = 1;
      }
      if (!r.sujeto) {
        r.soltado += dt;
        r.alfa = Math.max(0, 1 - r.soltado / RAYO_APAGON);
        if (r.alfa <= 0) return false;
      }
      r.largo = largoDeRayo();
      r.destello = Math.max(0, r.destello - dt / 260);

      /* Mientras el dedo está puesto, la yema suelta chispas sin parar, por el
         lado de alguno de sus rayos; si el dedo se arrastra, suelta más. */
      if (r.sujeto && dt > 0) {
        var v = Math.sqrt((r.x - r.px) * (r.x - r.px) + (r.y - r.py) * (r.y - r.py)) / dt;
        r.acum += dt * (0.03 + Math.min(0.12, v * 0.1)) * (RAYOS.degradado ? 0.5 : 1);
        while (r.acum >= 1) {
          r.acum -= 1;
          var h = r.hilos[Math.floor(Math.random() * r.hilos.length)];
          soltarChispas(r.x, r.y, 1, 0.38, h.ang, 0.9);
        }
      }
      r.px = r.x; r.py = r.y;

      rehacerRayo(r, t, dt, W, H);
      dibujarRayo(ctx, r, r.alfa, t, P);
      return true;
    });

    RAYOS.chispas = RAYOS.chispas.filter(function (c) {
      c.edad += dt;
      if (c.edad >= c.vida) return false;
      var f = Math.exp(-dt / 240);
      c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= f; c.vy *= f;
      var p = c.edad / c.vida;
      /* Una estela corta hacia atrás: con la velocidad se alarga, y al frenarse
         queda en un punto que se apaga. */
      ctx.strokeStyle = rgbaRayo(p < 0.35 ? P.chispa0 : P.chispa1, (1 - p) * 0.95);
      ctx.lineWidth = 1.7 - p * 0.9;
      ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x - c.vx * 24, c.y - c.vy * 24); ctx.stroke();
      return true;
    });
    ctx.restore();
  } catch (e) {
    /* Un adorno no puede apagar el negocio: si el dibujo revienta en un
       navegador raro, se apaga el rayo y la página sigue como si nada. */
    RAYOS.vivos = []; RAYOS.chispas = []; RAYOS.ondas = [];
    try { ctx.restore(); ctx.clearRect(0, 0, W, H); } catch (e2) {}
    RAYOS.corriendo = false;
    if (window.console && console.warn) console.warn('el rayo se apagó:', e);
    return;
  }

  if (RAYOS.vivos.length || RAYOS.chispas.length || RAYOS.ondas.length) requestAnimationFrame(pasoRayos);
  else { RAYOS.corriendo = false; ctx.clearRect(0, 0, W, H); }
}

function dibujarRayo(ctx, r, alfa, t, P) {
  dibujarNucleo(ctx, r, alfa, t, P);
  /* Tres pasadas por rayo: un halo ancho y tenue, un cuerpo de color y el
     filamento claro del centro. Sale más barato que un shadowBlur, que en
     Android recalcula el desenfoque en cada fotograma. El halo se ensancha un
     instante con el destello del toque y del soltar. */
  for (var i = 0; i < r.hilos.length; i++) {
    var h = r.hilos[i];
    if (h.camino.length < 2) continue;
    ctx.strokeStyle = rgbaRayo(P.halo, alfa * P.aHalo);
    ctx.lineWidth = 9 + 5 * r.destello; trazo(ctx, h.camino);
    ctx.strokeStyle = rgbaRayo(P.medio, alfa * P.aMedio);
    ctx.lineWidth = 3.4; trazo(ctx, h.camino);
    ctx.strokeStyle = rgbaRayo(P.centro, alfa * P.aCentro);
    ctx.lineWidth = 1.5; trazo(ctx, h.camino);

    /* Las ramas, más finas y más apagadas cuanto más hondas: es lo que hace que
       se lean como ramas y no como rayos encimados. */
    for (var j = 0; j < h.ramas.length; j++) {
      var b = h.ramas[j];
      if (b.nivel > 0) {
        ctx.strokeStyle = rgbaRayo(P.medio, alfa * P.aMedio * 0.8);
        ctx.lineWidth = 2.4; trazo(ctx, b.pts);
      }
      ctx.strokeStyle = rgbaRayo(b.nivel > 0 ? P.centro : P.medio, alfa * (b.nivel > 0 ? 0.85 : 0.6));
      ctx.lineWidth = b.nivel > 0 ? 1.1 : 0.9; trazo(ctx, b.pts);
    }
  }
}

/* EL NÚCLEO: la yema encendida. Late un poco —siete veces por segundo, apenas
   un 20%— para que se lea como energía y no como un círculo pegado. Si el
   navegador no tiene degradados en el lienzo, el rayo sale sin núcleo. */
function dibujarNucleo(ctx, r, alfa, t, P) {
  if (!ctx.createRadialGradient || !ctx.arc || !ctx.fill) return;
  var R = (18 + 3.5 * Math.sin(t / 22) + 12 * r.destello) * (r.sujeto ? 1 : 0.6 + 0.4 * alfa);
  var g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, R);
  g.addColorStop(0, rgbaRayo(P.n0, alfa));
  g.addColorStop(0.35, rgbaRayo(P.n1, alfa * 0.5));
  g.addColorStop(1, rgbaRayo(P.n2, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(r.x, r.y, R, 0, Math.PI * 2); ctx.fill();
}

/* LA ONDA del toque: un anillo que se abre rápido y se apaga. */
function dibujarOnda(ctx, o, P) {
  if (!ctx.arc) return;
  var p = o.edad / o.vida, e = 1 - (1 - p) * (1 - p);
  ctx.strokeStyle = rgbaRayo(P.medio, (1 - p) * 0.6);
  ctx.lineWidth = 0.6 + 2.6 * (1 - p);
  ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(1, o.R * e), 0, Math.PI * 2); ctx.stroke();
}
function trazo(ctx, pts) {
  if (!pts || pts.length < 2) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

  var g = { valores: {}, foco: '', ini: null, fin: null };
  CASILLAS_ESCRITAS.forEach(function (id) {
    var el = $(id);

  try {
    var a = document.activeElement;
    if (a && a.id && CASILLAS_ESCRITAS.indexOf(a.id) >= 0) {
      g.foco = a.id;
      g.ini = typeof a.selectionStart === 'number' ? a.selectionStart : null;

}
function devolverLoEscrito(g) {
  if (!g) return;
  Object.keys(g.valores).forEach(function (id) {
    var el = $(id);
    if (el && !el.value) el.value = g.valores[id];
  });
  if (!g.foco) return;
  var f = $(g.foco);
  try {
    if (f && f.focus) f.focus();
    if (f && f.setSelectionRange && g.ini !== null) f.setSelectionRange(g.ini, g.fin === null ? g.ini : g.fin);
  } catch (e) {}
}

/* ------------------------------ LA FICHA ------------------------------ */

/* POR QUÉ FALLÓ, EN UNA SOLA FUNCIÓN. Tres pantallas preguntan a la nube y las
   tres tienen que dar la misma respuesta ante la misma causa.

   Y las causas son distintas de verdad, no matices: al 404 no hay nada que
   hacerle desde el teléfono —es una migración que Joan no ha corrido—; al 401 se
   le contesta volviendo a entrar, que es un toque; y solo la última es de verdad
   un problema de conexión. Decirle «revisa tu internet» a quien tiene la sesión
   vencida lo manda a reiniciar el teléfono por algo que arregla un botón. */
function causaDe(e) {
  if (e && e.sinSesion) return 'sesion';
  var m = String((e && e.message) || '');
  if (/\b404\b/.test(m)) return 'apagado';
  if (/\b401\b/.test(m) || /\b403\b/.test(m)) return 'sesion';
  return 'falla';
}
/* 21-oct-2026 — G1: la ficha es de la sesión que la pidió. Si mientras
   contestaba mi_cuenta la persona tocó «Salir» y otra entró a la suya, la
   respuesta vieja pintaba el nombre y el historial del primero en la cuenta
   del segundo. Se descarta, como ya hacían mi_registro y el chat. */
function cargarFicha() {
  MI_REGISTRO = '';
  if (!SESION || !SESION.access_token) { FICHA_ESTADO = 'sin'; return; }
  FICHA_ESTADO = 'cargando';
  var ses = SESION;
  rpcSesion('mi_cuenta').then(function (j) {
    if (SESION !== ses) return;
    if (!j || j.ok !== true) { FICHA_ESTADO = 'falla'; return pintarLamina(); }
    if (!j.vinculada) {
      /* NO ES UN ERROR: es un registrado nuevo, o uno antiguo al que Joan
         todavía no le ha cargado el historial. Se le contesta así. */
      FICHA = null; FICHA_ESTADO = 'nueva'; pintarLamina();
      preguntarMiRegistro();
      return;
    }
    FICHA = FS.leer(j.datos || {});
    FICHA.nombre = j.nombre || '';
    FICHA.actualizado = j.actualizado_en || '';
    FICHA_ESTADO = 'vinculada';
    pintarLamina();
  }).catch(function (e) {
    if (SESION !== ses) return;
    /* Cada causa, su palabra: ver causaDe. */
    var c = causaDe(e);
    FICHA_ESTADO = c === 'apagado' ? 'apagada' : (c === 'sesion' ? 'sesion' : 'falla');
    pintarLamina();
  });
}

/* 7-oct-2026 (tercera vuelta) — ¿EN QUÉ VA EL REGISTRO DE ESTA CUENTA SIN

   eso, y la app del socio ya lo usa (app/sesion-socio.js, textoSinJuntar).

   Una vez por apertura de la cuenta, después de pintar: lo de siempre sale en

   (la migración sin correr), 401 o sin red se queda lo de siempre: no saber no
   es razón para cambiar de promesa. */
function preguntarMiRegistro() {
  var ses = SESION;
  rpcSesion('mi_registro', {}).then(function (j) {
    if (SESION !== ses || FICHA_ESTADO !== 'nueva') return;   // salió, entró otro, o ya está junta
    MI_REGISTRO = leerMiRegistro(j);
    /* El chat no muestra este aviso, y repintarlo le reabre el canal a quien
       está escribiendo: al cambiar de pestaña ya sale con lo nuevo. */
    if (textoSinJuntarDistinto() && TAB !== 'chat') pintarLamina();
  })['catch'](function () { /* se queda lo de siempre: ver arriba */ });
}
/* Lo mismo que lee app/sesion-socio.js (miRegistro), con una diferencia a
   propósito: una respuesta SIN la llave `registro` no es «sin registro», es
   una respuesta que no dice nada (la base contesta {ok, registro: null} con
   la llave puesta). */
function leerMiRegistro(j) {
  if (!j || j.ok !== true || !Object.prototype.hasOwnProperty.call(j, 'registro')) return '';
  if (j.registro === null) return 'sin_registro';
  var e = String((j.registro && j.registro.estado) || '');
  return (e === 'nuevo' || e === 'atendido' || e === 'descartado') ? e : '';

/* Las palabras son las de la app del socio (textoSinJuntar), para que el mismo
   cliente lea lo mismo en las dos; «por el chat de servicio al cliente» en vez

   de siempre. */

  if (MI_REGISTRO === 'descartado') {

      'Si quieres saber por qué, escríbenos por el chat de servicio al cliente.';

    return 'No encontramos un registro hecho junto con esta cuenta. Si te registraste antes, en otro intento, ' +
