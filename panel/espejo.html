/* ------------------------------- HOY ----------------------------------- */
function vistaHoy() {
  var arr = DB.prestamos.filter(function (p) {
    return ['mora', 'hoy', 'proximo'].indexOf(estadoPrestamo(p)) !== -1;
  }).sort(function (a, b) {
    var o = { mora: 0, hoy: 1, proximo: 2 };
    return o[estadoPrestamo(a)] - o[estadoPrestamo(b)] ||
      String(P.corteDelCredito(a)).localeCompare(String(P.corteDelCredito(b)));
  });

  var h = '';
  var hor = horarioPermitido();
  if (!hor.ok) {
    h += '<div class="aviso ambar"><b>Fuera de horario de cobranza</b> (Ley 2300): ' + esc(hor.motivo)
      + '. Puedes registrar pagos y prórrogas —eso es contabilidad, no contacto—, '
      + 'pero no llamar ni escribir.</div>';
  }
  if (!arr.length) {
    /* DOS VACÍOS QUE PARECEN UNO Y NO LO SON, Y ES LA RAZÓN DE ESTA PÁGINA.
       «No hay nada que cobrar» y «todavía no ha llegado tu cartera» se ven
       igual en la pantalla y significan lo contrario. El CRM de escritorio
       abierto en un teléfono hace exactamente esto: con la cartera en el otro
       aparato pinta un ✓ verde y «Nada por gestionar hoy», o sea afirma en
       positivo que Joan no tiene nada que cobrar el martes. La cabecera y la
       barra de abajo ya dicen «sin conectar», pero el ojo va al centro, y un ✓
       verde gana a cualquier letra pequeña.
       El criterio es la CARTERA, no la cola: si no hay ni un crédito cargado,
       este teléfono no sabe nada y tiene que decirlo. */
    var sinCartera = !(DB.prestamos && DB.prestamos.length);
    if (sinCartera) {
      return h + '<div class="vacio"><div class="ic">☁</div>'
        + '<p>Todavía no ha llegado tu cartera a este teléfono.</p>'
        + '<p class="muted">Esto <b>no</b> quiere decir que no tengas nada que cobrar: quiere decir que '
        + 'este aparato aún no la ha traído. Entra con tu correo y toca «Traer de la nube».</p></div>';
    }
    return h + '<div class="vacio"><div class="ic">✅</div><p>Nada por gestionar hoy.</p>'
      + '<p class="muted">Aparecen los créditos vencidos, los que vencen hoy y los que vencen en dos días o menos.</p></div>';
  }

  var total = arr.reduce(function (s, p) { return s + totalCiclo(p); }, 0);
  var enMora = arr.filter(function (p) { return estadoPrestamo(p) === 'mora'; }).length;
  h += '<div class="card laca ap"><div class="etq">La cola de hoy</div>'
    + '<div class="cifra oro">' + COP(total) + '</div>'
    + '<div class="sub" style="color:color-mix(in srgb, var(--blanco-laca) 62%, transparent)">'
    + arr.length + ' crédito(s) por gestionar · ' + enMora + ' en mora</div></div>';

  arr.forEach(function (p) {
    var s = socioDe(p) || { nombre: p.socioNombre, telefono: p.telefono, gestiones: [] };
    var est = estadoPrestamo(p);
    var l = liq(p);
    var cuando = est === 'hoy' ? 'vence hoy'
      : est === 'mora' ? 'hace ' + l.dias_mora + ' día(s)'
      : 'en ' + diasPara(p) + ' día(s)';
    var ofrecida = prorrogaOfrecida(p);
    h += '<div class="card ap">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'
      +   '<div style="min-width:0">'
      +     '<b>' + esc(s.nombre || p.socioNombre || 'Socio') + '</b>'
      +     '<div class="mini mono">' + esc(P.codCredito(p)) + (s.id ? ' · ' + esc(P.codCliente(s)) : '') + '</div>'
      +   '</div>'
      +   '<span class="pill ' + est + '">' + ESTADO_TXT[est] + '</span>'
      + '</div>'
      + '<div class="fila"><span class="k">Total para saldar</span>'
      +   '<span class="v">' + COP(l.total_a_pagar) + '</span></div>'
      + (l.recargo_mora
          ? '<div class="fila"><span class="k">Recargo por ' + l.dias_mora + ' día(s)' + pctMora(l) + '</span>'
            + '<span class="v ambar">' + COP(l.recargo_mora) + '</span></div>'
          : '')
      + '<div class="fila"><span class="k">Vence</span>'
      +   '<span class="v">' + fmtFecha(P.corteDelCredito(p)) + ' <span class="muted">· ' + cuando + '</span></span></div>'
      + '<div class="fila"><span class="k">Prórroga</span><span class="v">'
      +   (ofrecida != null ? COP(ofrecida)
          : (P.tienePlan(p) ? '<span class="muted">en plan de pagos</span>'
             : '<span class="muted">ya no le quedan</span>')) + '</span></div>'
      + (avisoDeTope(s, true) ? '<div class="mini">' + esc(avisoDeTope(s, true)) + '</div>' : '')
      + '<div class="tres">'
      +   '<button class="btn sm" type="button" data-acc="cobro" data-id="' + esc(p.id) + '">Cobrar</button>'
      +   '<button class="btn sm sec" type="button" data-acc="prorroga" data-id="' + esc(p.id) + '">Prórroga</button>'
      +   '<button class="btn sm sec" type="button" data-acc="gestion" data-id="' + esc(p.id) + '">Gestión</button>'
      + '</div>'
      + '<button class="btn sm sec arriba" type="button" data-acc="vercredito" data-id="' + esc(p.id) + '">Ver el crédito</button>'
      + '</div>';
  });
  /* Lo que esta cola NO trae, dicho donde se nota la falta. */
  h += '<div class="aviso info">Acá solo entran los <b>créditos quincenales</b>, igual que la cola del '
    + 'computador. Las cuotas del <b>préstamo con garantía</b> no se cobran desde el celular: '
    + 'se ven en la ficha del socio y se cobran en el computador.</div>';
  return h;
}

/* =========================================================================
 * LA TANDA DE MENSAJES
 * =========================================================================
 *
 * QUÉ PIDIÓ JOAN Y QUÉ SE LE ENTREGA, SIN ADORNOS.
 * Pidió «poder enviar masivamente mensajes por whatsapp con publicidad o
 * informacion de cobro». Esto NO es envío masivo, y la pantalla lo dice con
 * esas palabras en el primer párrafo, no en letra chica al final:
 *
 *   · El envío masivo DE VERDAD es la Cloud API de Meta. Cuesta una SIM nueva
 *     (el número registrado deja de funcionar como WhatsApp normal, o sea que
 *     no puede ser el suyo), verificación del negocio con papeles, política de
 *     privacidad publicada, plantillas aprobadas una por una y un servidor con
 *     un token secreto — que este sitio, que es HTML estático, no tiene. Todo
 *     eso para ahorrarle diez toques al día. Cuando pase de unos 150 créditos
 *     activos, o el día que quiera avisos que salgan solos a las 9am sin que él
 *     toque el teléfono, esa es la respuesta correcta. Hoy no.
 *   · El envío masivo FÁCIL —listas de difusión, extensiones de Chrome, apps de
 *     «envío masivo»— le puede costar el número donde tiene los chats de toda
 *     la cartera y los comprobantes de pago. Además la difusión solo le llega a
 *     quien tenga guardado su número, no avisa a quién no le llegó, y no se
 *     puede personalizar: un texto idéntico a 200 personas es justo el patrón
 *     que dispara la detección de spam.
 *
 * Lo que sí se puede hacer hoy, sin trámite y sin arriesgar el número, es esto:
 * el sistema decide A QUIÉN, CON QUÉ TEXTO y SI LA LEY LO PERMITE AHORA MISMO;
 * Joan abre el chat y toca enviar, de a uno. Lo masivo es el trabajo previo.
 *
 * QUÉ LE AHORRA DE VERDAD: no los toques —esos son los mismos— sino el PENSAR
 * (a quién le toca, qué le escribo, cuánto debe, si hoy puedo) y dos errores que
 * hoy son posibles: escribirle dos veces al mismo y escribirle fuera de horario.
 *
 * POR QUÉ NO GUARDA LA LISTA DE PENDIENTES.
 * La tanda se RECALCULA cada vez que se abre. Congelar la lista es más cómodo
 * hasta el día en que guarda a alguien que pagó anoche y Joan le cobra a un
 * cliente que está al día, con el cliente leyéndolo. Lo único que se guarda es
 * el grupo y a quién saltó, con la fecha; si es de otro día, se descarta y se
 * dice por qué.
 *
 * Y POR QUÉ NO HAY MARCADOR DE «HECHO».
 * Porque ya existe y se llama gestión. Marcar hecho ES anotar la gestión, la
 * misma de siempre. Tres cosas salen gratis de esa decisión: si Joan gestiona a
 * alguien por fuera de la tanda, la tanda se entera sola; las gestiones son una
 * lista que SOLO SUMA al sincronizar (nube.js), así que un choque entre el
 * computador y el celular nunca borra un «ya lo llamé»; y el tope de la Ley 2300
 * y el avance de la tanda se leen del MISMO dato, o sea que es imposible que
 * digan cosas distintas.
 * ======================================================================== */

/* En memoria: el grupo abierto y si estamos en la lista o en la tarjeta. */
var TANDA = { grupo: null, verFuera: '' };

/* Los créditos que caen en cada grupo. Ni un número se calcula acá: el estado,
   los días de mora y los que faltan salen de estadoPrestamo/diasMora/diasPara,
   que preguntan al puente. */
function casosDelGrupo(clave) {
  var casos = [];
  var ayer = isoLocal(new Date(hoy0().getTime() - 86400000));
  DB.prestamos.forEach(function (p) {
    var est = estadoPrestamo(p);
    var entra = false, prioridad = 0, k = '';
    if (clave === 'hoy') { entra = est === 'hoy'; prioridad = 1; k = 'venceHoy'; }
    else if (clave === 'mora-temprana') { entra = est === 'mora' && diasMora(p) <= 5; prioridad = 1; k = 'moraTemprana'; }
    else if (clave === 'mora') { entra = est === 'mora' && diasMora(p) >= 6; prioridad = 1; k = 'mora'; }
    else if (clave === 'proximos') {
      entra = est === 'proximo';
      prioridad = 1;
      k = diasPara(p) >= 2 ? 'recordatorio2' : 'recordatorio1';
    }
    else if (clave === 'pagaron-ayer') { entra = !!p.pagado && p.fechaPagado === ayer; prioridad = 1; k = 'recibo'; }
    if (!entra) return;
    /* Sin socio no hay ficha, ni teléfono, ni gestiones donde anotar: no hay a
       quién escribirle. Es un dato roto, y se cuenta aparte más abajo. */
    var s = socioDe(p);
    if (!s) return;
    casos.push({
      id: p.id, socioId: s.id, socio: s, credito: p,
      telefono: waNum(s), plantilla: k, prioridad: prioridad,
      orden: P.corteDelCredito(p) || ''
    });
  });
  return casos;
}

/* El grupo, ya filtrado por la ley. Un solo sitio: la lista de la pantalla y
   los contadores de los botones salen de acá, así que no pueden discrepar. */
function tandaDe(clave) {
  var gr = T.grupoPorClave(clave);
  if (!gr) return null;
  var guardada = (TANDA_GUARDADA && TANDA_GUARDADA.fecha === hoyISO() && TANDA_GUARDADA.grupo === clave)
    ? TANDA_GUARDADA : null;
  var t = T.armarTanda(casosDelGrupo(clave), {
    hoy: hoyISO(),
    horario: horarioPermitido(),
    tipo: gr.tipo,
    grupo: clave,
    saltados: guardada ? guardada.saltados : []
  });
  /* El detalle del motivo, para poder pintarlo al abrir un número del recuento.
     Se cuelga del caso acá y no dentro de tanda.js, que no pinta nada. */
  t.fuera.forEach(function (f) { f.caso.__detalle = f.motivo.detalle || ''; });
  t.grupo = gr;
  return t;
}

/* Cuántos de este grupo ya se tocaron HOY desde la tanda. Se DERIVA de las
   gestiones —no hay contador— por la misma razón que el puente deriva la
   amortización del cupón: un contador guardado se desincroniza el día que algo
   se edita, y desde ahí miente para siempre. */
function tocadosHoy(clave) {
  var hoy = hoyISO(), vistos = {}, n = 0;
  DB.socios.forEach(function (s) {
    (s.gestiones || []).forEach(function (g) {
      if (g.fecha !== hoy || g.origen !== 'tanda' || g.grupo !== clave) return;
      if (vistos[s.id]) return;
      vistos[s.id] = true; n++;
    });
  });
  return n;
}

function vistaTanda() {
  if (!T) {
    return '<div class="vacio"><div class="ic">⚖</div><p>La tanda no puede abrir.</p>'
      + '<p class="muted">Falta <span class="mono">panel/tanda.js</span>, que es donde viven los topes '
      + 'de contacto de la Ley 2300. Sin él no puedo garantizar que un mensaje sea legal, y prefiero '
      + 'no abrir a abrir sin comprobar.</p></div>';
  }
  if (!(DB.prestamos && DB.prestamos.length)) {
    return '<div class="vacio"><div class="ic">☁</div><p>Todavía no ha llegado tu cartera a este teléfono.</p>'
      + '<p class="muted">La tanda se arma con tus créditos. Entra con tu correo y toca «Traer de la nube».</p></div>';
  }
  return TANDA.grupo ? vistaTandaGrupo(TANDA.grupo) : vistaTandaElegir();
}

/* --------------------------- 1. ELEGIR EL GRUPO ------------------------- */
function vistaTandaElegir() {
  var hor = horarioPermitido();
  var h = '';

  /* LO PRIMERO DE LA PANTALLA ES LA VERDAD SOBRE QUÉ ES ESTO. Va arriba y no
     al pie porque al pie no se lee, y porque Joan pidió «envío masivo»: si la
     primera frase no lo desmiente, la pantalla le está diciendo que sí. */
  h += '<div class="card laca ap"><div class="etq">Tanda de mensajes</div>'
    + '<div class="sub" style="color:var(--blanco-laca);font-size:15px;margin-top:8px">'
    + '<b>Esto no envía nada solo.</b> Prepara la lista, el orden y el texto; '
    + 'el chat lo abres tú y <b>tú tocas enviar</b>, uno por uno.</div>'
    + '<div class="sub">Lo que te ahorra no son los toques: es tener que pensar a quién le toca, '
    + 'cuánto debe y si hoy la ley te deja escribirle.</div></div>';

  if (!hor.ok) {
    h += '<div class="aviso ambar"><b>Ahora no se puede contactar a nadie</b> (Ley 2300): '
      + esc(hor.motivo) + '. '
      + 'El horario permitido es de lunes a viernes de 7am a 7pm y los sábados de 8am a 3pm. '
      + 'Domingos y festivos, nunca. Aplica igual al cobro y a la publicidad.<br>'
      + 'Puedes seguir <b>registrando pagos y prórrogas</b>: eso es contabilidad, no contacto.</div>';
  }

  var rit = T.avisoDeRitmo(DB.socios, new Date());
  if (rit) h += '<div class="aviso ambar"><b>Ve más despacio.</b> ' + esc(rit.texto) + '</div>';

  /* RETOMAR — o decir por qué ya no se puede.
     Una tanda de ayer NO se retoma, y no es una limitación técnica: la lista de
     mora de hoy es otra. Retomarla sería escribirle a alguien que pagó anoche.
     Se dice con esas palabras en vez de borrarla en silencio. */
  if (TANDA_GUARDADA && TANDA_GUARDADA.grupo) {
    var grG = T.grupoPorClave(TANDA_GUARDADA.grupo);
    if (grG && TANDA_GUARDADA.fecha === hoyISO()) {
      var tG = tandaDe(TANDA_GUARDADA.grupo);
      var hechos = tocadosHoy(TANDA_GUARDADA.grupo);
      h += '<div class="aviso info"><b>Tenías abierta la tanda «' + esc(grG.titulo) + '».</b> '
        + (hechos ? 'Ya tocaste ' + hechos + '. ' : '')
        + 'Quedan ' + tG.pendientes.length
        + (tG.saltados.length ? ', más ' + tG.saltados.length + ' que saltaste' : '') + '.'
        + '<button class="btn sm arriba" type="button" data-acc="tanda-abrir" data-g="'
        + esc(TANDA_GUARDADA.grupo) + '">Retomar</button></div>';
    } else if (grG) {
      h += '<div class="aviso info"><b>La tanda de «' + esc(grG.titulo) + '» era del '
        + esc(fmtFecha(TANDA_GUARDADA.fecha)) + ' y ya no vale.</b> La lista de hoy es otra: '
        + 'alguno de esos ya pagó, y cobrarle a un cliente que está al día es el papelón que '
        + 'esta pantalla existe para evitar. Empieza una nueva abajo.</div>';
    }
  }

  /* --- cobro y servicio --- */
  h += '<div class="tit-bloque"><h3 class="tit">Cobro</h3>'
    + '<span class="mini">Ley 2300 · uno al día, uno a la semana</span></div>';
  T.gruposDeTipo('cobro').concat(T.gruposDeTipo('servicio')).forEach(function (gr) {
    var t = tandaDe(gr.clave);
    var r = T.resumenDeTanda(t);
    var tocados = tocadosHoy(gr.clave);
    var vacio = r.total === 0;
    h += '<div class="card ap' + (vacio ? '' : ' tocable') + '"'
      + (vacio ? '' : ' data-acc="tanda-abrir" data-g="' + esc(gr.clave) + '"')
      + (vacio ? ' style="opacity:.55"' : '') + '>'
      + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">'
      +   '<b>' + esc(gr.titulo) + '</b>'
      +   '<span class="pill ' + (gr.tipo === 'servicio' ? 'ok' : 'hoy') + '">'
      +     (gr.tipo === 'servicio' ? 'servicio' : 'cobro') + '</span>'
      + '</div>'
      + '<div class="mini">' + esc(gr.ayuda) + '</div>'
      + (vacio
          ? '<div class="mini" style="margin-top:8px">Nadie en este grupo hoy.</div>'
          : '<div class="fila" style="border-bottom:0;padding-bottom:0">'
            + '<span class="k">' + r.total + ' persona(s) en el grupo</span>'
            + '<span class="v' + (r.puedes ? '' : ' ambar') + '">'
            + (r.puedes ? 'puedes escribirle a ' + r.puedes : 'a nadie ahora') + '</span></div>'
            + (tocados ? '<div class="mini">Hoy ya tocaste ' + tocados + ' de este grupo.</div>' : ''))
      + '</div>';
  });

  /* --- publicidad, explicada y apagada --- */
  h += bloquePublicidad();

  h += '<div class="aviso info"><b>Lo que la tanda no hace</b><ul style="margin:8px 0 0;padding-left:18px">'
    + T.LO_QUE_NO_HACE.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('')
    + '</ul></div>';
  return h;
}

/* ------------------ LA PUBLICIDAD: APAGADA Y EXPLICADA ------------------
   Joan pidió esto explícitamente. No se esconde el botón —esconderlo sería
   dejarle creer que se me olvidó— y tampoco se enciende: se muestra apagado,
   con los cuatro motivos, quién resuelve cada uno, y qué pasa si se enciende
   igual. El coste de equivocarse acá no es un bug: la SIC sancionó a Movistar
   con unos $670 millones por exactamente esta conducta. */
function bloquePublicidad() {
  var b = T.bloqueoDePublicidad(DB.socios);
  var h = '<div class="tit-bloque"><h3 class="tit">Publicidad</h3>'
    + '<span class="mini">Ley 1581 · habeas data</span></div>';

  h += '<div class="choque">'
    + '<h3>🔒 Apagada — y no por falta de código</h3>'
    + '<div class="lado" style="margin-top:12px">'
    +   '<div class="d"><span>Socios que autorizaron publicidad</span>'
    +     '<span>' + b.autorizados + ' de ' + b.total + '</span></div>'
    + '</div>'
    + '<p style="margin:12px 0 0;font-size:13.5px">' + esc(b.resumen) + '</p>'
    + '</div>';

  h += '<div class="card ap"><div class="etq">Qué falta, y quién lo tiene que hacer</div>';
  b.falta.forEach(function (f) {
    h += '<div style="padding:12px 0;border-bottom:1px solid var(--linea)">'
      + '<b>' + esc(f.titulo) + '</b>'
      + '<div class="mini" style="margin-top:4px">' + esc(f.texto) + '</div>'
      + '<div class="mini"><b>Lo resuelve:</b> ' + esc(f.quien) + '</div>'
      + '</div>';
  });
  h += '<div class="mini" style="margin-top:12px">Los grupos que existirían el día que se encienda: '
    + T.gruposDeTipo('publicidad').map(function (g) { return esc(g.titulo); }).join(' · ')
    + '. Ninguno incluiría a quien deba algo: ofrecerle un crédito nuevo a quien está atrasado '
    + 'es cobranza disfrazada.</div>';
  h += '</div>';

  h += '<div class="aviso ambar"><b>Y una advertencia que no pediste.</b> Un mensaje «informativo» que '
    + 'además ofrece algo ES publicidad. Ponerle «pide tu nuevo crédito» al pie de un recordatorio de '
    + 'pago convierte ese mensaje en comercial y le quita la excepción que hoy protege los mensajes de '
    + 'cobro. Por eso las dos tandas están separadas acá y no se pueden mezclar.</div>';
  return h;
}

/* ------------------------- 2. EL RECUENTO Y LA COLA ---------------------- */
function vistaTandaGrupo(clave) {
  var t = tandaDe(clave);
  if (!t) { TANDA.grupo = null; return vistaTandaElegir(); }
  var r = T.resumenDeTanda(t);
  var gr = t.grupo;
  var tocados = tocadosHoy(clave);

  var h = '<button class="btn sec sm" type="button" data-acc="tanda-salir">← Todos los grupos</button>';

  h += '<div class="card laca ap" style="margin-top:12px"><div class="etq">' + esc(gr.titulo) + '</div>'
    + '<div class="cifra oro">' + r.puedes + '</div>'
    + '<div class="sub" style="color:var(--blanco-laca)">'
    + (r.puedes
        ? 'persona(s) a las que puedes escribirle ahora, de ' + r.total + ' del grupo.'
        : 'No puedes escribirle a nadie de este grupo ahora mismo.')
    + '</div>';
  if (r.puedes) {
    /* Con listas cortas los dos extremos redondean al mismo número y «entre 1 y
       1 minutos» se lee como un error de programa. La cuenta es la misma; solo
       cambia la frase. */
    var mm = r.minutos.min === r.minutos.max
      ? 'unos <b>' + r.minutos.max + ' minuto(s)</b>'
      : 'entre <b>' + r.minutos.min + ' y ' + r.minutos.max + ' minutos</b>';
    h += '<div class="sub">Te va a tomar ' + mm + ' de puro envío. '
      + 'Con los que contesten al instante, cuenta más del doble: esos son los que hay que atender bien.</div>';
  }
  if (tocados) h += '<div class="sub">Hoy ya tocaste ' + tocados + '.</div>';
  h += '</div>';

  /* EL RECUENTO. Nunca adjetivos: cada motivo con su número, y cada número se
     puede ABRIR para ver quiénes son. Un número que no se puede abrir es un
     número en el que Joan no confía, y acaba abriendo WhatsApp por su cuenta. */
  if (r.fuera) {
    h += '<div class="card ap"><div class="etq">A ' + r.fuera + ' no, hoy</div>';
    t.porMotivo.forEach(function (m) {
      h += '<div class="linea-item tocable" data-acc="tanda-motivo" data-m="' + esc(m.clave) + '">'
        + '<span>' + m.casos.length + ' — ' + esc(m.texto) + '</span>'
        + '<span class="muted">' + (TANDA.verFuera === m.clave ? 'ocultar' : 'ver') + '</span></div>';
      if (TANDA.verFuera === m.clave) {
        m.casos.forEach(function (c) {
          var det = c.__detalle || '';
          h += '<div class="linea-item"><span class="muted">' + esc(c.socio.nombre || 'Socio')
            + (det ? '<br>' + esc(det) : '') + '</span>'
            + '<span class="muted">'
            + (m.clave === 'sinTel'
                ? '<button class="btn sm sec" type="button" data-acc="verficha" data-id="' + esc(c.socioId) + '">Arreglar ficha</button>'
                : '')
            + '</span></div>';
        });
      }
    });
    h += '</div>';
  }

  if (t.creditosAgrupados) {
    h += '<div class="mini">' + t.creditosAgrupados + ' crédito(s) más son de personas que ya están en '
      + 'la lista. La ley cuenta contactos por PERSONA, no por crédito: se escribe una sola vez.</div>';
  }

  if (!r.puedes) {
    /* DOS VACÍOS QUE PARECEN UNO. «Terminaste» y «la ley no te deja» se ven
       igual y significan lo contrario, igual que en la vista de Hoy. Si además
       lo único que queda son los que Joan mismo saltó, decirle «no se le puede
       escribir» sería falso: sí se puede, fue él quien dijo ahora no. */
    if (t.saltados.length) {
      h += '<div class="vacio"><div class="ic">✅</div><p>Terminaste este grupo.</p>'
        + '<p class="muted">Lo único que queda son los que saltaste. Están abajo y los puedes retomar '
        + 'cuando quieras: la ley no los bloquea, los aplazaste tú.</p></div>';
    } else if (tocados) {
      h += '<div class="vacio"><div class="ic">✅</div><p>Terminaste este grupo.</p>'
        + '<p class="muted">Tocaste ' + tocados + ' de ' + r.total
        + (tocados >= r.total ? '.' : '. A los demás no se les puede escribir hoy; '
            + 'los números de arriba dicen por qué.') + '</p></div>';
    } else {
      h += '<div class="vacio"><div class="ic">✋</div><p>Nada que hacer en este grupo ahora.</p>'
        + '<p class="muted">No es que no tengas a quién cobrarle: es que hoy no se le puede escribir. '
        + 'Los números de arriba dicen por qué.</p></div>';
    }
    if (t.saltados.length) h += bloqueSaltados(t);
    return h;
  }

  /* LA TARJETA DEL SIGUIENTE. No hay índice ni «6 de 9» guardado en ninguna
     parte: el siguiente es SIEMPRE el primero de la lista recalculada, porque
     al anotar la gestión esa persona sale sola de la lista (ya la contactaste
     hoy). Cerrar la app y volver no pierde nada, y no hay estado que se pueda
     desincronizar. */
  h += tarjetaDeTanda(t.pendientes[0], t, r);

  if (t.saltados.length) h += bloqueSaltados(t);
  return h;
}

function bloqueSaltados(t) {
  var h = '<div class="card ap"><div class="etq">Saltados — quedan para el final</div>';
  t.saltados.forEach(function (x) {
    h += '<div class="linea-item"><span>' + esc(x.caso.socio.nombre || 'Socio')
      + '<br><span class="muted">' + esc(x.motivo) + '</span></span>'
      + '<span><button class="btn sm sec" type="button" data-acc="tanda-recuperar" data-s="'
      + esc(x.caso.socioId) + '">Retomar</button></span></div>';
  });
  h += '</div>';
  return h;
}

/* ------------------- LO POCO QUE LA TANDA GUARDA ------------------------
   Grupo, fecha y saltados. Nada más. Ver el comentario de arriba: la lista de
   pendientes NO se guarda nunca. */
function saltadosDe(grupo) {
  return (TANDA_GUARDADA && TANDA_GUARDADA.fecha === hoyISO() &&
          TANDA_GUARDADA.grupo === grupo && TANDA_GUARDADA.saltados) || [];
}
function guardarTanda(grupo, saltados) {
  TANDA_GUARDADA = { fecha: hoyISO(), grupo: grupo, saltados: saltados || [] };
  guardarUI();
}
function saltarEnTanda(socioId, motivo) {
  var g = TANDA.grupo; if (!g) return;
  var l = saltadosDe(g).filter(function (x) { return x.socioId !== socioId; });
  l.push({ socioId: socioId, motivo: motivo });
  guardarTanda(g, l);
  pintar();
}
function recuperarEnTanda(socioId) {
  var g = TANDA.grupo; if (!g) return;
  guardarTanda(g, saltadosDe(g).filter(function (x) { return x.socioId !== socioId; }));
  pintar();
}
/* Saltar es «ahora no», y el porqué importa: al final del día «saltaste 1
   (Marta — prometió pagar el viernes)» es información; «saltaste 1» no es nada.
   La lista es corta a propósito: con el cliente delante nadie escribe un texto
   libre, y cuatro botones se tocan sin mirar. */
var MOTIVOS_SALTO = ['No contesta', 'Prometió pagar', 'Mejor lo llamo', 'No es buen momento'];
function abrirSaltar(socioId) {
  var h = '<p class="mini">Se queda para el final de la tanda, no desaparece.</p>';
  MOTIVOS_SALTO.forEach(function (m) {
    h += '<button class="btn sec arriba" type="button" data-acc="tanda-saltar-ok" '
      + 'data-s="' + esc(socioId) + '" data-m="' + esc(m) + '">' + esc(m) + '</button>';
  });
  abrirHoja('¿Por qué lo saltas?', h);
}

/* ------------------------- 3. UNO POR UNO ------------------------------- */
function tarjetaDeTanda(c, t, r) {
  var p = c.credito, s = c.socio;
  var l = liq(p);
  var est = estadoPrestamo(p);
  var txt = textoPlantilla(p, s, c.plantilla);
  var huecos = tokensSinResolver(txt);
  var sem = T.contactadoEstaSemana(s, hoyISO());

  var h = '<div class="tit-bloque"><h3 class="tit">El siguiente</h3>'
    + '<span class="mini">quedan ' + r.puedes + '</span></div>';

  h += '<div class="card ap">'
    + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'
    +   '<div style="min-width:0"><b>' + esc(s.nombre || 'Socio') + '</b>'
    +     '<div class="mini mono">' + esc(P.codCredito(p)) + ' · ' + esc(P.codCliente(s))
    +     ' · ' + esc(c.telefono) + '</div></div>'
    +   '<span class="pill ' + est + '">' + (ESTADO_TXT[est] || est) + '</span>'
    + '</div>';

  /* Los números son los del puente, los mismos de la pantalla de cobro. */
  if (!p.pagado) {
    h += '<div class="fila"><span class="k">Debe hoy</span>'
      + '<span class="v">' + COP(l.total_a_pagar) + '</span></div>';
    if (l.recargo_mora) {
      h += '<div class="fila"><span class="k">Recargo por ' + l.dias_mora + ' día(s)' + pctMora(l) + '</span>'
        + '<span class="v ambar">' + COP(l.recargo_mora) + '</span></div>';
    }
    h += '<div class="fila"><span class="k">Vence</span>'
      + '<span class="v">' + fmtFecha(P.corteDelCredito(p)) + '</span></div>';
  }

  h += '<div class="fila"><span class="k">Último contacto</span><span class="v">'
    + (sem.si ? 'hace ' + sem.dias + ' día(s)' : '<span class="muted">no esta semana</span>')
    + '</span></div>';

  if (c.otrosDelMismoSocio) {
    h += '<div class="aviso info">Esta persona tiene <b>' + c.otrosDelMismoSocio + ' crédito(s) más</b> '
      + 'en este grupo. El mensaje habla solo de ' + esc(P.codCredito(p)) + '. '
      + 'Se le escribe una sola vez: la Ley 2300 cuenta contactos por persona, no por crédito.</div>';
  }
  if (P.tienePlan(p)) {
    h += '<div class="mini">Tiene plan de pagos: el mensaje no le ofrece prórroga, porque no se le puede dar.</div>';
  }
  if (huecos.length) {
    h += '<div class="aviso ambar"><b>Este mensaje tiene ' + huecos.length + ' hueco(s) sin llenar: </b>'
      + esc(huecos.join(', ')) + '. Complétalos o bórralos antes de enviar: si lo mandas así, '
      + 'el cliente los ve tal cual.</div>';
  }
  if (!txt) {
    var hayAlgunas = DB.plantillas && Object.keys(DB.plantillas).length > 0;
    h += '<div class="aviso info">' + (hayAlgunas
      ? '<b>No tienes escrita la plantilla «' + esc(c.plantilla) + '».</b> El chat se abre en blanco '
        + 'y escribes a mano. Se escribe en el computador, en Plantillas.'
      : '<b>Todavía no han llegado tus plantillas.</b> El chat se abre en blanco: no invento un texto, '
        + 'porque el mensaje que le queda al cliente tiene que ser el tuyo.') + '</div>';
  }

  h += '<label for="tdTexto">Mensaje (puedes editarlo)</label>'
    + '<textarea id="tdTexto">' + esc(txt) + '</textarea>';

  h += '<a class="btn arriba" id="tdWa" target="_blank" rel="noopener" href="' + esc(waLink(c.telefono, txt)) + '" '
    + 'data-acc="tanda-abrir-wa" data-id="' + esc(p.id) + '" data-g="' + esc(t.grupo.clave) + '" '
    + 'data-k="' + esc(c.plantilla) + '" data-tel="' + esc(c.telefono) + '">'
    + 'Abrir WhatsApp con ' + esc((s.nombre || '').split(' ')[0] || 'el socio') + '</a>';
  h += '<div class="dos">'
    + '<button class="btn sec" type="button" data-acc="tanda-solo" data-id="' + esc(p.id)
    +   '" data-g="' + esc(t.grupo.clave) + '" data-k="' + esc(c.plantilla) + '">Solo anotar</button>'
    + '<button class="btn sec" type="button" data-acc="tanda-saltar" data-s="' + esc(c.socioId) + '">Saltar</button>'
    + '</div>';
  h += '<p class="mini" style="margin-top:10px">Al abrir WhatsApp queda anotada la gestión de hoy y esta '
    + 'persona sale de la lista. <b>Tú presionas enviar en WhatsApp.</b> Esta pantalla no sabe si lo '
    + 'enviaste: anota que abriste el chat, no que mandaste el mensaje.</p>';
  h += '</div>';
  return h;
}

/* ------------------------------ BUSCAR --------------------------------- */
function vistaBuscar() {
  var q = BUSQUEDA.trim().toLowerCase();
  var h = '<div class="card ap">'
    + '<label for="bq">Buscar por nombre, cédula, teléfono o código</label>'
    + '<input id="bq" type="search" inputmode="search" autocomplete="off" '
    +   'placeholder="Ej.: María, 1032…, CL-0007" value="' + esc(BUSQUEDA) + '">'
    + '</div>';

  var socios = DB.socios;
  if (q) {
    socios = socios.filter(function (s) {
      var codigo = P.codCliente(s).toLowerCase();
      return [s.nombre, s.cedula, s.telefono, s.telefono2, s.whatsappNumero, codigo]
        .some(function (v) { return String(v == null ? '' : v).toLowerCase().indexOf(q) !== -1; });
    });
  }
  socios = socios.slice().sort(function (a, b) {
    return String(a.nombre || '').localeCompare(String(b.nombre || ''), 'es');
  });

  h += '<div class="tit-bloque"><h3 class="tit">'
    + (q ? socios.length + ' resultado(s)' : socios.length + ' socios')
    + '</h3></div>';

  if (!socios.length) {
    h += '<div class="vacio"><div class="ic">🔍</div><p>Nadie con eso.</p></div>';
  } else {
    socios.slice(0, 60).forEach(function (s) {
      var abiertos = DB.prestamos.filter(function (p) { return p.socioId === s.id && !p.pagado; });
      var enMora = abiertos.filter(function (p) { return estadoPrestamo(p) === 'mora'; }).length;
      h += '<div class="card ap tocable" data-acc="verficha" data-id="' + esc(s.id) + '">'
        + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'
        +   '<div style="min-width:0"><b>' + esc(s.nombre || 'Socio') + '</b>'
        +     '<div class="mini mono">' + esc(P.codCliente(s)) + (s.cedula ? ' · ' + esc(s.cedula) : '') + '</div></div>'
        +   (enMora ? '<span class="pill mora">' + enMora + ' en mora</span>' : '')
        + '</div>'
        + '<div class="mini">' + abiertos.length + ' crédito(s) abierto(s)'
        +   (abiertos.length ? ' · ' + COP(abiertos.reduce(function (t, p) { return t + totalCiclo(p); }, 0)) + ' por cobrar' : '')
        + '</div></div>';
    });
    if (socios.length > 60) {
      h += '<div class="mini" style="margin-top:8px">Se muestran los primeros 60. Afina la búsqueda.</div>';
    }
  }

  /* El botón NO se esconde sin señal: se muestra y se explica. Esconderlo dejaría
     a Joan pensando que la función no existe; mostrarlo apagado sin decir por qué
     es peor todavía. */
  h += '<button class="btn arriba" type="button" data-acc="nuevocliente">＋ Cliente nuevo</button>';
  h += nubeLista()
    ? '<div class="mini" style="margin-top:8px">El número de cliente lo emite la nube al crearlo, para que no se repita con el del computador.</div>'
    : '<div class="aviso ambar"><b>Sin señal no se puede crear un cliente.</b> El número (CL-0001, CL-0002…) '
      + 'lo emite la nube uno por uno; si el celular lo inventara, el computador podría estar entregando '
      + 'ese mismo número al mismo tiempo. Cobrar, prorrogar y marcar gestión sí funcionan sin señal.</div>';
  return h;
}

/* ------------------------------- FICHA --------------------------------- */
function vistaFicha() {
  var s = SEL.socioId ? socioPorId(SEL.socioId) : null;
  if (!s) {
    return '<div class="vacio"><div class="ic">👤</div><p>Todavía no has abierto la ficha de nadie.</p>'
      + '<p class="muted">Búscalo en <b>Buscar</b> o entra desde un crédito de <b>Hoy</b>.</p></div>';
  }
  var paq = P.migrarSocio(DB, s);
  var cupo = P.cupoDelSocio(DB, s, paq.garantia.nivel);
  var ps = DB.prestamos.filter(function (p) { return p.socioId === s.id; })
    .sort(function (a, b) { return String(b.fechaDesembolso || '').localeCompare(String(a.fechaDesembolso || '')); });
  var resp = P.respaldadosDe(DB, s);
  var tel = waNum(s);

  var h = '<div class="card laca">'
    + '<div class="etq">' + esc(P.codCliente(s)) + ' · nivel ' + esc(paq.garantia.nivel) + '</div>'
    + '<h1 style="font-size:22px;margin-top:6px;color:var(--blanco-laca)">' + esc(s.nombre || 'Socio') + '</h1>'
    + '<div class="sep"></div>'
    + '<div class="fila"><span class="k">Garantía ganada</span><span class="v oro">' + COP(paq.garantia.acumulada) + '</span></div>'
    + '<div class="fila"><span class="k">Garantía total (con cupón y referidos)</span><span class="v oro">' + COP(paq.garantia.total) + '</span></div>'
    + '<div class="fila"><span class="k">Capital afuera</span><span class="v">' + COP(paq.garantia.capital_afuera) + '</span></div>'
    + '<div class="fila"><span class="k">Cupo disponible hoy</span><span class="v oro">' + COP(cupo.cupo) + '</span></div>'
    + '<div class="fila"><span class="k">Pagados a tiempo · racha</span><span class="v">'
    +   paq.garantia.pagados_a_tiempo + ' · ' + paq.garantia.racha + '</span></div>'
    + '</div>';

  /* LO QUE LE PAGÓ DE MÁS, SUMADO DE SUS CRÉDITOS.
     Es una SUMA de un campo, no una cuenta del negocio: acá no se reimplementa
     nada del motor ni del puente (regla 3). Va en la ficha porque el sobrepago
     vive dentro de un crédito ya cerrado, y sin esta línea la única forma de
     encontrarlo era abrir crédito por crédito acordándose de cuál fue. */
  var aFavor = ps.reduce(function (t, x) { return t + Math.max(0, Number(x.saldoAFavor) || 0); }, 0);
  if (aFavor > 0) {
    var cuantos = ps.filter(function (x) { return Number(x.saldoAFavor) > 0; }).length;
    h += '<div class="aviso ambar"><b>Te ha pagado ' + COP(aFavor) + ' de más</b> '
      + '(en ' + cuantos + ' crédito' + (cuantos === 1 ? '' : 's') + '). Es plata suya. '
      + '<b>Esto no se descuenta solo del próximo crédito:</b> se lo aplicas tú a mano al '
      + 'prestarle, o se lo devuelves. Y ojo: este total es lo que pagó de más en su historia, '
      + 'no lo que queda pendiente — no baja solo cuando ya se lo hayas devuelto.</div>';
  }

  if (tel) {
    var hor = horarioPermitido();
    h += '<div class="card ap">'
      + '<div class="fila"><span class="k">WhatsApp</span><span class="v mono">' + esc(tel) + '</span></div>'
      + (avisoDeTope(s, true) ? '<div class="mini">' + esc(avisoDeTope(s, true)) + '</div>' : '')
      + (hor.ok
          ? '<a class="btn sm sec arriba" href="' + esc(waLink(tel, '')) + '" target="_blank" rel="noopener">Abrir el chat</a>'
          : '<div class="aviso ambar" style="margin-top:8px">Fuera de horario (Ley 2300): ' + esc(hor.motivo) + '.</div>')
      + '</div>';
  }

  /* Donde iría la foto, va la verdad. */
  h += '<div class="aviso info"><b>Las fotos se quedan en el computador.</b> La cédula, la selfie y los '
    + 'comprobantes no viajan al celular en esta fase: pesan mucho en base64 y la selfie es dato '
    + 'biométrico (Ley 1581, art. 5). Acá ves los datos y los números, no las imágenes.</div>';

  h += '<div class="tit-bloque"><h3 class="tit">Créditos quincenales</h3>'
    + '<span class="muted">' + ps.length + '</span></div>';
  if (!ps.length) h += '<div class="card ap muted">Sin créditos todavía.</div>';
  ps.forEach(function (p) {
    var est = estadoPrestamo(p);
    h += '<div class="card ap tocable" data-acc="vercredito" data-id="' + esc(p.id) + '">'
      + '<div style="display:flex;justify-content:space-between;gap:8px">'
      +   '<div><b>' + COP(p.capital) + '</b><div class="mini mono">' + esc(P.codCredito(p)) + '</div></div>'
      +   '<span class="pill ' + est + '">' + ESTADO_TXT[est] + '</span></div>'
      + '<div class="mini">' + (p.pagado
          ? 'pagado el ' + fmtFecha(p.fechaPagado)
          : 'vence el ' + fmtFecha(P.corteDelCredito(p)) + ' · ' + COP(totalCiclo(p)) + ' para saldar')
      + '</div></div>';
  });

  if (resp.length) {
    h += '<div class="tit-bloque"><h3 class="tit">Préstamos con garantía</h3>'
      + '<span class="muted">' + resp.length + '</span></div>';
    resp.forEach(function (r) {
      var pend = (r.cuotas || []).filter(function (c) { return !c.pagado; });
      var prox = pend.slice().sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); })[0];
      h += '<div class="card ap"><div><b>' + COP(r.capital) + '</b>'
        + '<div class="mini mono">' + esc(P.codRespaldado(r)) + '</div></div>'
        + '<div class="fila"><span class="k">Saldo de capital</span>'
        +   '<span class="v">' + COP(P.saldoCapitalRespaldado(r)) + '</span></div>'
        + (prox ? '<div class="fila"><span class="k">Próxima cuota</span><span class="v">'
            + COP(prox.total) + ' el ' + fmtFecha(prox.fecha) + '</span></div>' : '')
        + '<div class="mini">Estas cuotas se cobran en el computador, no desde acá.</div>'
        + '</div>';
    });
  }

  var g = (s.gestiones || []).slice(-6).reverse();
  h += '<div class="tit-bloque"><h3 class="tit">Últimas gestiones</h3></div>';
  if (!g.length) h += '<div class="card ap muted">Sin gestiones registradas.</div>';
  else {
    h += '<div class="card ap">';
    g.forEach(function (x) {
      h += '<div class="linea-item"><span>' + fmtFecha(x.fecha) + '</span>'
        + '<span class="muted">' + esc(x.plantilla || x.canal || '') + '</span></div>';
    });
    h += '</div>';
  }
  return h;
}

/* ------------------------------ CRÉDITO -------------------------------- */
function vistaCredito() {
  var p = SEL.creditoId ? creditoPorId(SEL.creditoId) : null;
  if (!p) {
    return '<div class="vacio"><div class="ic">💵</div><p>Todavía no has abierto ningún crédito.</p>'
      + '<p class="muted">Ábrelo desde <b>Hoy</b> o desde la ficha del socio.</p></div>';
  }
  var s = socioDe(p);
  var l = liq(p);
  var est = estadoPrestamo(p);
  var cuota = P.cuotaPlanActual(p);
  var cuotas = P.cuotasPlan(p);
  var pr = liqProrroga(p);

  var h = '<div class="card">'
    + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'
    +   '<div><div class="etq">' + esc(P.codCredito(p)) + '</div>'
    +     '<h3 class="tit" style="margin-top:4px">' + esc((s && s.nombre) || p.socioNombre || 'Socio') + '</h3></div>'
    +   '<span class="pill ' + est + '">' + ESTADO_TXT[est] + '</span>'
    + '</div>'
    + '<div class="sep"></div>'
    + '<div class="fila"><span class="k">' + (cuota ? 'Capital de la cuota ' + cuota.n + ' de ' + cuotas.length : 'Capital del ciclo') + '</span>'
    +   '<span class="v">' + COP(l.capital) + '</span></div>'
    /* El porcentaje que se imprime es el que RIGE ESTE CICLO y lo dice el puente
       (`tasa`): con plan de pagos es el 5% sobre el saldo, no el 20% pactado. El
       día que se escribió a mano en ocho pantallas del Panel, ocho siguieron
       diciendo 90% cuando el motor ya acreditaba 75. */
    + '<div class="fila"><span class="k">'
    +   (cuota ? 'Costo del plan (' + Math.round((l.tasa || 0) * 100) + '% del saldo)'
             : 'Costo del ciclo (' + Math.round((l.tasa || 0) * 100) + '%)') + '</span>'
    +   '<span class="v">' + COP(l.costo) + '</span></div>'
    + (l.recargo_mora
        ? '<div class="fila"><span class="k">Recargo por ' + l.dias_mora + ' día(s)' + pctMora(l) + '</span>'
          + '<span class="v ambar">' + COP(l.recargo_mora) + '</span></div>'
        : '')
    + '<div class="fila"><span class="k"><b>' + (cuota ? 'Total de la cuota' : 'Total para saldar') + '</b></span>'
    +   '<span class="v"><b>' + COP(l.total_a_pagar) + '</b></span></div>'
    + '<div class="fila"><span class="k">Garantía que le deja</span><span class="v oro-tinta">'
    +   COP(l.garantia_generada)
    +   (l.acredita_en_fecha ? ''
        : ' <span class="muted">(la mitad, '
          + (l.pago_a_tiempo ? 'porque el crédito ya venía de una mora' : 'por pagar tarde') + ')</span>')
    + '</span></div>'
    + '<div class="fila"><span class="k">Vence</span><span class="v">' + fmtFecha(P.corteDelCredito(p)) + '</span></div>'
    + '<div class="fila"><span class="k">Saldo de capital del crédito</span><span class="v">' + COP(capitalActual(p)) + '</span></div>'
    + '</div>';

  /* EL SOBREPAGO, A LA VISTA DESPUÉS DE CERRAR LA HOJA DE COBRO.
     Sin esta línea, `p.saldoAFavor` se escribía y no se pintaba en NINGUNA
     pantalla: en cuanto Joan cerraba la hoja, la plata que le debe al socio
     desaparecía y solo quedaba en su memoria. Es un pasivo con un tercero; lo
     mínimo es poder consultarlo.
     Y se dice que NO se descuenta solo, porque no se descuenta solo: nada en el
     repositorio lee este campo para crear el crédito siguiente. */
  if (Number(p.saldoAFavor) > 0) {
    h += '<div class="aviso ambar"><b>Pagó ' + COP(p.saldoAFavor) + ' de más en este crédito.</b> '
      + 'Es plata del socio que quedó en tu mano. <b>No se descuenta sola del crédito siguiente</b>: '
      + 'cuando le vuelvas a prestar se la aplicas tú, o se la devuelves. '
      + 'Este número es la anotación de lo que pagó de más — no se borra solo cuando se lo devuelvas.</div>';
  }

  if (p.pagado) {
    h += '<div class="aviso info">Este crédito ya está pagado (' + fmtFecha(p.fechaPagado) + '). '
      + 'No hay nada que cobrar ni que prorrogar.</div>';
  } else {
    if (cuota) {
      h += '<div class="aviso info">Está en <b>plan de pagos</b>: va por la cuota <b>' + cuota.n
        + ' de ' + cuotas.length + '</b>. De acá no se sale prorrogando; se cobran las cuotas una por una.</div>';
    } else if (pr && pr.ok) {
      h += '<div class="aviso info">Si no puede pagar todo, la prórroga cuesta <b>' + COP(pr.total_a_pagar) + '</b>'
        + (pr.recargo_mora ? ' (' + COP(pr.costo_prorroga) + ' del ciclo más ' + COP(pr.recargo_mora)
            + ' de recargo ya causado: la prórroga no lo borra)' : '')
        + ' y el capital pasa al <b>' + fmtFecha(pr.fecha_corte_nueva) + '</b>. '
        + 'Le quedan <b>' + (pr.prorrogas_permitidas - pr.prorrogas_usadas) + '</b> de ' + pr.prorrogas_permitidas + '.</div>';
    } else if (pr && !pr.ok) {
      h += '<div class="aviso ambar"><b>Ya usó sus ' + pr.prorrogas_permitidas + ' prórroga(s)</b> — es lo que da el '
        + 'nivel ' + esc(pr.nivel_socio) + '. La salida es el plan de pagos del §8, y eso se registra en el '
        + 'computador: son tres fechas y tres montos que quedan fijos.</div>';
    }
    h += '<div class="dos">'
      + '<button class="btn" type="button" data-acc="cobro" data-id="' + esc(p.id) + '">Registrar pago</button>'
      + '<button class="btn sec" type="button" data-acc="prorroga" data-id="' + esc(p.id) + '">Prórroga</button>'
      + '</div>'
      + '<button class="btn sec arriba" type="button" data-acc="gestion" data-id="' + esc(p.id) + '">Marcar gestión / WhatsApp</button>';
  }

  if (cuotas.length) {
    h += '<div class="tit-bloque"><h3 class="tit">Plan de pagos</h3></div><div class="card ap">';
    cuotas.forEach(function (c) {
      h += '<div class="linea-item"><span>Cuota ' + c.n + ' · ' + fmtFecha(c.fecha) + '</span>'
        + '<span>' + COP(c.total) + (c.pagado ? ' <span class="muted">pagada</span>' : '') + '</span></div>';
    });
    h += '</div>';
  }

  var prs = p.prorrogas || [];
  if (prs.length) {
    h += '<div class="tit-bloque"><h3 class="tit">Prórrogas</h3><span class="muted">' + prs.length + '</span></div><div class="card ap">';
    prs.slice().reverse().forEach(function (x) {
      h += '<div class="linea-item"><span>' + fmtFecha(x.fecha) + ' → ' + fmtFecha(x.nuevoCiclo) + '</span>'
        + '<span>' + COP(x.monto) + '</span></div>';
    });
    h += '</div>';
  }

  var abs = p.abonosCapital || [];
  if (abs.length) {
    h += '<div class="tit-bloque"><h3 class="tit">Abonos a capital</h3></div><div class="card ap">';
    abs.slice().reverse().forEach(function (x) {
      h += '<div class="linea-item"><span>' + fmtFecha(x.fecha) + '</span><span>' + COP(x.monto) + '</span></div>';
    });
    h += '</div>';
  }

  var comps = (p.comprobantes || []).length;
  if (comps) {
    h += '<div class="aviso info"><b>' + comps + ' comprobante(s)</b> guardados en este crédito. '
      + 'Las fotos no viajan al celular en esta fase: ábrelas en el computador.</div>';
  }
  return h;
}

/* ----------------------------- QUINCENA -------------------------------- */
function vistaQuincena() {
  var q = cicloActualGlobal();
  var vencen = creditosQueVencenEn(q);
  var hoy = hoyISO();

  /* Lo que Joan registró HOY. Sale de los hechos guardados, no de un contador
     aparte: los créditos con fechaPagado de hoy y las prórrogas con fecha de hoy. */
  var pagadosHoy = DB.prestamos.filter(function (p) { return p.pagado && p.fechaPagado === hoy; });
  var prorrogadosHoy = [];
  DB.prestamos.forEach(function (p) {
    (p.prorrogas || []).forEach(function (pr) { if (pr.fecha === hoy) prorrogadosHoy.push({ p: p, pr: pr }); });
  });
  var cobradoHoy = pagadosHoy.reduce(function (t, p) { return t + (Number(p.gananciaPago) || 0); }, 0)
    + prorrogadosHoy.reduce(function (t, x) { return t + (Number(x.pr.monto) || 0); }, 0);

  var h = '<div class="card laca">'
    + '<div class="etq">Quincena del ' + fmtFecha(q) + '</div>'
    + '<div class="cifra oro">' + COP(gananciaDeQuincena(q)) + '</div>'
    + '<div class="sub" style="color:color-mix(in srgb, var(--blanco-laca) 62%, transparent)">'
    +   'ganancia del ciclo (costos y prórrogas ya cobrados)</div>'
    + '<div class="sep"></div>'
    + '<div class="fila"><span class="k">Invertido en el ciclo</span>'
    +   '<span class="v">' + COP(invertidoEnQuincena(q)) + '</span></div>'
    + '<div class="fila"><span class="k">Por cobrar en el ciclo</span>'
    +   '<span class="v">' + COP(porCobrarEnQuincena(q)) + '</span></div>'
    + '<div class="fila"><span class="k">Créditos que vencen</span>'
    +   '<span class="v">' + vencen.length + '</span></div>'
    + '</div>';

  h += '<div class="tit-bloque"><h3 class="tit">Lo que registraste hoy</h3></div>';
  if (!pagadosHoy.length && !prorrogadosHoy.length) {
    h += '<div class="card ap muted">Todavía nada hoy.</div>';
  } else {
    h += '<div class="card ap">';
    /* Cada línea muestra LA GANANCIA, que es lo que suma el total de abajo. La
       primera versión mostraba el capital del crédito y el total la ganancia:
       tres renglones que no daban el cuarto. Una lista cuyos números no suman el
       total que tienen debajo es peor que no poner la lista. El capital queda
       como contexto, en gris y dicho. */
    pagadosHoy.forEach(function (p) {
      h += '<div class="linea-item"><span>Pago · ' + esc(p.socioNombre || '')
        + '<br><span class="muted">' + COP(p.capital) + ' de capital devuelto</span></span>'
        + '<span>' + COP(Number(p.gananciaPago) || 0) + '</span></div>';
    });
    prorrogadosHoy.forEach(function (x) {
      h += '<div class="linea-item"><span>Prórroga · ' + esc(x.p.socioNombre || '')
        + '<br><span class="muted">pasa al ' + fmtFecha(x.pr.nuevoCiclo) + '</span></span>'
        + '<span>' + COP(x.pr.monto) + '</span></div>';
    });
    h += '<div class="fila"><span class="k"><b>Ganancia registrada hoy</b></span>'
      + '<span class="v"><b>' + COP(cobradoHoy) + '</b></span></div>';
    h += '</div>';
    /* ---------------------------------------------------------------------
       POR QUÉ ESTOS DOS NÚMEROS PUEDEN NO COINCIDIR, DICHO ANTES DE QUE JOAN LO
       PREGUNTE. Un cobro se le carga al corte que se estaba cumpliendo, no al
       día en que entró la plata: si alguien paga hoy un crédito que vencía el 31
       de julio, esa ganancia es de la quincena del 31 de julio. Así lo cuenta
       también el computador. Sin esta línea, la tarjeta de arriba puede decir $0
       mientras esta dice $60.000 del mismo día, y eso se lee como un error.
       --------------------------------------------------------------------- */
    if (cobradoHoy > 0) {
      h += '<div class="aviso info">Lo de hoy no siempre entra en la quincena de arriba: '
        + 'cada cobro se le carga al <b>corte que se estaba cumpliendo</b>, no al día en que entró '
        + 'la plata. Un crédito vencido que se paga hoy suma en la quincena en la que venció.</div>';
    }
  }

  h += '<div class="tit-bloque"><h3 class="tit">Vencen en esta quincena</h3>'
    + '<span class="muted">' + vencen.length + '</span></div>';
  if (!vencen.length) h += '<div class="card ap muted">Ninguno.</div>';
  vencen.slice().sort(function (a, b) { return totalCiclo(b) - totalCiclo(a); }).forEach(function (p) {
    h += '<div class="card ap tocable" data-acc="vercredito" data-id="' + esc(p.id) + '">'
      + '<div style="display:flex;justify-content:space-between;gap:8px">'
      + '<span>' + esc(p.socioNombre || '') + '</span>'
      + '<b>' + COP(totalCiclo(p)) + '</b></div>'
      + '<div class="mini mono">' + esc(P.codCredito(p)) + '</div></div>';
  });

  /* Esta cifra es de la CARTERA ENTERA, y la cartera entera solo está completa si
     lo del computador ya subió. Decirlo evita que Joan lea un número a medias. */
  h += '<div class="aviso info">Estos números salen de lo que este teléfono tiene guardado. '
    + 'Si el computador registró algo y todavía no lo ha subido, acá no está. '
    + 'Última vez que se trajo algo de la nube: <b>' + esc(textoTraido()) + '</b>.</div>';
  return h;
}

/* =========================== LA CINTA DE ESTADO ==========================
   Está fija abajo, encima de las pestañas, y se ve en las cinco vistas. Dice
   siempre las mismas tres cosas y en el mismo orden: cuántas cosas esperan
   subir, si hay señal, y cuándo se trajo algo por última vez. */
function textoTraido() {
  if (!ULTIMO_TRAER) return 'nunca';
  return fmtFechaHora(ULTIMO_TRAER);
}
function pintarTraido() {
  var el = document.getElementById('cabTraido');
  var partes = [];
  partes.push('Traído de la nube: ' + textoTraido());
  if (NUBE && NUBE.sesion && NUBE.sesion()) {
    var ses = NUBE.sesion();
    if (ses && ses.correo) partes.push(ses.correo);
  }
  el.textContent = partes.join(' · ');
}
function pintarCinta() {
  var el = document.getElementById('cinta');
  var n = pendientes();
  var choques = CHOQUES.length;
  var sinRed = (typeof navigator !== 'undefined' && navigator.onLine === false);
  var html = '';
  var alerta = false;

  if (n > 0) {
    alerta = true;
    html += '<span class="cuenta">' + n + '</span>';
    html += '<span class="txt"><b>' + n + (n === 1 ? ' cosa esperando subir' : ' cosas esperando subir') + '</b>'
      + (choques ? ' · ' + choques + ' con choque' : '')
      + '<br>' + (sinRed ? 'sin señal — toca para ver qué falta'
                 : (nubeLista() ? 'toca para subirlo ahora' : 'sin conectar — toca para ver qué falta'))
      + '</span>';
  } else if (choques) {
    alerta = true;
    html += '<span class="cuenta">' + choques + '</span>';
    html += '<span class="txt"><b>' + choques + ' choque(s) por decidir</b><br>toca para verlos</span>';
  } else if (sinRed) {
    alerta = true;
    html += '<span class="txt"><b>Sin señal.</b> Puedes cobrar, prorrogar y marcar gestión; '
      + 'no puedes crear clientes.</span>';
  } else if (!NUBE) {
    alerta = true;
    html += '<span class="txt"><b>Falta panel/nube.js.</b> Esta pantalla no sube ni trae nada.</span>';
  } else if (!nubeLista()) {
    alerta = true;
    html += '<span class="txt"><b>Sin conectar a la nube.</b> Toca para entrar con tu correo.</span>';
  } else if (_sincronizando) {
    html += '<span class="txt">Sincronizando…</span>';
  } else if (ULTIMO_ERROR) {
    alerta = true;
    html += '<span class="txt"><b>' + esc(ULTIMO_ERROR) + '</b><br>toca para reintentar</span>';
  } else {
    html += '<span class="txt">Todo subido · traído ' + esc(textoTraido()) + ' · toca para actualizar</span>';
  }
  el.className = 'cinta' + (alerta ? ' pendiente' : '');
  el.innerHTML = html;
}

/* ============================== LOS CHOQUES ============================== */
var _choqueAbierto = -1;
function bloqueChoques() {
  if (!CHOQUES.length) return '';
  var h = '';
  CHOQUES.forEach(function (c, i) {
    var nombre = nombreDeFila(c.tabla, c.mio) || nombreDeFila(c.tabla, c.suyo) || String(c.id);
    h += '<div class="choque">'
      + '<h3>Choque: ' + esc(nombre) + '</h3>'
      + '<div class="mini" style="color:inherit">Tú cambiaste esta ficha en el celular y '
      + esc(c.actualizado_por || 'el otro aparato') + ' la cambió también'
      + (c.actualizado_en ? ' (' + esc(fmtFechaHora(c.actualizado_en)) + ')' : '')
      + '. <b>Nada se ha perdido</b>: las dos versiones están guardadas en este teléfono. '
      + 'Decide cuál queda.</div>';
    if (_choqueAbierto === i) h += ladosHTML(c);
    h += '<div class="tres">'
      + '<button class="btn sm sec" type="button" data-acc="choque-nube" data-i="' + i + '">Dejar lo de la nube</button>'
      + '<button class="btn sm sec" type="button" data-acc="choque-mio" data-i="' + i + '">Mandar lo mío encima</button>'
      + '<button class="btn sm sec" type="button" data-acc="choque-ver" data-i="' + i + '">'
      + (_choqueAbierto === i ? 'Ocultar' : 'Ver las dos') + '</button>'
      + '</div></div>';
  });
  return h;
}
function nombreDeFila(tabla, f) {
  if (!f) return '';
  if (tabla === 'socios') return f.nombre || '';
  return (f.socioNombre || '') + (f.capital != null ? ' · ' + COP(f.capital) : '');
}
/* -------------------------------------------------------------------------
   QUÉ CAMPOS SE ENSEÑAN: LOS QUE DE VERDAD SE PISAN, Y LOS DICE nube.js.

   Acá había una lista escrita a mano de campos "importantes" por tabla, y era
   la copia número trece de este proyecto: el día que un campo nuevo empezara a
   decidir plata, la pantalla del choque seguiría enseñando los de agosto y Joan
   escogería a ciegas. `fusionarFila` ya devuelve `pisables` —exactamente los
   campos donde las dos versiones no dicen lo mismo y que NO se pueden resolver
   solos—, así que la lista sale del cálculo, no de una tabla.

   Si no hay ninguno, se dice: quiere decir que el choque fue por listas que se
   suman y que mandar lo mío no le quita nada a nadie.
   ------------------------------------------------------------------------- */
function ladosHTML(c) {
  var r = null;
  try { r = NUBE.fusionarFila(c.mio, c.suyo); } catch (e) { r = null; }
  var pisables = (r && r.pisables) || [];
  if (!pisables.length) {
    return '<div class="lados"><div class="lado">'
      + '<h4>Las dos versiones caben</h4>'
      + '<div class="muted">No hay ningún campo en discordia: lo que cambió son listas que solo '
      + 'suman (gestiones, abonos, prórrogas). Con <b>Mandar lo mío encima</b> se quedan las de los '
      + 'dos aparatos y no se pierde nada.</div></div></div>';
  }
  var izq = '<div class="lado"><h4>Lo mío (este celular)</h4>';
  var der = '<div class="lado"><h4>Lo de la nube</h4>';
  pisables.slice(0, 12).forEach(function (p) {
    izq += '<div class="d"><span>' + esc(etiquetaCampo(p.campo)) + '</span><span>' + esc(valorCorto(p.campo, p.mio)) + '</span></div>';
    der += '<div class="d"><span>' + esc(etiquetaCampo(p.campo)) + '</span><span>' + esc(valorCorto(p.campo, p.suyo)) + '</span></div>';
  });
  return '<div class="lados">' + izq + '</div>' + der + '</div></div>';
}
var ETIQUETAS = {
  pagado: '¿Pagado?', fechaPagado: 'Fecha de pago', capital: 'Capital', total: 'Total',
  cicloActual: 'Corte vigente', cicloPago: 'Corte del pago', gananciaPago: 'Ganancia del pago',
  recargoMora: 'Recargo cobrado', nombre: 'Nombre', cedula: 'Cédula', telefono: 'Teléfono',
  ajusteGarantia: 'Ajuste de garantía', planPagos: 'Plan de pagos', costoPct: 'Costo %',
  /* `montoRecibido` va acá porque es EL campo que resuelve el choque de un
     cobro: si el celular registró 240.000 con descuento y el computador
     «pagó todo» 260.000, sin ver los dos montos Joan no puede saber cuál de las
     dos versiones es la buena. */
  montoRecibido: 'Plata que entró', costoCausado: 'Costo causado',
  moraCausada: 'Mora causada', saldoAFavor: 'Saldo a favor'
};
function etiquetaCampo(k) { return ETIQUETAS[k] || k; }
function valorCorto(campo, v) {
  if (v === undefined) return '(no estaba)';
  if (v === null) return '—';
  if (Array.isArray(v)) return v.length + ' elemento(s)';
  if (typeof v === 'boolean') return v ? 'sí' : 'no';
  if (typeof v === 'object') return 'objeto';
  if (typeof v === 'number') {
    /* Un porcentaje no lleva signo de pesos. Los montos de este proyecto son
       todos enteros grandes; el 20 de costoPct no lo es. */
    return campo === 'costoPct' ? String(v) + '%' : COP(v);
  }
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return fmtFecha(v);
  return String(v);
}

/* ================================ HOJAS ================================= */
function abrirHoja(titulo, html) {
  document.getElementById('hojaTitulo').textContent = titulo;
  document.getElementById('hojaCuerpo').innerHTML = html;
  document.getElementById('hoja').classList.add('on');
  document.querySelector('.hoja-caja').scrollTop = 0;
}
function cerrarHoja() { document.getElementById('hoja').classList.remove('on'); }

/* -------------------------------------------------------------------------
   EL ESTADO DE LA HOJA DE COBRO. Vive fuera del HTML porque la hoja se vuelve a
   pintar en cada tecla del monto, y lo que Joan ya respondió no se puede perder
   entre repintado y repintado.
     monto   lo que teclea (null = todavía no ha tocado nada: vale el total)
     modo    null | 'perdon' | 'debe' | 'afavor'   ← lo que dijo que pasó
     sobre   'mora' | 'costo'                      ← sobre qué es el descuento
     motivo  texto corto, obligatorio si hay descuento
   Se reinicia entero cada vez que se abre la hoja o cambia la fecha: con otra
   fecha el total es otro y una respuesta vieja sería una respuesta a otra
   pregunta. */
var _cobro = { id: null, monto: null, modo: null, sobre: 'mora', motivo: '' };
function reiniciarCobro(id) { _cobro = { id: id, monto: null, modo: null, sobre: 'mora', motivo: '' }; }

function abrirCobro(id) {
  var p = creditoPorId(id); if (!p) return;
  reiniciarCobro(id);
  abrirHoja('Cobro · ' + ((socioDe(p) || {}).nombre || p.socioNombre || ''),
    '<label for="pgFecha">Fecha en que paga</label>'
    + '<input id="pgFecha" type="date" value="' + hoyISO() + '">'
    + '<div id="pgCalc"></div>');
  document.getElementById('pgFecha').addEventListener('input', function () {
    reiniciarCobro(id); calcCobro(id);
  });
  calcCobro(id);
}
function calcCobro(id) {
  var p = creditoPorId(id); if (!p) return;
  var f = document.getElementById('pgFecha').value || hoyISO();
  var l = liq(p, f);
  var c = P.cuotaPlanActual(p), cs = P.cuotasPlan(p);
  var pr = liqProrroga(p, f);
  var h = '<div class="card ap" style="margin-top:14px">'
    + '<div class="fila"><span class="k">' + (c ? 'Capital de la cuota ' + c.n + ' de ' + cs.length : 'Capital') + '</span>'
    +   '<span class="v">' + COP(l.capital) + '</span></div>'
    + '<div class="fila"><span class="k">'
    +   (c ? 'Costo del plan (' + Math.round((l.tasa || 0) * 100) + '% del saldo)'
           : 'Costo del ciclo (' + Math.round((l.tasa || 0) * 100) + '%)') + '</span>'
    +   '<span class="v">' + COP(l.costo) + '</span></div>'
    + (l.recargo_mora
        ? '<div class="fila"><span class="k">Recargo por ' + l.dias_mora + ' día(s)' + pctMora(l) + '</span>'
          + '<span class="v ambar">' + COP(l.recargo_mora) + '</span></div>'
        : '')
    + '<div class="fila"><span class="k"><b>' + (c ? 'Total de la cuota' : 'Total para saldar') + '</b></span>'
    +   '<span class="v"><b>' + COP(l.total_a_pagar) + '</b></span></div>'
    /* Cuando acredita a la mitad se dice POR QUÉ, y son dos motivos distintos:
       pagar tarde, o pagar dentro de un corte que compró una prórroga (§4-bis).
       Las dos respuestas las trae el puente resueltas; acá no se deduce ninguna. */
    + '<div class="fila"><span class="k">Garantía que le deja</span>'
    +   '<span class="v oro-tinta">' + COP(l.garantia_generada)
    +   (l.acredita_en_fecha ? ''
        : ' <span class="muted">(la mitad, '
          + (l.pago_a_tiempo ? 'porque el crédito ya venía de una mora' : 'por pagar tarde') + ')</span>')
    +   '</span></div>'
    + '</div>';
  h += '<div class="aviso info">El comprobante en foto <b>no se puede adjuntar desde el celular</b> en esta fase: '
    + 'las fotos no viajan. Si te dio comprobante, guárdalo y adjúntalo en el computador.</div>';

  /* ------------------------------------------------------------------ el monto
     EL CAMPO ARRANCA CON EL TOTAL EXACTO. Si Joan no lo toca, el cobro es el de
     siempre: un toque en el botón y se acabó. El descuento es un camino
     deliberado, nunca un dedazo.
     Con PLAN DE PAGOS no se ofrece: una cuota del plan trae su costo y su
     garantía materializados, y descontar ahí es una cuenta que hoy no existe ni
     en el motor ni en el puente. Se dice, no se inventa. */
  if (c) {
    h += '<div class="aviso info">Este crédito está en <b>plan de pagos</b>: la cuota se cobra '
      + 'completa. El cobro con descuento todavía <b>no está en el celular</b> para los planes; '
      + 'si le vas a perdonar algo de una cuota, regístralo en el computador.</div>';
  } else {
    h += '<label for="pgMonto">¿Cuánto pagó?</label>'
      + '<input id="pgMonto" type="number" inputmode="numeric" step="1" min="0" '
      + 'value="' + Math.round(l.total_a_pagar) + '">';
    var atajos = [];
    if (l.recargo_mora > 0) {
      atajos.push({ v: Math.round(l.total_a_pagar - l.recargo_mora), t: 'Sin la mora' });
    }
    if (l.capital > 0 && l.capital < l.total_a_pagar) {
      atajos.push({ v: Math.round(l.capital), t: 'Solo el capital' });
    }
    if (atajos.length) {
      h += '<div class="' + (atajos.length > 1 ? 'dos' : '') + '">';
      atajos.forEach(function (a) {
        h += '<button class="btn sec sm" type="button" data-acc="cobro-atajo" data-id="' + esc(p.id) + '"'
          + ' data-v="' + a.v + '">' + a.t + ' (' + COP(a.v) + ')</button>';
      });
      h += '</div>';
    }
  }

  /* EL BOTÓN PRIMARIO NO SE MUEVE NUNCA. Va siempre acá, justo debajo del monto,
     y lo que cambia es su TEXTO, que dice exactamente lo que se va a registrar.
     Si se moviera al aparecer el bloque de preguntas, el toque de memoria de
     Joan aterrizaría en otro botón con el cliente mirando. */
  h += '<button class="btn arriba" id="pgBtn" type="button" data-acc="cobro-ok" data-id="' + esc(p.id) + '">'
    + (c ? '✓ Pagó la cuota ' + c.n + ' (' + COP(l.total_a_pagar) + ')' : '✓ Pagó todo (' + COP(l.total_a_pagar) + ')')
    + '</button>';
  if (!c && pr && pr.ok) {
    h += '<button class="btn sec arriba" type="button" data-acc="prorroga-ok" data-id="' + esc(p.id) + '">'
      + '↻ Prórroga (' + COP(pr.total_a_pagar) + ')</button>';
  }
  h += '<div id="pgDif"></div>';
  document.getElementById('pgCalc').innerHTML = h;
  if (!c) pintarDif(id);
}

/* -------------------------------------------------------------------------
   LO QUE PASA CUANDO EL MONTO NO ES EL TOTAL.

   Repinta SOLO este bloque y el texto del botón: el campo del monto queda
   intacto y no pierde el foco ni el cursor mientras Joan teclea.

   La pantalla PREGUNTA, no adivina. «Se lo perdoné» y «queda debiendo» son dos
   hechos distintos, se guardan distinto y uno cierra el crédito y el otro no;
   deducirlo del monto sería inventarle una intención a Joan con la plata de por
   medio.
   ------------------------------------------------------------------------- */
function pintarDif(id) {
  var caja = document.getElementById('pgDif'); if (!caja) return;
  var p = creditoPorId(id); if (!p) return;
  var btn = document.getElementById('pgBtn');
  var f = (document.getElementById('pgFecha') || {}).value || hoyISO();
  var l = liq(p, f);
  var total = Math.round(l.total_a_pagar);
  var monto = (_cobro.monto == null) ? total : _cobro.monto;
  var falta = total - monto;
  var h = '';

  /* --- caso normal: pagó lo que debía. Ni una palabra de más. --- */
  if (falta === 0) {
    caja.innerHTML = '';
    if (btn) { btn.disabled = false; btn.className = 'btn arriba'; btn.textContent = '✓ Pagó todo (' + COP(total) + ')'; }
    return;
  }

  /* --- pagó de MÁS --- */
  if (falta < 0) {
    var sobra = -falta;
    h += '<div class="aviso ambar"><b>Te dio ' + COP(sobra) + ' de más.</b> '
      + 'El total para saldar es ' + COP(total) + '.</div>'
      + '<div class="dos">'
      + '<button class="btn sec sm" type="button" '
      + 'data-acc="cobro-modo" data-id="' + esc(p.id) + '" data-m="error">Se lo devuelvo</button>'
      + '<button class="btn ' + (_cobro.modo === 'afavor' ? '' : 'sec') + ' sm" type="button" '
      + 'data-acc="cobro-modo" data-id="' + esc(p.id) + '" data-m="afavor">Queda a favor</button>'
      + '</div>';
    /* ACÁ SE DICE LO QUE EL CÓDIGO HACE, NO LO QUE UNO QUISIERA QUE HICIERA.
       Este aviso decía «se le guardan a favor para el crédito siguiente» y NADIE
       lo aplica al crédito siguiente: `p.saldoAFavor` se escribe y no lo lee
       ninguna ruta de creación de crédito, ni el puente, ni el motor, ni el
       Panel de escritorio. Prometerle eso a un tercero con su plata de por medio
       es la regla 4 rota en la peor pantalla posible: la que tiene al socio
       delante. Mientras no exista quien lo aplique solo, el aviso dice que es
       una ANOTACIÓN y que la mano es la de Joan. */
    if (_cobro.modo === 'afavor') {
      h += '<div class="aviso info">Le quedan ' + COP(sobra) + ' a favor. '
        + '<b>OJO: por ahora esto solo queda anotado en este crédito</b> — todavía no se descuenta '
        + 'solo del siguiente; se lo tienes que aplicar tú a mano, o devolvérselo. Lo vuelves a ver '
        + 'en el crédito y en la ficha del socio. '
        + '<b>No le suma cupo: no es costo.</b> La garantía sale del costo que entró, y esa plata '
        + 'es suya, no tuya.</div>';
    }
    caja.innerHTML = h;
    if (btn) {
      var listoMas = _cobro.modo === 'afavor';
      btn.disabled = !listoMas;
      btn.className = 'btn arriba' + (listoMas ? '' : ' sec');
      btn.textContent = listoMas
        ? '✓ Registrar ' + COP(monto) + ' (' + COP(sobra) + ' a favor)'
        : 'Falta decir qué hacer con los ' + COP(sobra) + ' de más';
    }
    return;
  }

  /* --- pagó de MENOS: la pregunta, en grande y una sola --- */
  h += '<div class="aviso ambar"><b>Faltan ' + COP(falta) + '. ¿Qué pasó?</b></div>'
    + '<button class="btn ' + (_cobro.modo === 'perdon' ? '' : 'sec') + ' arriba" type="button" '
    + 'data-acc="cobro-modo" data-id="' + esc(p.id) + '" data-m="perdon">Se lo perdoné</button>'
    + '<button class="btn ' + (_cobro.modo === 'debe' ? '' : 'sec') + ' arriba" type="button" '
    + 'data-acc="cobro-modo" data-id="' + esc(p.id) + '" data-m="debe">Queda debiendo</button>'
    + '<button class="btn sec arriba" type="button" '
    + 'data-acc="cobro-modo" data-id="' + esc(p.id) + '" data-m="error">Me equivoqué</button>';

  if (_cobro.modo === 'perdon') {
    var rep = repartoDelDescuento(l, falta, _cobro.sobre);
    /* Solo se pregunta SOBRE QUÉ cuando de verdad hay dos respuestas posibles.
       Si el faltante cabe entero en la mora, es mora y no se pregunta: menos
       toques, y de paso empuja hacia el descuento barato. */
    if (rep.hay_eleccion) {
      h += '<div class="dos">'
        + '<button class="btn ' + (_cobro.sobre === 'mora' ? '' : 'sec') + ' sm" type="button" '
        + 'data-acc="cobro-sobre" data-id="' + esc(p.id) + '" data-s="mora">De la mora</button>'
        + '<button class="btn ' + (_cobro.sobre === 'costo' ? '' : 'sec') + ' sm" type="button" '
        + 'data-acc="cobro-sobre" data-id="' + esc(p.id) + '" data-s="costo">Del costo</button>'
        + '</div>';
    }
    if (rep.excede) {
      h += '<div class="aviso ambar">Ese descuento (' + COP(falta) + ') no cabe en el costo ni en la '
        + 'mora de este ciclo. Lo máximo que se puede perdonar acá es ' + COP(rep.tope)
        + '. Si le vas a perdonar capital, eso no es un descuento: es una pérdida y '
        + 'no se registra desde el celular.</div>';
    } else {
      var q = cuentasDelCobro(p, l, { condonaCosto: rep.costo, condonaMora: rep.mora });
      var dsc = descuentosDelSocio(socioDe(p));
      h += '<div class="card ap" style="margin-top:14px">'
        + '<div class="fila"><span class="k">Descuento</span><span class="v ambar">'
        +   COP(rep.costo + rep.mora)
        +   ' <span class="muted">(' + rep.explica + ')</span></span></div>'
        + '<div class="fila"><span class="k">Le queda de garantía</span>'
        +   '<span class="v oro-tinta">' + COP(q.garantia)
        +   ' <span class="muted">(era ' + COP(q.garantia_sin_descuento) + ')</span></span></div>'
        /* ESTE es el número que debe frenar el descuento reflejo, y hoy no
           existía en ninguna pantalla del proyecto. */
        + '<div class="fila"><span class="k"><b>Sale de tu ganancia</b></span>'
        +   '<span class="v ambar"><b>' + COP(q.de_tu_ganancia) + '</b></span></div>'
        + '<div class="fila"><span class="k">Sale del cupo de él</span>'
        +   '<span class="v">' + COP(q.de_su_cupo) + '</span></div>'
        + '</div>'
        /* El reparto, con la plata que ENTRÓ. Los tres pedazos suman ese total
           exacto: es una definición del motor, no una propiedad de los
           porcentajes (operativo absorbe el redondeo). */
        + '<div class="aviso info"><b>Solo para ti</b> — de los ' + COP(q.ganancia_pago)
        + ' de costo que entran: <b>' + COP(q.reparto.garantia_socio) + '</b> se le vuelven garantía, '
        + '<b>' + COP(q.reparto.operativo) + '</b> son tu costo operativo y '
        + '<b>' + COP(q.reparto.amortiza_cupon) + '</b> te devuelven cupón.</div>'
        + (dsc.veces
            ? '<div class="aviso ambar">Ya lleva <b>' + dsc.veces + ' descuento(s)</b> por '
              + COP(dsc.monto) + '.</div>'
            : '')
        + '<label for="pgMotivo">¿Por qué se lo perdonas?</label>'
        + '<input id="pgMotivo" type="text" maxlength="120" placeholder="se le enfermó el hijo, cliente viejo…" '
        + 'value="' + esc(_cobro.motivo) + '">';
    }
  }

  if (_cobro.modo === 'debe') {
    var cap = capitalActual(p);
    h += '<div class="aviso ambar">Los <b>' + COP(monto) + '</b> se le bajan del capital. '
      + 'El costo del ciclo (' + COP(l.costo) + ')'
      + (l.recargo_mora ? ' y la mora (' + COP(l.recargo_mora) + ')' : '')
      + ' <b>siguen debiéndose</b> y la mora sigue corriendo. '
      + 'El crédito <b>NO se cierra</b> y hoy no le deja ni un peso de garantía: '
      + 'la garantía sale del costo, y un abono no es costo.'
      + (monto >= cap
          ? '<br><br><b>Y así no se puede:</b> ' + COP(monto) + ' cubre el capital entero ('
            + COP(cap) + '). Para abonar y seguir debiendo tiene que entregar menos de ' + COP(cap) + '.'
          : '')
      + '</div>';
  }

  caja.innerHTML = h;
  if (btn) {
    var listo = false, txt = 'Falta decir qué pasó con los ' + COP(falta);
    if (_cobro.modo === 'perdon') {
      var r2 = repartoDelDescuento(l, falta, _cobro.sobre);
      listo = !r2.excede;
      txt = listo ? '✓ Registrar ' + COP(monto) + ' con ' + COP(falta) + ' de descuento'
                  : 'Ese descuento no cabe en este ciclo';
    } else if (_cobro.modo === 'debe') {
      listo = monto < capitalActual(p);
      txt = listo ? '↓ Abonar ' + COP(monto) + ' a capital (sigue debiendo)'
                  : 'Ese abono cubre el capital entero';
    }
    btn.disabled = !listo;
    btn.className = 'btn arriba' + (listo ? '' : ' sec');
    btn.textContent = txt;
  }
}

/* Cómo se reparte un descuento entre mora y costo. NO es una regla de negocio
   nueva: es dónde meter la plata perdonada, y son dos bolsas con dos dueños
   distintos (la mora perdonada es casi toda ganancia de Joan; el costo
   perdonado es tres cuartas partes cupo del socio). Por eso `sobre` decide cuál
   se vacía PRIMERO, y lo que no quepa desborda a la otra — dicho en la
   pantalla, nunca en silencio. El capital no entra: perdonar capital es una
   pérdida, no un descuento. */
function repartoDelDescuento(l, falta, sobre) {
  var mora = Math.round(l.recargo_mora), costo = Math.round(l.costo);
  var tope = mora + costo;
  if (falta > tope) return { excede: true, tope: tope, costo: 0, mora: 0, explica: '', hay_eleccion: mora > 0 && costo > 0 };
  var deMora = 0, deCosto = 0;
  if (sobre === 'costo') { deCosto = Math.min(falta, costo); deMora = falta - deCosto; }
  else { deMora = Math.min(falta, mora); deCosto = falta - deMora; }
  var partes = [];
  if (deMora) partes.push(COP(deMora) + ' de mora');
  if (deCosto) partes.push(COP(deCosto) + ' de costo');
  return {
    excede: false, tope: tope, costo: deCosto, mora: deMora,
    explica: partes.join(' + '),
    /* Solo hay algo que elegir si el faltante no cabe holgadamente en una sola
       bolsa: con mora 0 no hay nada que preguntar, y si el faltante ya desborda
       la mora, la elección solo cambia el orden. */
    hay_eleccion: mora > 0 && costo > 0 && falta <= Math.max(mora, costo)
  };
}

function abrirGestion(prestId, clave, tituloExtra) {
  var p = creditoPorId(prestId); if (!p) return;
  var s = socioDe(p); if (!s) return;
  var k = clave || plantillaPara(p);
  var txt = textoPlantilla(p, s, k);
  var hor = horarioPermitido();
  var tel = waNum(s);

  var h = '';
  if (!hor.ok) {
    h += '<div class="aviso ambar"><b>Fuera de horario (Ley 2300):</b> ' + esc(hor.motivo)
      + '. Mejor no escribas ahora.</div>';
  }
  /* Los dos topes, no solo el diario. Hasta hoy esta hoja avisaba del máximo de
     uno al día y callaba el semanal, que no estaba implementado en ninguna
     parte del repositorio. */
  h += avisoDeTope(s, false);
  if (!tel) {
    h += '<div class="aviso ambar">Esta ficha no tiene teléfono. Puedes dejar la gestión anotada igual.</div>';
  }
  if (txt) {
    /* El aviso va ANTES del cuadro de texto y antes del botón de WhatsApp, que
       es el único momento en que sirve: después de apretar «Abrir WhatsApp» el
       mensaje ya está en el chat del cliente. Se nombran los tokens que
       quedaron, porque «hay un hueco» sin decir cuál obliga a leer el mensaje
       entero buscándolo. */
    var huecos = tokensSinResolver(txt);
    if (huecos.length) {
      h += '<div class="aviso ambar"><b>Este mensaje tiene ' + huecos.length + ' hueco(s) sin llenar: </b>'
        + esc(huecos.join(', ')) + '. Son datos que solo existen en el computador '
        + '(el préstamo con garantía, los códigos). Bórralos o complétalos a mano antes de enviar: '
        + 'si lo mandas así, el cliente los ve tal cual.</div>';
    }
    h += '<label for="gTexto">Mensaje (puedes editarlo)</label>'
      + '<textarea id="gTexto">' + esc(txt) + '</textarea>';
  } else {
    /* Dos faltas distintas y dos avisos distintos. Decir "no han llegado las
       plantillas" cuando sí llegaron pero falta ESTA manda a Joan a buscar un
       problema de sincronización que no existe: lo que le falta es escribir esa
       plantilla en el computador. */
    var hayAlgunas = DB.plantillas && Object.keys(DB.plantillas).length > 0;
    h += hayAlgunas
      ? '<div class="aviso info"><b>No tienes escrita la plantilla «' + esc(k) + '».</b> '
        + 'El chat se abre en blanco y escribes a mano. Si la quieres lista para la próxima, '
        + 'se escribe en el computador, en Plantillas.</div>'
      : '<div class="aviso info"><b>Todavía no han llegado tus plantillas.</b> Se guardan en la nube '
        + 'junto con la cartera y este teléfono aún no las ha traído, así que el chat se abre en '
        + 'blanco. No invento un texto: el mensaje que le queda al cliente tiene que ser el tuyo.</div>';
  }
  h += '<div class="dos">';
  if (tel) {
    h += '<a class="btn" id="gWa" target="_blank" rel="noopener" href="' + esc(waLink(tel, txt)) + '" '
      + 'data-acc="gestion-ok" data-id="' + esc(p.id) + '" data-k="' + esc(k) + '">Abrir WhatsApp</a>';
  } else { h += '<span></span>'; }
  h += '<button class="btn sec" type="button" data-acc="gestion-solo" data-id="' + esc(p.id) + '" data-k="' + esc(k) + '">'
    + 'Solo anotar la gestión</button></div>';
  h += '<p class="mini" style="margin-top:10px">Al abrir WhatsApp queda registrada la gestión de hoy. '
    + 'Tú presionas enviar. La gestión se guarda en este teléfono y sube cuando haya señal.</p>';

  abrirHoja((tituloExtra ? tituloExtra + ' · ' : 'Gestionar · ') + (s.nombre || ''), h);
  var ta = document.getElementById('gTexto');
  if (ta) {
    ta.addEventListener('input', function () {
      var wa = document.getElementById('gWa');
      if (wa) wa.href = waLink(tel, ta.value);
    });
  }
}
