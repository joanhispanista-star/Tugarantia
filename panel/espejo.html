/* ============================== CONEXIÓN ================================
   Vive en una hoja y no en una pestaña: se toca dos veces en la vida del
   teléfono. La llave anónima de Supabase es pública por diseño; la contraseña
   NO se guarda en ninguna parte —solo viaja para pedir la sesión— y por eso hay
   que escribirla otra vez cuando la sesión caduque de verdad. */
function abrirConexion() {
  if (!NUBE) {
    abrirHoja('Conexión', '<div class="aviso ambar"><b>Falta panel/nube.js.</b> Sin ese archivo esta '
      + 'pantalla no puede hablar con la nube. Súbelo al sitio y vuelve a abrir.</div>');
    return;
  }
  var cfg = {};
  try { cfg = NUBE.config() || {}; } catch (e) { cfg = {}; }
  var ses = null;
  try { ses = NUBE.sesion(); } catch (e) { ses = null; }

  var h = '';
  if (ses) {
    h += '<div class="aviso info">Conectado como <b>' + esc(ses.correo || '—') + '</b>.</div>'
      + '<button class="btn arriba" type="button" data-acc="sinc">Traer y subir ahora</button>'
      + '<button class="btn sec arriba" type="button" data-acc="salir">Cerrar la sesión de este teléfono</button>';
  }
  h += '<label for="cnUrl">Dirección del proyecto (URL de Supabase)</label>'
    + '<input id="cnUrl" type="text" inputmode="url" autocapitalize="off" autocorrect="off" '
    +   'placeholder="https://xxxx.supabase.co" value="' + esc(cfg.url || '') + '">'
    + '<label for="cnAnon">Llave pública (anon)</label>'
    + '<input id="cnAnon" type="text" autocapitalize="off" autocorrect="off" value="' + esc(cfg.anon || '') + '">'
    + '<div class="mini">Esta llave es pública por diseño: es la que trae el sitio. La que abre la '
    + 'cartera es tu correo y tu contraseña, y eso no se guarda acá.</div>'
    + '<label for="cnCorreo">Tu correo</label>'
    + '<input id="cnCorreo" type="email" autocapitalize="off" autocorrect="off" autocomplete="username" '
    +   'value="' + esc((ses && ses.correo) || '') + '">'
    + '<label for="cnClave">Tu contraseña</label>'
    + '<input id="cnClave" type="password" autocomplete="current-password">'
    + '<button class="btn arriba" id="cnBtn" type="button" data-acc="entrar">Entrar</button>'
    + '<div class="aviso info">La contraseña no se guarda en este teléfono. Lo que queda guardado es la '
    + 'sesión, que se renueva sola mientras la uses.</div>';

  /* -----------------------------------------------------------------------
     ESTE AVISO DICE LO QUE EL CÓDIGO HACE, NI UNA PALABRA MÁS.

     La primera versión decía "este teléfono no descarga fotos ni la papelera", y
     eso era mentira a medias: este archivo no filtra nada de lo que baja. Lo
     que de verdad pasa es que las fotos NO ESTÁN ARRIBA (en la Fase 1 no se
     suben) y la papelera solo estaría arriba si alguien la hubiera subido a
     propósito desde subir.html, que trae la casilla de no subirla marcada.

     Y no se filtra acá a propósito: si el celular borrara de su copia algo que
     sí está en la nube, el siguiente lote mandaría ese borrado hacia arriba y le
     borraría a Joan lo que él decidió guardar. Un espejo que edita lo que
     refleja deja de ser un espejo.
     ----------------------------------------------------------------------- */
  h += '<div class="aviso info">Este teléfono muestra lo que haya en la nube. Las <b>fotos</b> '
    + '(cédula, selfie, comprobantes) no están allá arriba en esta fase, así que acá tampoco. '
    + 'La <b>papelera</b> tampoco sube si dejaste marcada la casilla de subir.html, que viene '
    + 'marcada. Si algún día la subes, va a bajar acá también: este archivo no filtra nada, '
    + 'porque filtrar de bajada acabaría borrándotelo de subida.</div>';
  abrirHoja('Conexión', h);
}

function entrarANube() {
  var url = String(document.getElementById('cnUrl').value || '').trim();
  var anon = String(document.getElementById('cnAnon').value || '').trim();
  var correo = String(document.getElementById('cnCorreo').value || '').trim();
  var clave = String(document.getElementById('cnClave').value || '');
  if (!url || !anon) { alert('Faltan la dirección del proyecto y la llave pública.'); return; }
  if (!correo || !clave) { alert('Faltan tu correo y tu contraseña.'); return; }
  var btn = document.getElementById('cnBtn');
  btn.disabled = true; btn.textContent = 'Entrando…';
  try { NUBE.guardarConfig({ url: url, anon: anon }); } catch (e) { /* lo dirá el entrar */ }
  NUBE.entrar(correo, clave).then(function () {
    cerrarHoja();
    /* La primera vez se trae TODO: sin ultimoTraer, panel_traer devuelve la
       cartera completa. Las siguientes van por lo que cambió. */
    return sincronizar(true);
  }).catch(function (e) {
    btn.disabled = false; btn.textContent = 'Entrar';
    alert((e && e.motivo) || 'No pude entrar. Revisa el correo y la contraseña.');
  });
}

/* ============================== EVENTOS ================================= */
/* `closest` solo existe en un Element. El objetivo de un click siempre lo es,
   pero un guardia de dos líneas es más barato que una pantalla que deja de
   responder a los toques en el único momento en que Joan la está usando. */
function cercano(ev, selector) {
  var t = ev && ev.target;
  return (t && typeof t.closest === 'function') ? t.closest(selector) : null;
}
document.getElementById('nav').addEventListener('click', function (ev) {
  var b = cercano(ev, 'button[data-v]');
  if (b) ir(b.dataset.v);
});
document.getElementById('btnConexion').addEventListener('click', abrirConexion);
document.getElementById('cinta').addEventListener('click', function () {
  if (CHOQUES.length && !pendientes()) { window.scrollTo(0, 0); return; }
  /* La lista de pendientes se abre SIEMPRE que haya algo esperando, con señal o
     sin ella. Antes, sin conexión, este toque llevaba a la pantalla de entrar:
     Joan veía el número, tocaba para saber qué era, y le salía un formulario de
     contraseña. Lo primero que necesita saber es QUÉ está esperando; conectarse
     es lo segundo, y para eso la propia lista tiene su botón. */
  if (pendientes()) { abrirCola(); return; }
  if (!NUBE || !nubeLista()) { abrirConexion(); return; }
  sincronizar(true);
});
document.getElementById('hojaCerrar').addEventListener('click', cerrarHoja);
document.getElementById('hoja').addEventListener('click', function (ev) {
  if (ev.target === this) cerrarHoja();
});

/* La lista de lo que está esperando subir. Se puede ABRIR: un número que no se
   puede abrir obliga a confiar en él a ciegas. */
function abrirCola() {
  var h = '';
  if (!COLA.length) h += '<div class="muted">Nada esperando.</div>';
  COLA.slice().reverse().forEach(function (it) {
    var choca = it.choque || enChoque(it.tabla, it.id);
    h += '<div class="linea-item"><span>' + esc(it.quien || nombreDeFila(it.tabla, it.datos) || '') + '<br>'
      + '<span class="muted">' + esc(it.que || 'cambio') + (it.detalle ? ' · ' + esc(it.detalle) : '') + '</span></span>'
      + '<span class="muted">' + esc(fmtHora(it.cuando)) + (choca ? '<br>en choque' : '') + '</span></div>';
  });
  h += '<button class="btn arriba" type="button" data-acc="sinc">Subir ahora</button>';
  if (!nubeLista()) {
    h += '<div class="aviso ambar">Sin conexión no sube nada. Lo de arriba está guardado en este '
      + 'teléfono y sigue ahí hasta que suba: no se pierde por cerrar la app.</div>';
  }
  abrirHoja(pendientes() + ' esperando subir', h);
}

/* Un solo oyente para todos los botones pintados. Con innerHTML no hay onclick
   escritos en el HTML a propósito: los datos de Joan (nombres de socios) se
   escapan una sola vez y no hay forma de que un apóstrofo en un nombre rompa
   una llamada. */
document.addEventListener('click', function (ev) {
  var el = cercano(ev, '[data-acc]');
  if (!el) return;
  var acc = el.dataset.acc, id = el.dataset.id;
  if (acc === 'cobro') { abrirCobro(id); }
  else if (acc === 'cobro-ok') {
    var f = document.getElementById('pgFecha');
    registrarCobro(id, f ? f.value : hoyISO());
  }
  else if (acc === 'cobro-atajo') {
    var im = document.getElementById('pgMonto');
    _cobro.monto = Number(el.dataset.v) || 0;
    _cobro.modo = null;
    if (im) im.value = String(_cobro.monto);
    pintarDif(id);
  }
  else if (acc === 'cobro-modo') {
    var m = el.dataset.m;
    if (m === 'error') {
      /* «Me equivoqué» / «Se lo devuelvo»: se vuelve al total y se olvida todo
         lo respondido. Un descuento a medio contestar es peor que ninguno. */
      var i2 = document.getElementById('pgMonto');
      _cobro.monto = null; _cobro.modo = null; _cobro.motivo = '';
      var p2 = creditoPorId(id), f2 = (document.getElementById('pgFecha') || {}).value || hoyISO();
      if (i2 && p2) i2.value = String(Math.round(liq(p2, f2).total_a_pagar));
    } else {
      _cobro.modo = (_cobro.modo === m) ? null : m;
    }
    pintarDif(id);
  }
  else if (acc === 'cobro-sobre') { _cobro.sobre = el.dataset.s; pintarDif(id); }
  else if (acc === 'prorroga') { abrirProrroga(id); }
  else if (acc === 'prorroga-ok') {
    var g = document.getElementById('prFecha') || document.getElementById('pgFecha');
    prorrogar(id, g ? g.value : hoyISO());
  }
  else if (acc === 'gestion') { abrirGestion(id); }
  else if (acc === 'gestion-ok') { marcarGestion(id, el.dataset.k); cerrarHoja(); }
  else if (acc === 'gestion-solo') { marcarGestion(id, el.dataset.k); cerrarHoja(); }
  /* ------------------------------ la tanda ------------------------------ */
  else if (acc === 'tanda-abrir') {
    TANDA.grupo = el.dataset.g; TANDA.verFuera = '';
    /* Se guarda el grupo al ENTRAR y no al salir: si la app se cierra a la
       mitad —que en un celular en la calle es lo normal— al volver hay que
       poder decirle a Joan en qué estaba. */
    guardarTanda(TANDA.grupo, saltadosDe(TANDA.grupo));
    window.scrollTo(0, 0); pintar();
  }
  else if (acc === 'tanda-salir') { TANDA.grupo = null; TANDA.verFuera = ''; window.scrollTo(0, 0); pintar(); }
  else if (acc === 'tanda-motivo') {
    TANDA.verFuera = (TANDA.verFuera === el.dataset.m) ? '' : el.dataset.m;
    pintar();
  }
  else if (acc === 'tanda-abrir-wa' || acc === 'tanda-solo') {
    /* EL MISMO REGISTRO QUE UNA GESTIÓN SUELTA, con la marca de que salió de la
       tanda. No hay un «marcador de hecho» aparte: el hecho ES la gestión, que
       es la única lista que sobrevive entera a un choque de sincronización. Si
       el avance viviera en un campo propio, «mandar lo mío encima» lo borraría y
       la tanda volvería a ofrecer a alguien al que Joan ya le escribió — o sea
       un segundo contacto el mismo día, justo lo que el artículo 3 prohíbe. */
    var grT = T && T.grupoPorClave(el.dataset.g);
    marcarGestion(id, el.dataset.k, {
      tipo: grT ? grT.tipo : 'cobro',
      grupo: el.dataset.g,
      origen: 'tanda'
    });
  }
  else if (acc === 'tanda-saltar') { abrirSaltar(el.dataset.s); }
  else if (acc === 'tanda-saltar-ok') { cerrarHoja(); saltarEnTanda(el.dataset.s, el.dataset.m); }
  else if (acc === 'tanda-recuperar') { recuperarEnTanda(el.dataset.s); }
  else if (acc === 'vercredito') { SEL.creditoId = id; var p = creditoPorId(id); if (p) SEL.socioId = p.socioId; ir('credito'); }
  else if (acc === 'verficha') { SEL.socioId = id; ir('ficha'); }
  else if (acc === 'nuevocliente') { abrirNuevoCliente(); }
  else if (acc === 'cliente-ok') { crearCliente(); }
  else if (acc === 'entrar') { entrarANube(); }
  else if (acc === 'salir') {
    if (!confirm('¿Cerrar la sesión de este teléfono?\n\nLo que esté esperando subir se queda guardado, '
      + 'pero no va a subir hasta que vuelvas a entrar.')) return;
    NUBE.salir().catch(function () {}).then(function () { cerrarHoja(); pintar(); });
  }
  else if (acc === 'sinc') { cerrarHoja(); sincronizar(true); }
  else if (acc === 'choque-nube') { resolverChoque(Number(el.dataset.i), 'nube'); }
  else if (acc === 'choque-mio') { resolverChoque(Number(el.dataset.i), 'mio'); }
  else if (acc === 'choque-ver') {
    var i = Number(el.dataset.i);
    _choqueAbierto = (_choqueAbierto === i) ? -1 : i;
    pintar();
  }
});

/* La búsqueda se escucha delegada porque el campo se vuelve a pintar en cada
   render. Se guarda el foco y el cursor: si no, escribir la tercera letra
   mandaba el cursor al principio. */
document.addEventListener('input', function (ev) {
  /* El monto del cobro repinta SOLO el bloque de abajo (pintarDif), nunca la
     hoja entera: si repintara el campo, el cursor saltaría al principio en cada
     dígito. Y el motivo no repinta nada — solo se guarda— por lo mismo. */
  if (ev.target && ev.target.id === 'pgMonto') {
    var v = ev.target.value;
    _cobro.monto = (v === '' || v == null) ? null : Math.round(Number(v) || 0);
    pintarDif(_cobro.id);
    return;
  }
  if (ev.target && ev.target.id === 'pgMotivo') { _cobro.motivo = ev.target.value; return; }
  /* El texto de la tanda actualiza el enlace de WhatsApp y NADA MÁS. Repintar
     acá mandaría el cursor al principio en cada letra, con el cliente delante. */
  if (ev.target && ev.target.id === 'tdTexto') {
    var wa = document.getElementById('tdWa');
    if (wa) wa.href = waLink(wa.dataset.tel || '', ev.target.value);
    return;
  }
  if (ev.target && ev.target.id === 'bq') {
    BUSQUEDA = ev.target.value;
    var pos = ev.target.selectionStart;
    pintar();
    var n = document.getElementById('bq');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
  }
});

window.addEventListener('online', function () { pintarCinta(); sincronizar(false); });
window.addEventListener('offline', function () { pintarCinta(); });
/* Al volver a la app después de un rato, lo primero es preguntarle a la nube si
   pasó algo: el martes de cobro Joan salta entre WhatsApp y esta pantalla cada
   dos minutos, y entre salto y salto el computador puede haber escrito. */
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { pintarCinta(); sincronizar(false); }
});

/* =============================== ARRANQUE =============================== */
(function () {
  /* Sin el motor y el puente no se pinta un solo número: se dice qué falta.
     Antes que nada, porque `pintar` los usa. */
  if (!M || !P) { DB = { socios: [], prestamos: [], respaldados: [] }; pintar(); return; }
  if (!NUBE) {
    /* Sin nube.js no hay caché que leer —la escribe él— ni forma de subir nada.
       Se pinta la pantalla vacía con el aviso en vez de reventar. */
    DB = normalizarConservando({});
    ir('hoy');
    return;
  }
  var ui = leerUI();
  ULTIMO_TRAER = ui.ultimoTraer || null;
  TANDA_GUARDADA = ui.tanda || null;
  /* La misma lectura defensiva que hace el Panel al cargar, pero SIN escribir en
     su llave: un respaldo viejo, un socio en null o un crédito sin capital no
     pueden dejar la pantalla en blanco. */
  recargarDeDisco();
  ir('hoy');
  sincronizar(false);
  /* Cada cinco minutos, si hay app abierta y señal. No es un reloj de
     sincronización: es que la cinta de abajo no puede mentir sobre la hora del
     último traer mientras Joan mira la pantalla. */
  setInterval(function () { if (!document.hidden) sincronizar(false); }, 300000);
})();

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
  });
}
</script>
