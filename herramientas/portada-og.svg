<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tu Garantía — Tu historial es tu garantía">
<!-- ===========================================================================
     LA TARJETA DE WHATSAPP (og:image de index.html) — 23-oct-2026
     La que había (portada.png, del 4-ago) decía «Crédito por quincena… Sin
     fiador. Solo con invitación.»: falso desde el registro abierto (24-ago) y
     la puerta única (8-oct). Esta lleva la marca A («Oro clásico»: la G de oro
     y la palabra «Tu Garantía» en curvas, los mismos de app/marca.svg) y la
     frase de la descripción de index.html, que es verdad: «Crédito a tu medida
     para gente que trabaja. Sin fiador. Regístrate tú mismo.»
     Se renderiza a portada-2.png (1200×630) con resvg; el titular va en
     Georgia y la línea de abajo en Segoe UI (las del computador que la
     renderiza; la marca no depende de fuentes). Si cambia esta tarjeta, el
     NOMBRE del PNG cambia también (portada-3.png…) en index.html y en sw.js a
     la vez: WhatsApp y la precarga guardan la imagen por su dirección.
     ======================================================================== -->
<defs>
  <radialGradient id="pPlaca" cx=".16" cy="-.25" r="1.4">
    <stop offset="0" stop-color="#2A2527"/>
    <stop offset=".45" stop-color="#131011"/>
    <stop offset="1" stop-color="#0C0A0B"/>
  </radialGradient>
  <radialGradient id="pHalo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#F5C542" stop-opacity=".30"/>
    <stop offset=".5" stop-color="#F5C542" stop-opacity=".09"/>
    <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pTitOro" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF4CC"/>
    <stop offset=".45" stop-color="#F5C542"/>
    <stop offset="1" stop-color="#E3A72F"/>
  </linearGradient>
  <linearGradient id="pFilete" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F5C542" stop-opacity="0"/>
    <stop offset=".2" stop-color="#F5C542" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#FFE08A"/>
    <stop offset=".8" stop-color="#F5C542" stop-opacity=".55"/>
    <stop offset="1" stop-color="#F5C542" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#pPlaca)"/>

