<script>
/* ===================== LA «s» DE HTTPS NO ES UN DETALLE =====================
   Copia de app/socio.html (28-ago-2026). Para el navegador, http:// y https://
   son dos sitios DISTINTOS con almacenamientos separados: si esta página se
   abriera sin la «s», la sesión guardada y lo último bajado vivirían en OTRO
   cajón, y eso se ve exactamente igual que «se perdió mi cuenta».

   Va ARRIBA DEL TODO y antes que cualquier otro script, para que el redirect
   ocurra antes de que la página lea nada del almacenamiento equivocado.
   localhost, 127.0.0.1 y la red local quedan fuera a propósito: ahí no hay
   https y así se prueba. `file://` tampoco entra: `protocol` no es 'http:'. */
(function () {
  var h = location.hostname;
  if (location.protocol === 'http:' && h !== 'localhost' && h !== '127.0.0.1'
      && h.indexOf('192.168.') !== 0 && h !== '[::1]') {
    location.replace('https:' + location.href.substring(location.protocol.length));
  }
})();
</script>

<style>
/* Lo que es SOLO de esta página y no de la piel compartida: las cajas de la
   calculadora, los escalones de la escalera, la ficha y el historial. Con
   prefijo pc- para que no choquen con estilo.css, y pintadas con los tokens
   de :root, nunca a mano.

   LO QUE NO ESTÁ ACÁ, A PROPÓSITO (14-sep-2026): la bienvenida (#hola), la
   cabecera con la marca (.cab, .logo, .lado), la barra de escritura del chat
   (.entrada-chat, .pildora, .enviar), los avatares (.avatar, .quienes) y las
   monedas (.moneda, .lingote, .m1…m4) son de la piel y se usan con SUS
   clases. La primera versión de esta página traía una copia propia de cada
   una («por si la piel no llegó»), y la auditoría encontró lo que pasa con
   dos dueños: por especificidad de id ganaba la piel en la bienvenida y
   ganaba la página en los avatares, y nadie sabía cuál se estaba viendo. Si
   la piel no llega, no llega NADA (tarjetas, barra, botones): un salvavidas
   para la barra del chat sola no salva a nadie. Un solo dueño. */
.pc-cajas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--e3);margin-top:var(--e4)}
.pc-cajas > div{padding:var(--e3);border-radius:12px;background:var(--fondo);font-size:12px;color:var(--gris)}
.pc-cajas > div b{display:block;font-size:20px;font-weight:600;color:var(--tinta);font-variant-numeric:tabular-nums}
.pc-cajas > div.verde{background:var(--marca-tinte);color:var(--marca-texto)}
.pc-cajas > div.verde b{color:var(--marca-texto)}
@media (max-width:360px){.pc-cajas{grid-template-columns:1fr}}
/* «O marca un día»: la etiqueta y el calendario en una fila; el calendario
   se estira y la etiqueta no se parte. El campo lo pinta la piel (input[type=date]). */
.pc-fecha{display:flex;align-items:center;gap:var(--e3);margin-top:var(--e3)}
.pc-fecha label{margin:0;flex:none}
.pc-fecha input{flex:1;min-width:0}

.pc-escalon{display:grid;grid-template-columns:1fr auto;gap:var(--e3);align-items:center;padding:10px var(--e3);
  border-radius:12px;background:var(--fondo);margin-top:var(--e2)}
.pc-escalon .n{font-size:12.5px;font-weight:600;color:var(--plata-tinta);white-space:nowrap;font-variant-numeric:tabular-nums}
.pc-escalon small{display:block;font-size:12px;color:var(--gris)}

.pc-dato{display:grid;grid-template-columns:22px 1fr auto;gap:var(--e2);align-items:center;padding:8px 0;border-top:1px solid var(--linea);font-size:14px}
.pc-dato:first-of-type{border-top:0}
.pc-dato .ok{color:var(--marca-texto)}
.pc-dato .falta{color:var(--plata-sombra)}
.pc-dato small{display:block;font-size:12px;color:var(--gris)}
.pc-dato .vl{font-size:12.5px;font-weight:600;color:var(--plata-tinta);white-space:nowrap;font-variant-numeric:tabular-nums}

.pc-credito{display:flex;justify-content:space-between;align-items:center;gap:var(--e3);padding:10px 0;border-top:1px solid var(--linea);font-size:14px}
.pc-credito:first-of-type{border-top:0}
.pc-credito small{display:block;font-size:12px;color:var(--gris)}
.pc-credito .estado{font-size:12px;font-weight:600;color:var(--plata-tinta);white-space:nowrap}
.pc-credito .estado.ambar{color:var(--ambar)}
.pc-enlaces a{color:inherit}
/* 22-oct-2026 — «¿A dónde te consignamos?» dentro de la tarjeta de la
   propuesta. El marcado sale de app/cuentas-pago.js (clases cp-), el mismo de

.cp-elegir{margin-top:var(--e2)}
.cp-tit{font-size:14.5px;font-weight:700;color:var(--tinta)}
.cp-sub{font-size:12.5px;color:var(--gris);margin-top:var(--e1);line-height:1.45}
.cp-opcion{display:flex;gap:10px;align-items:flex-start;margin-top:var(--e2);padding:10px var(--e3);

.cp-opcion.cp-sel{border-color:var(--marca-texto);background:var(--marca-tinte)}
.cp-opcion input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--marca)}

.cp-etq{display:inline-block;margin-top:var(--e1);padding:2px var(--e2);border-radius:999px;font-size:11px;

.cp-etq.cp-rapido{background:var(--marca-tinte);color:var(--marca-texto)}
.cp-otra label{display:block;font-size:12.5px;font-weight:600;margin:var(--e3) 0 var(--e1)}
.cp-otra input[type=text],.cp-otra input[type=tel],.cp-otra select{width:100%;padding:10px var(--e3);

<!-- ======================= BIENVENIDA =======================
     El marcado es el que pide estilo.css (#hola …): la placa, el aura, el
     grano y la viñeta atrás; la moneda de CSS con su halo y la burbujita verde
     de la marca; el nombre, el lema y el filete que se mueve mientras carga.
     La página no le pone ni una regla propia: la bienvenida es de la piel. -->
<div id="hola" role="status" aria-label="Abriendo PlataChat">
  <div class="placa" aria-hidden="true"></div>
  <div class="aura" aria-hidden="true"></div>
  <div class="grano" aria-hidden="true"></div>
  <div class="vineta" aria-hidden="true"></div>
  <div class="marco">
    <div class="sello-caja">
      <div class="halo" aria-hidden="true"></div>
      <div class="sello" aria-hidden="true"><span>$</span></div>
      <div class="burbujita" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg></div>
    </div>
    <div class="nombre">PlataChat</div>
    <div class="lema">tu crédito por el chat</div>
    <div class="filete" aria-hidden="true"><i></i></div>
  </div>
  <div class="version" id="holaVersion" aria-hidden="true"></div>
</div>
<script>
/* LA VERSIÓN DE LA APP, EN UN SOLO SITIO. Vive junto a la bienvenida porque es
   donde se pinta primero; el pie de las pantallas la lee de esta misma
   variable. Dos literales serían dos verdades sobre la misma versión, que es
   la enfermedad que socio.html ya sufrió (dos copias publicadas, mismas caras,
   reglas distintas). Al cambiar la app se sube esta fecha.

   OJO (14-sep-2026): platachat/ todavía NO está en la lista ARCHIVOS de sw.js
   —es un archivo ajeno y va por receta, RECETA-PLATACHAT.md—, así que hoy
   subir CACHE allá no precarga esta app. Mientras la receta no se aplique, la
   página y los .js llegan frescos (red primero) pero estilo.css y los iconos
   se quedan con la copia guardada hasta que suba CACHE. Cuando la receta esté
   aplicada, la regla vuelve a ser la de socio.html: fecha acá Y CACHE allá.

   7-oct-2026 — sube por la puerta única: se fue la caja de «escribe tu cédula
   y tu código» de Yo, y ninguna pantalla manda ya a escribir un código. Hoy
   platachat/ SÍ está en ARCHIVOS de sw.js, así que la regla es la de
   socio.html: fecha acá Y CACHE allá.

   8-oct-2026 — sube con las condiciones de cada propuesta y la casilla «Leí
   y acepto» (app/calculadora-solicitud.js, nuevo: tiene que entrar también a
   ARCHIVOS de sw.js).

   21-oct-2026 — sube con el «Salir» que sale de verdad (H3: avisa al
   servidor y borra la copia de la sesión que dejó el registro en la
   pestaña) y con sesion.js, que trae cerrar(). CACHE de sw.js también tiene
   que subir al publicar: esta tanda no toca sw.js.

   22-oct-2026 — sube con la franja de «versión nueva» que se vuelve a
   decidir al cambiar de pantalla y con «Actualizar ahora» que espera lo que
   va en camino (el pedido de Plata, la foto del chat) en vez de cortarlo.
   El mismo día, y con la misma fecha, «Cambiar mi contraseña» en Yo
   (sesion.js trae cambiarClave) y el recado que ya no promete escribir «al
   <número del recado>». Las dos tandas llegan juntas en el lote que se
   publica con el CACHE v139 de sw.js, con un solo sello: es lo que Joan le
   pregunta al cliente, y dos fechas para un mismo pie no le dirían nada. */
var VERSION_APP = '2026-10-22';
/* 21-oct-2026 — EL NÚMERO DE LA CACHÉ DE ESTA PÁGINA: el CACHE de sw.js
   ('tugarantia-v138' → 'v138'). Con él app/actualizar.js sabe si ESTA página
   es la vieja. Sube con CACHE, siempre: pruebas/se-actualiza-sola.test.js no
   deja pasar uno sin el otro. */
var VERSION_SITIO = 'v139';   // 21-oct-2026 — sube con el CACHE de sw.js: el lote 1 integrado
(function () {
  var v = document.getElementById('holaVersion');
  if (v) v.textContent = 'Versión ' + VERSION_APP + ' · ' + VERSION_SITIO;
})();
/* El plazo de seguridad se arma ACÁ, pegado a la bienvenida: si el script
   grande de abajo revienta, la bienvenida se va igual y no deja al cliente
   mirando el sello para siempre. 5 s: claramente por encima de los 2 s que la
   bienvenida se queda a propósito. */
setTimeout(function () {
  var h = document.getElementById('hola');
  if (h) h.classList.add('fuera');
}, 5000);
</script>

<!-- Los degradados y los recortes del metal, una sola vez para toda la página.
     Los ids y las clases de las paradas (.m1…m4, .m-luz, .m-espejo, .m-plata,
     .m-sombra, .m-hondo) son los que estilo.css espera: .moneda .cara pinta
     con url(#plata-moneda), .lingote .cuerpo con url(#plata-lingote), y para
     qué es cada uno de los demás lo dice «EL METAL» en estilo.css. Los tonos
     viven en la piel, no acá. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Fracciones y no porcentajes en la geometría: el centinela «el socio no
         ve porcentajes» lee línea por línea y no distingue un radio de un precio. -->
    <radialGradient id="plata-moneda" cx=".35" cy=".28" r=".78">
      <stop offset="0" class="m1"/><stop offset=".42" class="m2"/>
      <stop offset=".8" class="m3"/><stop offset="1" class="m4"/>
    </radialGradient>
    <clipPath id="media-moneda"><rect x="0" y="0" width="20" height="40"/></clipPath>
    <!-- 1-oct-2026 — EL METAL (qué es cada pieza y por qué, en «EL METAL» de
         estilo.css): las bandas del espejo, el campo hundido, el signo pulido,
         la mancha de luz, la franja que cruza, el lingote y su tapa, y los
         dos recortes que encierran la franja en la moneda y en el lingote.
         Las paradas toman el color por clase; la opacidad sí va acá porque es
         la forma del reflejo, no un color. -->
    <linearGradient id="plata-bandas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="m-luz" stop-opacity="0"/><stop offset=".18" class="m-luz" stop-opacity=".6"/>
      <stop offset=".34" class="m-hondo" stop-opacity=".38"/><stop offset=".47" class="m-luz" stop-opacity="0"/>
      <stop offset=".6" class="m-luz" stop-opacity=".75"/><stop offset=".74" class="m-hondo" stop-opacity=".32"/>
      <stop offset="1" class="m-hondo" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="plata-campo" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" class="m-espejo"/><stop offset=".45" class="m-plata"/>
      <stop offset=".75" class="m-sombra"/><stop offset="1" class="m4"/>
    </linearGradient>
    <linearGradient id="plata-letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="m-luz"/><stop offset=".42" class="m-espejo"/>
      <stop offset=".54" class="m2"/><stop offset=".64" class="m-espejo"/><stop offset="1" class="m-luz"/>
    </linearGradient>
    <radialGradient id="plata-destello">
      <stop offset="0" class="m-luz" stop-opacity=".95"/><stop offset="1" class="m-luz" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plata-reflejo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="m-luz" stop-opacity="0"/><stop offset=".5" class="m-luz" stop-opacity=".85"/>
      <stop offset="1" class="m-luz" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plata-lingote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="m-luz"/><stop offset=".3" class="m2"/><stop offset=".55" class="m4"/>
      <stop offset=".72" class="m-espejo"/><stop offset="1" class="m3"/>
    </linearGradient>
    <linearGradient id="plata-tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="m-luz"/><stop offset=".35" class="m-espejo"/><stop offset=".55" class="m3"/>
      <stop offset=".72" class="m-luz"/><stop offset="1" class="m2"/>
    </linearGradient>
    <clipPath id="moneda-recorte"><circle cx="20" cy="20" r="19"/></clipPath>
    <clipPath id="lingote-recorte"><polygon points="8,28 16,6 48,6 56,28"/></clipPath>
    <!-- 1-oct-2026 — EL ORO: los mismos degradados de la plata, en cálido (las
         paradas .o1…o4 y .o-hondo toman el color de la piel). La mancha de
         luz, la franja y los recortes son los mismos de la plata: la luz es
         blanca sobre los dos metales. -->
    <radialGradient id="oro-moneda" cx=".35" cy=".28" r=".78">
      <stop offset="0" class="o1"/><stop offset=".42" class="o2"/>
      <stop offset=".8" class="o3"/><stop offset="1" class="o4"/>
    </radialGradient>
    <linearGradient id="oro-bandas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="m-luz" stop-opacity="0"/><stop offset=".18" class="m-luz" stop-opacity=".55"/>
      <stop offset=".34" class="o-hondo" stop-opacity=".35"/><stop offset=".47" class="m-luz" stop-opacity="0"/>
      <stop offset=".6" class="m-luz" stop-opacity=".65"/><stop offset=".74" class="o-hondo" stop-opacity=".3"/>
      <stop offset="1" class="o-hondo" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="oro-campo" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" class="o1"/><stop offset=".45" class="o2"/>
      <stop offset=".75" class="o3"/><stop offset="1" class="o4"/>
    </linearGradient>
    <linearGradient id="oro-letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="m-luz"/><stop offset=".42" class="o1"/>
      <stop offset=".54" class="o2"/><stop offset=".64" class="o1"/><stop offset="1" class="m-luz"/>
    </linearGradient>
    <linearGradient id="oro-lingote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="o1"/><stop offset=".3" class="o2"/><stop offset=".55" class="o4"/>
      <stop offset=".72" class="o2"/><stop offset="1" class="o3"/>
    </linearGradient>
    <linearGradient id="oro-tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="m-luz"/><stop offset=".35" class="o1"/><stop offset=".55" class="o3"/>
      <stop offset=".72" class="o1"/><stop offset="1" class="o2"/>
    </linearGradient>
  </defs>
</svg>

/* ===========================================================================
 * EL «ENTRAR», CON LAS REGLAS DE play/ — 21-oct-2026 (I2)
 *
 * Es el G1 que play/ cerró el 21-oct, aquí. Pedro tocaba «Entrar» con la señal
 * floja: no había tope ni botón apagado, y decía «Entrando…» para siempre. Se
 * cansaba y dejaba el teléfono; María, en la misma pestaña, entraba con la
 * suya. Cuando llegaba la respuesta de Pedro, sesion.js la guardaba en el
 * teléfono y la página hacía SES = esa: María quedaba operando la cuenta de
 * Pedro (su cupo, su chat, pedir a su nombre), y la sesión de Pedro quedaba
 * recordada para el siguiente que abriera PlataChat. La regla, la de play/
 * (G1 y H1 en play/index.html, «UNA RESPUESTA DE LA RED SOLO VALE PARA QUIEN
 * LA PIDIÓ»):
 *   · UN «ENTRAR» A LA VEZ: el botón se apaga mientras viaja, y a los 30 s
 *     se enciende con un aviso que no promete nada (el tope DESBLOQUEA, no
 *     aborta: con señal floja de verdad la respuesta tarda más que eso, y
 *     cortarla dejaba a la gente afuera para siempre).
 *   · LA FOTO DEL TOQUE: el número del viaje y el celular se toman al tocar.
 *   · AL VOLVER, la respuesta solo se adopta si nadie hizo otra cosa: no salió
 *     otro «Entrar», no se tocó «Salir», el celular de la casilla sigue
 *     siendo ese, y nadie entró mientras. Si no, la sesión que llegó se
 *     cierra en el servidor (scope=local, SP.cerrar) sin guardarse en
 *     ninguna parte: una cuenta abierta que nadie ve es lo que no se deja.
 *   · Se guarda en el teléfono AQUÍ, después de esa comprobación: sesion.js
 *     ya no guarda por su cuenta (SP.entrar).
 * ======================================================================== */
var MS_TOPE_ENTRAR = 30000;
var VIAJE_ENTRAR = 0;          // el número del último «Entrar» que cuenta
var ENTRAR_EN_CAMINO = null;   // la foto del «Entrar» cuya respuesta no ha llegado
/* Deja atrás el «Entrar» en camino: su número ya no es el último, así que su
   respuesta se descarta al llegar; y el botón se enciende ya. */
function soltarElEntrar() {
  VIAJE_ENTRAR++;
  var f = ENTRAR_EN_CAMINO;
  ENTRAR_EN_CAMINO = null;
  if (f && f.reloj) { try { clearTimeout(f.reloj); } catch (e) {} f.reloj = null; }
  var b = $('btnEntrar'); if (b) b.disabled = false;
}
function entrar() {
  var err = $('errEntrar');
  if (!SP) return fallo(err, 'No cargó una parte de la app (sesion.js). Cierra y vuelve a abrir con internet.');
  if (ENTRAR_EN_CAMINO && ENTRAR_EN_CAMINO.apagado) return;   // un «Entrar» a la vez
  var crudo = $('inCelular').value;
  var foto = { viaje: ++VIAJE_ENTRAR, celular: (U && U.normalizarTelefono) ? (U.normalizarTelefono(crudo) || '') : String(crudo || ''),
               apagado: true, reloj: null };
  if (ENTRAR_EN_CAMINO && ENTRAR_EN_CAMINO.reloj) { try { clearTimeout(ENTRAR_EN_CAMINO.reloj); } catch (e) {} }
  ENTRAR_EN_CAMINO = foto;
  var b = $('btnEntrar'); if (b) b.disabled = true;
  fallo(err, 'Entrando…');
  foto.reloj = setTimeout(function () {
    foto.reloj = null;
    if (ENTRAR_EN_CAMINO !== foto || !foto.apagado) return;
    foto.apagado = false;
    var b2 = $('btnEntrar'); if (b2) b2.disabled = false;
    fallo($('errEntrar'), 'La conexión tardó demasiado en contestar. Seguimos esperando: si la respuesta llega, entras sin hacer ' +
      'nada más. Si se te cayó el internet, vuelve a tocar «Entrar» cuando vuelva.');
  }, MS_TOPE_ENTRAR);
  SP.entrar(CFG, crudo, $('inClave').value).then(function (r) {
    var deAqui = foto.viaje === VIAJE_ENTRAR && !SES;
    if (ENTRAR_EN_CAMINO === foto) {
      ENTRAR_EN_CAMINO = null;
      if (foto.reloj) { try { clearTimeout(foto.reloj); } catch (e) {} foto.reloj = null; }
      var b3 = $('btnEntrar'); if (b3) b3.disabled = false;
    }
    if (!deAqui) {
      if (r && r.ok && r.sesion && r.sesion.access_token) SP.cerrar(CFG, r.sesion.access_token);
      return;
    }
    var e2 = $('errEntrar');
    if (!r.ok) return fallo(e2, r.motivo);
    if (e2) e2.classList.add('oculto');
    SES = r.sesion;
    SP.guardar(SES);
    mostrar('pCargando');
    return cargarCuenta();
  });
}

/* ===========================================================================
 * LO QUE PIDE LA CUENTA ES DE LA SESIÓN QUE LO PIDIÓ — 21-oct-2026 (I2)
 *
 * El H2 de play/, aquí. «Salir» no corta lo que va en camino: María abría la
 * foto de su cédula en el chat, pedía $450.000 o tocaba «Acepto», la red iba
 * lenta, tocaba «Salir» y Pedro entraba. Al llegar, la foto de María se abría
 * a pantalla completa sobre la cuenta de Pedro (o sobre la entrada), su
 * solicitud y su aceptación se pintaban en la pantalla de él y la saltaban a
 * Créditos, y lo que llegaba de mi_cuenta se guardaba DENTRO de la sesión de
 * Pedro. Solo traerSolicitud, traerPolitica y traerMiRegistro miraban la
 * sesión, una por una.
 * La regla, en UN sitio: toda llamada de la cuenta sale por rpcSesion, que
 * toma la sesión AL PEDIR (`ses`), sale con el token de ESA sesión —nunca con
 * SES en vivo— y solo deja seguir la respuesta si SES todavía es esa. Si no,
 * la promesa se queda callada para siempre (enSilencio): ni el .then ni el
 * .catch de quien llamó corren, así que no se pinta, no se guarda, no se
 * llama nada más y un «tu sesión venció» tardío no saca al que entró después.
 * El refresco que muta la sesión en su sitio no la cambia de dueño: SES sigue
 * siendo el mismo objeto. salir() deja en su estado inicial lo que la cuenta
 * tenía a medias (ACEPTANDO, CH, SOL…), como ya hacía.
 * ======================================================================== */
function enSilencio() { return new Promise(function () {}); }
/* La promesa de una llamada hecha con `ses`, atada a ella. */
function deEstaSesion(ses, promesa) {
  return promesa.then(function (v) { return SES === ses ? v : enSilencio(); },
                      function (e) { if (SES === ses) throw e; return enSilencio(); });
}
/* `ses` (opcional) es la sesión que pidió; sin ella, la de este momento.
   21-oct-2026 (verificación del lote 1, R3) — si ESCRIBE, cuenta como
   escritura en camino, y se cuenta la llamada de la red (SP.rpc), que siempre
   termina: la atada a la sesión se calla para siempre si la sesión cambia. */
function rpcSesion(fn, cuerpo, ses) {
  if (ses === undefined) ses = SES;
  if (!SP) return Promise.reject({ humano: 'No cargó una parte de la app (sesion.js). Cierra y vuelve a abrir con internet.' });
  var p = SP.rpc(CFG, ses, fn, cuerpo);
  if ((LECTURAS_QUE_NO_FRENAN || []).indexOf(fn) < 0) escrituraEnCamino(p);
  return deEstaSesion(ses, p);
}

/* ===========================================================================
 * LO QUE VA EN CAMINO NO SE CORTA — 21 de octubre de 2026 (verificación del
 * lote 1, R3)
 *
 * SE ACTUALIZA SOLA recarga al llegar a Plata o a Yo, y una recarga CORTA lo
 * que esté en camino. La lista no miraba el chat: la persona mandaba la foto
 * del comprobante («Mandando la foto…», CH.enviando), tocaba «Plata» y la
 * recarga la cortaba a mitad de subida, sin un error; creía que la había
 * mandado. Toda escritura (rpcSesion de las que escriben, la foto del chat,
 * el recado, el aviso de «Salir») sale por escrituraEnCamino, que la cuenta
 * (sube al salir, baja al contestar o fallar), y mientras haya una no es
 * momento seguro en NINGUNA pantalla. Las lecturas (el latido del chat, la
 * cuenta, la solicitud) no frenan: cortarlas no pierde nada. Al terminar la
 * última se vuelve a preguntar (revisar, no yaEsSeguro: la persona puede
 * estar mirando).
 * ======================================================================== */
var ESCRITURAS_EN_CAMINO = 0;
/* Las RPC que solo leen. Lo que no está aquí cuenta como escritura: una
   función nueva frena la recarga hasta que alguien diga que solo lee. */
var LECTURAS_QUE_NO_FRENAN = ['mi_cuenta', 'politica_platachat', 'mi_registro', 'mi_solicitud_platachat',
                              'chat_leer_sesion', 'chat_foto_sesion_ver',
                              /* 22-oct-2026 — las cuentas del registro, al aceptar: solo lee. */
                              'mis_cuentas_de_pago'];
/* Devuelve la MISMA promesa; el conteo va en una rama aparte que se traga el
   error (no deja una promesa rechazada sin atender). */
function escrituraEnCamino(p) {
  if (!p || typeof p.then !== 'function') return p;
  ESCRITURAS_EN_CAMINO = (ESCRITURAS_EN_CAMINO || 0) + 1;
  avisarQueEmpieza();
  var fin = function () {
    ESCRITURAS_EN_CAMINO = Math.max(0, (ESCRITURAS_EN_CAMINO || 0) - 1);
    avisarQueTermino();
  };
  p.then(fin, fin);
  return p;
}
function hayEscriturasEnCamino() { return (ESCRITURAS_EN_CAMINO || 0) > 0; }
/* 22-oct-2026 (verificación de 35f0687) — EMPEZÓ UNA: la franja se vuelve a
   mirar YA, no solo al terminar. Con la calculadora movida el botón está
   siempre, y tocarlo con «Pedir» en el aire cortaba el pedido. */
function avisarQueEmpieza() {
  if (typeof ACT === 'undefined' || !ACT || typeof ACT.volverAMirar !== 'function') return;
  try { ACT.volverAMirar(); } catch (e) {}
}
function avisarQueTermino() {
  if (hayEscriturasEnCamino() || typeof ACT === 'undefined' || !ACT) return;
  try { ACT.revisar(); } catch (e) {}
}

/* ==================== TRAER LA CUENTA ====================
   mi_cuenta() contesta con la sesión: {vinculada:false} para el que todavía no
   demostró quién es (cupo cero, chat propio), o {vinculada:true, nombre,
   datos, actualizado_en} con el MISMO paquete que consume socio.html.

   Lo último que contestó se guarda dentro de la sesión: si el cliente abre en
   el bus sin señal, ve sus números al día de la última vez, con fecha, y la
   pantalla dice «sin conexión» en vez de una pantalla de error. */
function cargarCuenta() {
  if (!SES || !SP) { salir(); return Promise.resolve(); }
  /* 21-oct-2026 — I2: con la sesión que pidió (rpcSesion). Lo que contesta
     mi_cuenta se guarda DENTRO de esa sesión: si mientras tanto salió y entró
     otro, los números de María quedaban guardados en la sesión de Pedro, y
     abrir() los pintaba sin señal («tus números al…»). */
  var ses = SES;
  return rpcSesion('mi_cuenta', undefined, ses).then(function (j) {
    if (!j || j.ok !== true) throw { sinSesion: true };
    SIN_NUBE = false; AVISO_NUBE = '';
    ses.ultimo = j; ses.ultimoEl = hoyISO();
    SP.guardar(ses);
    if (j.vinculada) MI_REGISTRO = '';
    abrir(j);
    marcarAcceso();
    /* La solicitud viva y la política se traen DESPUÉS de pintar y sin
       esperarlas: la cuenta no se queda en «Abriendo…» por dos funciones que
       quizá no existen todavía. */
    traerSolicitud();
    traerPolitica();
    /* 7-oct-2026 (tercera vuelta) — y solo si la nube dijo «sin juntar»: a
       una cuenta junta no hay registro que preguntarle. */
    if (!j.vinculada) traerMiRegistro();
  }).catch(function (e) {
    if (e && e.sinSesion) {
      salir('Tu sesión venció, así que te pedimos entrar de nuevo. Si no fuiste tú, escríbenos.');
      return;
    }
    if (e && e.estado === 404) {
      /* La función no existe: la migración 20260914b no se corrió. La app
         abre igual, como cuenta sin vincular, y lo dice arriba de todo. */
      SIN_NUBE = false;
      AVISO_NUBE = 'La base todavía no tiene encendida la cuenta de PlataChat (falta correr base/20260914b_tres_canales.sql). ' +
                   'Mientras tanto ves la app como cliente nuevo.';
      abrir((SES && SES.ultimo) || { ok: true, vinculada: false });
      return;
    }
    /* «Sin conexión» SOLO cuando no se llegó a la nube (sesion.js marca
       red:true únicamente si el fetch rechazó o no hay conexión configurada).
       Un 500 o un 429 es la nube contestando: culpar a la señal del cliente
       lo manda a revisar su internet por un error que no es suyo (14-sep). */
    if (e && e.red) {
      SIN_NUBE = true; AVISO_NUBE = '';
    } else {
      SIN_NUBE = false;
      AVISO_NUBE = 'La nube contestó con un error (' + ((e && e.estado) || '?') + '). Vuelve a intentar en un momento. ' +
                   'Mientras tanto ves tus números al ' + fmtFecha((SES && SES.ultimoEl) || hoyISO()) + '.';
    }
    abrir((SES && SES.ultimo) || { ok: true, vinculada: false });
  });
}

/* LA POLÍTICA CON LA QUE LA BASE FIRMA (fase 1b, 15-sep-2026). Una sola vez
   al abrir la cuenta: politica_platachat() devuelve la MISMA fila de
   politica_app que leen solicitar_platachat y resolver_vencidas, así que la

function traerPolitica() {
  if (!SES || !SP) return Promise.resolve();

  return rpcSesion('politica_platachat', undefined, ses).then(function (j) {
    if (SES !== ses) return;                         /* salió, o entró otro */

    POL = j.politica;

    if (TAB === 'plata') sincronizarCalc();

/* ==================== PREPARAR AL SOCIO ====================
   El paquete {nombre, datos, actualizado_en} se vuelve S. La aritmética de la
   garantía —el nivel derivado del total y nunca leído del paquete, la
   prestada por resta, la comprometida recortada contra la ganada, el cupo y
   el máximo con garantía sacados de maximoRespaldado— vive en app/ficha.js
   (14-sep), el MISMO archivo con el que socio.html y play/ abren ese

   app que abriera. Acá solo se agregan los campos que esta pantalla usa y
   ficha.js no da (nombre, código, fecha, perfil, referidos, resumen). */
function abrir(resp) {
  if (!resp || !resp.vinculada) { S = cuentaVacia(); return pintarCuenta(); }
  if (!F || !F.leer) {
    /* Sin ficha.js no hay con qué leer el paquete. Se abre como cuenta sin
       vincular y se dice arriba: mejor un cupo en cero con aviso que un cupo
       calculado a mano por una segunda copia (el mismo criterio que la
       escalera con platachat-reglas.js). */
    AVISO_FICHA = 'No cargó la parte de la app que lee tu ficha (app/ficha.js), así que por ahora no ves tu garantía ni tu cupo. ' +
                  'Cierra y vuelve a abrir con internet.';
    S = cuentaVacia();
    return pintarCuenta();
  }
  AVISO_FICHA = '';
  var d = resp.datos || {};
  var f = F.leer(d);
  S = {
    vinculada: true,
    nombre: resp.nombre || (SES && SES.nombre) || 'Cliente',
    codigo: (d.socio && d.socio.codigo) || '',
    actualizado: resp.actualizado_en,
    g: f.g, gd: f.gd,
    garantia: f.gd.total,
    nivel: f.nivel,
    cupo: f.cupo,
    maxRespaldado: f.maxRespaldado,
    creditos: f.creditos,
    respaldados: f.respaldados,
    activo: f.activo,
    pagados: f.pagados,
    perfil: f.entrada.datos,
    referidos: d.referidos || { total: 0, pagaron: 0, lista: [] },
    resumen: d.resumen || {}
  };
  pintarCuenta();
}

function cuentaVacia() {

  return {

/* 7-oct-2026 — ¿LA NUBE DIJO DE VERDAD QUE ESTA CUENTA NO ESTÁ JUNTA? S sale

   cuenta, y eso basta. */
function sinJuntarSabido() {
  if (!S || S.vinculada) return false;
  if (AVISO_FICHA || AVISO_NUBE) return false;
  if (SIN_NUBE && !(SES && SES.ultimo)) return false;

}

/* 7-oct-2026 (tercera vuelta) — ¿EN QUÉ VA EL REGISTRO DE ESTA CUENTA SIN
   JUNTAR? «Revisamos que seas tú, lo juntamos y te avisamos» es verdad
   mientras el registro esté en la bandeja de Joan, que es de donde sale el
   toque de juntar (📥 Registrados). Deja de serlo en dos casos que la nube
   sabe y esta pantalla no sabía: Joan ya lo DESCARTÓ, o la cuenta no tiene un
   registro hecho junto con ella (a una hora de abrirla) y en la bandeja no hay
   nada que revisar. mi_registro (base/20261007_una_puerta.sql, §8-bis) se
   escribió para eso, y la app del socio ya lo usa (app/sesion-socio.js).

   Una vez por apertura, sin esperarla: lo de siempre sale en el acto y solo
   se corrige si la nube contesta uno de esos dos casos. Con 404 (la migración
   sin correr), sesión vencida o sin red se queda lo de siempre: no saber no es
   razón para cambiar de promesa. */
function traerMiRegistro() {
  if (!SES || !SP) return Promise.resolve();
  var ses = SES;
  return rpcSesion('mi_registro', {}, ses).then(function (j) {
    if (SES !== ses || !S || S.vinculada) return;        /* salió, entró otro, o ya está junta */
    var antes = MI_REGISTRO;
    MI_REGISTRO = leerMiRegistro(j);
    /* Solo Plata y Yo lo dicen; repintar Chats le reharía la conversación a
       quien está escribiendo. Al cambiar de pestaña ya sale lo nuevo. */
    if (MI_REGISTRO !== antes && (TAB === 'plata' || TAB === 'yo')) irA(TAB);
  }).catch(function () {});
}
/* Lo mismo que lee app/sesion-socio.js (miRegistro), con una diferencia a

   una respuesta que no dice nada (la base contesta {ok, registro: null} con la
   llave puesta). */
function leerMiRegistro(j) {
  if (!j || j.ok !== true || !Object.prototype.hasOwnProperty.call(j, 'registro')) return '';
  if (j.registro === null) return 'sin_registro';
  var e = String((j.registro && j.registro.estado) || '');
  return (e === 'nuevo' || e === 'atendido' || e === 'descartado') ? e : '';
}

   por su nombre, que aquí es una de dos conversaciones. HTML ya armado (lleva
   <b>). Vacío = se dice lo de siempre. */
function textoSinJuntarDistinto() {
  if (MI_REGISTRO === 'descartado') {

      'Si quieres saber por qué, escríbenos por el chat de <b>Servicio</b>.';

function contarMonedas(ganada) {
  if (R && R.monedas) return R.monedas(ganada);
  var g = Math.max(0, Math.floor(Number(ganada) || 0)), L = valorLingote(), Mo = valorMoneda();
  return { lingotes: Math.floor(g / L), monedas: Math.floor((g % L) / Mo), media: (g % Mo) >= Mo / 2, total: g };
}
function monedasEnPalabras(ganada) {
  var m = contarMonedas(ganada);

     y «sin monedas» encima de una fila de oro sería mentira. */
  if (!m.lingotes && !m.monedas && !m.media) return 'Todavía sin monedas de plata: la primera llega con tu primer pago en fecha';
  return palabrasDe(m);
}

  var partes = [];

    partes.push(m.monedas
      ? m.monedas + ' moneda' + (m.monedas !== 1 ? 's' : '') + (m.media ? ' y media' : '')

   nuevas es un respaldo, no un color: cualquier regla de la piel le gana, y
   si el teléfono trae esta página con la hoja de antes (la caché de GitHub
   dura diez minutos), esas capas no salen negras —el relleno por defecto de
   SVG— sino invisibles, y la moneda se ve como la de antes. capasMoneda() es una sola para
   la moneda entera y para la media, que es la misma moneda recortada: si
   fueran dos dibujos, la media se quedaría atrás con el primer retoque. */
function capasMoneda() {

    '<circle class="bandas" fill="none" cx="20" cy="20" r="19"/>' +

    '<g clip-path="url(#moneda-recorte)"><polygon class="barrido" fill="none" points="-8,-2 0,-2 -12,42 -20,42"/></g>' +

}
function svgMoneda(clase) {
  return '<svg class="moneda ' + clase + '" viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">' +

function svgMediaMoneda(oro) {

    '<circle class="molde" cx="20" cy="20" r="19"/>' +

/* El lingote lleno va en barra: el cuerpo, los cuatro biseles y la tapa; el
   vacío es solo el contorno punteado (sin biseles: no hay metal todavía). */
function svgLingote(vacio, oro) {
  var cuerpo = '<polygon class="cuerpo" points="8,28 16,6 48,6 56,28"/>';
  if (vacio) return '<svg class="lingote vacio" viewBox="0 0 64 32" width="64" height="32" aria-hidden="true">' + cuerpo + '</svg>';
  return '<svg class="lingote' + (oro ? ' oro' : '') + '" viewBox="0 0 64 32" width="64" height="32" aria-hidden="true">' + cuerpo +

/* Una moneda por cada 10.000 ganados, un lingote por cada 100.000. Con nada
   ganado se pinta el molde vacío punteado: se ve el hueco donde va a ir la
   primera. Más de OCHO lingotes se resumen con «×N»: cada lingote asoma 28px,
   ocho miden 64 + 7·28 = 260 y caben en la placa de un teléfono de 320 (248
   útiles más el relleno); nueve ya se salen, y pasa justo al llegar al millón
   (antes el corte era diez y la revisión del 1-oct lo midió saliéndose). Una
   .pila no se parte: el wrap de .monedas solo baja pilas enteras. Cada grupo va en su .pila (la piel monta las monedas
   una sobre otra con margen negativo, y escalona el brillo por hijo). */
function monedasHTML(ganada) {
  var m = contarMonedas(ganada);
  if (!m.lingotes && !m.monedas && !m.media) {
    return '<div class="monedas"><div class="pila">' + svgLingote(true) + '</div>' +
      '<div class="pila">' + svgMoldeVacio() + '</div></div>';
  }
  return '<div class="monedas">' + pilasDe(m, false) + '</div>';
}
/* Las pilas de un metal: los lingotes en la suya y las monedas en otra. La
   misma para la plata y para el oro, para que las dos filas se cuenten igual. */
function pilasDe(m, oro) {
  var lingotes = '', monedas = '';
  if (m.lingotes > 8) lingotes = svgLingote(false, oro) + '<span class="muted" style="font-size:13px">×' + m.lingotes + '</span>';
  else for (var i = 0; i < m.lingotes; i++) lingotes += svgLingote(false, oro);
  for (var j = 0; j < m.monedas; j++) monedas += svgMoneda(oro ? 'oro brillo' : 'brillo');
  if (m.media) monedas += svgMediaMoneda(oro);
  return (lingotes ? '<div class="pila">' + lingotes + '</div>' : '') +
    (monedas ? '<div class="pila">' + monedas + '</div>' : '');
}

/* LAS MONEDAS DE ORO (1-oct-2026). Joan: «unas cuantas monedas de oro para
   mejorar el diseño». Con una condición que él eligió: cada moneda cuenta
   plata de verdad. El oro es la garantía que el cliente tiene SIN haberla
   ganado pagando —por sus datos y por la gente que trajo—, que es gd.prestada:
   ficha.js la saca por resta (total − ganada), así que la plata y el oro
   juntos son la garantía entera, ni un peso más. Oro de adorno le mostraría
   más de lo que tiene (Ley 1480). Sin nada que no haya ganado pagando, no
   hay fila de oro: no se pinta un molde vacío, porque no es algo que el
   cliente vaya a llenar pagando. */
/* EL CUPÓN QUE DE VERDAD QUEDA. Un ajuste negativo del Panel más grande que la
   ganada se come el cupón (motor.partesDeGarantia), y gd.cupon llega del
   paquete sin ese recorte: la fila «Por tus datos» decía +$100.000 con el oro

   recortado + referidos, así que esta resta da la cifra del motor, no una
   segunda cuenta. La usan la fila y el oro: el mismo número en los dos. */

function oroHTML(gd) {
  var m = contarMonedas(gd.prestada);
  if (!m.lingotes && !m.monedas && !m.media) return '';
  var datos = cuponVivo(gd) > 0, gente = Number(gd.referidos) > 0;
  var origen = datos && gente ? 'por tus datos y por la gente que trajiste'
    : gente ? 'por la gente que trajiste'
    : datos ? 'por tus datos' : 'aparte de lo que ganaste pagando';
  return '<div class="monedas oro">' + pilasDe(m, true) +
    '<div class="oro-dice">En oro: ' + esc(palabrasDe(m)) + ', ' + origen + '</div></div>';
}

    /* hidden A PROPÓSITO, no lo quites: la regla de la piel (.pausa-brillo,
