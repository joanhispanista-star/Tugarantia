function setCanal(id) {
  CANAL = canalDe(id).id;
  var seg = $('chSeg');
  var bs = seg ? seg.querySelectorAll('button') : [];
  for (var i = 0; i < bs.length; i++) bs[i].classList.toggle('on', bs[i].getAttribute('data-canal') === CANAL);
  var sub = $('chSub'); if (sub) sub.textContent = canalDe(CANAL).vacio;
  var ce = $('chError'); if (ce) ce.classList.add('oculto');
  pintarPropuesta();
  arrancarChat();
}

function arrancarChat() {
  if (!chatDisponible()) return;
  apagarLatido();
  GEN++;
  CH = { canal: CANAL, gen: GEN, mensajes: [], ultimo: 0, cargando: false, enviando: false, error: '' };
  var ta = $('chTexto');
  if (ta && BORRADOR) { ta.value = BORRADOR; BORRADOR = ''; chatContar(); }
  pintarPropuesta();
  /* Al abrir Créditos se pregunta de una por la solicitud, no en el próximo
     latido: lo primero que quiere ver quien entra es si le contestaron. Es
     una traída, no un temporizador: el latido sigue siendo uno. */
  if (CANAL === 'creditos') traerSolicitud();
  chatTraer(true);
}

function chatPintar() {
  var caja = $('chHilo'); if (!caja) return;
  pintarPropuesta();
  if (CH.error) { caja.innerHTML = '<div class="ch-vacio">' + esc(CH.error) + '</div>'; return; }
  caja.innerHTML = CHAT.hiloHTML(CH.mensajes, { yo: 'socio', textoVisto: 'Lo vieron', alVerFoto: 'verFotoChat', vacio: canalDe(CH.canal).vacio });
  etiquetarAutores(caja);
  caja.scrollTop = caja.scrollHeight;
}

/* La etiqueta de quién habla, encima de cada mensaje que no es del cliente.
   Se pone sobre el DOM que armó hiloHTML —un .ch-msg por mensaje, en el mismo
   orden que la lista— en vez de armar el HTML acá: el hilo lo escribe un solo
   archivo. La marca de «automático» que trae chat.js se reemplaza por la
   nuestra para no decir lo mismo dos veces; el punteado de chat.css se queda.

   Y NO se toca la clase ch-esauto en ninguna dirección: quién es máquina lo
   decide chat.js (esAutomatico), y esta página solo pone nombre. Por eso el
   gerente escribe como 'equipo' y no como 'agente' (base/20260923, sección 1):
   'agente' es el asistente para chat.js y saldría punteado, y quitarle acá el
   punteado a un autor que chat.js llama máquina sería la segunda copia de la
   regla que la fase 3 no puede permitirse. */
function etiquetarAutores(caja) {
  var nodos = caja.querySelectorAll ? caja.querySelectorAll('.ch-msg') : [];
  for (var i = 0; i < nodos.length && i < CH.mensajes.length; i++) {
    var m = CH.mensajes[i];
    if (!m || m.de === 'socio' || !QUIEN[m.de]) continue;
    var burbuja = nodos[i].firstElementChild;
    if (!burbuja) continue;
    var vieja = burbuja.querySelector('.ch-auto');
    if (vieja) burbuja.removeChild(vieja);
    var q = document.createElement('span');
    q.className = 'ch-quien';
    q.textContent = QUIEN[m.de] + (m.de === 'auto' && m.regla ? ' · ' + m.regla : '');
    burbuja.insertBefore(q, burbuja.firstChild);
  }
}

function chatContar() {
  var t = $('chTexto'), c = $('chCuenta'); if (!t || !c) return;
  var n = t.value.length;
  c.textContent = n > CHAT.LARGO_MAX - 200 ? (CHAT.LARGO_MAX - n) + ' caracteres' : '';
  c.classList.toggle('ch-pasado', n >= CHAT.LARGO_MAX);
  /* La píldora crece con el texto, hasta el tope de la hoja. */
  t.style.height = 'auto';
  t.style.height = Math.min(120, t.scrollHeight || 24) + 'px';
}

/* Trae lo que falte del canal abierto. `desde` es el id del último que ya
   tengo. Si el cliente cambió de canal mientras la respuesta venía, esa
   respuesta se bota: era de otro hilo. Se compara el GEN y no el nombre del
   canal: con A→B→A el nombre coincide y la traída vieja de A se sumaría a la
   nueva (las dos desde p_desde 0): mensajes repetidos en el hilo. */
function chatTraer(primera) {
  if (!chatDisponible() || CH.cargando) return;
  var gen = GEN, canal = CH.canal;
  CH.cargando = true;
  /* 21-oct-2026 — I2: rpcSesion además de GEN: GEN dice de qué hilo es, la
     sesión dice de quién. */
  rpcSesion('chat_leer_sesion', { p_canal: canal, p_desde: CH.ultimo }).then(function (j) {
    if (gen !== GEN) return;
    CH.cargando = false;
    if (!j || j.ok !== true) {
      CH.error = 'No pude abrir tus mensajes. Sal y vuelve a entrar; si sigue igual, escríbenos por WhatsApp.';
      chatPintar(); return;
    }
    CH.error = '';
    (j.mensajes || []).forEach(function (m) {
      CH.mensajes.push(m);
      if (Number(m.id) > CH.ultimo) CH.ultimo = Number(m.id);
    });
    SIN_NUBE = false;
    chatPintar();
  }).catch(function (e) {
    if (gen !== GEN) return;
    CH.cargando = false;
    if (e && e.sinSesion) { salir('Tu sesión venció. Entra de nuevo para seguir la conversación.'); return; }
    /* Con la conversación ya en pantalla, un corte de señal no la borra. */
    if (!CH.mensajes.length) {
      CH.error = (e && e.estado === 404)
        ? 'El chat de PlataChat todavía no está encendido en la base (falta correr base/20260914b_tres_canales.sql).'
        : ((e && e.humano) || 'No pude conectarme. Revisa tu internet.');
      chatPintar();
    }
  }).then(function () {
    /* Solo la primera traída del hilo VIVO arma el latido: una primera traída
       de un hilo ya cerrado que llegue tarde no puede resucitar el sondeo. */
    if (primera && gen === GEN) chatLatido();
  });
}

/* El sondeo: cada 20 s, solo con la pestaña de chats abierta y la app a la
   vista. Nadie gasta los datos de un cliente por una pantalla que no mira.
   Antes de armar uno se apaga el que hubiera: nunca hay dos. */
function chatLatido() {
  apagarLatido();
  LATIDO = setTimeout(function () {
    LATIDO = 0;
    if (TAB !== 'chats' || !$('chHilo')) return;
    if (typeof document.hidden === 'boolean' && document.hidden) { chatLatido(); return; }
    chatTraer(false);
    /* En Créditos el MISMO tic trae también la solicitud (la propuesta que
       llegó, la hora que venció): dentro del único latido, nunca con un
       temporizador propio (15-sep-2026). */
    if (CH.canal === 'creditos') traerSolicitud();
    chatLatido();
  }, CHAT_CADA_MS);
}

function enviarTexto(canal, texto) {
  var r = CHAT.revisar(texto);
  if (!r.ok) return Promise.reject({ humano: r.motivo });
  /* 21-oct-2026 — I2: con la sesión de este momento, que es la del toque
     (enviarChat y pedirComoMensaje llaman aquí al tocar): la respuesta del
     mensaje de María no le borra a Pedro lo que está escribiendo. */
  return rpcSesion('chat_escribir_sesion', { p_canal: canal, p_texto: r.texto }).then(function (j) {
    if (!j || j.ok !== true) {
      throw { humano: (j && /demasiados/.test(String(j.motivo || '')))
        ? 'Escribiste varios seguidos: espera unos minutos y vuelve a intentar.'
        : 'No pude mandarlo. Vuelve a intentar en un momento.' };
    }
    return j;
  });
}

function enviarChat() {
  if (!chatDisponible() || CH.enviando) return;
  var ta = $('chTexto'), b = $('chEnviar'), err = $('chError');
  if (err) err.classList.add('oculto');
  var r = CHAT.revisar(ta ? ta.value : '');
  if (!r.ok) return fallo(err, r.motivo);
  CH.enviando = true; if (b) b.disabled = true;
  enviarTexto(CH.canal, r.texto).then(function () {
    if (ta) { ta.value = ''; chatContar(); }
    /* Se vuelve a preguntar en vez de pintar el mensaje a mano: lo que se ve es
       lo que quedó guardado de verdad, con su id y su hora de la base. */
    chatTraer(false);
  }).catch(function (e) {
    if (e && e.sinSesion) { salir('Tu sesión venció. Entra de nuevo para seguir la conversación.'); return; }
    fallo(err, (e && e.estado === 404)
      ? 'El chat todavía no está encendido en la base (falta correr base/20260914b_tres_canales.sql).'
      : ((e && e.humano) || 'No pude mandarlo. Revisa tu internet y vuelve a intentar.'));
  }).then(function () {
    CH.enviando = false; if (b) b.disabled = false;
  });
}

/* ------- LA FOTO DEL CHAT (26-sep-2026): la misma de play/, no una segunda.

   Hasta hoy PlataChat mandaba sus fotos a una tabla suya, con una
   función suya. El 22-sep la app del cliente estrenó fotos en el chat
   (base/20260922f_fotos_en_el_chat.sql, ya aplicada en la base), y es mejor
   en todo lo que importa: cuelga la foto del MENSAJE con borrado en cascada
   (así, cuando el socio pide borrar su conversación, las fotos se van con
   ella, que es lo que promete la política de datos); guarda aparte una
   miniatura para que abrir el hilo no baje la foto grande con los datos del
   cliente; tiene tope por mes; y el CRM ya las enseña. Dos maneras de mandar
   una foto serían dos bandejas donde buscar un comprobante y dos promesas de
   borrado que cumplir. Se queda la que ya existe.

   Se comprime como el resto de la casa: 900 px y calidad 0,6 la grande (unos
   73 KB), 240 px la miniatura. El video se ataja aquí para poder explicar por
   qué no cabe; el freno de verdad es el CHECK de la base. ------- */
function elegirFoto() {
  if (!chatDisponible()) return;
  var f = $('chFoto'); if (f && f.click) f.click();
}

/* Lado mayor a `max` px y JPEG de calidad `q`. Copia de fotoDeLienzo de
   play/index.html: son cuatro cuentas y viven en una página, no en app/. */
function fotoDeLienzo(c, max, q) {
  var w = c.width, h = c.height;
  if (!w || !h) return '';
  if (w > h && w > max) { h = Math.round(h * max / w); w = max; }
  else if (h >= w && h > max) { w = Math.round(w * max / h); h = max; }
  var t = document.createElement('canvas'); t.width = w; t.height = h;
  var x = t.getContext('2d'); if (!x) return '';
  var out = '';
  try { x.drawImage(c, 0, 0, w, h); out = t.toDataURL('image/jpeg', q); } catch (e) { out = ''; }
  t.width = t.height = 1;
  return out;
}

function mandarFoto(input) {
  var err = $('chError');
  /* 21-oct-2026 — I2: la sesión de quien escogió la foto. Leer y comprimir
     es asíncrono: si en ese rato salió y entró otro, la foto no sale con el
     token del que llegó (subirFotoChat la compara). */
  var ses = SES;
  var f = input && input.files && input.files[0];
  try { input.value = ''; } catch (e) {}
  if (!f) return;
  /* El tipo que declara el teléfono NO decide: el lienzo recodifica a JPEG lo
     que sea que llegue, y hay gestores de Android que mandan el tipo VACÍO
     sobre una foto perfecta. Solo se ataja el video, para decir por qué. */
  if (/^video\//.test(f.type || '')) {
    return fallo(err, 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.');
  }
  fallo(err, 'Preparando la foto…');
  var lector = new FileReader();
  lector.onerror = function () { fallo(err, 'No pude leer esa foto. Prueba con otra.'); };
  lector.onload = function () {
    var im = new Image();
    im.onerror = function () { fallo(err, 'Eso no se pudo abrir como foto. Prueba con otra.'); };
    im.onload = function () {
      var c = document.createElement('canvas');
      c.width = im.naturalWidth || im.width; c.height = im.naturalHeight || im.height;
      if (!c.width || !c.height) return fallo(err, 'Esa foto salió vacía. Prueba con otra.');
      try { c.getContext('2d').drawImage(im, 0, 0); }
      catch (e) { return fallo(err, 'No pude preparar esa foto. Prueba con otra.'); }
      var grande = fotoDeLienzo(c, 900, 0.6);
      var mini = fotoDeLienzo(c, 240, 0.5);
      c.width = c.height = 1;
      if (!grande) return fallo(err, 'Tu teléfono no dejó preparar la foto. Prueba con otra.');
      subirFotoChat(grande, mini, ses);
    };
    im.src = lector.result;
  };
  lector.readAsDataURL(f);
}

/* Cada motivo de chat_foto_sesion dice algo distinto. «No se pudo» tapando un
   tope alcanzado deja a la persona intentándolo para siempre. */
function motivoFoto(m) {
  return m === 'no_es_imagen' ? 'Por aquí solo se pueden mandar fotos. Un video no cabe en el chat.'
    : m === 'muy_grande' ? 'Esa foto pesa demasiado. Tómala otra vez con menos calidad.'
    : m === 'tope' ? 'Ya mandaste el máximo de fotos de este mes. Escríbenos por aquí y seguimos por texto.'
    : m === 'muchas' ? 'Espera unos minutos antes de mandar otra.'
    : m === 'lleno' ? 'Ahora mismo no podemos recibir fotos. Escríbenos por aquí y te decimos cómo hacernos llegar el comprobante.'
    : m === 'sesion' ? 'Se cerró tu sesión. Entra otra vez y la mandas.'
    : 'No pude mandar la foto. Vuelve a intentar en un momento.';
}

/* 21-oct-2026 — I2: `ses`, la sesión de quien escogió la foto (mandarFoto).
   Si ya no es la de la página, no sale nada: era de otra persona. */
function subirFotoChat(grande, mini, ses) {
  if (ses === undefined) ses = SES;
  if (!ses || ses !== SES) return;
  var err = $('chError'), b = $('chEnviar'), ta = $('chTexto');
  var pie = String((ta && ta.value) || '').trim();
  /* El largo se revisa AQUÍ: un pie que la base recortara a mil dejaría a la
     persona creyendo que mandó el resto. Sin pie la foto vale igual. */
  if (pie.length > CHAT.LARGO_MAX) {
    return fallo(err, 'El texto que acompaña la foto es muy largo. Déjalo en ' + CHAT.LARGO_MAX + ' caracteres o menos.');
  }
  fallo(err, 'Mandando la foto…');
  CH.enviando = true; if (b) b.disabled = true;
  rpcSesion('chat_foto_sesion', {
    p_canal: CH.canal, p_imagen: grande, p_miniatura: mini || null, p_texto: pie || null
  }, ses).then(function (j) {
    if (!j || j.ok !== true) {
      if (j && j.motivo === 'sesion') { salir('Tu sesión venció. Entra de nuevo para mandar la foto.'); return; }
      fallo(err, motivoFoto(j && j.motivo));
      return;
    }
    if (err) err.classList.add('oculto');
    if (ta) { ta.value = ''; chatContar(); }
    chatTraer(false);
  }).catch(function (e) {
    if (e && e.sinSesion) { salir('Tu sesión venció. Entra de nuevo para mandar la foto.'); return; }
    fallo(err, (e && e.estado === 404)
      ? 'Mandar fotos todavía no está encendido en la base. Escríbenos por aquí y te decimos cómo hacernos llegar el comprobante.'
      : ((e && e.humano) || 'No pude mandar la foto. Revisa tu internet y vuelve a intentar.'));
  }).then(function () {
    CH.enviando = false; if (b) b.disabled = false;
  });
}

/* LA FOTO GRANDE, AQUÍ MISMO Y CON LA FORMA COMPROBADA. Es la lección del
   22-sep en play/: la foto que llega de la base NO se mete como texto en un
   atributo (una cadena que empiece por data:image/ puede traer un onerror
   detrás), y no se abre en otra pestaña (un about:blank hereda el origen de
   quien lo abre). Se comprueba la forma entera con CHAT.esFoto, la fuente se
   ASIGNA como propiedad, y se enseña encima de la página. */
function mostrarFoto(imagen) {
  if (!CHAT || !CHAT.esFoto || !CHAT.esFoto(imagen)) {
    alert('Esa foto llegó dañada. Pide que la manden otra vez.');
    return;
  }
  var capa = document.createElement('div');
  capa.setAttribute('role', 'dialog');
  capa.setAttribute('aria-label', 'Foto del chat');
  capa.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);' +
    'display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  var img = document.createElement('img');
  img.alt = 'Foto que se mandó en el chat';
  img.style.cssText = 'max-width:100%;max-height:100%;border-radius:10px';
  img.src = imagen;               /* propiedad, nunca texto de un atributo */
  capa.appendChild(img);
  var pie = document.createElement('p');
  pie.textContent = 'Toca para cerrar';
  pie.style.cssText = 'position:absolute;bottom:14px;left:0;right:0;text-align:center;' +
    'color:#FFFFFF;font-size:13px;opacity:.75;margin:0';
  capa.appendChild(pie);
  function cerrar() {
    if (capa.parentNode) capa.parentNode.removeChild(capa);
    document.removeEventListener('keydown', porTecla);
  }
  function porTecla(e) { if (e.key === 'Escape') cerrar(); }
  capa.addEventListener('click', cerrar);
  document.addEventListener('keydown', porTecla);
  document.body.appendChild(capa);
}

/* Se pide la grande solo cuando alguien toca la miniatura. Nunca muda: una
   foto que no abre sin decir por qué es una función que no existe.
   21-oct-2026 — I2: CON LA SESIÓN QUE LA PIDIÓ (rpcSesion). La foto de la
   cédula que María mandó por Servicio llegaba después de su «Salir» y se
   abría a pantalla completa encima de la entrada, o de la cuenta de Pedro
   (su cara: un dato sensible, Ley 1581). Ahora esa respuesta se calla, y
   también su «tu sesión venció», que habría sacado a Pedro. */
function verFotoChat(id) {
  if (!chatDisponible()) return;
  rpcSesion('chat_foto_sesion_ver', { p_id: Number(id) }).then(function (j) {
    if (!j || j.ok !== true || !j.imagen) return alert('No pude abrir esa foto. Vuelve a intentar en un momento.');
    mostrarFoto(j.imagen);
  }).catch(function (e) {
    if (e && e.sinSesion) { salir('Tu sesión venció. Entra de nuevo para ver la foto.'); return; }
    alert((e && e.red) ? 'No pude abrir esa foto. Revisa tu internet y vuelve a intentar.'
                       : 'No pude abrir esa foto. Vuelve a intentar en un momento.');
  });
}

/* ===================== CAMBIAR MI CONTRASEÑA — 22-oct-2026 =====================
   Joan: «los clientes deben de tener la opcion de cambiar contraseña y olvide
   contraseña». Es el final del camino de «Olvidé mi contraseña»: Joan le da
   una clave temporal desde el CRM, se la manda por WhatsApp, y ese mensaje le
   dice que la cambie aquí. Hasta hoy PlataChat no tenía dónde: el que solo
   usa PlataChat se quedaba con una clave que Joan vio y que viajó por un chat.
   La red y las reglas viven en sesion.js (SP.cambiarClave), las mismas de la
   app del socio y del Perfil de play/; esta pantalla solo pinta. Va dentro de
   Yo (la pestaña sigue encendida) y con la sesión que la pidió
   (deEstaSesion): si mientras viaja sale María y entra Pedro, el «Listo» de
   ella no se le pinta a él ni le borra lo que esté escribiendo. */
function pintarCambiarClave() {
  if (!S || !SES) return;
  $('cuerpo').innerHTML = '<div class="panel">' + avisosArriba() +
    '<div class="card">' +
      '<h3 class="tit">Cambiar mi contraseña</h3>' +
      '<p class="sub">La nueva tiene que tener al menos 8 caracteres y no puede ser tu número de celular. ' +
        'Desde que la cambies, la de antes deja de servir.</p>' +
      '<label for="ccNueva">Tu contraseña nueva</label>' +
      '<input id="ccNueva" type="password" autocomplete="new-password">' +
      '<label for="ccRepite">Escríbela otra vez</label>' +
      '<input id="ccRepite" type="password" autocomplete="new-password">' +
      '<button type="button" class="btn marca" id="ccBoton" style="margin-top:var(--e4)" onclick="cambiarClave()">Guardar mi contraseña nueva</button>' +
      '<div id="ccMsg" class="aviso ambar oculto"></div>' +
      '<button type="button" class="btn claro" style="margin-top:var(--e3)" onclick="irA(\'yo\')">Volver</button>' +
    '</div></div>';
  /* El botón nace encendido: un cambio de otra sesión que quedó callado
     (deEstaSesion) no puede dejarle el botón apagado al que entró después. */
  var b = $('ccBoton'); if (b) b.disabled = false;
  window.scrollTo(0, 0);
}

function cambiarClave() {
  var msg = $('ccMsg'); if (!msg) return;
  var nueva = ($('ccNueva') || {}).value || '', repite = ($('ccRepite') || {}).value || '';
  var b = $('ccBoton');
  if (!SP || !SP.cambiarClave) return fallo(msg, 'No cargó una parte de la app (sesion.js). Cierra y vuelve a abrir con internet.');
  if (!SES) return fallo(msg, 'Se cerró tu sesión. Entra otra vez y lo hacemos.');
  if (nueva !== repite) return fallo(msg, 'Las dos no quedaron iguales. Escríbelas otra vez, sin afán.');
  if (b && b.disabled) return;   // un cambio a la vez
  if (b) b.disabled = true;
  fallo(msg, 'Guardando…');
  var ses = SES;
  deEstaSesion(ses, SP.cambiarClave(CFG, ses, nueva)).then(function (r) {
    if (b) b.disabled = false;
    if (r && r.sinSesion) { salir(r.motivo); return; }
    if (!r || !r.ok) { fallo($('ccMsg'), (r && r.motivo) || 'No pude cambiar tu contraseña. Vuelve a intentar en un momento.'); return; }
    $('cuerpo').innerHTML = '<div class="panel">' +
      '<div class="card"><div class="aviso verde"><b>Listo: tu contraseña quedó cambiada.</b></div>' +
        '<p class="sub" style="margin-top:var(--e4)">La próxima vez entra con tu celular y la nueva. Es tuya: nosotros no la vemos.</p>' +
        '<button type="button" class="btn marca" onclick="irA(\'yo\')">Volver</button>' +
      '</div></div>';
    window.scrollTo(0, 0);
  });
}

/* Los créditos, crédito por crédito, recortado de vistaHistorial: qué pidió,
   cómo va y cuánta garantía le dejó. Los días de atraso son los que liquidó
   el puente, no una segunda cuenta hecha acá. */
function tarjetaHistorial() {
  var h = '<div class="card"><h3 class="tit">Tus créditos</h3>';
  if (!S.creditos.length) return h + '<p class="muted" style="margin-top:var(--e3)">Todavía no tienes créditos.</p></div>';
  var lista = S.creditos.slice().reverse().slice(0, 8);
  h += '<div style="margin-top:var(--e2)">' + lista.map(function (c) {
    var puntual = c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte;
    var atraso = c.pagado ? 0 : Math.max(0, Number(c.dias_mora) || 0);
    var estado = c.pagado ? (puntual ? 'Pagado en fecha' : 'Pagado')
      : (atraso > 0 ? atraso + ' día' + (atraso !== 1 ? 's' : '') + ' de atraso' : 'En curso');
    var suCapital = c.saldo_capital != null ? c.saldo_capital : c.capital;
    return '<div class="pc-credito"><div><b>' + COP(suCapital) + '</b><small>' +
      esc(fmtFecha(c.desembolso) + ' → ' + fmtFecha(c.fecha_pagado || c.corte)) +
      (c.garantia ? ' · te dejó +' + COP(c.garantia) : '') + '</small></div>' +
      '<span class="estado' + (atraso > 0 ? ' ambar' : '') + '">' + esc(estado) + '</span></div>';
  }).join('') + '</div>';
  if (S.creditos.length > lista.length) {
    h += '<div class="muted" style="font-size:12px;margin-top:var(--e2)">Los últimos ' + lista.length + ' de ' + S.creditos.length + '.</div>';
  }
  return h + '</div>';
}

/* ============================ SALIR ============================
   Borra la sesión guardada (y con ella lo último bajado) y vuelve a la
   puerta. `msg`, si viene, es lo que se le dice ahí: por qué lo sacaron.
   21-oct-2026 — H3: Y SALE DE VERDAD, como el «Salir» de play/ y el de la app
   del socio. Solo borraba platachat_sesion: el refresh_token seguía vivo en
   el servidor y la copia que dejó el registro en esta pestaña (play_sesion)
   también. Pedro tocaba «Abrir mi cuenta» en la misma pestaña, el arranque de
   play/ encontraba la sesión de María y PlataChat se le abría dentro de la
   cuenta de ella (su crédito, su chat, sus datos), y lo mismo play/ sin la
   marca o app/socio.html. Ahora se le avisa al servidor (SP.cerrar, sin
   esperar: si no llega, igual se sale) con el token de esta sesión, y con el
   de la copia de la pestaña si es otro; y la copia se borra. La página sigue
   sin armar un fetch por su cuenta: el aviso va por sesion.js.
   Con `msg` (la nube ya dijo que la sesión no vale) no hay a quién avisarle
   por ESA sesión, igual que en la app del socio (cerrarSesionLocal); la
   copia de la pestaña, si es otra, sí se cierra.
   21-oct-2026 — I2: LA SESIÓN SE SUELTA, NO SOLO SE BORRA (SP.soltar). Con el
   token vencido el logout era un 401 que no cerraba nada, y un refresco que
   iba en camino volvía a escribir la sesión de María en el teléfono, con su
   refresh_token vivo: el siguiente que abría PlataChat entraba a su cuenta.
   soltar la marca `cerrada` (sesion.js ya no la guarda, ni la refresca para
   nadie: el refresco que llegue la cierra con el token nuevo) y, si venció,
   refresca para poder cerrarla de verdad. Y un «Entrar» que siguiera en
   camino queda atrás (soltarElEntrar): su respuesta ya no es de nadie. */
function salir(msg) {
  var ses = SES;
  var tokenPC = (ses && ses.access_token) || '';
  var dePlay = null;
  try { dePlay = JSON.parse(sessionStorage.getItem(LLAVE_PLAY) || 'null'); } catch (e) { dePlay = null; }
  soltarElEntrar();
  /* 21-oct-2026 (verificación del lote 1, R3) — los avisos al servidor son
     escrituras en camino: la entrada es de la lista de SE ACTUALIZA SOLA, y
     recargar ahí mismo los cortaba (la sesión seguía viva allá). Un
     sesion.js de antes en la caché no devuelve promesa: no se cuenta. */
  if (SP && SP.soltar) escrituraEnCamino(SP.soltar(CFG, ses, !!msg));
  else if (SP && SP.cerrar && !msg) escrituraEnCamino(SP.cerrar(CFG, tokenPC));   // un sesion.js de antes en la caché
  if (SP && SP.cerrar) {
    if (dePlay && dePlay.access_token && dePlay.access_token !== tokenPC) escrituraEnCamino(SP.cerrar(CFG, dePlay.access_token));
  }
  try { sessionStorage.removeItem(LLAVE_PLAY); } catch (e) {}
  /* Y la marca de «la cuenta que acaba de nacer» del registro de play/ (desde
     el 21-oct-2026 play/ la suelta al pasar la sesión; esto es por la que
     haya dejado una versión anterior): con ella, el siguiente «Abrir mi
     cuenta» de este teléfono rebotaba aquí durante un día. */
